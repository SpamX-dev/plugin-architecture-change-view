schema_version: 1
id: architecture-change-view
title: Контракты и просмотр архитектуры
kind: module
extensions:
  archiview.roles: [app]
responsibilities:
  R1: Предоставить агенту и человеку интерфейс ревизии архитектурных изменений  и зависимостей
  R2: Позволять агенту определить по инвентаризации, где требуется создать, перенести или исправить контракт.
  R8: Предоставлять агенту контракт выбранного каталога вместе с действующими ограничениями предков.
  R3: Показывать изменения выбранной пары снимков вместе с результатами проверок и их доказательствами.
  R4: Вести переносимую историю проверок с актуальностью выводов по каждому модулю и его поддереву.
  R7: Предоставлять один проект с общей картой контрактов и историей во всех вариантах запуска ArchiView.
  R9: Давать команде возможность изменять пункты действующих контрактов модулей из интерфейса проекта.
  R10: Позволять команде спроектировать дерево модулей и их контракты до появления исходников.
boundaries:
  B1: Просмотр и подготовка анализа сохраняют исходники и согласованные контракты проекта без изменений.
  B2: При подготовке контекста ArchiView не строит граф зависимостей по символам исходного кода.
  B3: В общей рабочей папке ArchiView читает контракты и историю модуля в пределах репозитория, которому он принадлежит.
  B4: Панель обращается к агенту только по явному поручению пользователя провести анализ или исправить замечание.
  B5: Автоматическая проверка структуры может подтвердить наличие контракта и корректность формата, но не выполнение обязанностей.
invariants:
  I9: Самостоятельный локальный запуск входит в обязательные варианты поставки приложения.
  I10: Приложение поддерживает встроенную панель Codex.
  I11: Приложение поддерживает встроенную панель DeepSeek Harness.
