schema_version: 1
id: architecture-core
title: Корень исходников ArchiView
kind: group
extensions:
  archiview.roles: [root]
responsibilities:
  R11: Предоставлять прикладные операции над общими данными проекта независимо от выбранного хоста или транспорта.
  R12: Предоставлять чтение контрактов по пути исходника также при работе без панели.
  R13: Сообщать потребителю о неполном обходе исходников и недостающих доказательствах.
boundaries:
  B6: При обходе учитывать исходники только внутри выбранного корня, исключая зависимости, результаты сборки и служебные данные ArchiView.
  B7: Записывать данные истории только в каталог ArchiView проекта либо в явно выбранное внешнее хранилище.
  B2: При структурном сравнении фиксировать различия контрактов без автоматического вывода о нарушении ответственности.
  B8: Разрешать исторические доказательства по содержимому выбранных снимков.
invariants: {}
