schema_version: 1
id: architecture-tests
title: Проверки контрактов и просмотра
kind: module
extensions:
  archiview.roles: [tests]
purpose: Проверять наблюдаемое поведение ArchiView от чтения контрактов до просмотра и переноса установленного приложения.
responsibilities:
  R1: Проверять инвентаризацию и контекст каталогов, в том числе при перемещениях и ошибках формата.
  R2: Проверять сохранность истории и разрешимость доказательств после изменений проекта.
  R3: Проверять внешние операции ArchiView через настоящие stdio и HTTP.
  R4: Проверять путь поручения от авторизованной панели до анализа выбранного снимка или исправления конкретного замечания.
  R5: Проверять перенос и запуск установленного пакета Codex без системных Node и npm.
  R6: Проверять перенос пакета dsh и запуск его CLI без каталога зависимостей.
  R7: Проверять, какие изменения требуют повторного анализа и как различаются состояния модуля и поддерева.
  R8: Проверять навигацию и восстановление после ошибок в собранном браузерном интерфейсе.
  R9: Проверять границы доступа к файлам проекта и обнаружение неполных или повреждённых данных.
boundaries:
  B2: Сценарии записи используют проекты и хранилища, принадлежащие тесту.
  B3: Для проверки переносимости запускать копию поставки из другого файлового корня.
invariants: {}
