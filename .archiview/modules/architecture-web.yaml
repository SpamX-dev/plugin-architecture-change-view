schema_version: 1
id: architecture-web
title: Клиентские интерфейсы архитектуры
kind: group
purpose: Давать пользователю единый интерфейс просмотра проекта в браузере и во встроенной панели.
responsibilities:
  R1: Предоставлять одинаковую навигацию по модулям выбранного сравнения в самостоятельном и встроенном интерфейсах.
boundaries:
  B2: Действия просмотра оставляют исходники и согласованные контракты без изменений.
  B3: Интерфейс отображает полученные документы и исходники только как данные.
invariants: {}
