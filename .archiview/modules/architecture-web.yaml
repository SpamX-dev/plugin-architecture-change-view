schema_version: 1
id: architecture-web
title: Web
kind: group
extensions:
  archiview.roles: [domain]
purpose: Предоставлять пользователю просмотр архитектуры проекта, редактирование контрактов и запуск анализа выбранного модуля.
boundaries:
  B2: Действия просмотра оставляют исходники и согласованные контракты без изменений.
  B3: Интерфейс отображает полученные документы и исходники только как данные.
invariants: {}
