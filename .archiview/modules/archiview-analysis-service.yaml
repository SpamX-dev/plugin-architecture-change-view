schema_version: 1
id: archiview-analysis-service
title: analysis-service
kind: module
extensions:
  archiview.roles: [service]
purpose: Передавать в новый чат выбранного harness поручение на анализ снимка модуля или исправление сохранённого замечания, предоставлять статус доставки и результат анализа.
boundaries:
  B1: Подтверждать завершение запроса только после появления проверенного отчёта с ожидаемым reviewId.
invariants:
  I1: До доставки поручения фиксировать входные данные анализа и доставлять их через HostBridge выбранного пользователем harness.
  I2: Повторная доставка одного запроса в выбранный harness возвращает сохранённую квитанцию без создания второго чата.
  I3: При потере подтверждения от harness сохранять неопределённый статус доставки.
  I4: Проверка перед ответом агента и контроль при завершении хода выбирают проверки по изменениям входов с начала того же хода.
  I5: Для проверки итогового состояния использовать актуальный отчёт либо уже подготовленный запрос для тех же входов и выбранного хоста.
