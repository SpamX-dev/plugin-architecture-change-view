schema_version: 1
id: archiview-analysis-service
title: analysis-service
kind: module
extensions:
  archiview.roles: [service]
purpose: Показывать текущие потребности в анализе и исправлениях, готовить поручения и принимать результаты анализа модулей.
boundaries:
  B1: Подтверждать завершение запроса только после появления проверенного отчёта с ожидаемым reviewId.
invariants:
  I1: Для ручной отправки фиксировать входы анализа и использовать HostBridge выбранного пользователем harness.
  I2: Повторная доставка одного запроса в выбранный harness возвращает сохранённую квитанцию без создания второго чата.
  I3: При потере подтверждения от harness сохранять неопределённый статус доставки.
  I4: Скилл перед ответом агента и контроль при завершении хода используют один список незавершённых анализов модулей, проверки связей и открытых замечаний.
  I5: Экспорт доказательств текущего анализа ограничен выбранным модулем и видом проверки.
  I6: Разбор связей актуален для проверенного графа SCIP и контрактов, а доказательства замечаний принадлежат этому графу.
