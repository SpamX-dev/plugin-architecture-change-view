schema_version: 1
id: archiview-analysis-service
title: analysis-service
kind: module
extensions:
  archiview.roles: [service]
purpose: Подготавливать поручение по модулю и снимку, передавать его в сессию панели и предоставлять статус и результат анализа.
boundaries:
  B1: Подтверждать завершение запроса только после появления проверенного отчёта с ожидаемым reviewId.
invariants:
  I1: До доставки поручения фиксировать входные данные анализа и использовать HostBridge, привязанный к сессии панели.
  I2: Запросы пользователя
  I3: События системы
