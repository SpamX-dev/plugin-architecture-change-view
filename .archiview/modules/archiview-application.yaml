schema_version: 1
id: archiview-application
title: Прикладной сервис ArchiView
kind: module
extensions:
  archiview.roles: [domain]
purpose: Вести сессию одного проекта и выполнять сценарии выбора сравнения, просмотра
  его истории и подготовки анализа для всех клиентов ArchiView.
responsibilities:
  R1: Управлять выбранной папкой проекта, рабочей сессией, сравнениями и ограниченным кешем представлений.
  R2: Формировать дерево, детали модулей и хронологию через общую модель снимков и отчётов;
    предоставлять расположение сохранённого анализа относительно текущего корня проекта.
  R3: Подготавливать анализ выбранного снимка, сохранять базы и обслуживать импорт результатов.
    Поручения не передают LLM определение зависимостей; текущие карточки не включают
    прежние списки зависимостей и не отслеживают состояния поставщиков.
  R5: Наблюдать за рабочим деревом и служебными ссылками Git выбранного репозитория и уведомлять панель о необходимости сверки.
  R4: Направлять операции панели из общей рабочей папки в сессию выбранного репозитория.
boundaries:
  B1: Не зависит от HTTP, MCP, Codex или DOM; получает аргументы и возвращает данные либо прикладную ошибку.
  B2: Схемы, доказательства, сбор исходников и хранение неизменяемых результатов принадлежат общей модели.
invariants:
  I1: Сессия привязана к одному корню; каталог установки не выбирается вместо проекта автоматически.
  I2: Исторический просмотр не заменяет опубликованное текущее состояние и не перечитывает изменённый код вместо выбранного снимка.
  I3: Подготовка и передача запроса анализа не считаются завершённой содержательной проверкой.
  I4: История, снимки и запросы анализа каждого репозитория принадлежат его собственной сессии и хранилищу.
  I6: Дерево рабочего каталога сравнивается с HEAD с учётом новых файлов. Статусы анализа доступны независимо для той же версии дерева.
  I5: Сохранённое представление показывает опубликованную пару и её доказательства; открытие представления не наблюдает и не публикует рабочее дерево.
