schema_version: 1
id: archiview-application
title: Прикладной сервис ArchiView
kind: module
extensions:
  archiview.roles: [domain]
responsibilities:
  R1: Вести сессию проекта с выбранной парой снимков.
  R2: Предоставлять дерево сравнения, карточки его модулей и хронологию состояний.
  R3: Подготавливать запрос анализа выбранной версии модуля.
  R6: Принимать результат для сохранённого запроса анализа.
  R7: Сохранять выбранный полный снимок как базу, оставляя открытое пользователем сравнение прежним.
  R4: Направлять операции общей рабочей папки в сессию соответствующего репозитория.
  R5: Уведомлять клиентов о необходимости сверки после изменений рабочего дерева или состояния Git.
  R8: Предоставлять текущее дерево изменений относительно HEAD с учётом новых файлов независимо от загрузки статусов проверок.
  R9: Сохранять правку пункта выбранного рабочего контракта и принимать отмену последнего удаления для соответствующей версии документа.
  R10: Регистрировать каркас прототипов в выбранном репозитории, изменять их контракты и удалять выбранный прототип с сохранением исходников и дочерних модулей.
boundaries:
  B3: Сессия работает с выбранным корнем проекта на протяжении своей жизни.
  B4: История, снимки и запросы анализа доступны только в контексте соответствующего репозитория.
  B5: Историческое представление использует выбранный снимок и сохраняет текущую публикацию.
  B6: Открытие сохранённого представления читает опубликованную пару и её доказательства без нового наблюдения рабочего дерева.
  B7: Сессия подтверждает завершение содержательной проверки только после импорта результата.
  B8: В поручение агенту не входит определение зависимостей модулей.
invariants: {}
