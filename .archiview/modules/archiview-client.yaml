schema_version: 1
id: archiview-client
title: Интерфейс ArchiView
kind: module
extensions:
  archiview.roles: [ui, http-client, mcp-client]
responsibilities:
  R1: Предоставлять поиск, фильтрацию и выбор модуля в дереве сравнения.
  R2: Показывать изменения полей контракта с переходом к различиям выбранного поля.
  R10: Показывать в дереве роли выбранного состояния, а в карточке сравнения также показывать удалённые роли.
  R11: Показывать изменения собственных файлов модуля.
  R12: Показывать историю проверок модуля с переходом к сохранённым доказательствам.
  R13: Связывать каждое замечание с конкретным пунктом и его владельцем, сохраняя обратный переход из пункта к замечанию.
  R14: Учитывать только открытые замечания в счётчике вкладки и включать замечания скрытых потомков в отметку свёрнутой ветви дерева.
  R3: Показывать потребность в анализе при отсутствующей, устаревшей, неизвестной или конфликтующей оценке текущего состояния.
  R15: Показывать актуальность оценок состояния и перехода по отдельности, с причинами перепроверки, полнотой и расхождениями.
  R4: Давать выбор рабочего состояния или исторического коммита в обратной хронологии.
  R16: Обновлять текущее дерево и статусы по уведомлениям репозитория с сохранением выбранного модуля.
  R5: Предлагать выбор папки, если контекст проекта недоступен при открытии панели или загрузке данных.
  R6: По запросу пользователя готовить поручение анализа выбранного снимка.
  R7: По запросу пользователя готовить поручение исправления со ссылкой на сохранённую попытку и ID замечания.
  R17: Передавать поручение в чат хоста, а при самостоятельном просмотре копировать его в буфер обмена.
  R8: Выполнять операции просмотра в браузере и dsh через HTTP, в Codex — через инструменты MCP панели.
  R9: Предоставлять общую навигацию по репозиториям с историей и деталями выбранного репозитория.
  R18: При отсутствии контракта указывать, какую запись карты и какой файл проверить.
  R19: Давать пользователю возможность редактировать, добавлять и удалять пункты рабочего контракта и восстанавливать последний удалённый пункт.
  R20: Показывать прототипы в дереве, давать выбрать родителя и видеть путь создаваемого модуля, редактировать контракт прототипа и удалять прототип.
boundaries:
  B1: Отображать смысловую оценку из выбранного отчёта. Статус изменения файлов сам по себе не определяет качество архитектуры.
  B2: Обращаться к агенту только по явному поручению анализа или исправления.
  B3: В основном чеклисте показывать только собственные пункты модуля для выбранного состояния.
  B4: В счётчики замечаний и действия исправления включать только содержательные замечания. Изменения текста пунктов показывать в контракте.
  B5: Свёрнутая ветвь учитывает потребность скрытых потомков в анализе, а раскрытая строка показывает собственный статус модуля.
  B6: В карточке текущего состояния показывать полноту проверки зависимостей без перечня зависимостей из прежнего отчёта.
  B7: Устаревание одной лишь оценки перехода не требует повторного анализа текущего состояния.
  B8: Обеспечивать просмотр дерева Git во время загрузки статусов проверок.
  B9: Подтверждать завершение анализа по импорту результата.
  B10: После передачи поручения на исправление сохранять текущий статус замечания.
  B11: Сохранять доступ к удалённым модулям и доказательствам выбранного исторического состояния.
invariants: {}
