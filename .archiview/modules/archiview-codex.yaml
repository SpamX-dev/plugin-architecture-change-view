schema_version: 1
id: archiview-codex
title: Адаптер панели Codex
kind: module
extensions:
  archiview.roles: [host-adapter, mcp-client]
purpose: Открывать ArchiView в боковой панели Codex для рабочей папки текущего чата.
responsibilities:
  R1: Предоставлять MCP-серверу ресурс встроенной панели и операции просмотра проекта.
  R2: Возвращать результаты и ошибки просмотра только интерфейсу панели.
  R3: Определять рабочую папку текущего чата и предоставлять ручной выбор, если определить её не удалось.
  R4: Подключать веб-приложение к хосту Codex через MCP Apps.
  R5: Обеспечивать чтение опубликованного сравнения и карточек во время фоновой сверки другого репозитория.
boundaries:
  B2: Для автоматического выбора папки использовать только доступные через хост сведения о чате и его рабочих папках.
  B3: Привязывать экземпляр панели к существующей папке один раз.
  B4: Открывать интерфейс и при недоступном контексте чата, сохраняя возможность явного выбора проекта.
  B5: Открывать системный диалог выбора папки Windows только по явному действию пользователя.
  B6: При навигации не вызывать модель и не передавать ей результаты просмотра.
  B7: Для работы встроенной панели не открывать локальный HTTP-сервер.
  B8: После отключения MCP-клиента завершать сессию и отклонять новые операции панели.
invariants: {}
