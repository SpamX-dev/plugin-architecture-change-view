schema_version: 1
id: archiview-contracts
title: Контракты каталогов
kind: module
extensions:
  archiview.roles: [domain]
purpose: Читать декларации ответственности и находить каталоги исходников, которым нужен контракт.
responsibilities:
  R1: Проверять карту каталогов и соответствие идентификатора каждого YAML-контракта записи в карте, сообщать об отсутствующих и повреждённых описаниях.
  R2: Предоставлять инвентаризацию каталогов по репозиториям и находить цепочку контрактов для пути файла или каталога.
boundaries:
  B1: Предметные выводы по реализации и публикация отчётов принадлежат другим модулям.
invariants:
  I1: Пути чтения ограничены выбранным проектом, при неполном обходе возвращается диагностика.
  I2: Наличие документа подтверждает только его структурное состояние.
  I3: Контракт и его предки читаются из карты репозитория исходника. Идентификаторы модулей уникальны в пределах одной карты.
