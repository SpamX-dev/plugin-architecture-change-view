schema_version: 1
id: archiview-contracts
title: Контракты каталогов
kind: module
extensions:
  archiview.roles: [domain]
responsibilities:
  R1: Проверять однозначность карты каталогов и соответствие ID каждого контракта записи в карте.
  R2: Выдавать инвентаризацию каталогов с состоянием их деклараций и указанием, какие документы требуется создать или исправить.
  R3: Возвращать цепочку контрактов от корня репозитория до выбранного пути.
boundaries:
  B2: Для пути внутри вложенного репозитория использовать карту этого репозитория. Область уникальности ID ограничена одной картой.
  B3: При неполном обходе выдавать диагностику вместе с найденными каталогами.
  B1: При проверке документа оценивать только его структуру и связь с картой.
invariants: {}
