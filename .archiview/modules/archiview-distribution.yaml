schema_version: 1
id: archiview-distribution
title: Сборка локального плагина
kind: module
extensions:
  archiview.roles: [builds, tools]
responsibilities:
  R1: Собирать автономные пакеты Codex и dsh, для запуска которых не нужна установка зависимостей через npm.
  R2: Предоставлять протокольный стенд для проверки панели, передачи поручения и отказа хоста.
  R3: Устанавливать плагин Codex штатным установщиком с привязкой конфигурации к его фактическому каталогу.
  R4: Собирать переносимый архив для Windows x64 с установщиком, локальным marketplace, встроенным Node и его лицензией.
boundaries:
  B1: Сборка ограничивается подготовкой пакета. Установка в пользовательский профиль выполняется только по явной команде.
  B2: Сборка пишет результаты в dist, сохраняя исходники и данные проектов.
  B3: Сборка отклоняет поставку при ошибках строгой проверки типов приложения, адаптеров, интерфейса, скриптов или тестов.
  B4: Стенд работает с временным проектом без обращения к модели.
invariants: {}
