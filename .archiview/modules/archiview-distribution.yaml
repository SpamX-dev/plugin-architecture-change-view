schema_version: 1
id: archiview-distribution
title: Сборка локального плагина
kind: module
extensions:
  archiview.roles: [builds, tools]
purpose: Готовить переносимые поставки ArchiView и обеспечивать их установку и локальную проверку.
boundaries:
  B1: Сборка ограничивается подготовкой пакета. Установка в пользовательский профиль выполняется только по явной команде.
  B2: Сборка пишет результаты в dist, сохраняя исходники и данные проектов.
  B3: Сборка отклоняет поставку при ошибках строгой проверки типов приложения, адаптеров, интерфейса, скриптов или тестов.
  B4: Стенд работает с временным проектом без обращения к модели.
invariants: {}
