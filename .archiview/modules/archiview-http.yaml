schema_version: 1
id: archiview-http
title: Локальный сервер ArchiView
kind: module
extensions:
  archiview.roles: [web-endpoints, cli]
purpose: Давать самостоятельный локальный доступ к просмотру проекта и операциям с переносимыми отчётами.
boundaries:
  B3: При самостоятельном запуске принимать соединения только на локальном интерфейсе.
  B4: По файловым маршрутам выдавать только ресурсы приложения.
  B5: Допускать междоменный вызов API панели только с её токеном.
  B6: При запуске пакетной команды построения, экспорта или проверки индекса завершать операцию до выхода из CLI.
  B7: При отдельном импорте проверки продолжать работу в режиме сервера, а при импорте с построением отчёта завершать пакетную операцию.
invariants:
  I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
  I8: Операции с переносимыми результатами доступны из командной строки.
