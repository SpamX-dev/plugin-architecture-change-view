schema_version: 1
id: archiview-http
title: web-service
kind: module
extensions:
  archiview.roles: [web-endpoints]
purpose: Предоставлять HTTP-интерфейс для чтения и изменения данных проекта, запуска анализа и получения его результатов.
boundaries:
  B3: При самостоятельном запуске принимать соединения только на локальном интерфейсе.
  B5: Допускать междоменный вызов API панели только с её токеном.
invariants:
  I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
