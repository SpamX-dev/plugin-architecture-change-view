schema_version: 1
id: archiview-mcp
title: MCP-сервер ArchiView
kind: module
extensions:
  archiview.roles: [mcp-server]
purpose: Предоставлять MCP-клиенту правила ведения контрактов и доступ к контексту выбранного проекта через stdio.
responsibilities:
  R1: Публиковать скилл module-boundaries как ресурс MCP и предоставлять инструменты инвентаризации каталогов и чтения цепочки контрактов.
  R2: При запуске с панелью регистрировать её ресурс и инструменты на том же сервере и передавать запросы адаптеру Codex.
boundaries:
  B1: Сервер проверяет аргументы протокола и передаёт выбранный корень и параметры обхода модулю контрактов.
  B2: Данные панели и выполнение её операций предоставляет адаптер Codex.
invariants:
  I1: Инструменты чтения работают в выбранном проекте. Метаданные сервера и текст скилла читаются из пакета ArchiView.
  I2: Обычный запуск по stdio предоставляет только скилл и инструменты чтения контрактов. Панель включается параметром --panel.
