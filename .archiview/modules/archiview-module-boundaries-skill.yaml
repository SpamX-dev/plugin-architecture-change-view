schema_version: 1
id: archiview-module-boundaries-skill
title: Правила ведения контрактов
kind: module
extensions:
  archiview.roles: [resources]
responsibilities:
  R1: Определять правила создания и пересмотра контрактов, включая выбор ролей и распределение пунктов между разделами.
  R2: Определять, как проверить контракт по сохранённым доказательствам и оформить результат.
boundaries:
  B2: Правила собственной проверки ограничивают чеклист пунктами модуля и допускают ссылку на нарушенное ограничение предка.
  B3: Правила проверки композиции ограничивают область родителя декларациями непосредственных детей.
  B4: Инструкция исключает вывод зависимостей из перечня прочитанных агентом доказательств.
invariants: {}
