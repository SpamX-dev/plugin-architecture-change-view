schema_version: 1
id: archiview-module-presenter
title: Module Presenter
kind: module
extensions:
  archiview.roles: [service]
purpose: Готовить карточку выбранного модуля, передавать правки её контракта в сессию выбранного репозитория и обновлять карточку после завершения запрошенного анализа.
boundaries: {}
invariants:
  I1: Пока открыта карточка того же модуля и среза, отслеживать отправленные запросы по requestId на любой её вкладке и при завершении заново запрашивать карточку.
