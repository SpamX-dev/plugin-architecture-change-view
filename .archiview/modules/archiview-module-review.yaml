schema_version: 1
id: archiview-module-review
title: Module review
kind: module
extensions:
  archiview.roles: [service]
purpose: Готовить входные данные проверки модуля, сохранять проверенные отчёты и показывать актуальность результатов относительно выбранных снимков.
boundaries:
  B1: Содержательная проверка относится к модулю и входным данным, указанным в её манифесте.
  B2: Повторный импорт того же результата сохраняет исходную запись проверки.
invariants: {}
