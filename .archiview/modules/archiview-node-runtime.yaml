schema_version: 1
id: archiview-node-runtime
title: Среда выполнения Node
kind: module
extensions:
  archiview.roles: [runtime]
purpose: Находить ресурсы действующего пакета ArchiView и предоставлять диагностику ошибок Node.
responsibilities:
  R1: Определять расположение ресурсов и команду запуска CLI для исходной и автономной поставки.
  R2: Приводить ошибки Node к общему виду с сохранением доступных диагностических полей.
boundaries:
  B2: При поиске ресурсов использовать пакет запущенного ArchiView независимо от рабочей папки пользователя.
invariants: {}
