schema_version: 1
id: archiview-project-location
title: Расположение данных и происхождение проекта
kind: module
extensions:
  archiview.roles: [domain]
purpose: Определять допустимую область файловых операций с данными ArchiView и идентичность истории при переносе проекта.
responsibilities:
  R1: Разрешать пути локального и внешнего хранилища, проверяя их фактическое расположение.
  R2: Читать и фиксировать исходный корень истории проекта.
  R3: Находить корни рабочих деревьев Git внутри выбранной папки и определять, какому репозиторию принадлежит путь исходника.
boundaries:
  B1: Сбор снимков, хранение истории и публикация отчётов принадлежат потребителям этих правил.
invariants:
  I1: При переносе происхождение истории сохраняется, а операции с исходниками используют выбранный корень.
  I2: Создание манифеста идентичности не заменяет существующий манифест с другим происхождением.
