schema_version: 1
id: archiview-reports
title: Модель переносимых отчётов
kind: module
extensions:
  archiview.roles: [domain]
purpose: Вычислять переносимые состояния модулей, входы проверок и актуальность оценок для заданной пары снимков.
responsibilities:
  R1: Вычислять технические отчёты и проверять идентичность входов, результатов и неизменяемых попыток.
  R2: Сопоставлять изменения кода, контрактов и зависимостей с областью проверки и агрегировать оценки дерева.
boundaries:
  B1: Чтение проектов, блокировка и запись публикации принадлежат другим модулям.
invariants:
  I1: Оценки current и change, собственное состояние и состояние поддерева вычисляются раздельно.
  I2: Кеш подготовленной модели ограничен выбранной парой снимков и изолирован от последующих изменений входов.
  I3: Актуальность определяется по входам проверки с учётом использованных зависимостей.
    Полнота проверки и полнота перечня зависимостей оцениваются отдельно от актуальности.
  I4: Изменения детей и их контрактов сами по себе не инвалидируют локальную собственную оценку родителя.
    При её сопоставлении учитываются свой код, контракт и явно использованные зависимости;
    контекст детей в сохранённых входах остаётся неизменным материалом проверки.
    Проверка поддерева и его агрегация учитывают изменения потомков отдельно.
