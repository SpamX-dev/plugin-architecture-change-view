purpose: Регламентировать структуру технического отчёта и смысл показателей состояния модуля и актуальности его проверок.
boundaries:
  B2: Актуальность проверки состояния и актуальность оценки перехода между снимками — два самостоятельных показателя отчёта.
invariants: {}
