schema_version: 1
id: archiview-reports
title: Модель переносимых отчётов
kind: module
extensions:
  archiview.roles: [domain]
purpose: Определять состояние модулей и актуальность архитектурных оценок для выбранной пары снимков.
boundaries:
  B2: Определять актуальность текущего состояния и оценки перехода между снимками раздельно.
  B3: Считать собственную проверку родителя устаревшей при изменении состава непосредственных детей или смысла их контрактов.
  B4: Изменения реализации ребёнка и его собственные замечания сами по себе не меняют собственный вердикт родителя.
  B5: Сохранённые зависимости из LLM-проверок учитывать только как происхождение доказательств.
  B6: Отражать отсутствие проверки зависимостей в полноте анализа независимо от актуальности его входов.
  B7: Считать конфликтом противоположные определённые выводы либо несовместимые статусы одного замечания.
invariants: {}
