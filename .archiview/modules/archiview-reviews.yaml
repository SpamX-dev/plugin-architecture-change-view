schema_version: 1
id: archiview-reviews
title: Содержимое архитектурной проверки
kind: module
extensions:
  archiview.roles: [data-types, domain]
purpose: Описывать проверку по контрактам и доказательствам выбранных снимков и проверять её целостность.
responsibilities:
  R1: Определять состав манифеста, проверяемые пункты и структуру результата.
  R2: Проверять ссылки отчёта на сохранённые факты и пункты, формировать явно структурную оценку.
boundaries:
  B1: Публикация попыток, уплотнение и расчёт актуальности выполняются вне этого модуля.
invariants:
  I1: Структурная проверка оставляет смысловые пункты непроверенными.
  I2: Ссылки разрешаются в снимке указанной стороны с учётом области манифеста.
  I3: В собственной проверке модуля чеклист содержит только пункты его контракта.
    Замечание также может ссылаться на границу или инвариант предка из сохранённого
    контекста проверяемого модуля, не добавляя проверку всего предка.
