schema_version: 1
id: archiview-reviews
title: Содержимое архитектурной проверки
kind: module
extensions:
  archiview.roles: [data-types, domain]
responsibilities:
  R1: Формировать манифест проверки с областью анализа и проверяемыми пунктами контрактов.
  R2: Проверять, что ссылки результата разрешаются в сохранённых данных указанной стороны сравнения.
  R3: Формировать результат автоматической проверки структуры контрактов.
boundaries:
  B2: Структурная проверка оставляет выполнение смысловых пунктов непроверенным.
  B3: При собственной проверке модуля в чеклист входят только пункты его контракта.
  B4: В замечании по собственной проверке допустима ссылка на границу или инвариант предка, сохранённые в контексте модуля.
  B5: При проверке ссылок учитывать только доказательства из области манифеста.
invariants: {}
