schema_version: 1
id: archiview-serialization
title: Serialization
kind: module
extensions:
  archiview.roles: [serialization]
purpose: Регламентировать представление доменных данных ArchiView при сериализации и их каноническую запись для воспроизводимого отпечатка.
boundaries:
  B2: YAML-представление допускает значения поддерживаемых типов с уникальными ключами словарей и без YAML-ссылок.
  B3: В канонической записи порядок элементов массива значим, исходный порядок ключей словаря произволен.
invariants: {}
