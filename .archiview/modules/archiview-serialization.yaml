schema_version: 1
id: archiview-serialization
title: Кодирование данных
kind: module
extensions:
  archiview.roles: [serialization]
purpose: Читать структурированные данные ArchiView и получать воспроизводимый отпечаток их содержимого.
boundaries:
  B2: При чтении отклонять неоднозначные ключи, ссылки YAML и значения вне поддерживаемых типов.
  B3: При канонизации считать порядок ключей словаря несущественным, сохраняя последовательность элементов массива.
invariants: {}
