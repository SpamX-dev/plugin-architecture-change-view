schema_version: 1
id: archiview-skills
title: Скиллы ArchiView
kind: group
extensions:
  archiview.roles: [resources]
purpose: Предоставлять единый набор именованных умений для поставок ArchiView.
responsibilities:
  R1: Определять состав набора и размещение каждого умения в каталоге с его именем.
boundaries:
  B1: Умение определяет свои инструкции. Сборка и адаптеры используют материалы из этого набора.
invariants:
  I1: Канонический текст каждого умения доступен в файле SKILL.md его каталога.
