schema_version: 1
id: archiview-snapshots
title: Снимки и сравнение
kind: module
extensions:
  archiview.roles: [domain]
purpose: Фиксировать состояние исходников и сравнивать собственные файлы, контракты и расположение модулей.
responsibilities:
  R1: Собирать снимки рабочего дерева, коммита и индекса Git с происхождением файлов и наблюдаемых фактов.
  R2: Сопоставлять версии модулей и вычислять различия файлов и композиции дерева.
boundaries:
  B1: Публикация, оценка проверок и выбор представления принадлежат хранилищу, модели отчётов и прикладной сессии.
invariants:
  I1: Идентичность содержимого включает факты и неполноту, время захвата и пользовательская метка её не меняют.
  I2: Сравнение сохраняет удалённые модули и различает изменение собственных файлов и изменение потомков.
