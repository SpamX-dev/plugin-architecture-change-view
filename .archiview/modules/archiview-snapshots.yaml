schema_version: 1
id: archiview-snapshots
title: Снимки и сравнение
kind: module
extensions:
  archiview.roles: [domain]
purpose: Фиксировать состояния исходников и показывать, как между ними изменились модули проекта.
boundaries:
  B2: Для рабочего дерева учитывать также новые файлы исходников, ещё не добавленные в Git.
  B3: Определять идентичность содержимого снимка с учётом фактов и неполноты, независимо от времени захвата и пользовательской метки.
invariants:
  I3: Рабочее дерево входит в поддерживаемые источники снимков.
  I4: Индекс Git доступен как самостоятельный источник снимка подготовленного состояния.
  I5: Сохранённый коммит Git доступен как источник исторического снимка.
