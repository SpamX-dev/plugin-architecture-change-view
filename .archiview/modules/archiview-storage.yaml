schema_version: 1
id: archiview-storage
title: Хранение истории проекта
kind: module
extensions:
  archiview.roles: [storage]
responsibilities:
  R1: Сохранять локальные состояния проекта с временем наблюдения и известной базовой ревизией Git.
  observations: Сохранять между запусками порядок наблюдаемых изменений файлов самого модуля, его контракта и объявлений непосредственных детей.
  R2: Уплотнять историю и обновлять публикацию по выбранным снимкам, используя технические отчёты и статусы из модели отчётов.
  R3: Предоставлять для чтения целостное опубликованное сравнение, проверки модуля и их доказательства, в том числе после переноса истории.
  R4: При открытии локального хранилища переносить историю из прежнего внешнего хранилища с сохранением принадлежности исходному проекту.
  R5: Сверять подготовленную к коммиту публикацию с исходниками и контрактами в индексе Git.
  R6: Проверять целостность сохраняемой и читаемой истории.
boundaries:
  B4: Хранилище публикует сравнение только при полноте каждого входящего в него снимка.
  B5: Хранилище принимает повторную запись той же проверки с тем же ID без создания второй попытки. Другое содержимое под занятым ID отклоняется.
  B6: При уплотнении хранилище сохраняет все принятые содержательные проверки и их доказательства.
invariants: {}
