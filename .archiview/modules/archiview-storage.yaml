schema_version: 1
id: archiview-storage
title: Хранение истории проекта
kind: module
extensions:
  archiview.roles: [storage]
purpose: Сохранять снимки, проверки и опубликованные отчёты проекта с возможностью переноса и восстановления.
responsibilities:
  R1: Обслуживать хранилище одного проекта, при открытии локального хранилища переносить в него
    данные из прежнего внешнего каталога. Сохранять локальные состояния с временем наблюдения
    и базовой ревизией Git, когда она известна.
  R2: Проверять целостность, уплотнять и публиковать переносимую историю, сверять подготовленные для Git отчёты с индексом.
boundaries:
  B1: Смысловая оценка и модель актуальности определяются вне хранилища.
invariants:
  I1: Проверка выбранной публикации и её замена выполняются под общей блокировкой записи.
  I2: Перенос сохраняет происхождение и содержимое неизменяемых попыток. Чтение и запись ограничены допустимой файловой областью.
  I3: При уплотнении истории сохраняются содержательные проверки и их доказательства.
  I4: Чтение опубликованной пары и доказательств одного модуля доступно из переносимого work; читатель не смешивает данные разных публикаций.
  I5: При повторном обновлении сессия использует проверенные архивные записи повторно и обнаруживает добавление, изменение, замену и удаление файлов другими процессами.
    Пересчёт применяет текущие правила актуальности даже при прежних исходниках и истории;
    неизменные производные результаты сохраняют публикацию без лишней записи.
