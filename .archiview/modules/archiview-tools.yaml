id: archiview-tools
title: Tools
kind: module
extensions:
  archiview.roles: [tools]
purpose: Предоставлять разработчику инструменты установки и локальной проверки ArchiView.
boundaries:
  B1: Устанавливать ArchiView в профиль пользователя только по явной команде.
  B2: Проводить стендовую проверку на временном проекте без обращения к модели.
invariants: {}
