schema_version: 1
id: dsh-adapter
title: dsh
kind: module
extensions:
  archiview.roles: [plugin]
purpose: Регистрировать работающий экземпляр DeepSeek Harness в ArchiView на время активности плагина, создавать новый чат в соответствующем проекте или каталоге репозитория, передавать в него поручение и запускать проверку изменений по событиям хода с правами текущей сессии.
boundaries: {}
invariants:
  I6: OS Windows 11
  I7: OS Linux
  I8: OS Mac
