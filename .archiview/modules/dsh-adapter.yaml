schema_version: 1
id: dsh-adapter
title: Плагин dsh
kind: module
extensions:
  archiview.roles: [host-adapter, web-endpoints]
purpose: Предоставлять агенту DeepSeek Harness контекст контрактов, а пользователю — панель ArchiView для проекта его чата.
boundaries:
  B5: Обращаться к проекту и создавать сессию только после проверки запроса политикой соединения хоста.
  B6: При запросах просмотра обслуживать панель без запуска модели и без передачи просмотренных данных в контекст агента.
  B7: Для вкладки выбирать проект по рабочей папке чата, которую сообщил хост.
  B8: Для прямого просмотра использовать настроенный корень или рабочую папку процесса.
  B9: Ограничивать доступ модельных инструментов настроенным корнем, а при его отсутствии использовать рабочую папку чата.
  B10: Активировать доступные операции плагина и при отсутствии необязательных сервисов хоста.
invariants: {}
