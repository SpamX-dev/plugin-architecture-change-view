schema_version: 1
id: dsh-client-panel
title: Вкладка ArchiView в веб-клиенте dsh
kind: module
extensions:
  archiview.roles: [host-adapter]
purpose: Давать пользователю вкладку ArchiView в правой панели того чата dsh, из которого она открыта.
boundaries:
  B1: При недоступной странице хоста не читать файлы проекта непосредственно из вкладки.
  B3: Использовать адрес панели, заданный хостом, либо стандартный префикс при отсутствии настройки.
  B4: Принимать поручение только от собственной встроенной страницы того же origin и для того же чата.
  B5: Обычная навигация во вкладке не создаёт сообщений в чате.
invariants: {}
