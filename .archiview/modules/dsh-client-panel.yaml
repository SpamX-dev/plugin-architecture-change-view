schema_version: 1
id: dsh-client-panel
title: Вкладка ArchiView в веб-клиенте dsh
kind: module
extensions:
  archiview.roles: [host-adapter]
responsibilities:
  R1: Регистрировать доступную для открытия вкладку ArchiView на время работы плагина.
  R2: Предоставлять содержимое вкладки под тем же идентификатором, под которым она зарегистрирована.
  R3: Показывать страницу ArchiView по адресу хоста в контексте чата вкладки.
  R4: Доставлять явное поручение анализа или исправления из панели в чат вкладки.
  R5: Возвращать панели подтверждение отправки поручения или причину отказа.
boundaries:
  B1: При недоступной странице хоста не читать файлы проекта непосредственно из вкладки.
  B3: Использовать адрес панели, заданный хостом, либо стандартный префикс при отсутствии настройки.
  B4: Принимать поручение только от собственной встроенной страницы того же origin и для того же чата.
  B5: Обычная навигация во вкладке не создаёт сообщений в чате.
invariants: {}
