    contract:
      schema_version: 1
      id: architecture-web
      title: Клиентские интерфейсы архитектуры
      kind: group
      purpose: Давать пользователю единый интерфейс просмотра архитектуры проекта в
        браузере и в панелях хостов.
      responsibilities:
        R1: Обеспечивать одинаковую навигацию по модулям выбранного сравнения в
          самостоятельной версии и во встроенных панелях.
      boundaries:
        B1: Интерфейс получает состояние проекта и результаты сравнений через API
          ArchiView.
      invariants:
        I1: Содержимое контрактов, отчётов и исходников отображается как данные.
        I2: Клиент не изменяет исходники и принятые границы ответственности.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Извлечение символов, разрешение зависимостей и индексация AST находятся за
          пределами ArchiView и относятся к ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено выбранным корнем проекта. Вкладка чата получает этот
          корень от хоста; явно настроенный для модельных инструментов корень
          ограничивает их чтение.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: Устойчивую ответственность задаёт контракт в .archiview/modules; карта
          modules.tree связывает его id с каталогом проекта. Эвристические
          оценки и текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-change-view
        section: invariants
        id: I5
        text: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются
          строгим TypeScript перед сборкой; классы сохраняют единственную
          ответственность внутри границ своих модулей.
      - module_id: architecture-change-view
        section: invariants
        id: I6
        text: Обе интеграции получают правила ведения контрактов из канонического скилла
          пакета.
      - module_id: architecture-change-view
        section: invariants
        id: I7
        text: Панель обращается к агенту только по явному поручению пользователя
          проанализировать модуль или исправить замечание.
      - module_id: architecture-change-view
        section: invariants
        id: I8
        text: Каждый Git-репозиторий рабочей папки версионирует свои контракты вместе с
          кодом. Панель и агент сохраняют принадлежность модуля его репозиторию.
