    contract:
      id: architecture-web
      kind: group
      purpose: Давать пользователю единый интерфейс просмотра проекта в браузере и во
        встроенной панели.
      responsibilities:
        R1: Предоставлять одинаковую навигацию по модулям выбранного сравнения в
