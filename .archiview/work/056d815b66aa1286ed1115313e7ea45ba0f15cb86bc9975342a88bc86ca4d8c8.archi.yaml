  technical:
    normalization: archiview/module-state/v1
    module_id: architecture-web
    directory: web
    own_files: []
    contract:
      schema_version: 1
      id: architecture-web
      title: Клиентские интерфейсы архитектуры
      kind: group
      purpose: Давать пользователю единый интерфейс просмотра проекта в браузере и во
        встроенной панели.
      responsibilities:
        R1: Предоставлять одинаковую навигацию по модулям выбранного сравнения в
          самостоятельном и встроенном интерфейсах.
      boundaries:
        B2: Действия просмотра оставляют исходники и согласованные контракты без
          изменений.
        B3: Интерфейс отображает полученные документы и исходники только как данные.
      invariants: {}
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Просмотр и подготовка анализа сохраняют исходники и согласованные
          контракты проекта без изменений.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: При подготовке контекста ArchiView не строит граф зависимостей по символам
          исходного кода.
      - module_id: architecture-change-view
        section: boundaries
        id: B3
        text: В общей рабочей папке ArchiView читает контракты и историю модуля в
          пределах репозитория, которому он принадлежит.
      - module_id: architecture-change-view
        section: boundaries
        id: B4
        text: Панель обращается к агенту только по явному поручению пользователя
          провести анализ или исправить замечание.
      - module_id: architecture-change-view
        section: boundaries
        id: B5
        text: Автоматическая проверка структуры может подтвердить наличие контракта и
          корректность формата, но не выполнение обязанностей.
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает встроенную панель Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает встроенную панель DeepSeek Harness.
      - module_id: architecture-change-view
        section: invariants
        id: I9
        text: Самостоятельный локальный запуск входит в обязательные варианты поставки
          приложения.
