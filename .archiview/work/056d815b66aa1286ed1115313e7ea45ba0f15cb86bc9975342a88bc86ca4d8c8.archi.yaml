  technical:
    normalization: archiview/module-state/v1
    module_id: architecture-web
    directory: web
    own_files: []
    contract:
      schema_version: 1
      id: architecture-web
      title: Клиентские интерфейсы архитектуры
      kind: group
      purpose: Объединять клиентские интерфейсы просмотра архитектурных модулей.
      responsibilities:
        R1: Представлять полученные от сервера данные и действия навигации.
      boundaries:
        B1: Чтение проекта, вычисление изменений и хранение снимков принадлежат серверу.
      invariants:
        I1: Содержимое контрактов, отчётов и исходников отображается как данные.
        I2: Клиент не изменяет исходники и принятые границы ответственности.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным
          адаптерам. Извлечение символов, разрешение зависимостей и индексация
          AST принадлежат ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено настроенным корнем проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
  technical_digest: sha256:87d0176e083d4f69f9ce6d1bf01df68518d7bd3e74b35ef0ed16fd7a8fd1c3aa
  complete: true
  self:
    normalization: archiview/module-state/v1
    module_id: architecture-web
    directory: web
    own_files: []
    contract:
      id: architecture-web
      kind: group
      purpose: Объединять клиентские интерфейсы просмотра архитектурных модулей.
      responsibilities:
        R1: Представлять полученные от сервера данные и действия навигации.
