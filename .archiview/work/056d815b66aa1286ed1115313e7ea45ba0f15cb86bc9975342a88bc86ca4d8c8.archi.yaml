        text: Извлечение символов, разрешение зависимостей и индексация AST находятся за
          пределами ArchiView и относятся к ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено выбранным корнем проекта. Вкладка чата получает этот
          корень от хоста; явно настроенный для модельных инструментов корень
          ограничивает их чтение.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: Устойчивую ответственность задаёт контракт в .archiview/modules; карта
          modules.tree связывает его id с каталогом проекта. Эвристические
          оценки и текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-change-view
        section: invariants
        id: I5
        text: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются
          строгим TypeScript перед сборкой; классы сохраняют единственную
          ответственность внутри границ своих модулей.
      - module_id: architecture-change-view
        section: invariants
        id: I6
        text: Обе интеграции получают правила ведения контрактов из канонического скилла
          пакета.
      - module_id: architecture-change-view
        section: invariants
        id: I7
        text: Панель обращается к агенту только по явному поручению пользователя
          проанализировать модуль или исправить замечание.
      - module_id: architecture-change-view
        section: invariants
        id: I8
        text: Каждый Git-репозиторий рабочей папки версионирует свои контракты вместе с
          кодом. Панель и агент сохраняют принадлежность модуля его репозиторию.
    children:
      - module_id: archiview-client
        directory: web/archiview
        contract:
          id: archiview-client
          kind: module
          purpose: Давать навигацию по дереву модулей и показывать контракты, изменения и
            результаты архитектурных проверок.
          responsibilities:
            R1: Владеть поиском, фильтрами, выбором модуля и представлением его
              структурированного контракта. Различать добавленные,
              неизменившиеся и удалённые роли при сравнении собственных
              контрактов. В дереве показывать только роли выбранного состояния,
              в карточке — также удалённые.
            R2: Показывать изменения непосредственно в контракте цветом и открывать диф
              выбранного поля. Название, тип, идентификатор и назначение
              образуют одну группу с общим дифом и самым строгим статусом
              изменения. Представлять состав файлов, историю проверок, замечания
              и сохранённые доказательства. Ошибки показываются в замечаниях без
              дублирующего общего вердикта; пункт и его владелец доступны из
              замечания. Основной чеклист содержит только собственные пункты
              выбранного состояния модуля; пункты предков и повторы версий в
              него не включаются. Изменение текста пункта и замечания к нему
              представлены независимо; каждое замечание доступно отдельным
              переходом из пункта. Открытые замечания обозначаются жуком на
              вкладке замечаний и в дереве; свёрнутый родитель показывает также
              замечания скрытых потомков, раскрытый — только собственные. Число
              на вкладке замечаний учитывает только неисправленные замечания.
            R3: В панели статусов над вкладками и раскрытой строке дерева показывать
              «Требует анализа», если текущая собственная проверка модуля
              отсутствует, устарела, имеет неизвестную актуальность или конфликт
              выводов. Свёрнутая строка дерева дополнительно транслирует
              потребность в анализе скрытых потомков, сохраняя собственную
              оценку модуля. При актуальности показанной области статус
              скрывать. Устаревание отдельной оценки перехода между снимками не
              добавляет этот статус. В деталях проверки раздельно показывать
              актуальность модуля и оценки изменения, причины перепроверки,
              полноту проверки, подтверждённость перечня зависимостей и
              расхождения содержательных оценок; совпадение проверенных входов
              не скрывать из-за частичного покрытия. Прежние списки зависимостей
              не показывать в текущих карточках.
            R4: Представлять хронологию коммитов, незакоммиченных изменений и текущего
              сжатого состояния; выбирать просматриваемое состояние в едином
              списке от свежих состояний к ранним. Выбранное состояние
              обозначать в выпадающем списке без повторной подписи у вкладок.
              При открытии и возврате из истории в текущее состояние показывать
              доступное сохранённое сравнение с датой, сохранять выбор модуля
              при актуализации рабочего дерева и открывать анализ после
              получения актуального сравнения.
            R5: Позволять выбрать папку проекта, если хост открыл панель без привязанного
              корня.
            R6: По явному действию подготавливать поручение анализа выбранного снимка и
              передавать его агенту хоста либо копировать промпт в буфер обмена
              в самостоятельной веб-версии; завершение анализа подтверждать
              импортом результата.
            R7: По явной кнопке карточки передавать агенту поручение исправить выбранное
              замечание либо копировать его в самостоятельной веб-версии.
              Ссылаться на сохранённый анализ и устойчивые идентификаторы
              проверки и замечания; подтверждение передачи не закрывает
              замечание.
            R8: Запрашивать данные сравнения и выполнять выбранные пользователем операции
              просмотра через HTTP в браузере и dsh или через инструменты MCP в
              панели Codex.
            R9: Показывать репозитории рабочей папки в общей навигации и открывать детали и
              историю в контексте выбранного репозитория.
          boundaries:
            B2: Компоненты обращаются к общему клиенту просмотра. В Codex подключение к
              хосту предоставляет адаптер панели. Агент получает только явные
              поручения анализа и исправления.
            B1: Снимки, статусы и вычисленное устаревание получает через API; семантические
              оценки берёт из выбранного отчёта.
          invariants:
            I1: initial, new, changed, removed и unchanged описывают изменения файлов, а не
              качество архитектуры.
            I2: Удалённые модули и исторические доказательства остаются доступны.
            I3: Если контракт отсутствует, интерфейс указывает, что нужно проверить запись
              модуля в карте и его YAML-контракт.
            I4: Неполнота и устаревание видны рядом с выводами; содержимое документов не
              исполняется.
            I5: Изменение контракта отображается только в контракте; исторические записи
              contract_change не входят в замечания, их счётчики и действия
              исправления.
        document_state: documented
