               */
              const verdicts = { consistent: "Согласуется", violation:
              "Нарушение", needs_review: "Требует решения",
                inconclusive: "Недостаточно данных", not_applicable: "Неприменимо", uncertain: "Неоднозначно", not_checked: "Не проверено" };
              const sections: Record<Section, string> = { responsibilities:
