                  результаты архитектурных проверок.
                responsibilities:
                  R1: Владеть поиском, фильтрами, выбором модуля и представлением его
                    структурированного контракта.
                  R2: Показывать изменения непосредственно в контракте цветом и открывать диф
                    выбранного поля. Название, тип, идентификатор и назначение
                    образуют одну группу с общим дифом и самым строгим статусом
                    изменения. Представлять состав файлов, историю проверок,
                    замечания и сохранённые доказательства. Ошибки показываются
                    в замечаниях без дублирующего общего вердикта; пункт и его
                    владелец доступны из замечания. Основной чеклист содержит
                    только собственные пункты выбранного состояния модуля;
                    пункты предков и повторы версий в него не включаются.
                    Изменение текста пункта и замечания к нему представлены
                    независимо; каждое замечание доступно отдельным переходом из
                    пункта. Открытые замечания обозначаются жуком на вкладке
                    замечаний и в дереве; свёрнутый родитель показывает также
                    замечания скрытых потомков, раскрытый — только собственные.
                  R3: Раздельно показывать собственную актуальность и актуальность поддерева,
                    причины перепроверки, полноту проверки, подтверждённость
                    перечня зависимостей и расхождения содержательных оценок;
                    совпадение проверенных входов не скрывать из-за частичного
                    покрытия.
                  R4: Представлять хронологию коммитов, незакоммиченных изменений и текущего
                    сжатого состояния; выбирать просматриваемое состояние в
                    едином списке от свежих состояний к ранним.
                  R5: Позволять выбрать папку проекта, если хост открыл панель без привязанного
                    корня.
                  R6: По явному действию подготавливать поручение анализа выбранного снимка и
                    передавать его агенту хоста либо копировать промпт в буфер
                    обмена в самостоятельной веб-версии; завершение анализа
                    подтверждать импортом результата.
                  R7: По явной кнопке карточки передавать агенту поручение исправить выбранное
                    замечание либо копировать его в самостоятельной веб-версии.
                    Ссылаться на сохранённый анализ и устойчивые идентификаторы
                    проверки и замечания; подтверждение передачи не закрывает
