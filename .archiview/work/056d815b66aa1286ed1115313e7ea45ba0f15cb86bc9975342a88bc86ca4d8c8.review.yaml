          text: >
            /** Typed application operations; components do not know HTTP routes
            or MCP tool names. */

            import type { AnalysisRequest, ArchiViewClient, ClientOptions,
            ComparisonView, ModuleDetail } from "./types.js";

            import { isRecord } from "./types.js";


            /** The transport boundary owns deserialization. The same DTOs are
            returned by both adapters. */

            export function createArchiViewClient({ mode, connection, fetcher =
            globalThis.fetch, base = "", sessionId = "" }: ClientOptions):
            ArchiViewClient {
              async function request<T>(tool: string, verb: "GET" | "POST", route: string, args: object = {}, query = true): Promise<T> {
                let result: unknown;
                if (mode === "mcp") {
                  const bridge = await connection;
                  if (!bridge?.call) throw new Error("Хост не поддерживает вызовы MCP из панели");
                  result = await bridge.call("archiview_ui_" + tool, { ...args });
                } else {
                  const params = new URLSearchParams();
                  if (verb === "GET" && query) for (const [key, value] of Object.entries(args)) {
                    if (value !== undefined) params.set(key, String(value));
                  }
                  if (sessionId !== "") params.set("session", sessionId);
                  const search = params.toString();
                  const response = await fetcher(base + route + (search ? "?" + search : ""), verb === "GET" ? undefined : {
                    method: verb, headers: { "Content-Type": "application/json" }, body: JSON.stringify(args),
                  });
                  result = await response.json();
                  if (!response.ok) throw Object.assign(new Error(isRecord(result) && typeof result.error === "string" ? result.error : "Не удалось получить данные"),
                    { code: isRecord(result) && typeof result.code === "string" ? result.code : undefined });
                }
                if (!isRecord(result)) throw new Error("Сервер передал некорректные данные операции");
                return result as T;
              }
              return {
                setProject: args => request("set_project", "POST", "/api/project", args),
                getComparison: (args = {}) => request<ComparisonView>("get_comparison", "GET", "/api/comparison", args),
                getModule: args => request<ModuleDetail>("get_module", "GET", "/api/module", args),
                prepareAnalysis: args => request<AnalysisRequest>("prepare_analysis", "POST", "/api/analysis", args),
                getAnalysis: args => request<AnalysisRequest>("get_analysis", "GET", "/api/analysis/" + encodeURIComponent(args.id), args, false),
                buildReview: (args = {}) => request("build_review", "POST", "/api/reviews", args),
                saveSnapshot: (args = {}) => request("save_snapshot", "POST", "/api/snapshots", args),
              };
            }
        - id: sha256:49b203105b977d5736cd2441dbdd98ab0bb0089e71aa64de81303d45ac95a832
          kind: file
          path: web/archiview/review.ts
          start_line: 1
