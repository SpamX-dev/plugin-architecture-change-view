          - moduleId: archiview-reviews
            role: executor
            task: Связать выводы агента с адресуемыми пунктами контракта и фактами снимка.
            assessment: B3–B5 устанавливают область собственного чеклиста, допускают ссылки
              замечаний на предков и ограничивают доказательства выбранными
              снимками. Совместимо с Contracts и Snapshots.
          - moduleId: archiview-serialization
            role: utility
            task: Предоставить воспроизводимую запись доменных данных.
            assessment: Потребителю Snapshots нужна идентичность по фактам и их полноте.
              Каноническая запись устойчива к перестановке ключей. Объём утилиты
              ограничен представлением значений.
            consumers:
              - archiview-snapshots
          - moduleId: archiview-snapshots
            role: executor
            task: Определить состав снимка, его происхождение и идентичность.
            assessment: B3 задаёт содержание, на которое ссылаются модель связей и оба вида
              отчётов, с учётом полноты фактов. Время захвата остаётся
              описательной характеристикой.
