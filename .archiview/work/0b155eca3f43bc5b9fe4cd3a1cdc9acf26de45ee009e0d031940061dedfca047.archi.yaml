    children:
      - module_id: archiview-contracts
        directory: framework/contracts
        contract:
          id: archiview-contracts
          kind: module
          purpose: Регламентировать структуру контракта модуля, смысл его полей и привязку
            контракта к каталогу через карту модулей.
          boundaries:
            B2: Область уникальности идентификатора модуля — одна карта репозитория.
          invariants: {}
        document_state: documented
      - module_id: archiview-project-context
        directory: framework/project
        contract:
          id: archiview-project-context
          kind: module
          purpose: Регламентировать контекст проекта ArchiView — корень репозитория,
            принадлежность путей и размещение архитектурных данных.
          boundaries: {}
          invariants: {}
        document_state: documented
      - module_id: archiview-project-types
        directory: framework/project-types
        contract:
          id: archiview-project-types
          kind: module
          purpose: Задавать общие типы данных для описания проекта ArchiView.
          boundaries: {}
          invariants: {}
        document_state: documented
      - module_id: archiview-reports
        directory: framework/static-report
        contract:
          id: archiview-reports
          kind: module
          purpose: Регламентировать структуру технического отчёта и смысл показателей
            состояния модуля и актуальности его проверок.
          boundaries:
            B2: Актуальность проверки состояния и актуальность оценки перехода между
              снимками — два самостоятельных показателя отчёта.
          invariants: {}
        document_state: documented
      - module_id: archiview-reviews
        directory: framework/ai-report
        contract:
          id: archiview-reviews
          kind: module
          purpose: Регламентировать структуру отчёта агента и связь выводов с пунктами
            контракта и доказательствами из выбранных снимков.
          boundaries:
            B3: Чеклист собственной проверки модуля содержит только пункты его контракта.
            B4: Замечание может ссылаться на границу или инвариант предка из контекста
              проверки.
            B5: Ссылки на доказательства относятся к зафиксированным входным данным
              проверки.
          invariants: {}
        document_state: documented
      - module_id: archiview-serialization
        directory: framework/serialization
        contract:
          id: archiview-serialization
          kind: module
          purpose: Регламентировать представление доменных данных ArchiView при
            сериализации и их каноническую запись для воспроизводимого
            отпечатка.
          boundaries:
            B2: YAML-представление допускает значения поддерживаемых типов с уникальными
              ключами словарей и без YAML-ссылок.
            B3: В канонической записи порядок элементов массива значим, исходный порядок
              ключей словаря произволен.
          invariants: {}
        document_state: documented
      - module_id: archiview-snapshots
        directory: framework/snapshots
        contract:
          id: archiview-snapshots
          kind: module
          purpose: Регламентировать состав снимка проекта, его происхождение и условия
            идентичности зафиксированного состояния.
          boundaries:
            B3: Идентичность снимка задают зафиксированные факты и их полнота. Время захвата
              и пользовательская метка относятся к описанию снимка.
          invariants: {}
        document_state: documented
