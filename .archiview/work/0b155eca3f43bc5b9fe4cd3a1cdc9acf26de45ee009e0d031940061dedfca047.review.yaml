      extensions:
        archiview.grasp:
          - moduleId: archiview-reviews
            role: executor
            task: Задать форму агентского отчёта и связи выводов с контрактами и
              доказательствами.
            assessment: Собственный чеклист, допустимая ссылка на ограничение предка и
              привязка доказательств к снимку согласуют отчёт с моделями
              Contracts и Snapshots.
          - moduleId: archiview-contracts
            role: executor
            task: Задать структуру контракта и привязать модуль к каталогу.
            assessment: Граница уникальности в одной карте согласуется с контекстом одного
              репозитория. Модель предоставляет адресуемый контракт для отчёта и
              снимка.
          - moduleId: archiview-relation-model
            role: executor
            task: Представить направленную зависимость модулей и её места использования.
            assessment: Контракт описывает связь и доказательства в снимке, оставляя
              определение зависимостей за пределами Framework.
          - moduleId: archiview-project-context
            role: executor
            task: Определить контекст проекта и принадлежность выбранных путей.
            assessment: Эта часть модели даёт репозиторий и границы для карты модулей,
              расположения данных и снимков.
          - moduleId: archiview-project-types
            role: utility
            task: Задать общие типы описания проекта.
            assessment: По предмету контракта типы обслуживают модель контекста проекта. Их
              обещание ограничено описанием данных и не дублирует политику
              принадлежности путей.
            consumers:
              - archiview-project-context
          - moduleId: archiview-serialization
            role: utility
            task: Задать сериализацию и каноническую запись для воспроизводимых отпечатков.
            assessment: Идентичность состояния — явная задача Snapshots. Правила словарей и
              порядка массивов обеспечивают каноническое представление. Смысл
              отчёта определяет его предметная модель.
            consumers:
              - archiview-snapshots
          - moduleId: archiview-snapshots
            role: executor
            task: Зафиксировать состав, происхождение и идентичность состояния.
            assessment: B3 относит факты и полноту к идентичности, время и пользовательскую
              метку — к описанию. Модель задаёт смысл ссылок на снимок у
              отчётов.
          - moduleId: archiview-reports
            role: executor
            task: Описать технический отчёт и показатели актуальности проверок.
            assessment: Раздельные показатели текущего состояния и перехода согласуются со
              снимками и не дублируют содержательные выводы агентского отчёта.
