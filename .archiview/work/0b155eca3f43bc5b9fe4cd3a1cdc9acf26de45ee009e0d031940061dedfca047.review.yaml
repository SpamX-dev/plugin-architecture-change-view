            role: executor
            task: Определить состав снимка, его происхождение и идентичность.
            assessment: B3 задаёт содержание, на которое ссылаются модель связей и оба вида
              отчётов, с учётом полноты фактов. Время захвата остаётся
              описательной характеристикой.
