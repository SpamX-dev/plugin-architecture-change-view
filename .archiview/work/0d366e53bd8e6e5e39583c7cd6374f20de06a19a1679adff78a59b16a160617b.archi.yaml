    contract:
      schema_version: 1
      id: archiview-analysis-service
      title: analysis-service
      kind: module
      extensions:
        archiview.roles:
          - service
      purpose: Показывать текущие потребности в анализе и исправлениях, готовить
        поручения и принимать результаты анализа модулей.
      boundaries:
        B1: Подтверждать завершение запроса только после появления проверенного отчёта с
          ожидаемым reviewId.
      invariants:
        I1: Для ручной отправки фиксировать входы анализа и использовать HostBridge
          выбранного пользователем harness.
        I2: Повторная доставка одного запроса в выбранный harness возвращает сохранённую
          квитанцию без создания второго чата.
        I3: При потере подтверждения от harness сохранять неопределённый статус
          доставки.
        I4: Скилл перед ответом агента и контроль при завершении хода используют один
          список незавершённых анализов модулей, проверки связей и открытых
          замечаний.
        I5: Экспорт доказательств текущего анализа ограничен выбранным модулем и видом
          проверки.
        I6: Разбор связей актуален для проверенного графа SCIP и контрактов, а
          доказательства замечаний принадлежат этому графу.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B6
        text: Не является IDE и не стремится заменить функционал IDE
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает интеграцию с Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает интеграцию с DeepSeek Harness.
      - module_id: architecture-change-view
        section: invariants
        id: I9
        text: Локальный запуск в браузере входит в обязательные варианты поставки
          приложения.
      - module_id: architecture-web
        section: boundaries
        id: B2
        text: Действия просмотра оставляют исходники и согласованные контракты без
          изменений.
      - module_id: architecture-web
        section: boundaries
        id: B3
        text: Интерфейс отображает полученные документы и исходники только как данные.
      - module_id: archiview-application
        section: boundaries
        id: B3
        text: Сессия работает с выбранным корнем проекта на протяжении своей жизни.
      - module_id: archiview-application
        section: boundaries
        id: B4
        text: История, снимки и запросы анализа доступны только в контексте
          соответствующего репозитория.
      - module_id: archiview-application
        section: boundaries
        id: B5
        text: Историческое представление использует выбранный снимок и сохраняет текущую
          публикацию.
      - module_id: archiview-application
        section: boundaries
        id: B6
        text: Открытие сохранённого представления читает опубликованную пару и её
          доказательства без нового наблюдения рабочего дерева.
      - module_id: archiview-application
        section: boundaries
        id: B7
        text: Сессия подтверждает завершение содержательной проверки только после
          импорта результата.
      - module_id: archiview-application
        section: boundaries
        id: B8
        text: В поручение агенту не входит определение зависимостей модулей.
