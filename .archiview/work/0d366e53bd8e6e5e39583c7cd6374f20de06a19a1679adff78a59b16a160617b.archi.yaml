            import type { AnalysisStatus, PreparedAnalysis, FindingFixArgs }
            from "../../../module-operations/api.js";

            import type { ReportStore } from
            "../../../analyse/module-review/report-store.js";

            import type { SnapshotStore } from
            "../../../analyse/git-changes/snapshot-store.js";

            import type { Snapshot, SnapshotReference, ComparisonModule } from
            "../../../framework/snapshots/types.js";

            import type { SessionView } from
            "../../../module-operations/session-view.js";

            import { analysisInstructions } from
            "../../../analyse/module-review/analysis-scope.js";

            import type { AnalysisType, ReviewManifest } from
            "../../../framework/ai-report/types.js";

            import type { DependencySelector, ReviewEntry } from
            "../../../framework/static-report/types.js";

            import { readAnalysisRequest, readDelivery, type Delivery, type
            AnalysisRequest } from
            "../../../module-operations/analysis-record.js";

            import { errorDetails } from "../../../node-errors.js";

            /**
             * Сервис фиксирует входы, подготавливает поручение и сохраняет подтверждение выбранного хоста.
             * CLI проверяет и импортирует результат по идентификатору запроса.
             * Снимки и область анализа остаются неизменяемыми даже после изменения проекта.
             */
            import { findingFixPrompt } from
            "../../../module-operations/finding-fix.js";

            import { reviewFilePath } from
            "../../../module-operations/module-view.js";

            import { connectHarness, listHarnesses, startTimeoutMs, type
            Assignment } from "../host-bridge/channel.js";

            import { ApplicationError } from
            "../../../module-operations/errors.js";

            import { randomUUID } from "node:crypto";

            import { mkdir, readFile, writeFile, lstat, link, rename, rm } from
            "node:fs/promises";

            import path from "node:path";

            import { fileURLToPath } from "node:url";

            import { stringify } from "yaml";

            import { assertStateLocation } from "../../../storage/paths.js";

            import { createReviewInput } from
            "../../../analyse/module-review/review-input.js";

            import { digest } from "../../../framework/serialization/digest.js";

            import { parseYaml } from
            "../../../framework/serialization/yaml.js";

            import { cliArguments, packageUrl } from
            "../runtime/package-paths.js";


            const MAX_SAVED_INPUT_BYTES = 256 * 1024 * 1024;

            const MAX_METADATA_BYTES = 32 * 1024 * 1024;

            const MAX_REVIEW_ADDITION_BYTES = 32 * 1024 * 1024;

            export const reviewAssignmentPrefix = "[ArchiView review] ";


            function savedInput(text: string) {
              if (Buffer.byteLength(text) > MAX_SAVED_INPUT_BYTES) throw new Error("Вход анализа превышает допустимый размер");
              return text;
            }


            /** Разрешает только внутренний идентификатор запроса, без
            произвольного пути. */

            function requestDirectory(store: SnapshotStore, id: string) {
              if (!/^[a-f0-9-]{36}$/.test(id)) throw new Error("Некорректный идентификатор анализа");
              return path.join(store.directory, "snapshots", "analysis", id);
            }


            /** Читает обычный файл в области данных; ссылки не расширяют
            разрешённую область. */

            async function readRequestFile(store: SnapshotStore, directory:
            string, name: string, maxSize: number) {
              const file = path.join(directory, name);
              await assertStateLocation(store.root, store.directory, file);
              const info = await lstat(file);
              if (!info.isFile() || info.isSymbolicLink() || info.size > maxSize)
                throw new Error("Недопустимый файл анализа");
