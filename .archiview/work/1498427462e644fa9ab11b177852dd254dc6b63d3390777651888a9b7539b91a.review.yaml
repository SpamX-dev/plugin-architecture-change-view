            id: archiview-host-bridge

            title: HostBridge

            kind: module

            extensions:
              archiview.roles: [port]
            purpose: Обнаруживать живые регистрации harness и передавать
            поручение выбранному экземпляру с подтверждением создания чата.

            boundaries: {}

            invariants: {}
        - id: sha256:39a69c09cf59f6bf8c01f92a8e5790cff546fbfacc4663777f2ec815ff5df740
          kind: file
          path: web/web-backend/host-bridge/channel.ts
          start_line: 1
