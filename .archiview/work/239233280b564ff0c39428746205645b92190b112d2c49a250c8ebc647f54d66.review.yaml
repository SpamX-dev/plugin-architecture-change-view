          subject: current
          verdict: violation
          explanation: Оба ребёнка создают чат и передают поручение в свои хосты. Ни один
            не обещает объявить свою доступность во время работы хоста. Создание
            чата по прямому обращению к адаптеру не обеспечивает регистрацию, по
            которой хост можно выбрать.
          evidence:
            - snapshot: current
              fact_id: sha256:96b40ed6b540eba0dd401e41fb3ea08d536ee0b6e6ef231fc9c7ac23a5d808de
            - snapshot: current
