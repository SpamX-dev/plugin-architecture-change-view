      findings:
        - id: finding-1
          kind: responsibility_gap
          certainty: confirmed
          severity: warning
          lifecycle: unknown
          summary: Создание чатов распределено между адаптерами, регистрация работающих
            хостов осталась без исполнителя
          details: Каждый адаптер может исправно создавать чат при обращении к нему, но не
            публиковать присутствие своего работающего хоста. Тогда оба дочерних
            контракта выполнены, а перечень выбираемых работающих harness
            остаётся пустым.
          recommendation: Определить владельца жизненного цикла регистрации. Это может
            быть единый механизм регистрации или обязанность каждого адаптера
            объявлять доступность своего экземпляра.
          clauses:
