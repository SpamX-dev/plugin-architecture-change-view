        ребёнка из экспорта: moduleId, role (executor или utility), task
        (задача), assessment (результат сравнения). Для утилиты добавь consumers
        со списком потребителей; если по контрактам потребитель не установлен,
        укажи это в assessment и оставь пустой список. Для листа используй
        пустой массив. Код, контракты предков и более глубоких потомков в эту
        проверку не входят.'
