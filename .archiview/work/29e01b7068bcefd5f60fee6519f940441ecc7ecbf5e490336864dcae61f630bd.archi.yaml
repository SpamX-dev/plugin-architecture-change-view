            /** Сбор файлов, контрактов и доказательств из рабочего дерева,
            коммита или индекса Git. */

            import { snapshotDigest, structureHash } from "./identity.js";

            import type {
              FileRecord, Fact, SnapshotModule, Snapshot, SnapshotOptions, GitRevision,
            } from "./types.js";

            import { errorDetails } from "../runtime/errors.js";

            import { spawn } from "node:child_process";

            import { createHash } from "node:crypto";

            import { createReadStream } from "node:fs";

            import { lstat, readFile, realpath } from "node:fs/promises";

            import path from "node:path";

            import { SOURCE_EXTENSIONS, excludedProjectPath, projectFiles,
            regularProjectFile } from "../contracts/inventory.js";

            import { contractDocument } from "../contracts/document.js";

            import { digest as contentDigest } from
            "../serialization/digest.js";

            import { readSnapshotRoot } from "../project/identity.js";


            /** Контракты читаются в обоих форматах; новый формат имеет
            безусловный приоритет. */

            const isContract = (file: string) => ["arch.yaml",
            "module.md"].includes(path.posix.basename(file));

            const isSource = (file: string) =>
            SOURCE_EXTENSIONS.has(path.posix.extname(file).toLowerCase());


            /** Относительные пути снимков используют единые разделители на всех
            платформах. */

