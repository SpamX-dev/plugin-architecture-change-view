          text: >
            /** Сбор файлов, контрактов и доказательств из рабочего дерева,
            коммита или индекса Git. */

            import { snapshotDigest, structureHash } from "./identity.js";

            import type {
              FileRecord, Fact, Snapshot, SnapshotOptions, GitRevision,
            } from "./types.js";

            import { errorDetails } from "../runtime/errors.js";

            import { spawn } from "node:child_process";

            import { createHash } from "node:crypto";

            import { createReadStream } from "node:fs";

            import { lstat, readFile, realpath } from "node:fs/promises";

            import path from "node:path";

            import { excludedProjectPath, projectFiles, regularProjectFile }
            from "../contracts/source-files.js";

            import { decodeContractText, listModuleContractPaths,
            MAX_DOCUMENT_BYTES, MAX_TREE_BYTES, MODULE_DIRECTORY,
            MODULE_TREE_FILE, readContractStorageFile } from
            "../contracts/module-tree.js";

            import { isSource, snapshotModules, type WorkingLayout } from
            "./module-layout.js";

            import { repositoryDirectoryOwnership } from
            "../project/workspace.js";

            import { digest as contentDigest } from
            "../serialization/digest.js";

            import { readSnapshotRoot } from "../project/identity.js";


            function isContractStorage(file: string) {
              return file === MODULE_TREE_FILE || path.posix.dirname(file) === MODULE_DIRECTORY && file.endsWith(".yaml");
            }


            /** Относительные пути снимков используют единые разделители на всех
            платформах. */

            function portable(value: string) {
              return value.split(path.sep).join("/");
            }


            /** Запускает только Git без оболочки, ограничивая время и объём
            ответа. */

            async function git(root: string, args: string[], input: string |
            Buffer = "", maxBytes = 16 * 1024 * 1024): Promise<Buffer> {
              return new Promise((resolve, reject) => {
                const child = spawn("git", args, { cwd: root, windowsHide: true,
                  stdio: ["pipe", "pipe", "pipe"] });
                const chunks: Buffer[] = [];
                let bytes = 0;
                let diagnostic = "";
                let failure: (Error & {exitCode?: number | null}) | undefined;
                const timer = setTimeout(() => {
                  failure = new Error("Git operation timed out");
                  child.kill();
                }, 30000);
                child.on("error", (error) => { clearTimeout(timer); reject(error); });
                child.stdout.on("data", (chunk) => {
                  bytes += chunk.length;
                  if (bytes > maxBytes) {
                    failure = new Error("Git response exceeds the size limit");
                    child.kill();
                  } else chunks.push(chunk);
                });
                child.stderr.on("data", (chunk) => {
                  diagnostic = (diagnostic + chunk.toString()).slice(-4096);
                });
                child.stdin.on("error", () => {});
                child.on("close", (code) => {
                  clearTimeout(timer);
                  if (failure || code !== 0) {
                    const error: Error & {exitCode?: number | null} = failure ?? new Error(diagnostic.trim() || "Git exited with code " + code);
                    error.exitCode = code;
                    reject(error);
                  }
                  else resolve(Buffer.concat(chunks));
                });
                child.stdin.end(input);
              });
            }


            /** Определяет корень и алгоритм Git; отсутствие Git допускает
            файловые снимки. */

            async function gitInfo(root: string) {
              let repository;
              try {
                repository = (await git(root, ["rev-parse", "--show-toplevel"])).toString().trim();
              } catch (errorCause) { const error = errorDetails(errorCause);
                if (error.code === "ENOENT" || error.message.includes("not a git repository")) return null;
                throw error;
              }
              const algorithm = (await git(root, ["rev-parse", "--show-object-format"]))
                .toString().trim();
              return { repository: await realpath(repository), algorithm };
            }


            /** Вычисляет blob-отпечаток вне Git, не загружая крупные исходники
            в память. */

            async function fileHash(file: string) {
              const before = await lstat(file);
              const hash = createHash("sha1").update("blob " + before.size + "\0");
              for await (const chunk of createReadStream(file)) hash.update(chunk);
              const after = await lstat(file);
              if (before.size !== after.size || before.mtimeMs !== after.mtimeMs) {
                throw new Error("File changed while being captured");
              }
              return hash.digest("hex");
            }


            /** Hash the exact buffer retained as evidence using Git's filters
            when available. */

