              kind: string;
              label: string;
              revision?: string;
              baseRevision?: string | null;
              subject?: string;
              isHead?: boolean;
              complete: boolean;
              diagnostics: string[];
              modules: SnapshotModule[];
              facts: Fact[];
              evidenceLimitations: string[];
              scoped?: boolean;
              scope_digest?: string;
            }


            export interface SnapshotOptions {
              maxFiles?: number;
              snapshotRoot?: string;
              revision?: string;
            }


            export type ChangeStatus = "initial" | "new" | "changed" | "removed"
            | "unchanged";


            export interface FileChange {
              path: string;
              status: ChangeStatus;
            }


            export interface ComparisonModule {
              directory: string;
