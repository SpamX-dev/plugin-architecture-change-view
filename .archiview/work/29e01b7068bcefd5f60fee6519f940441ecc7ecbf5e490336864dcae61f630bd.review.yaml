              text?: string;
            }


            export interface Fact {
              id: string;
              kind: string;
              path: string;
              text: string;
              start_line?: number;
              end_line?: number;
            }


            export interface SnapshotModule {
              directory: string;
              documentPath: string;
              document: ContractDocument;
              files: SourceFile[];
              sourceFiles: number;
              fingerprint: string;
            }


            export interface Snapshot {
              schema_version: number;
              root: string;
              id: string;
              digest: string;
              capturedAt: string;
