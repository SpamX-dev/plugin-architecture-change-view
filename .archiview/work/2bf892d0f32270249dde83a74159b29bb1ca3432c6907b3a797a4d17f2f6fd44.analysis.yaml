      observed:
        baseline: null
        current:
          summary: В types.ts объявлены типы направленных связей, мест использования
            символов и графа для конкретного снимка. Там же заданы формы данных
            для просмотра связей модуля и результата проверки циклов.
          responsibilities:
            - text: RelationEdge задаёт направление ребра полями from и to. Для каждого
                символа на ребре SymbolReferences хранит его идентификатор, имя,
                место определения и список мест использования. Site задаёт путь
                относительно репозитория, строку и столбец с отсчётом от
                единицы.
              evidence:
                - snapshot: current
                  fact_id: sha256:477de8b43782365fb541cbfeeeb66d4c49cb70c2f8312521b362033b8dbbb4ef
            - text: RelationGraph объединяет рёбра и привязывает граф к снимку через
                snapshotDigest. В графе также представлены версия формата,
                входы, индексатор и счётчики indexed и eligible.
              evidence:
                - snapshot: current
                  fact_id: sha256:477de8b43782365fb541cbfeeeb66d4c49cb70c2f8312521b362033b8dbbb4ef
            - text: ModuleRelations описывает готовность данных и, когда они готовы, различает
                исходящие и входящие связи модуля. RelationPeer группирует
                символы по соседнему модулю и добавляет текст к каждому месту
                использования.
              evidence:
                - snapshot: current
                  fact_id: sha256:477de8b43782365fb541cbfeeeb66d4c49cb70c2f8312521b362033b8dbbb4ef
            - text: DependencyCycleCheck различает отсутствие индекса, отсутствие поддержки и
                завершённую проверку. В последнем случае каждый цикл представлен
                шагами CycleStep с направлением перехода и местом использования.
              evidence:
                - snapshot: current
                  fact_id: sha256:477de8b43782365fb541cbfeeeb66d4c49cb70c2f8312521b362033b8dbbb4ef
