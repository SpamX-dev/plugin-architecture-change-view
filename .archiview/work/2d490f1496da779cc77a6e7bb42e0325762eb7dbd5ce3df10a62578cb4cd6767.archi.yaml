            selected workspace. */

            export interface WorkspaceProject {
              repository: string;
              hasModuleMap: boolean;
            }


            /** On-disk origin of historical snapshots. The active checkout may
            have moved. */

            export interface ProjectIdentity {
              schema_version: 1;
              snapshot_root: string;
            }


