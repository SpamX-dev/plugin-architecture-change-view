            export interface ProjectIdentity {
              schema_version: 1;
              snapshot_root: string;
            }


            export interface ProjectSourceLocation {
              workspaceRoot: string;
              root: string;
              repository: string;
              directory: string;
              existingDirectory: string;
              plannedPath?: string;
            }
