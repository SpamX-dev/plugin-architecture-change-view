      instructions: 'Проверь композицию по собственному контракту и контрактам
        непосредственных детей. Разбери детей по их роли относительно обещания
        родителя. Для непосредственных исполнителей проверь совместимость их
        контрактов между собой и способность вместе выполнить обещание родителя.
        Для утилит (Pure Fabrication) укажи потребителя и задачу, проверь
        достаточность и границы обязанностей. Для листа объясни неприменимость
        композиции. Выводы и замечания обоснуй сохранёнными контрактами. Заполни
        report.extensions["archiview.grasp"] для каждого непосредственного
        ребёнка из экспорта: moduleId, role (executor или utility), task
        (задача), assessment (результат сравнения). Для утилиты добавь consumers
        со списком потребителей; если по контрактам потребитель не установлен,
        укажи это в assessment и оставь пустой список. Для листа используй
        пустой массив. Код, контракты предков и более глубоких потомков в эту
        проверку не входят.'
