    contract:
      schema_version: 1
      id: dsh-adapter
      title: Плагин dsh
      kind: module
      purpose: Поставлять ArchiView в DeepSeek Harness как плагин хоста — инструменты
        чтения контрактов, маршруты панели и публикацию скилла без запуска
        модели самим просмотром.
      responsibilities:
        R1: Регистрировать в реестре инструментов dsh чтение инвентаризации и контекста
          каталогов, не добавляя данные панели в контекст модели.
        R2: Публиковать канонический скилл module-boundaries в реестре скиллов dsh из
          единственного файла пакета, без копий в пользовательских каталогах.
        R3: Отдавать браузерной половине шаблон панели и операции просмотра по
          префиксным маршрутам, проверяя каждый запрос политикой соединения
          хоста.
        R4: Держать сессии прикладного сервиса по корню проекта, разрешая корень по
          рабочему каталогу чата вкладки, и закрывать реестр при выгрузке
          плагина.
        R5: Передавать браузерной половине префикс маршрутов панели через внедрение
          конфигурации в документ клиента, чтобы настройка хоста не расходилась
          с адресом вкладки.
      boundaries:
        B1: Прикладные операции принадлежат application; адаптер не дублирует сравнение,
          снимки, проверки и анализ.
        B2: Отображение модулей принадлежит web, а браузерная регистрация вкладки —
          client.
        B3: MCP-сервер и панель Codex принадлежат codex; этот модуль их не импортирует и
          не заменяет.
        B4: Генерация проекта, Git-история и хранилище отчётов остаются в существующих
          модулях ядра; адаптер только передаёт им корень и аргументы запроса.
      invariants:
        I1: Маршрут панели не запускает модель и не возвращает данные просмотра в
          контекст агента.
        I2: До проверки политики соединения запрос не читает проект и не создаёт сессию.
        I3: Корень проекта берётся из конфигурации плагина или рабочего каталога
          процесса и никогда из URL запроса.
        I4: Публикация скилла не создаёт второго источника текста — используется файл
          пакета.
        I5: Необязательные сервисы хоста (скиллы, хранилище и контроллер сессий)
          читаются только при наличии и не блокируют активацию плагина.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным
          адаптерам. Извлечение символов, разрешение зависимостей и индексация
          AST принадлежат ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено настроенным корнем проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-core
        section: boundaries
        id: B1
        text: Прикладные операции находятся в application; HTTP и CLI в archiview
          являются адаптерами, отображение принадлежит web.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: Семантический вывод ответственности выполняет агент или внешний
          анализатор. Наличие контракта не доказывает его выполнения.
      - module_id: architecture-core
        section: boundaries
        id: B3
        text: Адаптер Codex находится в codex; вызывает прикладной сервис через скрытые
          от модели инструменты UI без HTTP-сервера.
      - module_id: architecture-core
        section: boundaries
        id: B4
        text: Адаптер dsh находится в dsh; регистрирует инструменты, маршруты панели и
          скилл хоста, получая прикладные операции из application.
      - module_id: architecture-core
        section: invariants
        id: I1
        text: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости,
          сборка и папки .archiview не расширяют анализ. Запись данных
          допускается в .archiview корня проекта либо явно выбранном внешнем
          хранилище; ссылки не меняют эту область.
      - module_id: architecture-core
        section: invariants
        id: I2
        text: Неполнота обхода и доказательств сообщается явно.
      - module_id: architecture-core
        section: invariants
        id: I3
        text: Снимки и отчёты не заменяют arch.yaml и не согласуют новую
          ответственность.
      - module_id: architecture-core
        section: invariants
        id: I4
        text: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых
          файлах.
      - module_id: architecture-core
        section: invariants
        id: I5
        text: Структурное различие контрактов не создаёт замечание; оценка нарушения
          требует отдельного анализа.
