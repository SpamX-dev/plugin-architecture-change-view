             * @returns {string} действующий префикс маршрутов.
             */
            export function resolveClientPrefix(scope: object = globalThis) {
              const config = (scope as Record<string, unknown>)[CLIENT_GLOBAL];
              const injected = config && typeof config === "object" ? (config as Record<string, unknown>).prefix : undefined;
              return asPrefix(injected) ?? DEFAULT_PREFIX;
