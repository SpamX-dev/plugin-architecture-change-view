    contract:
      schema_version: 1
      id: dsh-adapter
      title: Плагин dsh
      kind: module
      purpose: Поставлять ArchiView в DeepSeek Harness как плагин хоста — инструменты
        чтения контрактов, маршруты панели и публикацию скилла без запуска
        модели самим просмотром.
      responsibilities:
        R1: Регистрировать в реестре инструментов dsh чтение инвентаризации и контекста
          каталогов, не добавляя данные панели в контекст модели.
        R2: Публиковать канонический скилл module-boundaries в реестре скиллов dsh из
          единственного файла пакета, без копий в пользовательских каталогах.
        R3: Отдавать браузерной половине шаблон панели и операции просмотра по
          префиксным маршрутам, проверяя каждый запрос политикой соединения
          хоста.
        R4: Держать сессии прикладного сервиса по корню проекта, разрешая корень по
          рабочему каталогу чата вкладки, и закрывать реестр при выгрузке
          плагина.
        R5: Передавать браузерной половине префикс маршрутов панели через внедрение
          конфигурации в документ клиента, чтобы настройка хоста не расходилась
          с адресом вкладки.
      boundaries:
        B1: Прикладные операции принадлежат application; адаптер не дублирует сравнение,
          снимки, проверки и анализ.
        B2: Отображение модулей принадлежит web, а браузерная регистрация вкладки —
          client.
        B3: MCP-сервер и панель Codex принадлежат codex; этот модуль их не импортирует и
          не заменяет.
        B4: Генерация проекта, Git-история и хранилище отчётов остаются в существующих
          модулях ядра; адаптер только передаёт им корень и аргументы запроса.
      invariants:
        I1: Маршрут панели не запускает модель и не возвращает данные просмотра в
          контекст агента.
        I2: До проверки политики соединения запрос не читает проект и не создаёт сессию.
        I3: Корень проекта берётся из конфигурации плагина или рабочего каталога
          процесса и никогда из URL запроса.
        I4: Публикация скилла не создаёт второго источника текста — используется файл
          пакета.
        I5: Необязательные сервисы хоста (скиллы, хранилище и контроллер сессий)
          читаются только при наличии и не блокируют активацию плагина.
