      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено выбранным корнем проекта. Вкладка чата получает этот
          корень от хоста; явно настроенный для модельных инструментов корень
          ограничивает их чтение.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-change-view
        section: invariants
        id: I5
        text: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются
          строгим TypeScript перед сборкой; классы сохраняют единственную
          ответственность внутри границ своих модулей.
      - module_id: architecture-core
        section: boundaries
        id: B1
        text: Прикладные операции находятся в application; HTTP и CLI в archiview
          являются адаптерами, отображение принадлежит web.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: Семантический вывод ответственности выполняет агент или внешний
          анализатор. Наличие контракта не доказывает его выполнения.
      - module_id: architecture-core
        section: boundaries
        id: B3
        text: Адаптер Codex находится в codex; вызывает прикладной сервис через скрытые
          от модели инструменты UI без HTTP-сервера.
      - module_id: architecture-core
        section: boundaries
        id: B4
        text: Адаптер dsh находится в dsh; регистрирует инструменты, маршруты панели и
          скилл хоста, получая прикладные операции из application.
      - module_id: architecture-core
        section: invariants
        id: I1
        text: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости,
          сборка и папки .archiview не расширяют анализ. Запись данных
          допускается в .archiview корня проекта либо явно выбранном внешнем
          хранилище; ссылки не меняют эту область.
      - module_id: architecture-core
        section: invariants
        id: I2
        text: Неполнота обхода и доказательств сообщается явно.
      - module_id: architecture-core
        section: invariants
        id: I3
        text: Снимки и отчёты не заменяют arch.yaml и не согласуют новую
          ответственность.
      - module_id: architecture-core
        section: invariants
        id: I4
        text: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых
          файлах.
      - module_id: architecture-core
        section: invariants
        id: I5
        text: Структурное различие контрактов не создаёт замечание; оценка нарушения
          требует отдельного анализа.
