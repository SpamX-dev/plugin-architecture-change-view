            внутренним. */

            const ERROR_STATUS: Record<string, number> = {
              INVALID_ARGUMENT: 400,
              REPOSITORY_UNAVAILABLE: 400,
              NOT_FOUND: 404,
              STALE_VIEW: 409,
              REQUEST_TOO_LARGE: 413,
              INCOMPLETE_VIEW: 422,
            };


