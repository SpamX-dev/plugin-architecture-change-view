            export function panelPageUrl(prefix: string, sessionId: unknown) {
              const base = (asPrefix(prefix) ?? DEFAULT_PREFIX) + "/";
              if (typeof sessionId !== "string" || sessionId === "") return base;
              return base + "?session=" + encodeURIComponent(sessionId);
            }
