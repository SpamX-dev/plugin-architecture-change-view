             * берётся из URL — его определяет `getSession`.
             *
             * @module plugin-architecture-change-view/dsh/routes
             */

            import { readFile } from "node:fs/promises";

            import { applicationError, ApplicationError } from
            "../application/errors.mjs";

            import { packageUrl } from "../package-paths.mjs";

            import { asPrefix, DEFAULT_PREFIX } from "./panel-contract.mjs";


            export { DEFAULT_PREFIX };


            /** Предел тела JSON-запроса: операции панели передают только
            идентификаторы и пути. */

            const MAX_BODY_BYTES = 4096;


            /** Прикладной код ошибки в HTTP-статус; незнакомый код считается
            внутренним. */

