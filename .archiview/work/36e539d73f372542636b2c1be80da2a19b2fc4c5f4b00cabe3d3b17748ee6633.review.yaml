                R1: Публиковать канонический скилл module-boundaries и MCP-инструменты чтения контрактов.
                R2: Проверять покрытие всех каталогов исходного кода контрактами arch.yaml и направлять агента на
                  немедленный перенос старых описаний либо анализ и создание отсутствующих.
                R3: Формировать снимки структуры, контрактов и доказательств; сохранять и отображать неизменяемые
                  review.yaml для выбранного сравнения.
                R4: Автоматически строить и уплотнять переносимые YAML-отчёты, сохраняя историю содержательных
                  проверок и отдельно определяя актуальность модуля и его поддерева.
                R5: Поставлять локальный плагин Codex с веб-панелью, явным запуском анализа выбранного модуля
                  и передачей агенту поручения исправить выбранное замечание.
                R6: Поставлять плагин dsh — инструменты чтения, маршруты панели и публикацию скилла в хосте
                  DeepSeek Harness без запуска модели самим просмотром.
              boundaries:
                B1: Запись и содержательный анализ контрактов выполняет агент своими файловыми инструментами.
                  Просмотр не изменяет исходники проекта.
                B2: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным адаптерам.
