          contract:
            id: dsh-adapter
            kind: module
            purpose: Поставлять ArchiView в DeepSeek Harness как плагин хоста — инструменты
              чтения контрактов, маршруты панели и публикацию скилла без запуска
              модели самим просмотром.
            responsibilities:
              R1: Регистрировать в реестре инструментов dsh чтение инвентаризации и контекста
                каталогов, не добавляя данные панели в контекст модели.
              R2: Публиковать канонический скилл module-boundaries в реестре скиллов dsh из
                единственного файла пакета, без копий в пользовательских
                каталогах.
              R3: Отдавать браузерной половине шаблон панели и операции просмотра по
                префиксным маршрутам, проверяя каждый запрос политикой
                соединения хоста.
              R4: Держать сессии прикладного сервиса по корню проекта, разрешая корень по
                рабочему каталогу чата вкладки, и закрывать реестр при выгрузке
                плагина.
              R5: Передавать браузерной половине префикс маршрутов панели через внедрение
                конфигурации в документ клиента, чтобы настройка хоста не
                расходилась с адресом вкладки.
            boundaries:
              B1: Прикладные операции принадлежат application; адаптер не дублирует сравнение,
                снимки, проверки и анализ.
              B2: Отображение модулей принадлежит web, а браузерная регистрация вкладки —
                client.
              B3: MCP-сервер и панель Codex принадлежат codex; этот модуль их не импортирует и
                не заменяет.
              B4: Генерация проекта, Git-история и хранилище отчётов остаются в существующих
                модулях ядра; адаптер только передаёт им корень и аргументы
                запроса.
            invariants:
              I1: Маршрут панели не запускает модель и не возвращает данные просмотра в
                контекст агента.
              I2: До проверки политики соединения запрос не читает проект и не создаёт сессию.
              I3: Корень проекта берётся из конфигурации плагина или рабочего каталога
                процесса и никогда из URL запроса.
              I4: Публикация скилла не создаёт второго источника текста — используется файл
                пакета.
              I5: Необязательные сервисы хоста (скиллы, хранилище и контроллер сессий)
                читаются только при наличии и не блокируют активацию плагина.
          children:
            - module_id: dsh-client-panel
              directory: src/dsh/client
              contract:
                id: dsh-client-panel
                kind: module
                purpose: Регистрировать в правой панели веб-клиента dsh страницу ArchiView и
                  показывать её во вкладке, не дублируя интерфейс и операции
                  просмотра.
                responsibilities:
                  R1: Регистрировать тип вкладки в полосе extension с идентификатором пакета и
                    записью в справочнике панели.
                  R2: Регистрировать тело вкладки под тем же идентификатором в ключевом слоте
                    панели.
                  R3: Показывать страницу по адресу, который сообщает хост, передавать хосту
                    идентификатор чата вкладки и сохранять транспорт и разметку
                    страницы внутри iframe.
                  R4: Передавать явные поручения анализа и исправления замечания из панели в чат
                    вкладки по сообщению моста, не создавая ходов при обычной
                    навигации.
                boundaries:
                  B1: Вкладка не читает файлы проекта и не вызывает прикладной сервис напрямую.
                  B2: Интерфейс и транспорт операций принадлежат web; клиент не описывает операции
                    повторно.
                  B3: Адрес страницы задаёт хост через внедрение конфигурации; клиент не вычисляет
                    корень проекта и не задаёт маршрут собственной константой.
                    Без внедрения действует стандартный префикс, совпадающий с
                    настройкой хоста по умолчанию.
                invariants:
                  I1: Регистрации типа и тела живут ровно столько же, сколько плагин.
                  I2: Без маршрутов хоста вкладка показывает страницу хоста и не подменяет её
                    скрытым обходом или прямым чтением проекта.
                  I3: Идентификатор типа уникален в клиенте и не совпадает с kind встроенных
                    вкладок.
                  I4: Тело вкладки принимает сообщения только от собственного iframe с тем же
                    origin; отказ передачи виден панели, а не выдаётся за успех.
              document_state: documented
