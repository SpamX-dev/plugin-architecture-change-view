                // `/archiview/` не покрыл бы `/archiview/styles.css`.
                { kind: "prefix", path: prefix, handler },
              ];
            }
        - id: sha256:c3f7d2eaba1f3c86a0992f34ce003ad15936efb68e70cdaaf218f22d472a9bdd
          kind: file
          path: src/dsh/sessions.mjs
          start_line: 1
          end_line: 103
          text: >
            /**
             * Реестр прикладных сессий ArchiView для плагина dsh.
             *
             * Один процесс dsh обслуживает несколько чатов и проектов, а прикладной сервис
             * (`src/application/session.mjs`) рассчитан на один корень проекта. Реестр
             * сопоставляет корень и лениво созданную сессию и повторяет одну и ту же
             * сессию всем запросам этого корня: панель, инструменты модели и экспорт
             * анализа видят одно состояние сравнения.
             *
             * Ответственность модуля ограничена жизненным циклом: он не читает проект,
             * не кэширует документы и не решает, какой корень считать текущим.
             *
             * @module plugin-architecture-change-view/dsh/sessions
             */

            import { createArchiViewSession } from "../application/session.mjs";


            /**
             * Создаёт реестр сессий, разделённый по корню проекта.
             *
             * Инициализация сессии ленивая: первый запрос к корню создаёт её, остальные
             * ожидают то же обещание. Неудачная инициализация удаляется из реестра, чтобы
             * следующий запрос мог повторить попытку, а не унаследовать отклонённое
             * обещание навсегда.
             *
             * @param {object} [options] - параметры реестра.
             * @param {(options: { root: string, stateDirectory?: string }) => object | Promise<object>} [options.createSession]
             *   фабрика прикладной сессии; по умолчанию используется штатная.
             * @param {string} [options.stateDirectory] - явный каталог состояния вместо `.archiview`.
             * @returns {{
             *   get: (root: string) => Promise<object>,
             *   has: (root: string) => boolean,
             *   size: () => number,
             *   dispose: () => Promise<void>
             * }} реестр с ленивыми сессиями.
             */
            export function createSessionRegistry({ createSession =
            createArchiViewSession, stateDirectory } = {}) {
              /** @type {Map<string, Promise<object>>} */
              const entries = new Map();
              let closed = false;

              /**
               * Возвращает сессию корня, создавая её при первом обращении.
               *
               * @param {string} root - абсолютный корень проекта.
               * @returns {Promise<object>} прикладная сессия ArchiView.
               * @throws {Error} если реестр закрыт или корень не задан.
               */
              function get(root) {
                if (closed) throw new Error("Реестр сессий ArchiView закрыт");
                if (typeof root !== "string" || root.trim() === "") {
                  throw new Error("Не задан корень проекта ArchiView");
                }
                let entry = entries.get(root);
                if (entry === undefined) {
                  // Обещание нормализует и синхронный throw фабрики, и отказ асинхронной.
                  entry = Promise.resolve().then(() => createSession({ root, stateDirectory }));
                  entries.set(root, entry);
                  entry.catch(() => {
                    if (entries.get(root) === entry) entries.delete(root);
                  });
                }
                return entry;
              }

              /**
               * Проверяет, создавалась ли сессия корня.
               *
               * @param {string} root - абсолютный корень проекта.
               * @returns {boolean} признак существующей записи.
               */
              function has(root) {
                return entries.has(root);
              }

              /**
               * Возвращает число известных корней.
               *
               * @returns {number} размер реестра.
               */
              function size() {
                return entries.size;
              }

              /**
               * Закрывает реестр и дожидается уже начатых инициализаций.
               *
               * Новые запросы после закрытия отклоняются, уже выданные сессии остаются
               * рабочими до выгрузки процесса: прикладной сервис не держит сокетов и
               * фоновых задач, поэтому отдельного закрытия ему не требуется.
               *
               * @returns {Promise<void>} завершение после расчёта всех обещаний.
               */
              async function dispose() {
                closed = true;
                const pending = [...entries.values()];
                entries.clear();
                await Promise.allSettled(pending);
              }

              return { get, has, size, dispose };
            }
        - id: sha256:8fdd2ef55d2876a1bd4ffd19dc109e82a2c8d9e1301545654ee2fe789adf9804
          kind: file
          path: src/dsh/skill.mjs
          start_line: 1
          end_line: 61
          text: >
            /**
             * Публикация канонического скилла module-boundaries в реестре dsh.
             *
             * Скилл остаётся единственным файлом `skills/module-boundaries/SKILL.md`:
             * адаптер Codex экспортирует его как MCP-ресурс, а плагин dsh регистрирует тот
             * же текст как runtime-скилл через `ctx.skills.register`. Копий в
             * пользовательских каталогах не создаётся, поэтому правка файла меняет оба
             * хоста одновременно.
             *
             * Модуль зависит только от файловой системы и YAML: разбор frontmatter
             * повторяет правило MCP-сервера, но не требует SDK.
             *
             * @module plugin-architecture-change-view/dsh/skill
             */

            import { readFile } from "node:fs/promises";

            import { parse } from "yaml";

            import { packageUrl } from "../package-paths.mjs";


            /** Адрес файла скилла внутри пакета. */

            export const SKILL_PATH = new
            URL("skills/module-boundaries/SKILL.md", packageUrl);


            /**
             * Разбирает текст скилла с YAML-frontmatter.
             *
             * Обязательны `name` в kebab-case и непустое `description`: реестр dsh
             * отклоняет runtime-скилл без них. Тело возвращается без frontmatter, потому
             * что реестр вставляет его внутрь блока `<skill_instructions>`.
             *
             * @param {string} text - полный текст файла.
             * @returns {{ name: string, description: string, content: string }} разобранный скилл.
             * @throws {Error} если frontmatter отсутствует или не содержит обязательных полей.
             */
            export function parseSkillText(text) {
              const frontmatter = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/.exec(String(text ?? ""));
              if (!frontmatter) throw new Error("У скилла module-boundaries отсутствует frontmatter");
              const metadata = parse(frontmatter[1]);
              if (typeof metadata?.name !== "string" || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(metadata.name)) {
                throw new Error("У скилла module-boundaries некорректное имя");
              }
              if (typeof metadata.description !== "string" || metadata.description === "") {
                throw new Error("У скилла module-boundaries отсутствует описание");
              }
              return {
                name: metadata.name,
                description: metadata.description,
                content: text.slice(frontmatter[0].length).trimStart(),
              };
            }


            /**
             * Читает и разбирает встроенный скилл.
             *
             * @param {URL} [file] - адрес файла скилла; по умолчанию штатный в пакете.
             * @param {(file: URL, encoding: "utf8") => Promise<string>} [read] - чтение для тестов.
             * @returns {Promise<{ name: string, description: string, content: string }>} разобранный скилл.
             */
            export async function loadSkill(file = SKILL_PATH, read = readFile)
            {
              return parseSkillText(await read(file, "utf8"));
            }
        - id: sha256:adb6239bd5cd33175c3fddf1a22a87c4ed6b07be631eb066ddf6ffa04edccda1
          kind: file
          path: src/dsh/tools.mjs
          start_line: 1
          end_line: 125
          text: >
            /**
             * Модельные инструменты ArchiView для плагина dsh.
             *
             * Слой не зависит от cordis и SDK инструментов: он объявляет статические
             * описания (имя, описание, параметры) и чистые операции чтения контрактов.
             * Хост-половина (`host.mjs`) превращает описания в определения `defineTool`,
             * поэтому этот модуль можно проверять обычным `node --test`.
             *
             * Инструменты только читают: анализ и запись arch.yaml выполняет агент своими
             * файловыми средствами по каноническому скиллу module-boundaries.
             *
             * @module plugin-architecture-change-view/dsh/tools
             */

            import { moduleContext, moduleInventory, SOURCE_EXTENSIONS } from
            "../inventory.mjs";


            /** Описание параметра `projectRoot`, общего для обоих инструментов.
            */

            const PROJECT_ROOT_PARAMETER = {
              type: "string",
              description: "Абсолютный корень проекта текущего чата. Необязателен, если корень задан " +
                "конфигурацией плагина; каталог установки плагина проектом не считается.",
            };


            /**
             * Статические определения инструментов модели.
             *
             * Порядок фиксирован: он же порядок регистрации в реестре инструментов dsh.
             * Схемы не содержат `projectRoot` как обязательный параметр, потому что корень
             * может быть закреплён конфигурацией; проверка выполняется в операции.
             *
             * @constant {ReadonlyArray<{ name: string, description: string, parameters: object }>}
             */
            export const TOOL_DEFINITIONS = Object.freeze([
              Object.freeze({
                name: "archiview_inventory",
                description: "List every source directory and arch.yaml coverage, including " +
                  "missing/empty contracts, source-container directories and planned modules. " +
                  "Presence is not a semantic compliance verdict. Read skill://module-boundaries.",
                parameters: Object.freeze({ projectRoot: PROJECT_ROOT_PARAMETER }),
              }),
              Object.freeze({
                name: "archiview_context",
                description: "Read arch.yaml for a target directory and all ancestors, root first. " +
                  "Use before editing source code. Reports missing documents explicitly.",
                parameters: Object.freeze({
                  projectRoot: PROJECT_ROOT_PARAMETER,
                  directory: Object.freeze({
                    type: "string",
                    description: "Каталог относительно корня проекта; по умолчанию корень.",
                  }),
                }),
              }),
            ]);


            /**
             * Собирает набор расширений исходников из настроек плагина.
             *
             * Базовый набор приходит из инвентаризации; конфигурация только добавляет
             * расширения в формате `.ext`. Пустое или некорректное значение — ошибка
             * конфигурации, а не молчаливое игнорирование.
             *
             * @param {readonly string[]} [configured] - дополнительные расширения из конфигурации.
             * @returns {Set<string>} расширения с ведущей точкой в нижнем регистре.
             * @throws {Error} если значение не является расширением.
             */
            export function normalizeExtensions(configured = []) {
              const extensions = new Set(SOURCE_EXTENSIONS);
              for (const value of configured) {
                if (typeof value !== "string" || !/^\.[a-z0-9]+$/i.test(value)) {
                  throw new Error("Некорректное расширение исходников: " + String(value));
                }
                extensions.add(value.toLowerCase());
              }
              return extensions;
            }


            /**
             * Выбирает корень проекта для операции.
             *
             * Приоритет у явного аргумента вызова: агент может работать с проектом,
             * отличным от закреплённого. Корень из URL запроса никогда не принимается —
             * иначе маршрут панели читал бы произвольный каталог.
             *
             * @param {object} options - параметры выбора.
             * @param {unknown} options.projectRoot - значение аргумента инструмента.
             * @param {string} [options.fallback] - корень из конфигурации плагина.
             * @returns {string} абсолютный или относительный корень, переданный сервису.
             * @throws {Error} если корень не задан ни одним способом.
             */
            export function resolveRoot({ projectRoot, fallback }) {
              const value = typeof projectRoot === "string" && projectRoot.trim() !== ""
                ? projectRoot.trim()
                : fallback;
              if (typeof value !== "string" || value.trim() === "") {
                throw new Error("Передайте projectRoot или задайте root в конфигурации плагина ArchiView");
              }
              return value.trim();
            }


            /**
             * Читает инвентаризацию каталогов проекта.
             *
             * @param {object} options - параметры чтения.
             * @param {string} options.root - корень проекта.
             * @param {Set<string>} options.extensions - расширения исходников.
             * @param {number} options.maxFiles - предел обхода.
             * @returns {Promise<object>} результат `moduleInventory` без изменений формы.
             */
            export async function readInventory({ root, extensions, maxFiles })
            {
              return moduleInventory(root, { extensions, maxFiles });
            }


            /**
             * Читает контракт каталога и всех предков.
             *
             * @param {object} options - параметры чтения.
             * @param {string} options.root - корень проекта.
             * @param {string} [options.directory] - каталог относительно корня.
             * @returns {Promise<object>} результат `moduleContext` без изменений формы.
             */
            export async function readContext({ root, directory = "." }) {
              if (typeof directory !== "string") throw new Error("directory должен быть строкой");
              return moduleContext(root, directory);
            }
