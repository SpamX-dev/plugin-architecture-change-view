          kind: file
          path: src/dsh/sessions.ts
          start_line: 1
          end_line: 103
          text: >
            /**
             * Реестр прикладных сессий ArchiView для плагина dsh.
             *
             * Один процесс dsh обслуживает несколько чатов и проектов, а прикладной сервис
             * (`src/application/session.mjs`) рассчитан на один корень проекта. Реестр
             * сопоставляет корень и лениво созданную сессию и повторяет одну и ту же
             * сессию всем запросам этого корня: панель, инструменты модели и экспорт
             * анализа видят одно состояние сравнения.
             *
             * Ответственность модуля ограничена жизненным циклом: он не читает проект,
             * не кэширует документы и не решает, какой корень считать текущим.
             *
             * @module plugin-architecture-change-view/dsh/sessions
             */

            import { createArchiViewSession } from "../application/session.js";


            /**
             * Создаёт реестр сессий, разделённый по корню проекта.
             *
             * Инициализация сессии ленивая: первый запрос к корню создаёт её, остальные
             * ожидают то же обещание. Неудачная инициализация удаляется из реестра, чтобы
             * следующий запрос мог повторить попытку, а не унаследовать отклонённое
             * обещание навсегда.
             *
             * @param {object} [options] - параметры реестра.
             * @param {(options: { root: string, stateDirectory?: string }) => object | Promise<object>} [options.createSession]
             *   фабрика прикладной сессии; по умолчанию используется штатная.
             * @param {string} [options.stateDirectory] - явный каталог состояния вместо `.archiview`.
             * @returns {{
             *   get: (root: string) => Promise<object>,
             *   has: (root: string) => boolean,
             *   size: () => number,
             *   dispose: () => Promise<void>
             * }} реестр с ленивыми сессиями.
             */
            export function createSessionRegistry<T = Awaited<ReturnType<typeof
            createArchiViewSession>>>({ createSession = createArchiViewSession
            as (options: { root: string; stateDirectory?: string }) =>
            Promise<T>, stateDirectory }: { createSession?: (options: { root:
            string; stateDirectory?: string }) => T | Promise<T>;
            stateDirectory?: string } = {}) {
              /** @type {Map<string, Promise<object>>} */
              const entries = new Map<string, Promise<T>>();
              let closed = false;

              /**
               * Возвращает сессию корня, создавая её при первом обращении.
               *
               * @param {string} root - абсолютный корень проекта.
               * @returns {Promise<object>} прикладная сессия ArchiView.
               * @throws {Error} если реестр закрыт или корень не задан.
               */
              function get(root: string) {
                if (closed) throw new Error("Реестр сессий ArchiView закрыт");
                if (typeof root !== "string" || root.trim() === "") {
                  throw new Error("Не задан корень проекта ArchiView");
                }
                let entry = entries.get(root);
                if (entry === undefined) {
                  // Обещание нормализует и синхронный throw фабрики, и отказ асинхронной.
                  entry = Promise.resolve().then(() => createSession({ root, stateDirectory }));
                  entries.set(root, entry);
                  entry.catch(() => {
                    if (entries.get(root) === entry) entries.delete(root);
                  });
                }
                return entry;
              }

              /**
               * Проверяет, создавалась ли сессия корня.
               *
               * @param {string} root - абсолютный корень проекта.
               * @returns {boolean} признак существующей записи.
               */
              function has(root: string) {
                return entries.has(root);
              }

              /**
               * Возвращает число известных корней.
               *
               * @returns {number} размер реестра.
               */
              function size() {
                return entries.size;
              }

              /**
               * Закрывает реестр и дожидается уже начатых инициализаций.
               *
               * Новые запросы после закрытия отклоняются, уже выданные сессии остаются
               * рабочими до выгрузки процесса: прикладной сервис не держит сокетов и
               * фоновых задач, поэтому отдельного закрытия ему не требуется.
               *
               * @returns {Promise<void>} завершение после расчёта всех обещаний.
               */
              async function dispose() {
                closed = true;
                const pending = [...entries.values()];
                entries.clear();
                await Promise.allSettled(pending);
              }

              return { get, has, size, dispose };
            }
        - id: sha256:203894af297f158cbbdd36e02b2f7143f3256b729ed5316d3a53cf1aaa8c6a0b
          kind: file
          path: src/dsh/skill.ts
          start_line: 1
          end_line: 62
          text: >
            /**
             * Публикация канонического скилла module-boundaries в реестре dsh.
             *
             * Скилл остаётся единственным файлом `skills/module-boundaries/SKILL.md`:
             * адаптер Codex экспортирует его как MCP-ресурс, а плагин dsh регистрирует тот
             * же текст как runtime-скилл через `ctx.skills.register`. Копий в
             * пользовательских каталогах не создаётся, поэтому правка файла меняет оба
             * хоста одновременно.
             *
             * Модуль зависит только от файловой системы и YAML: разбор frontmatter
             * повторяет правило MCP-сервера, но не требует SDK.
             *
             * @module plugin-architecture-change-view/dsh/skill
             */

            import { readFile } from "node:fs/promises";

            import { parse } from "yaml";

            import { packageUrl } from "../package-paths.js";


            /** Адрес файла скилла внутри пакета. */

            export const SKILL_PATH = new
            URL("skills/module-boundaries/SKILL.md", packageUrl);


            /**
             * Разбирает текст скилла с YAML-frontmatter.
             *
             * Обязательны `name` в kebab-case и непустое `description`: реестр dsh
             * отклоняет runtime-скилл без них. Тело возвращается без frontmatter, потому
             * что реестр вставляет его внутрь блока `<skill_instructions>`.
             *
             * @param {string} text - полный текст файла.
             * @returns {{ name: string, description: string, content: string }} разобранный скилл.
             * @throws {Error} если frontmatter отсутствует или не содержит обязательных полей.
             */
            export function parseSkillText(text: string) {
              const frontmatter = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/.exec(String(text ?? ""));
              if (!frontmatter) throw new Error("У скилла module-boundaries отсутствует frontmatter");
              const value: unknown = parse(frontmatter[1]);
              const metadata = value && typeof value === "object" && !Array.isArray(value) ? value as Record<string, unknown> : {};
              if (typeof metadata?.name !== "string" || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(metadata.name)) {
                throw new Error("У скилла module-boundaries некорректное имя");
              }
              if (typeof metadata.description !== "string" || metadata.description === "") {
                throw new Error("У скилла module-boundaries отсутствует описание");
              }
              return {
                name: metadata.name,
                description: metadata.description,
                content: text.slice(frontmatter[0].length).trimStart(),
              };
            }


            /**
             * Читает и разбирает встроенный скилл.
             *
             * @param {URL} [file] - адрес файла скилла; по умолчанию штатный в пакете.
             * @param {(file: URL, encoding: "utf8") => Promise<string>} [read] - чтение для тестов.
             * @returns {Promise<{ name: string, description: string, content: string }>} разобранный скилл.
             */
            export async function loadSkill(file = SKILL_PATH, read: (file: URL,
            encoding: "utf8") => Promise<string> = readFile) {
              return parseSkillText(await read(file, "utf8"));
            }
