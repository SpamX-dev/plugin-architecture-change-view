            import { lstat, rename, rm, writeFile } from "node:fs/promises";

            import path from "node:path";

            import { isDeepStrictEqual } from "node:util";

            import { isMap, isScalar, parseDocument, type Pair, type YAMLMap }
            from "yaml";

            import { assertModuleDirectory, MAX_DOCUMENT_BYTES,
            MODULE_DIRECTORY, moduleDocumentPath, readContractStorageFile,
            readModuleTree } from "../analyse/project-sources/module-tree.js";

            import { contractDocument, currentContractYaml } from
            "../framework/contracts/document.js";

            import { clauseEntries, isPrototype, type ContractDocument, type
            Section, type StoredContract } from
            "../framework/contracts/types.js";

            import { assertStateLocation, STATE_DIRECTORY } from
