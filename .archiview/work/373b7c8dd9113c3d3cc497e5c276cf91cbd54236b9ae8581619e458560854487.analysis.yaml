            "../framework/snapshots/types.js";

            import { withFileLock } from "../storage/file-lock.js";

            import { nextClauseId, rememberClauseId } from "./clause-ids.js";

            import type { ClauseChange, DeletedClause } from "./api.js";

            import { ApplicationError } from "./errors.js";


            const stale = () => new ApplicationError("STALE_VIEW", "Контракт
            изменился. Откройте актуальную версию пункта.");

            const normalize = (text: string) => text.replace(/\r\n?/g, "\n");


            // Include the key and its separator so an empty flow map can become
            a block map.

            function sectionRange(doc: ReturnType<typeof parseDocument>,
            section: Section) {
              if (!isMap(doc.contents) || doc.contents.flow) return;
              const pair = doc.contents.items.find(item => isScalar(item.key) && item.key.value === section);
              if (pair && isScalar(pair.key) && pair.key.range && (isMap(pair.value) || isScalar(pair.value)) && pair.value.range)
                return { start: pair.key.range[0], end: pair.value.range[2] };
