                    if (!deleted || deleted.clause.undoToken !== change.undoToken || Object.hasOwn(clauseEntries(contract, section), clauseId)) throw stale();
                    result = exactUndo?.token === change.undoToken && exactUndo.after === source ? exactUndo.before :
