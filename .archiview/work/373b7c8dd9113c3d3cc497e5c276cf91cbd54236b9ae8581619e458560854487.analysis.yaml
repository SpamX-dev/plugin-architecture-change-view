            import type { SessionOperations } from "./api.js";

            import { ApplicationError } from "./errors.js";


            /** Independently supplied selectors must agree on which repository
            owns the operation. */

            export function repositoryArguments(selected: string | null, args:
            Record<string, unknown>) {
              if (selected === null) return args;
              if (args.repository !== undefined && args.repository !== selected)
                throw new ApplicationError("INVALID_ARGUMENT", "Не совпадают идентификаторы репозитория");
              return { ...args, repository: selected };
            }


            /** Decode URL scalars for both HTTP adapters. Invalid booleans are
            rejected by the operation. */

            export function comparisonQueryArguments(args: Record<string,
            unknown>) {
              return { ...args, historyLimit: args.historyLimit === undefined ? undefined : Number(args.historyLimit),
                watch: args.watch === "true" ? true : args.watch === "false" ? false : args.watch,
                published: args.published === "true" ? true : args.published === "false" ? false : args.published };
            }


            /** Decode external arguments once before invoking the
            transport-independent session. */

            export function callSessionOperation(session: SessionOperations,
            method: keyof SessionOperations, args: Record<string, unknown>,
