            type ClausePosition = NonNullable<ReturnType<typeof
            clausePosition>>;


            function insertRestoredClause(map: YAMLMap, position:
            ClausePosition, baselineOrder: string[]) {
              const indices = new Map(map.items.map((pair, index) => [pairKey(pair), index]));
