                (target.revision || entry.manifest.source_snapshot.digest === target.digest) ? 1 : 0;
              const ordered = [...entries].sort((a, b) => exact(b) - exact(a) || (b.registration_order ?? 0) - (a.registration_order ?? 0));
              for (const entry of ordered) {
