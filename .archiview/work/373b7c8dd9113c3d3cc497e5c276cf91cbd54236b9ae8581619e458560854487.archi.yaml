            import { contractDocument, currentContractYaml } from
            "../framework/contracts/document.js";

            import { clauseEntries, isPrototype, type ContractDocument, type
            Section, type StoredContract } from
            "../framework/contracts/types.js";

            import { assertStateLocation, STATE_DIRECTORY } from
            "../storage/paths.js";

            import { repositoryDirectoryOwnership } from
            "../analyse/project/workspace.js";

            import type { SnapshotModule } from
            "../framework/snapshots/types.js";

            import { withFileLock } from "../storage/file-lock.js";

            import { nextClauseId, rememberClauseId } from "./clause-ids.js";

            import type { ClauseChange, DeletedClause } from "./api.js";

            import { ApplicationError } from "./errors.js";


            const stale = () => new ApplicationError("STALE_VIEW", "Контракт
            изменился. Откройте актуальную версию пункта.");

            const normalize = (text: string) => text.replace(/\r\n?/g, "\n");


            // Include the key and its separator so an empty flow map can become
            a block map.

            function sectionRange(doc: ReturnType<typeof parseDocument>,
            section: Section) {
              if (!isMap(doc.contents) || doc.contents.flow) return;
              const pair = doc.contents.items.find(item => isScalar(item.key) && item.key.value === section);
              if (pair && isScalar(pair.key) && pair.key.range && (isMap(pair.value) || isScalar(pair.value)) && pair.value.range)
                return { start: pair.key.range[0], end: pair.value.range[2] };
            }


            type ClauseWrite = { section: Section; clauseId: string } & ({
            action: "add" | "edit"; text: string } | { action: "delete" });

            const pairKey = (pair?: Pair) => isScalar(pair?.key) ?
            pair.key.value : undefined;


            /** Keep the deleted YAML entry, including its comments and place
            among surviving neighbours. */

            function clausePosition(source: string, section: Section, clauseId:
            string) {
              const map = parseDocument(source, { intAsBigInt: true }).get(section, true);
              if (!isMap(map)) return;
              const index = map.items.findIndex(pair => pairKey(pair) === clauseId);
              if (index >= 0) return { pair: map.items[index], index, next: pairKey(map.items[index + 1]), previous: pairKey(map.items[index - 1]) };
