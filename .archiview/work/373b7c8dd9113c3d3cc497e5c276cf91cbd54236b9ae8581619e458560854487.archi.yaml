                  if ((target !== undefined && typeof target !== "string") ||
                      (baseline !== undefined && typeof baseline !== "string") ||
                      (historyLimit !== undefined && (typeof historyLimit !== "number" || !Number.isSafeInteger(historyLimit) || historyLimit < 1)) ||
