            import { open } from "node:fs/promises";

            import path from "node:path";

            import { structuredPatch } from "diff";

            import { regularProjectFile } from
            "../analyse/project-sources/source-files.js";

            import { isProjectMetadataPath } from
            "../framework/project/paths.js";

            import { repositoryDirectoryOwnership } from
