          text: >
            /** Serializable operations exposed by a project session to all
            panel transports. */

            import type { AggregateAssessment, DependencySelector,
            ReviewFreshness, TreeReviewStatus } from
            "../framework/static-report/types.js";

            import type { AnalysisStatus, PreparedAnalysis } from
            "./analysis-record.js";

            export type { AnalysisStatus, PreparedAnalysis } from
            "./analysis-record.js";

            import type { ClauseInput, ReviewReport, Side } from
            "../framework/ai-report/types.js";

            import type { Comparison, ComparisonModule, Fact, Snapshot } from
            "../framework/snapshots/types.js";

            import type { compareContracts, RoleChange } from
            "../analyse/git-changes/contract-diff.js";

            import type { StructuredPatchHunk } from "diff";

            import type { Section } from "../framework/contracts/types.js";

            import type { ModuleRelations } from
            "../framework/module-relations/types.js";


            export interface RepositoryArgs { repository?: string }

            export type ComparisonArgs = RepositoryArgs & { target?: string;
            baseline?: string; historyLimit?: number; published?: boolean;
            watch?: boolean };

            export type ModuleArgs = RepositoryArgs & { view: string; path:
            string; analysis?: boolean };

            export type ClauseChange = { action: "add"; section:
            Exclude<Section, "purpose">; clauseId?: string; text: string }
              | ({ section: Section; clauseId: string } & (
                | { action: "edit"; text: string }
                | { action: "delete" }
                | { action: "revert" }
                | { action: "restore"; undoToken: string }
              ));
            export interface DeletedClause { section: Section; clauseId: string;
            undoToken: string; text: string }

            export type ChangeClauseArgs = ModuleArgs & ClauseChange;

            export type PrototypeChange = RepositoryArgs & { view: string; path:
            string } & (
              | { action: "create"; moduleId: string; title: string; purpose: string }
              | { action: "edit"; text: string }
              | { action: "delete" }
            );

            export type FileDiffArgs = RepositoryArgs & { view: string; path:
            string; file: string };

            export interface FileDiff { hunks: StructuredPatchHunk[]; message?:
            string; unchangedText?: string }

            export type SnapshotArgs = RepositoryArgs & { view: string; label?:
            string };


            export type TimelineEntry = Pick<Snapshot, "id" | "kind" | "label" |
            "revision" | "isHead" | "subject" | "baseRevision">
              & { capturedAt?: string };
            export interface ModuleReviewState {
              review?: {
                id: string;
                stale: boolean;
                assessment: ReviewReport["assessment"];
                findings: number;
                activeFindings: number;
                createdAt: string;
              } | null;
              structure?: {
                automatic: boolean;
                complete: boolean;
                checkHash: string | null;
                diagnostics: string[];
              };
              reviewStatus?: TreeReviewStatus | null;
            }


            export type ModuleSummary = Omit<ComparisonModule, "before" |
            "after" | "files"> & ModuleReviewState & { roles?: RoleChange[];
            prototypeModule?: boolean };

            export interface ComparisonView extends Pick<Comparison,
            "schema_version" | "id" | "root" | "complete" | "diagnostics" |
            "counts" | "before" | "after"> {
              /** Served from the last complete publication, before checking the working tree. */
              published?: true;
              separateAnalysis?: true;
              watchCursor?: string;
              watchError?: string;
              workspace?: { root: string; repositories: string[]; repository: string };
              reviewDiagnostics: string[];
              modules: ModuleSummary[];
              timeline: TimelineEntry[];
              target: TimelineEntry;
              baselines: TimelineEntry[];
              historyHasMore: boolean;
            }


            export interface ModuleReview {
              report: ReviewReport;
              stale: boolean;
              reviewFile: string;
              freshness: ReviewFreshness;
              dependencies: {
                selector: DependencySelector;
                available: boolean;
                contractOnly: boolean;
                providerStatus: AggregateAssessment | null;
              }[];
              facts: Record<Side, Fact[]>;
              contracts: Record<Side, ClauseInput[]>;
              /** Saved clauses referenced by findings, kept separate from the manifest checklist. */
              referencedContracts?: Record<Side, ClauseInput[]>;
            }

            export interface DocumentDiffLine {
              kind: "added" | "removed" | "same";
              beforeLine: number | null;
              afterLine: number | null;
              text: string;
            }

