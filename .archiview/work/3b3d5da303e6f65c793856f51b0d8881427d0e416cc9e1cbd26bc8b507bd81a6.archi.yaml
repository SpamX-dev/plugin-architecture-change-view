    contract:
      schema_version: 1
      id: dsh-client-panel
      title: Вкладка ArchiView в веб-клиенте dsh
      kind: module
      extensions:
        archiview.roles:
          - host-adapter
      purpose: Регистрировать в правой панели веб-клиента dsh страницу ArchiView и
        показывать её во вкладке, не дублируя интерфейс и операции просмотра.
      responsibilities:
        R1: Регистрировать тип вкладки в полосе extension с идентификатором пакета и
          записью в справочнике панели.
        R2: Регистрировать тело вкладки под тем же идентификатором в ключевом слоте
          панели.
        R3: Показывать страницу по адресу, который сообщает хост, передавать хосту
          идентификатор чата вкладки и сохранять транспорт и разметку страницы
          внутри iframe.
        R4: Передавать явные поручения анализа и исправления замечания из панели в чат
          вкладки по сообщению моста, не создавая ходов при обычной навигации.
      boundaries:
        B1: Вкладка не читает файлы проекта и не вызывает прикладной сервис напрямую.
        B2: Интерфейс и транспорт операций принадлежат web; клиент не описывает операции
          повторно.
        B3: Адрес страницы задаёт хост через внедрение конфигурации; клиент не вычисляет
          корень проекта и не задаёт маршрут собственной константой. Без
          внедрения действует стандартный префикс, совпадающий с настройкой
          хоста по умолчанию.
      invariants:
        I1: Регистрации типа и тела живут ровно столько же, сколько плагин.
        I2: Без маршрутов хоста вкладка показывает страницу хоста и не подменяет её
          скрытым обходом или прямым чтением проекта.
        I3: Идентификатор типа уникален в клиенте и не совпадает с kind встроенных
          вкладок.
        I4: Тело вкладки принимает сообщения только от собственного iframe с тем же
          origin; отказ передачи виден панели, а не выдаётся за успех.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным
          адаптерам. Извлечение символов, разрешение зависимостей и индексация
          AST принадлежат ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено выбранным корнем проекта. Вкладка чата получает этот
          корень от хоста; явно настроенный для модельных инструментов корень
          ограничивает их чтение.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-change-view
        section: invariants
        id: I5
        text: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются
          строгим TypeScript перед сборкой; классы сохраняют единственную
          ответственность внутри границ своих модулей.
      - module_id: architecture-core
        section: boundaries
        id: B1
        text: Прикладные операции находятся в application; HTTP и CLI в archiview
          являются адаптерами, отображение принадлежит web.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: Семантический вывод ответственности выполняет агент или внешний
          анализатор. Наличие контракта не доказывает его выполнения.
      - module_id: architecture-core
        section: boundaries
        id: B3
        text: Адаптер Codex находится в codex; вызывает прикладной сервис через скрытые
          от модели инструменты UI без HTTP-сервера.
      - module_id: architecture-core
        section: boundaries
        id: B4
        text: Адаптер dsh находится в dsh; регистрирует инструменты, маршруты панели и
          скилл хоста, получая прикладные операции из application.
      - module_id: architecture-core
        section: invariants
        id: I1
        text: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости,
          сборка и папки .archiview не расширяют анализ. Запись данных
          допускается в .archiview корня проекта либо явно выбранном внешнем
          хранилище; ссылки не меняют эту область.
      - module_id: architecture-core
        section: invariants
        id: I2
        text: Неполнота обхода и доказательств сообщается явно.
      - module_id: architecture-core
        section: invariants
        id: I3
        text: Снимки и отчёты не заменяют arch.yaml и не согласуют новую
          ответственность.
      - module_id: architecture-core
        section: invariants
        id: I4
        text: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых
          файлах.
      - module_id: architecture-core
        section: invariants
        id: I5
        text: Структурное различие контрактов не создаёт замечание; оценка нарушения
          требует отдельного анализа.
      - module_id: dsh-adapter
        section: boundaries
        id: B1
        text: Прикладные операции принадлежат application; адаптер не дублирует
          сравнение, снимки, проверки и анализ.
      - module_id: dsh-adapter
        section: boundaries
        id: B2
        text: Отображение модулей принадлежит web, а браузерная регистрация вкладки —
          client.
      - module_id: dsh-adapter
        section: boundaries
        id: B3
        text: MCP-сервер и панель Codex принадлежат codex; этот модуль их не импортирует
          и не заменяет.
      - module_id: dsh-adapter
        section: boundaries
        id: B4
        text: Генерация проекта, Git-история и хранилище отчётов остаются в существующих
          модулях ядра; адаптер только передаёт им корень и аргументы запроса.
      - module_id: dsh-adapter
        section: invariants
        id: I1
        text: Маршрут панели не запускает модель и не возвращает данные просмотра в
          контекст агента.
      - module_id: dsh-adapter
        section: invariants
        id: I2
        text: До проверки политики соединения запрос не читает проект и не создаёт
          сессию.
      - module_id: dsh-adapter
        section: invariants
        id: I3
        text: Корень вкладки задаётся рабочим каталогом из заголовка чата, прочитанного
          хостом. Для прямого просмотра действует настроенный корень или рабочий
          каталог процесса. URL может выбирать чат по идентификатору, но не
          задаёт путь проекта. Настроенный корень ограничивает чтение модельных
          инструментов.
      - module_id: dsh-adapter
        section: invariants
        id: I4
        text: Публикация скилла не создаёт второго источника текста — используется файл
          пакета.
      - module_id: dsh-adapter
        section: invariants
        id: I5
        text: Необязательные сервисы хоста (скиллы, хранилище и контроллер сессий)
          читаются только при наличии и не блокируют активацию плагина.
