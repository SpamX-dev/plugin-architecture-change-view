      - index: 43
        fact:
          id: sha256:c2ed6e18775e7b7bafcda31ff49086b37e93baee02211c05dc26f64c4f0df961
          kind: file
          path: src/dsh/client/body.mjs
          start_line: 1
          end_line: 109
          text: >
            /**
             * Тело вкладки ArchiView в правой панели dsh.
             *
             * Показывает страницу, которую отдают маршруты плагина (`src/dsh/routes.mjs`),
             * в обычном iframe. Такой способ не требует переписывать интерфейс: страница
             * остаётся тем же `web/archiview`, что и в браузере, и получает базу API из
             * метатега, который вставляет маршрут.
             *
             * Адрес страницы не хранится здесь константой: префикс маршрутов сообщает хост
             * через внедрение в документ (см. `panel-contract.mjs`), поэтому настройка
             * `config.prefix` меняет и адрес iframe. Без внедрения действует стандартный
             * префикс — вкладка остаётся рабочей, а не падает.
             *
             * Через тот же iframe идёт и явное поручение анализа: страница присылает
             * `archiview:send`, тело передаёт текст в чат вкладки и отвечает `archiview:sent`
             * либо `archiview:send-failed`. Других сообщений мост не принимает, поэтому
             * навигация панели не может создать ход модели.
             *
             * @module plugin-architecture-change-view/dsh/client/body
             */

            import { createElement, useEffect, useRef } from "react";

            import { panelPageUrl, resolveClientPrefix } from
            "../panel-contract.mjs";


            /** Приветствие страницы: сообщает, что родитель — хост ArchiView.
            */

            const HELLO = "archiview:hello";

            /** Ответ хоста: какие возможности доступны странице. */

            const HOST = "archiview:host";

            /** Поручение анализа из страницы в чат. */

            const SEND = "archiview:send";

            /** Подтверждение принятия поручения хостом. */

            const SENT = "archiview:sent";

            /** Отказ или ошибка передачи. */

            const FAILED = "archiview:send-failed";


            /**
             * Тело вкладки: страница панели во всю площадь вкладки.
             *
             * `sessionId` — стандартное свойство сессионного слота: хост по нему разрешает
             * рабочий каталог проекта, поэтому панель показывает проект именно этого чата.
             * `sendPrompt` передаёт поручение в этот же чат; без него мост остаётся
             * доступным только для просмотра.
             *
             * @param {object} [props] - свойства, переданные слотом.
             * @param {string} [props.sessionId] - идентификатор чата вкладки.
             * @param {(sessionId: string, text: string) => Promise<void>} [props.sendPrompt]
             *   отправка поручения в чат.
             * @returns {import("react").ReactElement} iframe со страницей ArchiView.
             */
            export function PanelBody({ sessionId, sendPrompt } = {}) {
              const frameRef = useRef(null);

              useEffect(() => {
                const frame = frameRef.current;
                if (frame === null) return undefined;
                const origin = window.location.origin;
                const windowOf = () => frame.contentWindow;
                const post = (message) => {
                  const target = windowOf();
                  if (target !== null) target.postMessage(message, origin);
                };
                const canSend = () => typeof sendPrompt === "function" && typeof sessionId === "string" && sessionId !== "";
                const hostMessage = () => ({ type: HOST, protocol: 1, capabilities: { send: canSend() } });

                /** Отвечает на приветствие и выполняет ровно одно поручение анализа. */
                const onMessage = async (event) => {
                  if (event.source !== windowOf()) return;
                  if (event.origin !== origin) return;
                  const data = event.data;
                  if (data === null || typeof data !== "object") return;
                  if (data.type === HELLO) {
                    post(hostMessage());
                    return;
                  }
                  if (data.type !== SEND || typeof data.id !== "string") return;
                  try {
                    if (!canSend()) throw new Error("Хост не умеет передавать поручения");
                    await sendPrompt(sessionId, data.prompt);
                    post({ type: SENT, id: data.id });
                  } catch (error) {
                    post({ type: FAILED, id: data.id, error: error?.message ?? "Не удалось передать поручение" });
                  }
                };

                window.addEventListener("message", onMessage);
                return () => window.removeEventListener("message", onMessage);
              }, [sendPrompt, sessionId]);

              // Страница могла отправить приветствие до подписки: объявляем хост после
              // загрузки iframe. Повторный ответ безвреден — страница принимает первый.
              const announce = () => {
                const target = frameRef.current?.contentWindow;
                if (target === null || target === undefined) return;
                target.postMessage({
                  type: HOST,
                  protocol: 1,
                  capabilities: { send: typeof sendPrompt === "function" && typeof sessionId === "string" && sessionId !== "" },
                }, window.location.origin);
              };

              return createElement("iframe", {
                ref: frameRef,
                src: panelPageUrl(resolveClientPrefix(), sessionId),
                title: "ArchiView",
                onLoad: announce,
                style: { display: "block", width: "100%", height: "100%", border: "0" },
              });
            }
      - index: 44
        fact:
          id: sha256:f268ec5a4a06abb7cc81e618b9c8c82f4e57f43e766f48ca9a0d3a3a15ff696e
          kind: file
          path: src/dsh/client/index.mjs
          start_line: 1
          end_line: 65
          text: >
            /**
             * Браузерная половина плагина ArchiView для dsh.
             *
             * Модуль регистрирует в правой панели тип вкладки ArchiView и её тело. Тип
             * объявлен в band `extension` — это штатная полоса для типов из другого
             * пакета: она выше встроенных и позволяет открывать страницу плагина, не
             * занимая чужой `kind`.
             *
             * Клиентская половина ничего не читает из проекта и не вызывает прикладной
             * сервис: страницу отдаёт маршрут хоста, а тело вкладки только показывает её в
             * iframe. Поэтому здесь нет ни сетевого клиента, ни операций просмотра.
             *
             * @module plugin-architecture-change-view/dsh/client
             */

            import { createElement } from "react";

            import { PanelBody } from "./body.mjs";

            import { createPromptSender } from "./prompt.mjs";


            /**
             * Сервисы клиента, без которых регистрация невозможна: слоты правой панели и
             * реестр типов вкладок.
             */
            export const inject = ["slots", "sidebarRightTabs"];


            /** Идентификатор реализации типа вкладки; он же ключ тела в слоте.
            */

            export const TAB_ID = "plugin-architecture-change-view/archiview";


            /** Дискриминатор типа вкладки, которым открывается страница. */

            export const TAB_KIND = "archiview";


            /**
             * Регистрирует вкладку ArchiView в клиенте dsh.
             *
             * Обе регистрации обёрнуты в `ctx.effect`, поэтому живут ровно столько же,
             * сколько плагин: выгрузка снимает и тип, и тело.
             *
             * @param {import("@deepseek-ai/cordis").Context} ctx - контекст клиента.
             * @returns {void}
             */
            export function apply(ctx) {
              // Отправитель замыкается на контекст плагина: тело вкладки получает только
              // функцию, поэтому не ищет сервисы само и не знает их имён.
              const sendPrompt = createPromptSender(ctx);
              const Body = (props) => createElement(PanelBody, { ...props, sendPrompt });

              ctx.effect(() => ctx.sidebarRightTabs.register({
                id: TAB_ID,
                kind: TAB_KIND,
                priority: "extension",
                title: () => "ArchiView",
                guide: [{
                  id: TAB_ID + "/guide",
                  order: 40,
                  title: () => "ArchiView",
                  description: () => "Архитектура проекта и контракты модулей",
                }],
              }), "ui-archiview: тип вкладки");

              ctx.effect(() => ctx.slots.inject("sidebar.right.pane.tab", () => ctx.slots.register({
                name: "sidebar.right.pane.tab",
                key: TAB_ID,
              }, Body)), "ui-archiview: тело вкладки");
            }
      - index: 45
        fact:
          id: sha256:fed6b51ae0edd843d25d6df705bbab975d57e880c83880eba2e111a524ff4b4a
          kind: file
          path: src/dsh/client/prompt.mjs
          start_line: 1
          end_line: 55
          text: >
            /**
             * Передача поручения анализа в чат dsh.
             *
             * Панель не может звать инструменты модели напрямую: она работает в iframe и
             * общается с хостом только явными сообщениями. Хост-половина плагина такой
             * запрос не принимает — поручение отправляет браузерная половина в тот чат,
             * которому принадлежит вкладка, через клиентский сервис сессий.
             *
             * Модуль держит одну операцию: взять сессию на время отправки, передать текст
             * в очередь хода и отпустить ссылку. Навигация панели сюда не попадает, поэтому
             * просмотр по-прежнему не создаёт сообщений модели.
             *
             * @module plugin-architecture-change-view/dsh/client/prompt
             */

            /**
             * Создаёт отправителя поручений для одного экземпляра плагина.
             *
             * @param {import("@deepseek-ai/cordis").Context} ctx - контекст клиента dsh.
             * @returns {(sessionId: string, text: string) => Promise<void>} отправка поручения в чат.
             */
            export function createPromptSender(ctx) {
              /**
               * Отправляет текст в очередь хода указанного чата.
               *
               * @param {string} sessionId - идентификатор чата вкладки.
               * @param {string} text - подготовленное панелью поручение.
               * @returns {Promise<void>} завершение после принятия хостом.
               * @throws {Error} если чат неизвестен, поручение пустое или хост его отклонил.
               */
              return async function sendPrompt(sessionId, text) {
                if (typeof sessionId !== "string" || sessionId === "") {
                  throw new Error("Чат вкладки неизвестен");
                }
                if (typeof text !== "string" || text.trim() === "") {
                  throw new Error("Пустое поручение анализа");
                }
                const sessions = ctx.get("sessions");
                if (sessions === undefined) throw new Error("Клиентские сессии dsh недоступны");

                // Ссылка держит поколение сессии на время отправки и освобождается в любом
                // исходе: удерживать её после ответа хоста нечего.
                const reference = sessions.retain(sessionId, { source: "archiview" });
                try {
                  const binding = await reference.ready;
                  const result = await binding.session.prompt([{ type: "text", text }], "queue");
                  if (result?.ok !== true) {
                    throw new Error(result?.error?.message ?? "Хост отклонил поручение");
                  }
                } finally {
                  reference.release();
                }
              };
            }
