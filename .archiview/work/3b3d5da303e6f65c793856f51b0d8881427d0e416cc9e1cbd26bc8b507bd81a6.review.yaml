          summary: Изменение относительно HEAD сужает общий валидатор префикса до
            локального пути и устраняет прежнее нарушение R3; новых нарушений не
            обнаружено. Остальные пункты проверены по сохранённым файлам обеих
            сторон, без живого хоста.
