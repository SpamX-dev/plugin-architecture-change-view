          contract:
            id: dsh-client-panel
            kind: module
            purpose: Регистрировать в правой панели веб-клиента dsh страницу ArchiView и
              показывать её во вкладке, не дублируя интерфейс и операции
              просмотра.
            responsibilities:
              R1: Регистрировать тип вкладки в полосе extension с идентификатором пакета и
                записью в справочнике панели.
              R2: Регистрировать тело вкладки под тем же идентификатором в ключевом слоте
                панели.
              R3: Показывать страницу, обслуженную маршрутами хоста, сохраняя её транспорт и
                разметку внутри iframe.
            boundaries:
              B1: Вкладка не читает файлы проекта и не вызывает прикладной сервис напрямую.
              B2: Интерфейс и транспорт операций принадлежат web; клиент не описывает операции
                повторно.
              B3: Адрес страницы и её префикс задаёт хост; клиент не вычисляет корень проекта.
            invariants:
              I1: Регистрации типа и тела живут ровно столько же, сколько плагин.
              I2: Без маршрутов хоста вкладка показывает страницу хоста и не подменяет её
                скрытым обходом или прямым чтением проекта.
              I3: Идентификатор типа уникален в клиенте и не совпадает с kind встроенных
                вкладок.
          children: []
        complete: true
        dependencies:
          - selector:
              kind: file
              path: src/dsh/host.mjs
            available: true
            digest: sha256:7cbd53212cd4899197d8a5abc4ba0f0b46877e9771277b9b0a34b1d5a6d8ba40
            content: >
              /**
               * Cordis-плагин ArchiView для DeepSeek Harness.
               *
               * Плагин собирает из существующих домены проекта две половины:
               *
               * 1. инструменты модели (`archiview_inventory`, `archiview_context`) — чтение
               *    контрактов через `src/inventory.mjs`;
               * 2. маршруты панели под префиксом `/archiview` — тот же прикладной сервис
               *    `src/application`, что используют standalone-адаптер и панель Codex;
               * 3. публикацию скилла module-boundaries в реестре dsh.
               *
               * Плагин не содержит прикладной логики и не запускает модель: просмотр только
               * читает проект, а анализ выполняет агент хоста по явному поручению. Корень
               * проекта берётся из конфигурации (или рабочего каталога процесса) и никогда
               * из URL запроса.
               *
               * @module plugin-architecture-change-view/dsh/host
               */

              import path from "node:path";

              import z from "@deepseek-ai/schemastery";

              import { defineTool } from "@deepseek-ai/dsh-tools";

              import { createRouteTable, DEFAULT_PREFIX, normalizePrefix } from
              "./routes.mjs";

              import { createSessionRegistry } from "./sessions.mjs";

              import { loadSkill } from "./skill.mjs";

              import {
                normalizeExtensions,
                readContext,
                readInventory,
                resolveRoot,
                TOOL_DEFINITIONS,
              } from "./tools.mjs";


              /** Имя Cordis-плагина для диагностики загрузчика. */

              export const name = "archiview";


              /**
               * Сервисы, без которых плагин не активируется.
               *
               * `connection` обязателен: маршруты панели отдают проект только после его
               * проверки политики соединения. Реестр скиллов подключается необязательно —
               * без него инструменты и панель продолжают работать.
               */
              export const inject = ["tools", "webServer", "connection"];


              /** Схема конфигурации плагина; значения по умолчанию рассчитаны
              на локальный проект. */

              export const Config = z.object({
                root: z.string().default(""),
                stateDirectory: z.string().default(""),
                prefix: z.string().default(DEFAULT_PREFIX),
                maxFiles: z.number().default(50_000),
                extensions: z.array(z.string()).default([]),
                panel: z.boolean().default(true),
                tools: z.boolean().default(true),
                skill: z.boolean().default(true),
              });


              /**
               * Применяет плагин к контексту dsh.
               *
               * Регистрации живут ровно столько же, сколько плагин: маршруты и скилл
               * снимаются возвращёнными disposer'ами, а реестр сессий закрывается эффектом.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @param {object} config - нормализованная конфигурация схемы.
               * @returns {void}
               */
              export function apply(ctx, config) {
                const prefix = normalizePrefix(config.prefix);
                const extensions = normalizeExtensions(config.extensions);
                const root = config.root === "" ? "" : path.resolve(config.root);
                const sessions = createSessionRegistry({
                  stateDirectory: config.stateDirectory === "" ? undefined : config.stateDirectory,
                });

                ctx.effect(() => () => {
                  void sessions.dispose();
                }, "archiview: сессии");

                if (config.tools) registerTools(ctx, { extensions, maxFiles: config.maxFiles, fallbackRoot: root });
                if (config.skill) registerSkill(ctx);
                if (config.panel) registerRoutes(ctx, { prefix, sessions, fallbackRoot: root });
              }


              /**
               * Регистрирует инструменты модели.
               *
               * Схема вывода — произвольный JSON: результат инвентаризации и контекста
               * остаётся структурированным, а не превращается в строку до валидации.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @param {object} options - параметры регистрации.
               * @param {Set<string>} options.extensions - расширения исходников.
               * @param {number} options.maxFiles - предел обхода.
               * @param {string} options.fallbackRoot - корень из конфигурации.
               * @returns {void}
               */
              function registerTools(ctx, { extensions, maxFiles, fallbackRoot
              }) {
                for (const definition of TOOL_DEFINITIONS) {
                  ctx.tools.register(defineTool({
                    name: definition.name,
                    description: definition.description,
                    parameters: definition.parameters,
                    output: {
                      schema: { type: "json" },
                      render: (_args, value) => [{ type: "text", text: JSON.stringify(value) }],
                    },
                    async execute(args) {
                      const projectRoot = resolveRoot({ projectRoot: args.projectRoot, fallback: fallbackRoot });
                      const value = definition.name === "archiview_inventory"
                        ? await readInventory({ root: projectRoot, extensions, maxFiles })
                        : await readContext({ root: projectRoot, directory: args.directory });
                      return value;
                    },
                  }));
                }
              }


              /**
               * Публикует встроенный скилл в реестре dsh, если он есть в композиции.
               *
               * Регистрация асинхронная: файл читается с диска после активации плагина, а
               * ошибка чтения не отменяет инструменты и панель.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @returns {void}
               */
              function registerSkill(ctx) {
                if (ctx.skills === undefined) {
                  ctx.logger?.warn?.("ArchiView: реестр скиллов dsh недоступен, module-boundaries не опубликован");
                  return;
                }
                let dispose;
                let disposed = false;
                loadSkill().then((skill) => {
                  if (!disposed) dispose = ctx.skills.register(skill);
                }, (error) => {
                  ctx.logger?.warn?.("ArchiView: скилл не зарегистрирован: " + error.message);
                });
                ctx.effect(() => () => {
                  disposed = true;
                  dispose?.();
                }, "archiview: скилл");
              }


              /**
               * Регистрирует маршруты панели в веб-сервере хоста.
               *
               * Корень проекта закреплён конфигурацией: привязка к рабочему каталогу
               * вызывающего чата — следующий шаг интеграции, поэтому `getSession` намеренно
               * не читает ни URL, ни заголовки запроса.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @param {object} options - параметры регистрации.
               * @param {string} options.prefix - префикс маршрутов.
               * @param {ReturnType<createSessionRegistry>} options.sessions - реестр сессий.
               * @param {string} options.fallbackRoot - корень из конфигурации.
               * @returns {void}
               */
              function registerRoutes(ctx, { prefix, sessions, fallbackRoot }) {
                const projectRoot = fallbackRoot === "" ? process.cwd() : fallbackRoot;
                const getSession = () => sessions.get(projectRoot);
                const guard = (request, response) => {
                  const rejection = ctx.connection.requestRejection(request);
                  if (rejection === undefined) return false;
                  response.statusCode = rejection;
                  response.end();
                  return true;
                };
                for (const route of createRouteTable({ prefix, guard, getSession })) {
                  ctx.effect(() => ctx.webServer.register(route), "archiview: маршрут " + route.path);
                }
              }
          - selector:
              kind: file
              path: src/dsh/routes.mjs
            available: true
            digest: sha256:c6577cbedff6f04f74145faae21cca2797c8c73286fdabd5b68e07e127814ebe
            content: >
              /**
               * HTTP-маршруты панели ArchiView для веб-сервера dsh.
               *
               * Модуль знает только про node:http-запросы и прикладной сервис: он отдаёт
               * статический интерфейс из `web/archiview`, переписывает в нём адреса под
               * префикс плагина и выполняет те же операции просмотра, что standalone-адаптер
               * `src/archiview/http.mjs`. Сервер не поднимается: маршруты регистрируются в
               * `ctx.webServer` хоста.
               *
               * Политика соединения приходит снаружи как `guard`: маршрут не читает проект
               * до того, как хост подтвердит допустимость запроса. Корень проекта также не
               * берётся из URL — его определяет `getSession`.
               *
               * @module plugin-architecture-change-view/dsh/routes
               */

              import { readFile } from "node:fs/promises";

              import { applicationError, ApplicationError } from
              "../application/errors.mjs";

              import { packageUrl } from "../package-paths.mjs";


              /** Префикс маршрутов по умолчанию. */

              export const DEFAULT_PREFIX = "/archiview";


              /** Предел тела JSON-запроса: операции панели передают только
              идентификаторы и пути. */

              const MAX_BODY_BYTES = 4096;


              /** Прикладной код ошибки в HTTP-статус; незнакомый код считается
              внутренним. */

              const ERROR_STATUS = {
                INVALID_ARGUMENT: 400,
                NOT_FOUND: 404,
                STALE_VIEW: 409,
                REQUEST_TOO_LARGE: 413,
                INCOMPLETE_VIEW: 422,
              };


              /**
               * Статические ресурсы панели: имя под префиксом, файл пакета и тип содержимого.
               *
               * Список повторяет standalone-адаптер. `mcp-app-sdk.mjs` здесь отсутствует
               * намеренно: в dsh панель открывается обычным iframe, а не MCP Apps, и
               * динамический импорт SDK внутри `panel-bridge.mjs` корректно завершается
               * откатом на пустой мост.
               *
               * @constant {ReadonlyMap<string, { file: string, type: string }>}
               */
              export const PANEL_ASSETS = new Map([
                ["", { file: "web/archiview/index.html", type: "text/html; charset=utf-8" }],
                ["index.html", { file: "web/archiview/index.html", type: "text/html; charset=utf-8" }],
                ["app.mjs", { file: "web/archiview/app.mjs", type: "text/javascript; charset=utf-8" }],
                ["client.mjs", { file: "web/archiview/client.mjs", type: "text/javascript; charset=utf-8" }],
                ["panel-bridge.mjs", { file: "web/archiview/panel-bridge.mjs", type: "text/javascript; charset=utf-8" }],
                ["review.mjs", { file: "web/archiview/review.mjs", type: "text/javascript; charset=utf-8" }],
                ["styles.css", { file: "web/archiview/styles.css", type: "text/css; charset=utf-8" }],
              ]);


              /** Кэш прочитанных ресурсов: файлы панели неизменны в пределах
              установленного пакета. */

              const assetCache = new Map();


              /**
               * Приводит префикс к виду `/archiview`: без хвостового слэша и служебных символов.
               *
               * @param {unknown} value - значение конфигурации.
               * @returns {string} нормализованный префикс.
               * @throws {Error} если значение не является допустимым путём.
               */
              export function normalizePrefix(value) {
                const prefix = typeof value === "string" ? value.trim() : "";
                if (prefix === "") return DEFAULT_PREFIX;
                if (!prefix.startsWith("/") || prefix.endsWith("/") || prefix.includes("?") ||
                    prefix.includes("#") || /\s/.test(prefix)) {
                  throw new Error("Префикс плагина ArchiView должен начинаться с / и не заканчиваться им");
                }
                return prefix;
              }


              /**
               * Экранирует значение для HTML-атрибута.
               *
               * @param {string} value - недоверенное значение.
               * @returns {string} безопасная для атрибута строка.
               */
              function escapeAttribute(value) {
                return String(value).replaceAll("&", "&amp;").replaceAll('"', "&quot;")
                  .replaceAll("<", "&lt;").replaceAll(">", "&gt;");
              }


              /**
               * Переписывает шаблон панели под префикс плагина.
               *
               * Шаблон ссылается на ресурсы абсолютными путями от корня сервера, поэтому без
               * переписывания они попадут в SPA-фолбэк dsh. Заодно вставляются метаданные:
               * база API (её читает `web/archiview/client.mjs`) и идентификатор чата, к
               * которому относится вкладка.
               *
               * @param {string} html - исходный шаблон.
               * @param {object} options - параметры переписывания.
               * @param {string} options.prefix - префикс маршрутов плагина.
               * @param {string | null} [options.sessionId] - идентификатор чата для вкладки.
               * @returns {string} готовый HTML.
               */
              export function rewritePanelHtml(html, { prefix, sessionId }) {
                const meta = [`<meta name="archiview-base" content="${escapeAttribute(prefix + "/api")}">`];
                if (typeof sessionId === "string" && sessionId !== "") {
                  meta.push(`<meta name="archiview-session" content="${escapeAttribute(sessionId)}">`);
                }
                return html
                  .replace('href="/styles.css"', `href="${prefix}/styles.css"`)
                  .replace('src="/app.mjs"', `src="${prefix}/app.mjs"`)
                  .replace("<head>", "<head>\n  " + meta.join("\n  "));
              }


              /**
               * Отправляет JSON-ответ с запретом кэширования.
               *
               * @param {import("node:http").ServerResponse} response - ответ.
               * @param {number} status - HTTP-статус.
               * @param {unknown} value - сериализуемое значение.
               * @returns {void}
               */
              function sendJson(response, status, value) {
                response.statusCode = status;
                response.setHeader("Content-Type", "application/json; charset=utf-8");
                response.end(JSON.stringify(value));
              }


              /**
               * Отправляет прикладную ошибку в общей для адаптеров форме.
               *
               * @param {import("node:http").ServerResponse} response - ответ.
               * @param {unknown} cause - перехваченная ошибка.
               * @returns {void}
               */
              function sendError(response, cause) {
                const error = applicationError(cause);
                const status = error.code === "REQUEST_TOO_LARGE" ? 413 : ERROR_STATUS[error.code] ?? 500;
                sendJson(response, status, { error: error.message, code: error.code });
              }


              /**
               * Читает ограниченное JSON-тело запроса.
               *
               * Проверяется только форма: предметные ограничения остаются в прикладном
               * сервисе, поэтому маршрут не дублирует его правила.
               *
               * @param {import("node:http").IncomingMessage} request - запрос.
               * @returns {Promise<Record<string, unknown>>} объект аргументов.
               * @throws {ApplicationError} при превышении предела или неверной форме.
               */
              async function readJson(request) {
                let body = "";
                for await (const chunk of request) {
                  body += chunk;
                  if (Buffer.byteLength(body) > MAX_BODY_BYTES) {
                    throw new ApplicationError("REQUEST_TOO_LARGE", "Слишком большой запрос");
                  }
                }
                const value = JSON.parse(body || "{}");
                if (!value || typeof value !== "object" || Array.isArray(value)) {
                  throw new ApplicationError("INVALID_ARGUMENT", "Ожидается объект параметров");
                }
                return value;
              }


              /**
               * Выполняет операцию панели по относительному пути под `/api/`.
               *
               * @param {import("node:http").IncomingMessage} request - запрос.
               * @param {import("node:http").ServerResponse} response - ответ.
               * @param {URL} url - разобранный адрес запроса.
               * @param {string} relative - путь после `<prefix>/api/`.
               * @param {object} session - прикладная сессия ArchiView.
               * @returns {Promise<void>} завершение после отправки ответа.
               * @throws {ApplicationError} если операция неизвестна.
               */
              async function runApiOperation(request, response, url, relative,
              session) {
                const method = request.method ?? "GET";
                const match = /^analysis\/([a-f0-9-]{36})$/.exec(relative);
                const query = Object.fromEntries(url.searchParams);

                if (method === "GET" && relative === "comparison") {
                  if (query.historyLimit !== undefined) query.historyLimit = Number(query.historyLimit);
                  return sendJson(response, 200, await session.getComparison(query));
                }
                if (method === "GET" && relative === "module") {
                  return sendJson(response, 200, await session.getModule(query));
                }
                if (method === "GET" && match !== null) {
                  return sendJson(response, 200, await session.getAnalysis({ id: match[1] }));
                }
                if (method === "POST" && relative === "analysis") {
                  return sendJson(response, 201, await session.prepareAnalysis(await readJson(request)));
                }
                if (method === "POST" && relative === "reviews") {
                  return sendJson(response, 200, await session.buildReview(await readJson(request)));
                }
                if (method === "POST" && relative === "snapshots") {
                  return sendJson(response, 201, await session.saveSnapshot(await readJson(request)));
                }
                throw new ApplicationError("NOT_FOUND", "Операция панели не найдена");
              }


              /**
               * Читает статический ресурс панели с кэшированием.
               *
               * @param {string} name - имя ресурса под префиксом.
               * @returns {Promise<{ content: Buffer, type: string } | null>} ресурс или `null`.
               */
              async function readAsset(name) {
                const asset = PANEL_ASSETS.get(name);
                if (asset === undefined) return null;
                let content = assetCache.get(name);
                if (content === undefined) {
                  content = await readFile(new URL(asset.file, packageUrl));
                  assetCache.set(name, content);
                }
                return { content, type: asset.type };
              }


              /**
               * Создаёт маршруты плагина для `ctx.webServer`.
               *
               * Возвращаются два маршрута: точный адрес панели с редиректом на слэш и
               * префиксный обработчик для ресурсов, API и HTML. Обработчик сначала отдаёт
               * запрос политике соединения хоста и только потом читает проект.
               *
               * @param {object} options - параметры маршрутов.
               * @param {string} [options.prefix] - префикс маршрутов.
               * @param {(request: import("node:http").IncomingMessage, response: import("node:http").ServerResponse) => boolean} options.guard
               *   проверка запроса; `true` означает, что ответ уже отправлен.
               * @param {(request: import("node:http").IncomingMessage, url: URL) => object | Promise<object>} options.getSession
               *   сессия прикладного сервиса для запроса.
               * @returns {ReadonlyArray<{ kind: "exact" | "prefix", path: string, handler: Function }>} маршруты.
               */
              export function createRouteTable({ prefix = DEFAULT_PREFIX, guard,
              getSession }) {
                if (typeof guard !== "function" || typeof getSession !== "function") {
                  throw new Error("createRouteTable требует guard и getSession");
                }
                const apiBase = prefix + "/api/";
                const assetBase = prefix + "/";

                /**
                 * Общий обработчик префикса: политика, статика, API.
                 *
                 * @param {import("node:http").IncomingMessage} request - запрос.
                 * @param {import("node:http").ServerResponse} response - ответ.
                 * @returns {Promise<void>} завершение обработки.
                 */
                async function handler(request, response) {
                  if (guard(request, response)) return;
                  response.setHeader("Cache-Control", "no-store");
                  response.setHeader("X-Content-Type-Options", "nosniff");
                  response.setHeader("Content-Security-Policy",
                    "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; " +
                    "object-src 'none'; base-uri 'none'; frame-ancestors 'self'");
                  try {
                    if (request.method === "OPTIONS") {
                      response.statusCode = 204;
                      response.end();
                      return;
                    }
                    const url = new URL(request.url ?? "/", "http://localhost");
                    if (url.pathname === assetBase || url.pathname === assetBase + "index.html") {
                      const html = await readFile(new URL("web/archiview/index.html", packageUrl), "utf8");
                      response.statusCode = 200;
                      response.setHeader("Content-Type", "text/html; charset=utf-8");
                      response.end(rewritePanelHtml(html, {
                        prefix,
                        sessionId: url.searchParams.get("session"),
                      }));
                      return;
                    }
                    if (url.pathname.startsWith(apiBase)) {
                      const session = await getSession(request, url);
                      await runApiOperation(request, response, url, url.pathname.slice(apiBase.length), session);
                      return;
                    }
                    const asset = await readAsset(url.pathname.slice(assetBase.length));
                    if (asset === null) {
                      sendJson(response, 404, { error: "Ресурс не найден", code: "NOT_FOUND" });
                      return;
                    }
                    response.statusCode = 200;
                    response.setHeader("Content-Type", asset.type);
                    response.end(asset.content);
                  } catch (error) {
                    sendError(response, error);
                  }
                }

                return [
                  {
                    kind: "exact",
                    path: prefix,
                    handler(request, response) {
                      response.statusCode = 308;
                      response.setHeader("Location", prefix + "/");
                      response.end();
                    },
                  },
                  { kind: "prefix", path: prefix + "/", handler },
                ];
              }
