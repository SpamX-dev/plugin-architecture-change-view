          kind: file
          path: src/dsh/client/body.mjs
          start_line: 1
          end_line: 46
          text: >
            /**
             * Тело вкладки ArchiView в правой панели dsh.
             *
             * Показывает страницу, которую отдают маршруты плагина (`src/dsh/routes.mjs`),
             * в обычном iframe. Такой способ не требует переписывать интерфейс: страница
             * остаётся тем же `web/archiview`, что и в браузере, и получает базу API из
             * метатега, который вставляет маршрут.
             *
             * Компонент намеренно не читает состояние чата и не вызывает сервисов: адрес
             * страницы — единственный вход, а данные приходят внутрь iframe по HTTP.
             *
             * @module plugin-architecture-change-view/dsh/client/body
             */

            import { createElement } from "react";


            /** Префикс маршрутов по умолчанию; совпадает с `DEFAULT_PREFIX`
            маршрутов хоста. */

            const DEFAULT_PREFIX = "/archiview";


            /**
             * Читает префикс маршрутов из метатега документа.
             *
             * Метатег может отсутствовать: в Web-клиенте dsh его нет, поэтому действует
             * значение по умолчанию. Переопределение нужно для композиций, где префикс
             * плагина отличается от стандартного.
             *
             * @returns {string} префикс маршрутов панели.
             */
            function panelPrefix() {
              const tag = globalThis.document?.querySelector?.('meta[name="archiview-prefix"]');
              return typeof tag?.content === "string" && tag.content !== "" ? tag.content : DEFAULT_PREFIX;
            }


            /**
             * Тело вкладки: страница панели во всю площадь вкладки.
             *
             * @returns {import("react").ReactElement} iframe со страницей ArchiView.
             */
            export function PanelBody() {
              return createElement("iframe", {
                src: panelPrefix() + "/",
                title: "ArchiView",
                style: { display: "block", width: "100%", height: "100%", border: "0" },
              });
            }
        - id: sha256:9ccf755b91fd1f018470f7c30abd3d2dbe8e43c4a8156eff4e099196e94d071c
          kind: file
          path: src/dsh/client/index.mjs
          start_line: 1
