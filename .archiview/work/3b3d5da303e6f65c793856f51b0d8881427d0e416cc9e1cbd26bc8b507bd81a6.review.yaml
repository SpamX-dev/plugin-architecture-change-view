      findings:
        - id: network-path-prefix-iframe
          kind: responsibility_gap
          certainty: confirmed
          severity: warning
          lifecycle: resolved
          summary: Принимаемый префикс //host/path превращал адрес iframe в URL другого
            хоста вместо локального маршрута ArchiView; теперь валидатор общего
            префикса отклоняет сетевые ссылки и обратные слэши, поэтому адрес
            остаётся на origin хоста.
          clauses:
            - snapshot: current
              module_id: dsh-client-panel
              section: responsibilities
              id: R3
          evidence:
            - snapshot: baseline
              fact_id: sha256:8c7583001cb63df0a8976f5fb1445958b89eeaa76ad6f87e1ec87f4319eb6902
            - snapshot: baseline
              fact_id: sha256:c2ed6e18775e7b7bafcda31ff49086b37e93baee02211c05dc26f64c4f0df961
            - snapshot: current
              fact_id: sha256:7915ceb1bfc6bbd2384aed795e2ada9e7832e594dd2a98567b18d24fa56f22be
            - snapshot: current
              fact_id: sha256:1085c2da3afca13f57e02da9e43ffafb36c0593f1cb5012199d5f666d92f0d2a
            - snapshot: current
              fact_id: sha256:ae4aae12c58d9601a2ff6e9d74cea70d220afa89d86f500307db71a64a6e3ac9
          details: "На baseline (HEAD) asPrefix принимал строку, начинающуюся с «/» и не
            содержащую ?/#/пробелов, поэтому //outside.invalid/archiview
            проходил проверку, resolveClientPrefix возвращал его, а PanelBody
            подставлял в src. new URL(src,
            https://dsh.example.invalid/chat).origin давал
            https://outside.invalid — чужой origin вместо маршрута панели. В
            текущем коде общий валидатор panel-contract.mjs:31,37,50-54 требует
            ровно один начальный прямой слэш (второй символ не «/» и не «\\»),
            запрещает обратный слэш, ?/# и пробельные символы и не допускает
            хвостовой слэш. Испорченное внедрение откатывается к /archiview
            через resolveClientPrefix и panelPageUrl, а недопустимый
            config.prefix отвергается в normalizePrefix (routes.mjs:71-84) до
            регистрации маршрутов. Повторная проверка на текущем коде: origin
            https://dsh.example.invalid сохраняется для /archiview,
            /custom-architecture и для значений //outside.invalid/archiview,
            /\\outside.invalid/archiview, ///outside.invalid; тесты префикса и
            адреса страницы проходят (node --test test/dsh.test.mjs: 32/32);
            отрицательный контроль на файле HEAD воспроизводит прежний origin
            https://outside.invalid. Живой браузер, React-рендер и сетевые
            запросы не выполнялись."
          recommendation: Держать проверку префикса общей для хоста и клиента и сохранять
            тесты на //host/path, /\host/path, стандартный и пользовательский
            префикс, чтобы ослабление валидатора снова не увело iframe с origin
            хоста.
          related_modules:
            - dsh-client-panel
            - dsh-adapter
      assessment:
        current:
          verdict: consistent
          summary: R1-R4, B1-B3, I2 и I4 согласуются с текущим кодом; I1 и I3 остаются
            not_checked из-за отсутствия API Cordis/dsh в сохранённой области.
            Принимаемый префикс — локальный путь, iframe остаётся на origin
            хоста. Замечание network-path-prefix-iframe устранено.
        change:
