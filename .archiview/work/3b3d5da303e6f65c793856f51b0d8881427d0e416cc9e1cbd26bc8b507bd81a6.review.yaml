          text: >
            /**
             * Браузерная половина плагина ArchiView для dsh.
             *
             * Модуль регистрирует в правой панели тип вкладки ArchiView и её тело. Тип
             * объявлен в band `extension` — это штатная полоса для типов из другого
             * пакета: она выше встроенных и позволяет открывать страницу плагина, не
             * занимая чужой `kind`.
             *
             * Клиентская половина ничего не читает из проекта и не вызывает прикладной
             * сервис: страницу отдаёт маршрут хоста, а тело вкладки только показывает её в
             * iframe. Поэтому здесь нет ни сетевого клиента, ни операций просмотра.
             *
             * @module plugin-architecture-change-view/dsh/client
             */

            import { createElement } from "react";

            import { PanelBody } from "./body.mjs";

            import { createPromptSender } from "./prompt.mjs";


            /**
             * Сервисы клиента, без которых регистрация невозможна: слоты правой панели и
             * реестр типов вкладок.
             */
            export const inject = ["slots", "sidebarRightTabs"];


            /** Идентификатор реализации типа вкладки; он же ключ тела в слоте.
            */

            export const TAB_ID = "plugin-architecture-change-view/archiview";


            /** Дискриминатор типа вкладки, которым открывается страница. */

            export const TAB_KIND = "archiview";


            /**
             * Регистрирует вкладку ArchiView в клиенте dsh.
             *
             * Обе регистрации обёрнуты в `ctx.effect`, поэтому живут ровно столько же,
             * сколько плагин: выгрузка снимает и тип, и тело.
             *
             * @param {import("@deepseek-ai/cordis").Context} ctx - контекст клиента.
             * @returns {void}
             */
            export function apply(ctx) {
              // Отправитель замыкается на контекст плагина: тело вкладки получает только
              // функцию, поэтому не ищет сервисы само и не знает их имён.
              const sendPrompt = createPromptSender(ctx);
              const Body = (props) => createElement(PanelBody, { ...props, sendPrompt });

              ctx.effect(() => ctx.sidebarRightTabs.register({
                id: TAB_ID,
                kind: TAB_KIND,
                priority: "extension",
                title: () => "ArchiView",
                guide: [{
                  id: TAB_ID + "/guide",
                  order: 40,
                  title: () => "ArchiView",
                  description: () => "Архитектура проекта и контракты модулей",
                }],
              }), "ui-archiview: тип вкладки");

              ctx.effect(() => ctx.slots.inject("sidebar.right.pane.tab", () => ctx.slots.register({
                name: "sidebar.right.pane.tab",
                key: TAB_ID,
              }, Body)), "ui-archiview: тело вкладки");
            }
        - id: sha256:fed6b51ae0edd843d25d6df705bbab975d57e880c83880eba2e111a524ff4b4a
          kind: file
          path: src/dsh/client/prompt.mjs
          start_line: 1
          end_line: 55
          text: >
            /**
             * Передача поручения анализа в чат dsh.
             *
             * Панель не может звать инструменты модели напрямую: она работает в iframe и
             * общается с хостом только явными сообщениями. Хост-половина плагина такой
             * запрос не принимает — поручение отправляет браузерная половина в тот чат,
             * которому принадлежит вкладка, через клиентский сервис сессий.
             *
             * Модуль держит одну операцию: взять сессию на время отправки, передать текст
             * в очередь хода и отпустить ссылку. Навигация панели сюда не попадает, поэтому
             * просмотр по-прежнему не создаёт сообщений модели.
             *
             * @module plugin-architecture-change-view/dsh/client/prompt
             */

            /**
             * Создаёт отправителя поручений для одного экземпляра плагина.
             *
             * @param {import("@deepseek-ai/cordis").Context} ctx - контекст клиента dsh.
             * @returns {(sessionId: string, text: string) => Promise<void>} отправка поручения в чат.
             */
            export function createPromptSender(ctx) {
              /**
               * Отправляет текст в очередь хода указанного чата.
               *
               * @param {string} sessionId - идентификатор чата вкладки.
               * @param {string} text - подготовленное панелью поручение.
               * @returns {Promise<void>} завершение после принятия хостом.
               * @throws {Error} если чат неизвестен, поручение пустое или хост его отклонил.
               */
              return async function sendPrompt(sessionId, text) {
                if (typeof sessionId !== "string" || sessionId === "") {
                  throw new Error("Чат вкладки неизвестен");
                }
                if (typeof text !== "string" || text.trim() === "") {
                  throw new Error("Пустое поручение анализа");
                }
                const sessions = ctx.get("sessions");
                if (sessions === undefined) throw new Error("Клиентские сессии dsh недоступны");

                // Ссылка держит поколение сессии на время отправки и освобождается в любом
                // исходе: удерживать её после ответа хоста нечего.
                const reference = sessions.retain(sessionId, { source: "archiview" });
                try {
                  const binding = await reference.ready;
                  const result = await binding.session.prompt([{ type: "text", text }], "queue");
                  if (result?.ok !== true) {
                    throw new Error(result?.error?.message ?? "Хост отклонил поручение");
                  }
                } finally {
                  reference.release();
                }
              };
            }
        - id: sha256:7915ceb1bfc6bbd2384aed795e2ada9e7832e594dd2a98567b18d24fa56f22be
          kind: file
          path: src/dsh/panel-contract.mjs
          start_line: 1
          end_line: 102
          text: >
            /**
             * Контракт между половинами плагина dsh.
             *
             * Хост и браузерный бандл — разные процессы и разные модульные графы, поэтому
             * единственное, что они могут разделить, — это зависимый от данных контракт:
             * имя глобального объекта, форму строки внедрения в index.html и правило
             * разбора. Модуль намеренно не имеет зависимостей, чтобы его можно было
             * импортировать и в Node-половину, и в бандл браузера.
             *
             * Так префикс маршрутов остаётся одним значением: конфигурация хоста попадает
             * в документ клиента через публичный канал `webserver/index-inject`, а клиент
             * читает её оттуда. Ни одна половина не дублирует константу маршрута.
             *
             * @module plugin-architecture-change-view/dsh/panel-contract
             */

            /** Префикс маршрутов панели по умолчанию, если хост не сообщил
            другой. */

            export const DEFAULT_PREFIX = "/archiview";


            /** Имя глобального объекта, который хост внедряет в документ
            клиента. */

            export const CLIENT_GLOBAL = "__DSH_ARCHIVIEW__";


            /**
             * Начало локального пути: ровно один прямой слэш.
             *
             * Второй символ не может быть ещё одним слэшем или обратным слэшем. `//host/path`
             * — сетевая ссылка (network-path reference): браузер сохраняет схему документа,
             * но берёт чужой origin. `/\host/path` приводится к той же ссылке при разборе
             * URL, потому что для специальных схем обратный слэш считается разделителем.
             */
            const LOCAL_PATH_START = /^\/(?![/\\])/;


            /**
             * Символы, которых не может быть в локальном пути маршрута: пробельные,
             * обратный слэш (меняет разбор URL), строка запроса и фрагмент.
             */
            const FORBIDDEN_IN_PATH = /[\s\\?#]/;


            /**
             * Проверяет префикс, пришедший из конфигурации или документа.
             *
             * Допускается только локальный абсолютный путь. Сетевые ссылки и обратные
             * слэши отклоняются: иначе адрес iframe увёл бы вкладку на чужой origin вместо
             * маршрута панели хоста (см. `src/dsh/client/body.mjs`). Тот же префикс служит
             * путём регистрации маршрутов, поэтому проверка общая для обеих половин.
             *
             * @param {unknown} value - проверяемое значение.
             * @returns {string | null} префикс без хвостового слэша либо `null`.
             */
            export function asPrefix(value) {
              if (typeof value !== "string" || value.endsWith("/")) return null;
              if (!LOCAL_PATH_START.test(value) || FORBIDDEN_IN_PATH.test(value)) return null;
              return value;
            }


            /**
             * Собирает строку внедрения конфигурации клиента в index.html.
             *
             * `kind: "global"` — штатная строка веб-сервера dsh: она присваивает
             * JSON-значение свойству `globalThis` до выполнения клиентских бандлов. Форма
             * строки стабильна и не зависит от версии плагина.
             *
             * @param {string} prefix - нормализованный префикс маршрутов панели.
             * @returns {{ kind: "global", name: string, value: { prefix: string } }} строка внедрения.
             */
            export function clientConfigRow(prefix) {
              return { kind: "global", name: CLIENT_GLOBAL, value: { prefix } };
            }


            /**
             * Читает префикс, который сообщил хост.
             *
             * Отсутствие или порча значения не считаются ошибкой: клиент откатывается к
             * стандартному префиксу, потому что вкладка не должна ломаться из-за
             * документа, который ещё не успел получить внедрение.
             *
             * @param {object} [scope] - глобальный объект; параметр нужен для тестов.
             * @returns {string} действующий префикс маршрутов.
             */
            export function resolveClientPrefix(scope = globalThis) {
              const injected = scope?.[CLIENT_GLOBAL]?.prefix;
              return asPrefix(injected) ?? DEFAULT_PREFIX;
            }


            /**
             * Собирает адрес страницы панели для вкладки чата.
             *
             * Идентификатор чата — единственное, что клиент знает о сессии: хост по нему
             * разрешает рабочий каталог проекта. Значение кодируется как параметр запроса,
             * потому что оно приходит из состояния клиента и не должно влиять на разбор
             * пути.
             *
             * @param {string} prefix - действующий префикс маршрутов.
             * @param {unknown} sessionId - идентификатор чата, которому принадлежит вкладка.
             * @returns {string} адрес страницы с идентификатором чата или без него.
             */
            export function panelPageUrl(prefix, sessionId) {
              const base = (asPrefix(prefix) ?? DEFAULT_PREFIX) + "/";
              if (typeof sessionId !== "string" || sessionId === "") return base;
              return base + "?session=" + encodeURIComponent(sessionId);
            }
        - id: sha256:ae4aae12c58d9601a2ff6e9d74cea70d220afa89d86f500307db71a64a6e3ac9
