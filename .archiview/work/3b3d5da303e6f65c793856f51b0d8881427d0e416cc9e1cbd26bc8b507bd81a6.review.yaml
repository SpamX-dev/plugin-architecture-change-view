              B2: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным адаптерам.
                Извлечение символов, разрешение зависимостей и индексация AST принадлежат ast-index.
            invariants:
              I1: Чтение ограничено настроенным корнем проекта.
              I2: Снимки и результаты анализа по умолчанию находятся в переносимой папке .archiview
