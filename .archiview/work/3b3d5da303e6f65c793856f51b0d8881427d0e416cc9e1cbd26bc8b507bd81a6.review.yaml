            При /custom-architecture и при отсутствии внедрения origin остаётся
            исходным. Внешний ресурс не запрашивался; источник конфигурации
            остаётся хостом, и недоверенное управление конфигурацией не
            предполагается. Дефект затрагивает корректность принимаемой
            настройки маршрутов.'
