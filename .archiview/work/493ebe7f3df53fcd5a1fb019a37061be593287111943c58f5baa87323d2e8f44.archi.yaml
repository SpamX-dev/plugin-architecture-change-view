        text: >
          schema_version: 1

          id: architecture-core

          title: Корень исходников ArchiView

          kind: group

          extensions:
            archiview.roles: [root]
          purpose: Объединять серверные модули ArchiView вокруг общей модели
          проекта, чтобы разные
            способы доступа давали согласованные контракты, изменения и результаты проверок.
          responsibilities:
            R11: Задавать границу между моделью проекта, прикладными операциями и внешними адаптерами.
          boundaries:
            B1: Адаптеры вызывают общие прикладные операции просмотра. Прикладной сервис принимает данные
              проекта и возвращает результат независимо от транспорта, хоста и способа отображения.
            B2: Семантический вывод ответственности выполняет агент или внешний анализатор. Наличие контракта не
              доказывает его выполнения.
            B5: Адаптеры и сборщики снимков используют общую модель контрактов. Чтение и проверка
              контрактов доступны независимо от MCP, HTTP и хоста.
          invariants:
            I1: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости, сборка и папки
              .archiview не расширяют анализ. Запись данных допускается в .archiview корня проекта
              либо явно выбранном внешнем хранилище; ссылки не меняют эту область.
            I2: Неполнота обхода и доказательств сообщается явно.
            I3: Снимки и отчёты не заменяют arch.yaml и не согласуют новую ответственность.
            I4: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых файлах.
            I5: Структурное различие контрактов не создаёт замечание; оценка нарушения требует отдельного анализа.
            I6: Успешная проверка индекса означает, что подготовленные к коммиту отчёты описывают
              состояние исходников и контрактов из того же индекса Git.
