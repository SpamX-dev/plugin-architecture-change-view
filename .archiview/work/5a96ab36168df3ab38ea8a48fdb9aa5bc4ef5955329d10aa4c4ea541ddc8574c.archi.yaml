            import { createArchiViewSession } from "./session.js";

            import { ApplicationError } from "./errors.js";

            import type { SessionOperations } from "./api.js";


            /** Route a panel request within its host-bound folder. The selected
            repository belongs to the request. */

            export async function createWorkspaceSession({ root: folder,
            stateDirectory, sharedStateDirectory = false }: {
              root: string; stateDirectory?: string; sharedStateDirectory?: boolean;
            }) {
