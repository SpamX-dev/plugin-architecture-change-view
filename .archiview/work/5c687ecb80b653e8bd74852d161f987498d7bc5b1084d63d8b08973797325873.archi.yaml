              допускают ссылку на нарушенное ограничение предка.
            B3: Правила проверки композиции ограничивают область родителя декларациями
              непосредственных детей.
            B4: Инструкция исключает вывод зависимостей из перечня прочитанных агентом
              доказательств.
          invariants: {}
