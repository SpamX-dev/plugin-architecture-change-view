    children:
      - module_id: archiview-module-boundaries-skill
        directory: skills/module-boundaries
        contract:
          id: archiview-module-boundaries-skill
          kind: module
          purpose: Давать агенту инструкции для работы с ответственностью каталогов
            проекта.
          responsibilities:
            R1: Определять, как агент создаёт и пересматривает контракты, выбирает роли и
              учитывает границы предков.
            R2: Описывать, как агент проверяет контракт по доказательствам выбранного снимка
              и оформляет результат. Проверка внутреннего модуля включает
              соответствие границам предков и выявление необходимых редакций
              реализации или контрактов без автоматического пересмотра верхних
              модулей. Правила исключают определение зависимостей через LLM и
              подмену зависимостей прочитанными доказательствами.
          boundaries:
            B1: Адаптеры отвечают за публикацию инструкций в своих хостах.
          invariants:
            I1: Скилл содержит имя и описание для обнаружения и единый текст правил для всех
              способов публикации.
