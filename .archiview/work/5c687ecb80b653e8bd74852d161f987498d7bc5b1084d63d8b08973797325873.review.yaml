            available: true
            digest: sha256:ae24650ff3e90b892c1aa5af380d20759a2704a1f0d73f64014523d81ab63701
            content: >
              import type { SessionOperations } from "../application/api.js";

              import { createWorkspaceSession } from
              "../application/workspace-session.js";

              import type { SessionRegistry } from "./sessions.js";

              import type { HostContext, HostConfig, JsonValue } from
              "./host-types.js";

              /**
               * Cordis-плагин ArchiView для DeepSeek Harness.
               *
               * Плагин собирает из существующих домены проекта две половины:
               *
               * 1. инструменты модели (`archiview_inventory`, `archiview_context`) — чтение
               *    контрактов через `src/contracts/inventory.ts`;
               * 2. маршруты панели под префиксом `/archiview` — тот же прикладной сервис
               *    `src/application`, что используют standalone-адаптер и панель Codex;
               * 3. публикацию скилла module-boundaries в реестре dsh;
               * 4. передачу настроенного префикса маршрутов браузерной половине через
               *    публичный канал `webserver/index-inject`.
               *
               * Плагин не содержит прикладной логики и не запускает модель: просмотр только
               * читает проект, а анализ выполняет агент хоста по явному поручению. Вкладка
               * получает рабочий каталог своего чата из хоста. Для прямого открытия панели
               * используются настройка корня и рабочий каталог процесса.
               *
               * @module plugin-architecture-change-view/dsh/host
               */

              import path from "node:path";

              import z from "@deepseek-ai/schemastery";

              import { defineTool } from "@deepseek-ai/dsh-tools";

              import { ApplicationError } from "../application/errors.js";

              import { resolveChatRoot } from "./chat-root.js";

              import { clientConfigRow, DEFAULT_PREFIX } from
              "./panel-contract.js";

              import { createRouteTable, normalizePrefix } from "./routes.js";

              import { createSessionRegistry } from "./sessions.js";

              import { loadSkill } from "./skill.js";

              import {
                normalizeExtensions,
                readContext,
                readInventory,
                resolveRoot,
                TOOL_DEFINITIONS,
              } from "./tools.js";


              /** Имя Cordis-плагина для диагностики загрузчика. */

              export const name = "archiview";


              /**
               * Сервисы, без которых плагин не активируется.
               *
               * `connection` обязателен: маршруты панели отдают проект только после его
               * проверки политики соединения. Реестр скиллов подключается необязательно —
               * без него инструменты и панель продолжают работать.
               */
              export const inject = ["tools", "webServer", "connection"];


              /** Схема конфигурации плагина; значения по умолчанию рассчитаны
              на локальный проект. */

              export const Config = z.object({
                root: z.string().default(""),
                stateDirectory: z.string().default(""),
                prefix: z.string().default(DEFAULT_PREFIX),
                maxFiles: z.number().default(50_000),
                extensions: z.array(z.string()).default([]),
                panel: z.boolean().default(true),
                tools: z.boolean().default(true),
                skill: z.boolean().default(true),
              });


              /**
               * Применяет плагин к контексту dsh.
               *
               * Регистрации живут ровно столько же, сколько плагин: маршруты и скилл
               * снимаются возвращёнными disposer'ами, а реестр сессий закрывается эффектом.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @param {object} config - нормализованная конфигурация схемы.
               * @returns {void}
               */
              export function apply(ctx: HostContext, config: HostConfig) {
                const prefix = normalizePrefix(config.prefix);
                const extensions = normalizeExtensions(config.extensions);
                const root = config.root === "" ? "" : path.resolve(config.root);
                const sessions = createSessionRegistry({
                  createSession: (options: { root: string; stateDirectory?: string }) => createWorkspaceSession({ ...options, sharedStateDirectory: true }),
                  stateDirectory: config.stateDirectory === "" ? undefined : config.stateDirectory,
                });

                ctx.effect(() => () => {
                  void sessions.dispose();
                }, "archiview: сессии");

                if (config.tools) registerTools(ctx, { extensions, maxFiles: config.maxFiles, configuredRoot: root });
                if (config.skill) registerSkill(ctx);
                if (config.panel) {
                  registerClientConfig(ctx, prefix);
                  registerRoutes(ctx, { prefix, sessions, fallbackRoot: root });
                }
              }


              /**
               * Регистрирует инструменты модели.
               *
               * Схема вывода — произвольный JSON: результат инвентаризации и контекста
               * остаётся структурированным, а не превращается в строку до валидации.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @param {object} options - параметры регистрации.
               * @param {Set<string>} options.extensions - расширения исходников.
               * @param {number} options.maxFiles - предел обхода.
               * @param {string} options.configuredRoot - область чтения инструментов из конфигурации.
               * @returns {void}
               */
              function registerTools(ctx: HostContext, { extensions, maxFiles,
              configuredRoot }: { extensions: Set<string>; maxFiles: number;
              configuredRoot: string }) {
                for (const definition of TOOL_DEFINITIONS) {
                  ctx.tools.register(defineTool({
                    name: definition.name,
                    description: definition.description,
                    parameters: definition.parameters,
                    output: {
                      schema: { type: "json" },
                      render: (_args, value) => [{ type: "text", text: JSON.stringify(value) }],
                    },
                    async execute(args: { projectRoot?: string; path?: string; directory?: string }, exec) {
                      const requested = args.projectRoot ?? (configuredRoot ? undefined : exec.agent?.session.header.cwd);
                      const projectRoot = await resolveRoot({ projectRoot: requested, configuredRoot });
                      const value = definition.name === "archiview_inventory"
                        ? await readInventory({ root: projectRoot, extensions, maxFiles })
                        : await readContext({ root: projectRoot, path: args.path, directory: args.directory });
                      return JSON.parse(JSON.stringify(value)) as JsonValue;
                    },
                  }));
                }
              }


              /**
               * Публикует встроенный скилл в реестре dsh, если он есть в композиции.
               *
               * Регистрация асинхронная: файл читается с диска после активации плагина, а
               * ошибка чтения не отменяет инструменты и панель.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @returns {void}
               */
              function registerSkill(ctx: HostContext) {
                // Скиллы не входят в inject: композиция без dsh-skill должна активировать
                // инструменты и панель. Поэтому сервис читается через ctx.get, а не ctx.skills.
                const skills = ctx.get("skills");
                if (skills === undefined) {
                  ctx.logger?.warn?.("ArchiView: реестр скиллов dsh недоступен, module-boundaries не опубликован");
                  return;
                }
                let dispose: (() => void) | undefined;
                let disposed = false;
                loadSkill().then((skill) => {
                  if (!disposed) dispose = skills.register(skill);
                }, (error) => {
                  ctx.logger?.warn?.("ArchiView: скилл не зарегистрирован: " + error.message);
                });
                ctx.effect(() => () => {
                  disposed = true;
                  dispose?.();
                }, "archiview: скилл");
              }


              /**
               * Сообщает браузерной половине префикс маршрутов панели.
               *
               * Используется публичный канал веб-сервера dsh: строка `webserver/index-inject`
               * с `kind: "global"` присваивает значение свойству `globalThis` до запуска
               * клиентских бандлов. Так конфигурация `prefix` доходит до вкладки, и клиенту
               * не нужно угадывать адрес страницы по собственной константе.
               *
               * Внедрение действует там, где index.html отдаёт веб-сервер (Web-профиль). В
               * Electron документ грузится по `file://` и внедрения не получает — клиент
               * остаётся на стандартном префиксе, который совпадает с настройкой по
               * умолчанию.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @param {string} prefix - нормализованный префикс маршрутов.
               * @returns {void}
               */
              function registerClientConfig(ctx: HostContext, prefix: string) {
                ctx.effect(() => ctx.on("webserver/index-inject", (rows) => {
                  rows.push(clientConfigRow(prefix));
                }), "archiview: конфигурация клиента");
              }


              /**
               * Регистрирует маршруты панели в веб-сервере хоста.
               *
               * Корень проекта определяется по чату, которому принадлежит вкладка: клиент
               * передаёт `?session=<id>`, хост разрешает рабочий каталог сессии и открывает
               * прикладную сессию этого каталога. Без параметра действует корень из
               * конфигурации — этот путь остаётся для прямого открытия страницы.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @param {object} options - параметры регистрации.
               * @param {string} options.prefix - префикс маршрутов.
               * @param {ReturnType<createSessionRegistry>} options.sessions - реестр сессий.
               * @param {string} options.fallbackRoot - корень из конфигурации.
               * @returns {void}
               */
              function registerRoutes(ctx: HostContext, { prefix, sessions,
              fallbackRoot }: { prefix: string; sessions:
              Pick<SessionRegistry<SessionOperations>, "get">; fallbackRoot:
              string }) {
                const projectRoot = fallbackRoot === "" ? process.cwd() : fallbackRoot;
                const getSession = async (request: import("node:http").IncomingMessage, url: URL) => {
                  const sessionId = url.searchParams.get("session");
                  if (sessionId === null) return sessions.get(projectRoot);
                  const root = await chatRoot(ctx, sessionId);
                  if (root === null) {
                    throw new ApplicationError("NOT_FOUND", "Чат не найден или у него нет рабочего каталога");
                  }
                  return sessions.get(root);
                };
                const guard = (request: import("node:http").IncomingMessage, response: import("node:http").ServerResponse) => {
                  const rejection = ctx.connection.requestRejection(request);
                  if (rejection === undefined) return false;
                  response.statusCode = rejection;
                  response.end();
                  return true;
                };
                for (const route of createRouteTable({ prefix, guard, getSession })) {
                  ctx.effect(() => ctx.webServer.register(route), "archiview: маршрут " + route.path);
                }
              }


              /**
               * Разрешает рабочий каталог чата, не раскрывая деталей хранилища маршруту.
               *
               * Ошибка чтения сессии означает лишь то, что корень определить нельзя:
               * маршрут отвечает `NOT_FOUND`, а не внутренней ошибкой с путями хранилища.
               *
               * @param {import("@deepseek-ai/cordis").Context} ctx - контекст хоста.
               * @param {string} sessionId - идентификатор чата из запроса.
               * @returns {Promise<string | null>} рабочий каталог или `null`.
               */
              async function chatRoot(ctx: HostContext, sessionId: string) {
                try {
                  return await resolveChatRoot({
                    sessionId,
                    // Хранилище и контроллер сессий не входят в inject: панель должна
                    // активироваться и в композиции без них. ctx.get читает сервис, если он есть.
                    sessions: ctx.get("sessions"),
                    sessionController: ctx.get("sessionController"),
                  });
                } catch {
                  return null;
                }
              }
          - selector:
              kind: file
              path: src/dsh/skill.ts
            available: true
            digest: sha256:4f2b782a83822968acb56b8c781a2bce3ff5e95b557399d49bc4180df349a05d
            content: >
              /**
               * Публикация канонического скилла module-boundaries в реестре dsh.
               *
               * Скилл остаётся единственным файлом `skills/module-boundaries/SKILL.md`:
               * адаптер Codex экспортирует его как MCP-ресурс, а плагин dsh регистрирует тот
               * же текст как runtime-скилл через `ctx.skills.register`. Копий в
               * пользовательских каталогах не создаётся, поэтому правка файла меняет оба
               * хоста одновременно.
               *
               * Модуль зависит только от файловой системы и YAML: разбор frontmatter
               * повторяет правило MCP-сервера, но не требует SDK.
               *
               * @module plugin-architecture-change-view/dsh/skill
               */

              import { readFile } from "node:fs/promises";

              import { parse } from "yaml";

              import { packageUrl } from "../runtime/package-paths.js";


              /** Адрес файла скилла внутри пакета. */

              export const SKILL_PATH = new
              URL("skills/module-boundaries/SKILL.md", packageUrl);


              /**
               * Разбирает текст скилла с YAML-frontmatter.
               *
               * Обязательны `name` в kebab-case и непустое `description`: реестр dsh
               * отклоняет runtime-скилл без них. Тело возвращается без frontmatter, потому
               * что реестр вставляет его внутрь блока `<skill_instructions>`.
               *
               * @param {string} text - полный текст файла.
               * @returns {{ name: string, description: string, content: string }} разобранный скилл.
               * @throws {Error} если frontmatter отсутствует или не содержит обязательных полей.
               */
              export function parseSkillText(text: string) {
                const frontmatter = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/.exec(String(text ?? ""));
                if (!frontmatter) throw new Error("У скилла module-boundaries отсутствует frontmatter");
                const value: unknown = parse(frontmatter[1]);
                const metadata = value && typeof value === "object" && !Array.isArray(value) ? value as Record<string, unknown> : {};
                if (typeof metadata?.name !== "string" || !/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(metadata.name)) {
                  throw new Error("У скилла module-boundaries некорректное имя");
                }
                if (typeof metadata.description !== "string" || metadata.description === "") {
                  throw new Error("У скилла module-boundaries отсутствует описание");
                }
                return {
                  name: metadata.name,
                  description: metadata.description,
                  content: text.slice(frontmatter[0].length).trimStart(),
                };
              }


              /**
               * Читает и разбирает встроенный скилл.
               *
               * @param {URL} [file] - адрес файла скилла; по умолчанию штатный в пакете.
               * @param {(file: URL, encoding: "utf8") => Promise<string>} [read] - чтение для тестов.
               * @returns {Promise<{ name: string, description: string, content: string }>} разобранный скилл.
               */
              export async function loadSkill(file = SKILL_PATH, read: (file:
              URL, encoding: "utf8") => Promise<string> = readFile) {
                return parseSkillText(await read(file, "utf8"));
              }
          - selector:
              kind: file
              path: src/mcp/server.ts
            available: true
            digest: sha256:0ef224584ce07b6fdbfca287dd22c41a005a5db92c44978c7d7852b9f671d9b8
            content: >
              #!/usr/bin/env node

              /**
               * Stdio MCP-сервер контрактов проекта. Раздаёт канонический SKILL.md и инструменты
               * чтения; явный --panel добавляет локальное MCP App со скрытыми от модели операциями UI.
               * Рабочий проект задаётся явно, контекстом рабочей папки Codex или cwd вне плагина.
               */
              import { readFile } from "node:fs/promises";

              import { parseArgs } from "node:util";

              import { Server } from
              "@modelcontextprotocol/sdk/server/index.js";

              import { StdioServerTransport } from
              "@modelcontextprotocol/sdk/server/stdio.js";

              import { CallToolRequestSchema, ListToolsRequestSchema,
                ListResourcesRequestSchema, ReadResourceRequestSchema,
                ErrorCode, McpError } from "@modelcontextprotocol/sdk/types.js";
              import { parse } from "yaml";

              import { moduleContext, moduleInventory, SOURCE_EXTENSIONS } from
              "../contracts/inventory.js";

              import { createCodexPanel, PANEL_URI, PANEL_TOOL, PROJECT_INPUT }
              from "../codex/panel.js";

              import { createProjectBinding } from "../application/project.js";

              import { createCodexProjectBinding } from
              "../codex/project-context.js";

              import { UI_TOOLS, UI_TOOL_METHODS } from "../codex/ui-tools.js";

              import { packageUrl } from "../runtime/package-paths.js";


              /** Версионированная метаинформация пакета для MCP initialize. */

              const packageValue: unknown = JSON.parse(await readFile(new
              URL("package.json", packageUrl), "utf8"));

              if (!packageValue || typeof packageValue !== "object" || !("name"
              in packageValue) || typeof packageValue.name !== "string" ||
                  !("version" in packageValue) || typeof packageValue.version !== "string") throw new Error("Invalid package metadata");
              const packageInfo = { name: packageValue.name, version:
              packageValue.version };

              /** Параметры запуска; повторяемый --extension добавляет
              расширения исходников. */

              const { values } = parseArgs({ options: {
                root: { type: "string" }, extension: { type: "string", multiple: true },
                "max-files": { type: "string", default: "50000" },
                help: { type: "boolean", short: "h" },
                panel: { type: "boolean" },
              } });

              if (values.help) {
                process.stdout.write(packageInfo.name + " [--root DIR] [--extension .ext] " +
                  "[--max-files 50000] [--panel]\n");
              } else {
                await serve();
              }


              /** Создаёт каталог ресурсов и обработчики SDK; stdout
              резервируется протоколу. */

              async function serve() {
                // Portable plugins запускаются с cwd=PLUGIN_ROOT. Этот cwd нельзя выдавать за проект.
                const bindProject = values.panel ? createCodexProjectBinding : createProjectBinding;
                const project = await bindProject(values.root ?? process.env.PLUGIN_ARCHITECTURE_CHANGE_VIEW_ROOT ??
                  (process.env.PLUGIN_ROOT ? undefined : process.cwd()));
                const maxFiles = Number(values["max-files"]);
                if (!Number.isSafeInteger(maxFiles) || maxFiles < 1) {
                  throw new Error("--max-files must be a positive integer");
                }
                const extensions = new Set(SOURCE_EXTENSIONS);
                for (const extension of values.extension ?? []) {
                  if (!/^\.[a-z0-9]+$/i.test(extension)) throw new Error("Invalid source extension");
                  extensions.add(extension.toLowerCase());
                }
                const text = await readFile(new URL("skills/module-boundaries/SKILL.md", packageUrl), "utf8");
                const frontmatter = /^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/.exec(text);
                if (!frontmatter) throw new Error("Skill frontmatter is missing");
                const metadataValue: unknown = parse(frontmatter[1]);
                if (!metadataValue || typeof metadataValue !== "object" || !("name" in metadataValue) || typeof metadataValue.name !== "string" ||
                    !("description" in metadataValue) || typeof metadataValue.description !== "string") throw new Error("Invalid skill metadata");
                const metadata = { name: metadataValue.name, description: metadataValue.description };
                const uri = "skill://" + metadata.name;
                const panel = values.panel ? createCodexPanel(project) : null;
                const server = new Server({ name: packageInfo.name, version: packageInfo.version },
                  { capabilities: { resources: {}, tools: {} },
                    instructions: "For source-code changes, read skill://module-boundaries. " +
                      "Use module_inventory to find repositories and module_context with a workspace-relative source path " +
                      "to read the owning repository's contracts, root first. Maintain that repository's .archiview/modules.tree and .archiview/modules/<id>.yaml " +
                      "with your file tools. Analyze source when a contract is missing. " +
                      "Responsibility changes require user agreement." });
                server.setRequestHandler(ListResourcesRequestSchema, async () => ({
                  resources: [{ uri, name: metadata.name, description: metadata.description,
                    mimeType: "text/markdown" }, ...(panel ? [{ uri: PANEL_URI, name: "ArchiView", mimeType: "text/html;profile=mcp-app" }] : [])],
                }));
                server.setRequestHandler(ReadResourceRequestSchema, async (request) => {
                  if (panel && request.params.uri === PANEL_URI) return panel.resource();
                  if (request.params.uri !== uri) {
                    throw new McpError(ErrorCode.InvalidParams, "Unknown resource: " + request.params.uri);
                  }
                  return { contents: [{ uri, mimeType: "text/markdown", text }] };
                });
                server.setRequestHandler(ListToolsRequestSchema, async () => ({ tools: [
                  ...(panel ? [PANEL_TOOL, ...UI_TOOLS] : []),
                  { name: "module_inventory",
                    description: "List repositories, source directories and mapped contracts in the workspace, including " +
                      "missing or invalid entries in .archiview/modules.tree and contract files. " +
                      "Presence is not a semantic compliance verdict. Read skill://module-boundaries.",
                    inputSchema: { type: "object", properties: { projectRoot: PROJECT_INPUT }, additionalProperties: false },
                    annotations: { readOnlyHint: true, destructiveHint: false, openWorldHint: false } },
                  { name: "module_context",
                    description: "Find the Git repository owning a source file or directory and read its contract chain, root first. " +
                      "Use before editing source code. Reports missing documents explicitly.",
                    inputSchema: { type: "object", properties: { projectRoot: PROJECT_INPUT,
                      path: { type: "string", description: "File or directory relative to the chat workspace, e.g. backend/src/main.ts." },
                      directory: { type: "string", description: "Alternative to path for existing callers. Defaults to the workspace root." } },
                      additionalProperties: false },
                    annotations: { readOnlyHint: true, destructiveHint: false, openWorldHint: false } },
                ] }));
                server.setRequestHandler(CallToolRequestSchema, async (request) => {
                  const args = request.params.arguments ?? {};
                  const name = request.params.name;
                  if (panel && UI_TOOL_METHODS.has(name)) return panel.callUi(name, args, request.params._meta);
                  if (panel && name === PANEL_TOOL.name) {
                    if (Object.keys(args).some((key) => key !== "projectRoot") ||
                        (args.projectRoot !== undefined && typeof args.projectRoot !== "string")) throw new McpError(ErrorCode.InvalidParams, "Invalid tool arguments");
                    try { return await panel.open(args.projectRoot, request.params._meta); }
                    catch (error) { return { isError: true, content: [{ type: "text", text: error instanceof Error ? error.message : String(error) }] }; }
                  }
                  if (name !== "module_inventory" && name !== "module_context") {
                    throw new McpError(ErrorCode.InvalidParams, "Unknown tool: " + name);
                  }
                  const allowed = name === "module_context" ? ["path", "directory", "projectRoot"] : ["projectRoot"];
                  if (Object.keys(args).some((key) => !allowed.includes(key)) ||
                      (args.path !== undefined && (typeof args.path !== "string" || args.directory !== undefined)) ||
                      (args.directory !== undefined && typeof args.directory !== "string") ||
                      (args.projectRoot !== undefined && typeof args.projectRoot !== "string")) {
                    throw new McpError(ErrorCode.InvalidParams, "Invalid tool arguments");
                  }
                  try {
                    const root = await project.select(args.projectRoot, request.params._meta);
                    const result = name === "module_inventory"
                      ? await moduleInventory(root, { extensions, maxFiles })
                      : await moduleContext(root, args.path ?? args.directory);
                    return { content: [{ type: "text", text: JSON.stringify(result) }] };
                  } catch (error) {
                    return { isError: true, content: [{ type: "text", text: error instanceof Error ? error.message : String(error) }] };
                  }
                });
                if (panel) server.onclose = () => { panel.close().catch(() => {}); };
                await server.connect(new StdioServerTransport());
              }
          - selector:
              kind: file
              path: src/runtime/package-paths.ts
            available: true
            digest: sha256:af6a0065988b958d651e4e519c288ff18651856e779afd7f7bdffe4e6ea56a56
            content: >
              import { fileURLToPath } from "node:url";

              import { existsSync } from "node:fs";

              /** Use the nearest package manifest both in a source checkout and
              inside each distribution. */

              function packageDirectory(moduleUrl: string): URL {
                let directory = new URL("./", moduleUrl);
                while (!existsSync(new URL("package.json", directory))) {
                  const parent = new URL("../", directory);
                  if (parent.href === directory.href) throw new Error("ArchiView package.json is missing");
                  directory = parent;
                }
                return directory;
              }


              export const packageUrl = packageDirectory(import.meta.url);

              const sourceCli = new URL("src/archiview/cli.ts", packageUrl);

              const sourceCheckout = existsSync(sourceCli);

              export const webAssetUrl = new URL(sourceCheckout ?
              "dist/web/archiview/" : "web/archiview/", packageUrl);


              /** Runtime argv for source execution and autonomous installed CLI
              bundles. */

              export function cliArguments(): string[] {
                return sourceCheckout ? ["--import", import.meta.resolve("tsx"), fileURLToPath(sourceCli)] : [fileURLToPath(new URL("src/cli.mjs", packageUrl))];
              }
