        dependencies:
          - selector:
              kind: file
              path: scripts/build-dsh.ts
            available: true
            digest: sha256:4ddfe3209000620dc605de155aebd3cec75641d3dc325b3afcb2a31afa0535d1
            content: >
              /**
               * Сборка плагина dsh: две половины одного пакета и автономный каталог установки.
               *
               * `dist/dsh/lib/index.js` — хост-половина для Node: cordis-плагин, который регистрирует
               * инструменты, маршруты и скилл. `dist/dsh/lib/client.js` — браузерная половина в
               * формате загрузчика dsh: бандл лишь регистрирует фабрику через
               * `window.__ModuleLoader__.load`, а тело выполняется при первом открытии
               * вкладки.
               *
               * `dist/dsh` — самостоятельный пакет для установки в профиль: только собранные
               * половины, интерфейс, скилл и документы, без зависимостей и devDependencies.
               * Бандл CLI нужен потому, что поручение анализа ссылается на `src/cli.mjs`
               * относительно корня установленного пакета.
               *
               * Пакеты `@deepseek-ai/*` остаются внешними: их предоставляет хост dsh и его
               * таблица платформы, поэтому бандл не несёт вторую копию cordis или React.
               * Остальные зависимости прикладного сервиса встраиваются в `lib/index.js`,
               * чтобы установленный пакет не требовал node_modules.
               *
               * @module plugin-architecture-change-view/scripts/build-dsh
               */

              import { build } from "esbuild";

              import { buildWeb } from "./build-web.js";

              import { buildDistribution } from "./distribution.js";

              import { cp, mkdir, readFile, writeFile } from "node:fs/promises";

              import { fileURLToPath } from "node:url";


              /** Корень пакета. */

              const root = new URL("../", import.meta.url);

              const installed = await buildDistribution(root, "dsh", async
              (distribution) => {
                await buildWeb(root, undefined, new URL("web/", distribution));
                /** Обе половины создаются сразу в пакете: сборка не пишет за пределами dist. */
                const output = new URL("lib/", distribution);
                /** Идентификатор бандла в загрузчике клиента dsh — имя пакета. */
                const metadata = JSON.parse(await readFile(new URL("package.json", root), "utf8"));

                /** Общее для Node-бандлов: CJS-зависимости получают рабочий `require`. */
                const nodeBanner = {
                  js: 'import { createRequire as archiviewCreateRequire } from "node:module";\n' +
                    "const require = archiviewCreateRequire(import.meta.url);",
                };

                await mkdir(output, { recursive: true });

                // Хост-половина: один ESM-файл, который загрузчик импортирует по имени пакета.
                await build({
                  entryPoints: [fileURLToPath(new URL("src/dsh/host.ts", root))],
                  outfile: fileURLToPath(new URL("index.js", output)),
                  bundle: true,
                  platform: "node",
                  target: "node22",
                  format: "esm",
                  external: ["@deepseek-ai/*"],
                  banner: nodeBanner,
                });

                // Браузерная половина: CJS-бандл внутри фабрики загрузчика dsh.
                const client = await build({
                  entryPoints: [fileURLToPath(new URL("src/dsh/client/index.ts", root))],
                  bundle: true,
                  write: false,
                  platform: "browser",
                  target: "es2022",
                  format: "cjs",
                  external: ["react", "react/jsx-runtime", "@deepseek-ai/*"],
                });

                const wrapped = `window.__ModuleLoader__.load({
                  id: ${JSON.stringify(metadata.name)},
                  factory: (require) => {
                    var module = { exports: {} };
                    var exports = module.exports;
                ${client.outputFiles[0].text}
                    return module.exports;
                  },
                });
                `;
                await writeFile(new URL("client.js", output), wrapped);

                // Автономный пакет установки: CLI кладётся на путь, который ожидает поручение анализа.
                await mkdir(new URL("src/", distribution), { recursive: true });
                await build({
                  entryPoints: [fileURLToPath(new URL("src/archiview/packaged-cli.ts", root))],
                  outfile: fileURLToPath(new URL("src/cli.mjs", distribution)),
                  bundle: true,
                  platform: "node",
                  target: "node22",
                  format: "esm",
                  banner: nodeBanner,
                });
                for (const name of ["skills", "docs"]) {
                  await cp(new URL(name, root), new URL(name, distribution), { recursive: true });
                }
                await cp(new URL("LICENSE", root), new URL("LICENSE", distribution));
                await cp(new URL("cordis.patch.yml", root), new URL("cordis.patch.yml", distribution));

                const manifest = {
                  name: metadata.name,
                  version: metadata.version,
                  description: metadata.description,
                  type: "module",
                  main: "lib/index.js",
                  exports: {
                    ".": "./lib/index.js",
                    "./client": "./lib/client.js",
                    "./package.json": "./package.json",
                  },
                  files: ["lib", "src/cli.mjs", "web", "skills", "docs", "cordis.patch.yml", "LICENSE"],
                  dsh: metadata.dsh,
                  peerDependencies: metadata.peerDependencies,
                  peerDependenciesMeta: metadata.peerDependenciesMeta,
                  license: metadata.license,
                  engines: metadata.engines,
                };
                await writeFile(new URL("package.json", distribution), JSON.stringify(manifest, null, 2) + "\n");
              });

              process.stdout.write("dsh package: " + installed + "\n");
          - selector:
              kind: file
              path: scripts/build-plugin.ts
            available: true
            digest: sha256:1523cde98115a8d765833a4ac75f5eb95e8b58bea56d28f11354f29c31816775
            content: >
              /**
               * Автономная локальная поставка: бандлы Node и самодостаточный UI SDK исключают
               * npm install внутри кеша плагинов. Результат всегда находится только в dist/codex.
               */
              import { build } from "esbuild";

              import { buildWeb } from "./build-web.js";

              import { buildDistribution } from "./distribution.js";

              import { cp, mkdir, readFile, writeFile } from "node:fs/promises";

              import { fileURLToPath } from "node:url";


              const root = new URL("../", import.meta.url);

              const installed = await buildDistribution(root, "codex", async
              (output) => {
                await buildWeb(root, undefined, new URL("web/", output));
                await mkdir(new URL("src/", output), { recursive: true });
                // Панель должна выполнить ui/initialize без загрузки скриптов с loopback:
                // хост может применять отдельную CSP для ресурсов и сетевых запросов.
                const panelBundle = await build({
                  entryPoints: [fileURLToPath(new URL("src/codex/panel-entry.ts", root))],
                  bundle: true, write: false, platform: "browser", target: "es2022", format: "esm",
                });
                const [template, styles, icon] = await Promise.all([
                  readFile(new URL("web/archiview/index.html", root), "utf8"),
                  readFile(new URL("web/archiview/styles.css", root), "utf8"),
                  readFile(new URL("web/archiview/favicon.svg", root)),
                ]);
                const panelHtml = template
                  .replace('href="./favicon.svg"', () => `href="data:image/svg+xml;base64,${icon.toString("base64")}"`)
                  .replace('<link rel="stylesheet" href="/styles.css">', () => `<style>${styles.replace(/<\/style/gi, "<\\/style")}</style>`)
                  .replace('<script type="module" src="/app.mjs"></script>', () => `<script type="module">${panelBundle.outputFiles[0].text.replace(/<\/script/gi, "<\\/script")}</script>`);
                await mkdir(new URL("dist/", output), { recursive: true });
                await writeFile(new URL("dist/panel.html", output), panelHtml);
                await build({
                  entryPoints: { server: fileURLToPath(new URL("src/mcp/server.ts", root)), cli: fileURLToPath(new URL("src/archiview/packaged-cli.ts", root)) },
                  outdir: fileURLToPath(new URL("src/", output)), outExtension: { ".js": ".mjs" },
                  bundle: true, platform: "node", target: "node22", format: "esm",
                  banner: { js: 'import { createRequire as archiviewCreateRequire } from "node:module"; const require = archiviewCreateRequire(import.meta.url);' },
                });
                for (const name of ["skills", "docs"]) await cp(new URL(name, root), new URL(name, output), { recursive: true });
                for (const name of ["package.json", "README.md", "LICENSE"])
                  await cp(new URL(name, root), new URL(name, output));
                // Формат Codex поддерживает env_vars: переносимый mcp.json v1 не умеет
                // передавать канал контекста из окружения хоста. Общий portable-пакет не меняется.
                const portablePlugin = JSON.parse(await readFile(new URL("plugin.json", root), "utf8"));
                const portableMcp = JSON.parse(await readFile(new URL("mcp.json", root), "utf8"));
                await mkdir(new URL(".codex-plugin/", output), { recursive: true });
                await writeFile(new URL(".codex-plugin/plugin.json", output), JSON.stringify({
                  name: portablePlugin.name, version: portablePlugin.version, description: portablePlugin.description,
                  skills: "./skills/", mcpServers: "./.mcp.json", requires_local_executor: true,
                  interface: portablePlugin.extensions["com.openai"].interface,
                }, null, 2) + "\n");
                const codexServer = { ...portableMcp.mcpServers.archiview,
                  args: ["${PLUGIN_ROOT}/src/server.mjs", "--panel"],
                  env_vars: ["CODEX_APP_TOOLS_PIPE_PATH", "CODEX_APP_TOOLS_CALLER_HOST_ID"] };
                delete codexServer.type;
                await writeFile(new URL(".mcp.json", output), JSON.stringify({ mcpServers: { archiview: codexServer } }, null, 2) + "\n");
                await cp(new URL(import.meta.resolve("@modelcontextprotocol/ext-apps/app-with-deps")),
                  new URL("web/archiview/mcp-app-sdk.mjs", output));
                // Автономный пакет использует версию Codex-плагина; общая npm/dsh-версия не меняется.
                const metadata = JSON.parse(await readFile(new URL("package.json", output), "utf8"));
                metadata.version = portablePlugin.version;
                delete metadata.dependencies;
                delete metadata.devDependencies;
                delete metadata.scripts;
                // dist/codex — самостоятельный пакет Codex: записи плагина dsh здесь не публикуются.
                delete metadata.main;
                delete metadata.exports;
                delete metadata.dsh;
                delete metadata.peerDependencies;
                delete metadata.peerDependenciesMeta;
                metadata.bin.archiview = "src/cli.mjs";
                metadata.bin["plugin-architecture-change-view"] = "src/server.mjs";
                metadata.files = ["src", "web", "skills", "docs", "dist/panel.html", ".codex-plugin", ".mcp.json", "README.md", "LICENSE"];
                await writeFile(new URL("package.json", output), JSON.stringify(metadata, null, 2) + "\n");
              });

              await cp(new URL("dist/codex/dist/panel.html", root), new
              URL("dist/panel.html", root));

              process.stdout.write("Codex plugin built: " + installed + "\n");
          - selector:
              kind: file
              path: skills/module-boundaries/SKILL.md
            available: true
            digest: sha256:f03b1aae387dd58505150abd8cd03300d50337046f7a6b28d734b0da9a0f8a5d
            content: >
              ---

              name: module-boundaries

              description: "Вести карту .archiview/modules.tree и YAML-контракты
              модулей при работе с исходниками, соблюдать границы каталогов и их
              предков."

              ---


              # Ответственность каталогов


              Открой `.archiview/modules.tree` в Git-репозитории редактируемого
              исходника.

              У каждого репозитория рабочей папки своя карта. В обычной папке
              без Git и

              вложенных репозиториев используется локальная карта проекта. Это
              плоский

              YAML-словарь «устойчивый id модуля → каталог исходников». Путь
              задаётся

              относительно корня с разделителем `/`, сам корень обозначается
              `.`.

              Контракт по схеме v1 хранится в `.archiview/modules/<id>.yaml`.
              Поле `id`

              совпадает с ключом карты и именем файла без расширения. Карта и
              контракты

              хранятся в Git вместе с исходниками.


              ## Подготовка контрактов


              1. Вызови `module_inventory`, затем передай в `module_context`
              путь исходника
                 или каталога относительно рабочей папки, например `{"path":"server/src/main.ts"}`.
                 Используй `root` из ответа как основу путей к контрактам и как корень для CLI.
                 При переходе к исходникам другого репозитория запроси цепочку для нового пути.
                 В DSH те же операции называются `archiview_inventory` и `archiview_context`.
                 Без инструментов найди Git-корень исходника внутри рабочей папки и прочитай
                 контракты из его карты по цепочке предков. Связывай id модулей с их репозиторием.
              2. Если контракт отсутствует, изучи код каталога и его поддерева,
                 публичные входы, зависимости, тесты и контракты предков. Добавь запись в
                 карту и содержательный YAML-контракт. Имя папки и перечень файлов не
                 объясняют её обязанности. Противоречивый код сам по себе не разрешает новую обязанность.
              3. Исправь пустые или невалидные контракты, отсутствующие файлы,
              конфликтующие
                 id и пути. При переносе каталога обнови его путь и пути вложенных модулей
                 в карте, сохранив прежние id и имена файлов контрактов.
              4. При подготовке просмотра подготовь контракты всего выбранного
              дерева,
                 включая контейнеры исходников, тесты и скрипты. Если у каталога ресурсов есть
                 собственная архитектурная обязанность, опиши её в контракте и добавь путь в карту. Это включит
                 каталог в дерево, даже если в нём только инструкции или другие материалы.
                 При локальном изменении кода подготовь затронутые каталоги и их предков.
                 Прочитай границы предков и проверь, что изменяемый модуль им соответствует.
                 Чтение контекста не требует содержательного пересмотра каждого верхнего модуля.
                 Зависимости и сгенерированные результаты сборки исключаются. Не создавай
                 пустые будущие каталоги.
              5. Создание отсутствующего контракта на основе анализа входит
                 в этот workflow и не требует отдельного подтверждения. Расширение ранее
                 принятой ответственности требует согласования, если оно уже не разрешено
                 текущей задачей пользователя.

              ## Содержание контракта v1


              Обязательны schema_version: 1, id, title, kind (module или group),
              purpose,

              responsibilities, boundaries, invariants. Последние три поля —
              словари

              «устойчивый идентификатор пункта → строка». responsibilities
              содержит минимум

              один пункт; boundaries и invariants могут быть пустыми словарями.

              Необязательны rationale, owners и tags (массивы строк), references
              (массив

              объектов title/uri), extensions (словарь с ключами вида
              organization.field).

              Неизвестные поля, повторяющиеся YAML-ключи, aliases и произвольные
              теги запрещены.


              - id уникален в проекте и сохраняется при перемещении каталога.

              - Идентификаторы пунктов сохраняются при уточнении, не
              переиспользуются для
                другого требования. Путь берётся из карты, родитель определяется по пути исходников.
              - Каждый каталог исходников имеет свой контракт. Предок не
              заменяет ребёнка.
                При редактировании и проверке внутреннего модуля проверь соответствие его
                реализации и контракта назначению и границам предков. Собственный чеклист
                содержит только его пункты; противоречие верхней границе отрази в замечании
                со ссылкой на ограничение предка и доказательства в проверяемом модуле.
                Исправь реализацию или согласованно пересмотри затронутые контракты, если задача
                разрешает такие изменения. Отдельный запрос анализа сохраняет исходники и
                контракты неизменными: необходимые редакции фиксируются в замечаниях.
                Изменения ребёнка, включая его контракт, сами по себе не устаревают собственную
                оценку родителя. Пересмотр верхнего контракта нужен при изменении его обещаний
                или устранении обнаруженного упущения, а не из-за самого факта локальной правки.
                Изменение контекста предка само по себе не инвалидирует локальную проверку ребёнка.
              - В контракте родителя опиши общий результат в purpose, его
              собственные обязанности в
                responsibilities и правила взаимодействия дочерних модулей в boundaries или invariants.
                Конкретную операцию декларирует в своём контракте модуль, который за неё отвечает.
                При переносе операции между детьми контракт родителя меняется только тогда, когда меняется
                его собственная обязанность, обещанный результат или правило взаимодействия.
              - При пересмотре сверь убираемые пункты с контрактами исполнителей
              и сохрани у владельца
                требования, которые до этого были записаны только у предка.
              - Для kind: group без собственного кода укажи, какой результат
              даёт объединение модулей.

              - Для `extensions.archiview.roles` выбирай роли по собственным
              обязанностям модуля.
                `domain` охватывает предметные правила и прикладные сценарии. `app` указывай,
                если модуль объединяет части в приложение и отвечает за него целиком.
                `root` указывай, когда каталог отвечает за состав дерева исходников и границы
                взаимодействия модулей. Если прежняя точка входа в корне указывает на другую роль,
