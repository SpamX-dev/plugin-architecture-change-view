              import z from "@deepseek-ai/schemastery";

              import { defineTool } from "@deepseek-ai/dsh-tools";

              import { ApplicationError } from "../application/errors.js";

              import { resolveChatRoot } from "./chat-root.js";

              import { clientConfigRow, DEFAULT_PREFIX } from
              "./panel-contract.js";

              import { createRouteTable, normalizePrefix } from "./routes.js";

              import { createSessionRegistry } from "./sessions.js";

              import { loadSkill } from "./skill.js";

              import {
                normalizeExtensions,
                readContext,
                readInventory,
                resolveRoot,
                TOOL_DEFINITIONS,
              } from "./tools.js";


              /** Имя Cordis-плагина для диагностики загрузчика. */

              export const name = "archiview";


              /**
