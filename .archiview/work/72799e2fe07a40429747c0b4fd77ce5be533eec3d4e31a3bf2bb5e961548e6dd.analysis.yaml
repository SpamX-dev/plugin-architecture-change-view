            schema_version: 1

            id: archiview-reviews

            title: Ai-report

            kind: module

            extensions:
              archiview.roles: [domain]
            purpose: Регламентировать структуру отчёта агента и связь выводов с
            пунктами контракта и доказательствами из выбранных снимков.

            boundaries:
              B3: Чеклист собственной проверки модуля содержит только пункты его контракта.
              B4: Замечание может ссылаться на границу или инвариант предка из контекста проверки.
              B5: Ссылки на доказательства относятся к зафиксированным входным данным проверки.
