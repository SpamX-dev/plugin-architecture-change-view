      - index: 105
        fact:
          id: sha256:c6f0a57d28aafb04b50042380a411ff658f372224bed09806ef5652a1e68114b
          kind: file
          path: framework/ai-report/schema.ts
          start_line: 1
          end_line: 73
          text: >
            import { fail, string, object, enumeration, nullable, array, shape,
            strings, references, extensions } from "../serialization/schema.js";


            import type { Validator } from "../serialization/schema.js";


            import type { ReviewReport } from "./types.js";


            const hash: Validator = (value, at) => {
              if (typeof value !== "string" || !/^sha256:[a-f0-9]{64}$/.test(value)) fail(at, "ожидается sha256:<64 hex>");
            };

            const version = enumeration(1);

            const side = enumeration("baseline", "current");

            const section = enumeration("purpose", "responsibilities",
            "boundaries", "invariants");

            const relativePath: Validator = (value, at) => {
              string(value, at);
              const v = value as string;
              if (v !== "." && (v.startsWith("/") || /[\\:]/.test(String(v)) ||
                  v.split("/").some((part) => ["", ".", ".."].includes(part)))) fail(at, "нужен путь относительно проекта");
            };

            const timestamp: Validator = (value, at) => {
              string(value, at);
              const v = value as string;
              if (!/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z$/.test(String(v)) || !Number.isFinite(Date.parse(v))) fail(at, "нужно время UTC");
            };

            const evidence = shape({ snapshot: side, fact_id: string });

            const clause = shape({ snapshot: side, module_id: string, section,
            id: string });

            const snapshot = shape({ id: string, digest: hash });

            const observation = shape({ summary: string, responsibilities:
            array(shape({ text: string, evidence: array(evidence, 1) })) });

            const assessment = shape({ verdict: enumeration("consistent",
            "violation", "needs_review", "inconclusive", "not_applicable"),
            summary: string });


            /** Полная схема отчёта; успешные выводы требуют явных
            доказательств. */

            export function validateReview(input: unknown): ReviewReport {
              const value = input as ReviewReport;
              shape({ schema_version: version, id: string,
                module: shape({ id: nullable(string), baseline_path: nullable(relativePath), current_path: nullable(relativePath) }),
                comparison: shape({ baseline: nullable(snapshot), current: snapshot }),
                analysis: shape({ created_at: timestamp, analyzer: shape({ name: string, version: string, config_digest: hash }),
                  input_digest: hash, scope: enumeration("module", "changes"), coverage: shape({
                    status: enumeration("complete", "partial", "unavailable"), limitations: strings }) },
                { model: shape({ provider: string, id: string }, { revision: string, parameters: object }), prompt_digest: hash }),
                observed: shape({ baseline: nullable(observation), current: nullable(observation) }),
                checks: array(shape({ id: string, contract: clause, subject: side,
                  verdict: enumeration("consistent", "violation", "uncertain", "not_checked", "not_applicable"),
                  explanation: string, evidence: array(evidence) })),
                // contract_change читается только для сохранения совместимости с неизменяемой историей.
                findings: array(shape({ id: string, kind: enumeration("boundary_violation", "invariant_violation",
                  "undeclared_responsibility", "responsibility_gap", "contract_conflict", "contract_change", "missing_contract"),
                  certainty: enumeration("confirmed", "suspected"), severity: enumeration("info", "warning", "error"),
                  lifecycle: enumeration("introduced", "persisting", "resolved", "unknown"), summary: string,
                  clauses: array(clause), evidence: array(evidence, 1) },
                { details: string, recommendation: string, related_modules: strings })),
                assessment: shape({ current: assessment, change: assessment }) }, { references, extensions })(value, "review");
              if (value.module.baseline_path === null && value.module.current_path === null) fail("review.module", "оба пути отсутствуют");
              for (const s of ["baseline", "current"] as const) {
                if ((value.module[`${s}_path`] === null) !== (value.observed[s] === null)) fail("review.observed." + s, "не совпадает с наличием модуля");
              }
              if (value.comparison.baseline === null) {
                if (value.module.baseline_path !== null || value.assessment.change.verdict !== "not_applicable")
                  fail("review.comparison", "первый анализ не имеет базы и оценки изменения");
                const fromBaseline = (ref: { snapshot: string }) => ref.snapshot === "baseline";
                if (value.checks.some(check => check.subject === "baseline" || fromBaseline(check.contract) || check.evidence.some(fromBaseline)) ||
                    value.findings.some(finding => finding.clauses.some(fromBaseline) || finding.evidence.some(fromBaseline)) ||
                    value.observed.current?.responsibilities.some(item => item.evidence.some(fromBaseline)))
                  fail("review.comparison", "ссылка на отсутствующий базовый снимок");
              }
              if (Boolean(value.analysis.model) !== Boolean(value.analysis.prompt_digest)) fail("review.analysis", "model и prompt_digest нужны вместе");
              if (value.analysis.coverage.status !== "complete" && !value.analysis.coverage.limitations.length) fail("review.analysis.coverage", "укажите ограничения анализа");
              for (const key of ["checks", "findings"] as const) {
                if (new Set(value[key].map((item) => item.id)).size !== value[key].length) fail("review." + key, "повторяющийся id");
              }
              for (const check of value.checks) if (["consistent", "violation"].includes(check.verdict) && !check.evidence.length) fail("review.checks." + check.id, "нужны доказательства");
              return value;
            }
      - index: 106
        fact:
          id: sha256:8db79057bcc6cdbe66f642d4cff0bb37bb3518d9ae757b393e951203a081b01c
          kind: file
          path: framework/ai-report/types.ts
          start_line: 1
          end_line: 157
          text: >
            import type { ReviewSection } from "../contracts/types.js";

            import type { Snapshot, SnapshotReference } from
            "../snapshots/types.js";


            export const analysisTypes = ["grasp", "implementation"] as const;

            export type AnalysisType = typeof analysisTypes[number];

            export function isAnalysisType(value: unknown): value is
            AnalysisType {
              return analysisTypes.some(type => type === value);
            }


            export interface GraspParticipant { moduleId: string; role:
            "executor" | "utility"; task: string; assessment: string;
            consumers?: string[] }

            export function graspParticipants(report: Pick<ReviewReport,
            "extensions">): GraspParticipant[] {
              const value = report.extensions?.["archiview.grasp"];
              if (!Array.isArray(value)) return [];
              return value;
            }


            export interface FindingDisposition { status: "open" | "accepted" |
            "resolved"; decision: string }

            export function validDisposition(value: unknown): value is
            FindingDisposition {
              if (!value || typeof value !== "object") return false;
              const item = value as FindingDisposition;
              return Object.keys(item).every(key => key === "status" || key === "decision") &&
                ["open", "accepted", "resolved"].includes(item.status) && typeof item.decision === "string";
            }

            export const openFinding: FindingDisposition = {status: "open",
            decision: ""};


            export type Side = "baseline" | "current";


            export type AssessmentSide = "current" | "change";


            export interface ClauseReference {
              snapshot: Side;
              module_id: string;
              section: ReviewSection;
              id: string;
            }


            export interface ClauseInput {
              reference: ClauseReference;
              text: string;
            }


            export interface EvidenceReference {
              snapshot: Side;
              fact_id: string;
            }


            export interface Analyzer {
              name: string;
              version: string;
              config_digest: string;
            }


            export interface FreshnessReason {
              code: string;
              side?: string;
              potential_influence?: { scope: string; module_id?: string; path?: string }[];
            }


            export interface Coverage {
              status: string;
              limitations: string[];
              reasons?: FreshnessReason[];
            }


            export interface Model {
              provider: string;
              id: string;
              revision?: string;
              parameters?: Record<string, unknown>;
            }


            export interface ReviewManifest {
              schema_version: number;
              comparison: Record<Side, SnapshotReference | null>;
              module: {
                id: string | null;
                baseline_path: string | null;
                current_path: string | null;
              };
              analyzer: Analyzer;
              scope: string;
              contract_scope?: string;
              clause_format?: "purpose";
              contracts: Record<Side, ClauseInput[]>;
              instructions: string;
              context: Record<string, unknown>;
              model?: Model;
              prompt_digest?: string;
              review_scope?: string;
              analysis_type?: AnalysisType;
              source_snapshot?: SnapshotReference;
              source_head?: string | null;
              source_captured_at?: string;
            }


            export interface Observation {
              summary: string;
              responsibilities: { text: string; evidence: EvidenceReference[] }[];
            }


            export interface ClauseCheck {
              id: string;
              contract: ClauseReference;
              subject: Side;
              verdict: string;
              explanation: string;
              evidence: EvidenceReference[];
            }


            export interface Finding {
              id: string;
              kind: string;
              certainty: string;
              severity: string;
              lifecycle: string;
              summary: string;
              clauses: ClauseReference[];
              evidence: EvidenceReference[];
              details?: string;
              recommendation?: string;
              related_modules?: string[];
            }


            export interface Assessment {
              verdict: string;
              summary: string;
            }


            export interface ReviewReport {
              schema_version: number;
              id: string;
              module: ReviewManifest["module"];
              comparison: ReviewManifest["comparison"];
              analysis: {
                created_at: string;
                analyzer: Analyzer;
                input_digest: string;
                scope: string;
                coverage: Coverage;
                model?: Model;
                prompt_digest?: string;
              };
              observed: Record<Side, Observation | null>;
              checks: ClauseCheck[];
              findings: Finding[];
              assessment: Record<AssessmentSide, Assessment>;
              references?: { title: string; uri: string }[];
              extensions?: Record<string, unknown>;
            }


            export interface ReviewBundle {
              report: ReviewReport;
              manifest: ReviewManifest;
              baseline: Snapshot | null;
              current: Snapshot;
            }
