          text: >
            import type { SnapshotData, SnapshotModule, Snapshot,
            ComparisonModule } from "../snapshots/types.js";

            import type {
              Side, ReviewBundle, ReviewReport, ReviewManifest, ClauseReference, ClauseInput,
              ClauseCheck, Finding, EvidenceReference,
            } from "./types.js";

            /**
             * Проверка структуры и связи отчёта со снимками. Не выводит семантику кода:
             * пункты ответственности получают not_checked, а наблюдения — явное ограничение.
             * Полноценный внешний анализ использует тот же формат и сохранённые доказательства.
             */
            import { clauseEntries, type ReviewSection } from
            "../contracts/types.js";

            import { randomUUID } from "node:crypto";

            import path from "node:path";

            import { canonical, digest } from "../serialization/digest.js";

            import { validateReview } from "./schema.js";

            import { snapshotDigest } from "../snapshots/identity.js";


            /** Версия включает алгоритм структурной проверки; настройки
            участвуют в manifest. */

            export const ANALYZER = { name: "archiview-structure", version:
            "1.1.0",
              config_digest: digest({ semantic: false, inherited: ["boundaries", "invariants"] }) };

            /** Точная ссылка на сохранённое содержание, независимо от
            пользовательской метки. */

            export const snapshotReference = (snapshot: Snapshot | null |
            undefined) => snapshot ?
              { id: snapshot.id, digest: snapshot.digest ?? snapshotDigest(snapshot) } : null;

            /**
             * Собственная проверка содержит только локальный контракт. Режим effective
             * нужен для проверки целостности прежних неизменяемых отчётов с пунктами предков.
             */
            export function effectiveClauses(snapshot: SnapshotData | null,
            directory: string | null | undefined, side: Side, contractScope =
            "effective", clauseFormat: "purpose" | "legacy" = "purpose"):
            ClauseInput[] {
              if (!["own", "effective"].includes(contractScope)) throw new Error("Unsupported contract scope");
              if (!snapshot || directory == null) return [];
              const parents = new Set([directory]);
              let parent = directory;
              while (contractScope === "effective" && parent !== ".") { parent = path.posix.dirname(parent); parents.add(parent); }
              const local: ReviewSection = clauseFormat === "legacy" ? "responsibilities" : "purpose";
              return snapshot.modules.filter((m) => parents.has(m.directory) && m.document.state === "documented" && m.document.contract)
                .flatMap((m) => ([local, "boundaries", "invariants"] as const)
                  .filter((section) => section !== local || m.directory === directory)
                  .flatMap((section) => Object.entries(clauseEntries(m.document.contract!, section)).map(([id, text]) => ({
                    reference: { snapshot: side, module_id: m.document.contract!.id, section, id }, text,
                  }))));
            }


            type ReviewedModule = Pick<ComparisonModule, "moduleId" |
            "baselinePath" | "currentPath" | "before" | "after">;


            /** Манифест отделяет собственный чеклист от сохранённого контекста
            предков. */

            export function reviewManifest(before: Snapshot | null, after:
            Snapshot, module: ReviewedModule, analyzer = ANALYZER, contractScope
            = "own"): ReviewManifest {
              return { schema_version: 1, comparison: { baseline: snapshotReference(before), current: snapshotReference(after) },
                module: { id: module.moduleId ?? null, baseline_path: module.baselinePath ?? null, current_path: module.currentPath ?? null },
                analyzer, scope: "module", clause_format: "purpose", ...(contractScope === "own" ? { contract_scope: "own" } : {}), contracts: {
                  baseline: effectiveClauses(before, module.baselinePath, "baseline", contractScope),
                  current: effectiveClauses(after, module.currentPath, "current", contractScope),
                }, instructions: "Проверять структуру контрактов; смысл кода не анализировать.", context: {} };
            }


            /**
             * База и текущее состояние проверяются отдельно. Повторная проверка текущего
             * кода по базовому пункту нужна лишь при изменении или удалении этого пункта;
             * старый формат сохраняет первоначальные требования к набору проверок.
             */
            export function requiredClauseChecks(manifest: ReviewManifest,
            hasCurrent: boolean) {
              const baseline = manifest.contracts?.baseline ?? [];
              const current = manifest.contracts?.current ?? [];
              const previousRequirements = manifest.contract_scope === "own" ? baseline.filter((item) =>
                !current.some((other) => other.reference.module_id === item.reference.module_id &&
                  other.reference.section === item.reference.section && other.reference.id === item.reference.id && other.text === item.text)) : baseline;
              return [...baseline.map((item) => ({ item, subject: "baseline" as const })),
                ...current.map((item) => ({ item, subject: "current" as const })),
                ...(hasCurrent ? previousRequirements.map((item) => ({ item, subject: "current" as const })) : [])];
            }


            /** Новый локальный чеклист не может расширяться пунктами чужого
            контракта. */

            export function validateContractScope(report: ReviewReport,
            manifest: ReviewManifest,
              snapshots?: { baseline: SnapshotData | null; current: SnapshotData }) {
              if (manifest.clause_format !== undefined && manifest.clause_format !== "purpose") throw new Error("Unsupported clause format");
              for (const side of ["baseline", "current"] as const) {
                const owner = snapshots?.[side]?.modules.find(m => m.directory === report.module[`${side}_path`]);
                const contract = owner?.document.contract;
                if (!contract) continue;
                if (!manifest.clause_format && !contract.responsibilities) throw new Error("Current contracts require purpose clause format");
                if (manifest.clause_format && !contract.purpose && report.analysis.coverage.status === "complete")
                  throw new Error("Complete review requires a declared purpose: " + side);
              }
              if (manifest.clause_format && report.findings.some(f => f.clauses.some(ref => ref.section === "responsibilities")))
                throw new Error("A new finding must reference purpose, boundaries or invariants");
              const scope = manifest.contract_scope ?? "effective";
              if (!["own", "effective"].includes(scope)) throw new Error("Unsupported contract scope");
              if (scope === "own" && report.checks.some((check) => check.contract.module_id !== report.module.id))
                throw new Error("Own review checks must reference the module contract");
              const clauses = new Set([...manifest.contracts.baseline, ...manifest.contracts.current].map((item) => canonical(item.reference)));
              if (report.checks.some((check) => !clauses.has(canonical(check.contract))))
                throw new Error("Review check references a clause outside the manifest");
              const localConstraint = (clause: ClauseReference) => {
                if (clause.module_id === report.module.id) return true;
                if (!["boundaries", "invariants"].includes(clause.section)) return false;
                const directory = report.module[`${clause.snapshot}_path`];
                const ancestor = snapshots?.[clause.snapshot]?.modules.find((module) =>
                  module.document.state === "documented" && module.document.contract?.id === clause.module_id);
                return Boolean(directory && ancestor && ancestor.directory !== directory &&
                  (ancestor.directory === "." || directory.startsWith(ancestor.directory + "/")));
              };
              if (scope === "own" && report.findings.some((finding) => finding.clauses.length &&
                !finding.clauses.some(localConstraint)))
                throw new Error("Own review finding must reference the module contract or an ancestor boundary");
              return scope;
            }


            /** Формирует честный частичный отчёт без подмены анализа наличием
            документов. */

            export function createStructuralReview(before: Snapshot | null,
            after: Snapshot, module: ReviewedModule, { contractScope = "own" }:
            {contractScope?:string} = {}): ReviewBundle {
              const manifest = reviewManifest(before, after, module, ANALYZER, contractScope);
              const limitations = ["Семантика кода не анализировалась. Соответствие назначению, границам и инвариантам требует отдельного анализа.",
                ...before?.evidenceLimitations ?? [], ...after.evidenceLimitations ?? []];
              const findings: Finding[] = [];
              const checks: ClauseCheck[] = [];
              const fact = (snapshot: Snapshot | null, side: Side, kind: string, file: string): EvidenceReference[] => (snapshot?.facts ?? [])
                .filter((f) => f.kind === kind && f.path === file).map((f) => ({ snapshot: side, fact_id: f.id }));
              for (const [snapshot, side, entry] of ([[before, "baseline", module.before], [after, "current", module.after]] as const)) {
                if (!entry) continue;
                if (entry.document.contract && !entry.document.contract.purpose)
                  limitations.push(side + ": в сохранённом контракте отсутствует назначение модуля.");
                if (!entry.document.contract || entry.document.state !== "documented") {
                  const evidence = fact(snapshot, side, "module", entry.directory);
                  const migrated = side === "baseline" && entry.document.state !== "invalid" && module.after?.document.state === "documented" && module.after.document.contract;
                  if (migrated) evidence.push(...fact(after, "current", "module", module.after!.directory));
                  if (evidence.length) findings.push({ id: "contract-" + side,
                    kind: entry.document.state === "invalid" ? "contract_conflict" : "missing_contract",
                    certainty: "confirmed", severity: migrated ? "info" : "warning", lifecycle: migrated ? "resolved" : "unknown",
                    summary: (side === "baseline" ? "В базовом снимке: " : "") + (entry.document.state === "invalid" ? "контракт не соответствует схеме v1." :
                      "нет действующего контракта модуля."),
                    details: migrated ? "В текущем снимке появился контракт модуля. Соответствие кода его пунктам требует проверки." :
                      entry.document.errors?.join("\n") ?? "Проверьте запись модуля в .archiview/modules.tree и его YAML-контракт.",
                    clauses: [], evidence });
                  else limitations.push(side + ": снимок прежнего формата не содержит фактов о модуле.");
                }
              }
              for (const { item, subject } of requiredClauseChecks(manifest, Boolean(module.after))) {
                checks.push({ id: "check-" + (checks.length + 1), contract: item.reference,
                  subject, verdict: "not_checked", explanation: "Структурный анализ не определяет соответствие кода этому пункту.", evidence: [] });
              }
              const observed = (entry: SnapshotModule | null | undefined) => entry ? { summary: "Обнаружено собственных исходных файлов: " + entry.sourceFiles +
                ". Ответственность из кода не выводилась.", responsibilities: [] } : null;
              const report: ReviewReport = { schema_version: 1, id: "review-" + randomUUID(), module: manifest.module,
                comparison: manifest.comparison,
                analysis: { created_at: new Date().toISOString(), analyzer: ANALYZER,
                  input_digest: digest(manifest), scope: "module", coverage: { status: "partial", limitations } },
                observed: { baseline: observed(module.before), current: observed(module.after) }, checks, findings,
                assessment: {
                  current: { verdict: !module.after ? "not_applicable" : findings.some((f) => f.id === "contract-current") ? "needs_review" : "inconclusive",
                    summary: !module.after ? "Модуль отсутствует в текущем снимке." : "Структура проверена; соответствие кода контракту не установлено." },
                  change: { verdict: !before ? "not_applicable" : "inconclusive",
                    summary: !before ? "Первый анализ без базового снимка." : "Изменения файлов зафиксированы; оценка ответственности требует анализа кода." },
                } };
              validateReviewBundle({ report, manifest, baseline: before, current: after });
              return { report, manifest, baseline: before, current: after };
            }


            /** Проверяет происхождение отчёта: хеши, пути, пункты контрактов и
            каждый факт. */

            export function validateReviewBundle(bundle: ReviewBundle) {
              const { report, manifest, baseline, current } = bundle;
              validateReview(report);
              if (!manifest || digest(manifest) !== report.analysis.input_digest) throw new Error("Review input digest mismatch");
              validateContractScope(report, manifest, bundle);
              if (digest(manifest.comparison) !== digest(report.comparison) || digest(manifest.module) !== digest(report.module) ||
                  digest(manifest.analyzer) !== digest(report.analysis.analyzer) || manifest.scope !== report.analysis.scope) throw new Error("Review manifest mismatch");
              if (report.analysis.model && (digest(manifest.model) !== digest(report.analysis.model) || manifest.prompt_digest !== report.analysis.prompt_digest)) throw new Error("Review model inputs mismatch");
              if (!current || (baseline && baseline.root !== current.root)) throw new Error("Foreign review snapshot");
              for (const [side, snapshot] of ([["baseline", baseline], ["current", current]] as const)) {
                const reference = report.comparison[side];
                if ((snapshot == null) !== (reference === null)) throw new Error("Missing " + side + " snapshot");
                if (snapshot && (snapshot.id !== reference?.id || snapshotDigest(snapshot) !== reference?.digest)) throw new Error("Review snapshot digest mismatch: " + side);
                const directory = report.module[`${side}_path`];
                const module = snapshot?.modules.find((m) => m.directory === directory);
                if (directory !== null && !module) throw new Error("Review module path is missing: " + side);
                if (module?.document.contract && report.module.id !== null && module.document.contract.id !== report.module.id) throw new Error("Review module identity mismatch");
                if (digest(manifest.contracts?.[side]) !== digest(effectiveClauses(snapshot, directory, side,
                  manifest.contract_scope ?? "effective", manifest.clause_format ?? "legacy"))) throw new Error("Effective contracts mismatch: " + side);
              }
              const resolveClause = (ref: ClauseReference) => {
                const snapshot = ref.snapshot === "baseline" ? baseline : current;
                const matches = snapshot?.modules.filter((m) => m.document.state === "documented" && m.document.contract?.id === ref.module_id) ?? [];
                if (matches.length !== 1 || !Object.hasOwn(clauseEntries(matches[0].document.contract!, ref.section), ref.id)) throw new Error("Unresolved contract clause: " + ref.module_id + "/" + ref.id);
              };
              const resolveEvidence = (ref: EvidenceReference) => {
                const snapshot = ref.snapshot === "baseline" ? baseline : current;
                const matches = snapshot?.facts?.filter((f) => f.id === ref.fact_id) ?? [];
                if (matches.length !== 1 || typeof matches[0].text !== "string") throw new Error("Unresolved evidence: " + ref.fact_id);
                const { id, ...fact } = matches[0];
                if (digest(fact) !== id) throw new Error("Evidence content digest mismatch");
              };
              for (const check of report.checks) {
                resolveClause(check.contract);
                if (report.module[`${check.subject}_path`] === null) throw new Error("Check subject is absent");
                check.evidence.forEach(resolveEvidence);
              }
              for (const finding of report.findings) { finding.clauses.forEach(resolveClause); finding.evidence.forEach(resolveEvidence); }
              for (const observed of Object.values(report.observed)) observed?.responsibilities.forEach((r) => r.evidence.forEach(resolveEvidence));
              for (const { item, subject } of requiredClauseChecks(manifest, report.module.current_path !== null)) {
                if (!report.checks.some((c) => c.subject === subject && digest(c.contract) === digest(item.reference))) throw new Error("Missing explicit clause check: " + item.reference.id);
              }
              return bundle;
            }
      - index: 111
        fact:
          id: sha256:8829e6dc65cb42ec3104b6cf15cc998c2f581588f758b49e377d5604cf569233
          kind: file
          path: src/reviews/schema.ts
          start_line: 1
          end_line: 63
          text: >
            import { fail, string, object, enumeration, nullable, array, shape,
            strings, references, extensions } from "../serialization/schema.js";


            import type { Validator } from "../serialization/schema.js";


            import type { ReviewReport } from "./types.js";


            const hash: Validator = (v, at) =>
            /^sha256:[a-f0-9]{64}$/.test(String(v)) ? undefined : fail(at,
            "ожидается sha256:<64 hex>");

            const version = enumeration(1);

            const side = enumeration("baseline", "current");

            const section = enumeration("purpose", "responsibilities",
            "boundaries", "invariants");

            const relativePath: Validator = (value, at) => {
              string(value, at);
              const v = value as string;
              if (v !== "." && (v.startsWith("/") || /[\\:]/.test(String(v)) ||
                  v.split("/").some((part) => ["", ".", ".."].includes(part)))) fail(at, "нужен путь относительно проекта");
            };

            const timestamp: Validator = (value, at) => {
              string(value, at);
              const v = value as string;
              if (!/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z$/.test(String(v)) || !Number.isFinite(Date.parse(v))) fail(at, "нужно время UTC");
            };

            const evidence = shape({ snapshot: side, fact_id: string });

            const clause = shape({ snapshot: side, module_id: string, section,
            id: string });

            const snapshot = shape({ id: string, digest: hash });

            const observation = shape({ summary: string, responsibilities:
            array(shape({ text: string, evidence: array(evidence, 1) })) });

            const assessment = shape({ verdict: enumeration("consistent",
            "violation", "needs_review", "inconclusive", "not_applicable"),
            summary: string });


            /** Полная схема отчёта; успешные выводы требуют явных
            доказательств. */

            export function validateReview(input: unknown): ReviewReport {
              const value = input as ReviewReport;
              shape({ schema_version: version, id: string,
                module: shape({ id: nullable(string), baseline_path: nullable(relativePath), current_path: nullable(relativePath) }),
                comparison: shape({ baseline: nullable(snapshot), current: snapshot }),
                analysis: shape({ created_at: timestamp, analyzer: shape({ name: string, version: string, config_digest: hash }),
                  input_digest: hash, scope: enumeration("module", "changes"), coverage: shape({
                    status: enumeration("complete", "partial", "unavailable"), limitations: strings }) },
                { model: shape({ provider: string, id: string }, { revision: string, parameters: object }), prompt_digest: hash }),
                observed: shape({ baseline: nullable(observation), current: nullable(observation) }),
                checks: array(shape({ id: string, contract: clause, subject: side,
                  verdict: enumeration("consistent", "violation", "uncertain", "not_checked", "not_applicable"),
                  explanation: string, evidence: array(evidence) })),
                // contract_change читается только для сохранения совместимости с неизменяемой историей.
                findings: array(shape({ id: string, kind: enumeration("boundary_violation", "invariant_violation",
                  "undeclared_responsibility", "responsibility_gap", "contract_conflict", "contract_change", "missing_contract"),
                  certainty: enumeration("confirmed", "suspected"), severity: enumeration("info", "warning", "error"),
                  lifecycle: enumeration("introduced", "persisting", "resolved", "unknown"), summary: string,
                  clauses: array(clause), evidence: array(evidence, 1) },
                { details: string, recommendation: string, related_modules: strings })),
                assessment: shape({ current: assessment, change: assessment }) }, { references, extensions })(value, "review");
              if (value.module.baseline_path === null && value.module.current_path === null) fail("review.module", "оба пути отсутствуют");
              for (const s of ["baseline", "current"] as const) {
                if ((value.module[`${s}_path`] === null) !== (value.observed[s] === null)) fail("review.observed." + s, "не совпадает с наличием модуля");
              }
              if (value.comparison.baseline === null && (value.module.baseline_path !== null || value.assessment.change.verdict !== "not_applicable")) fail("review.comparison", "первый анализ не имеет базы и оценки изменения");
              if (Boolean(value.analysis.model) !== Boolean(value.analysis.prompt_digest)) fail("review.analysis", "model и prompt_digest нужны вместе");
              if (value.analysis.coverage.status !== "complete" && !value.analysis.coverage.limitations.length) fail("review.analysis.coverage", "укажите ограничения анализа");
              for (const key of ["checks", "findings"] as const) {
                if (new Set(value[key].map((item) => item.id)).size !== value[key].length) fail("review." + key, "повторяющийся id");
              }
              for (const check of value.checks) if (["consistent", "violation"].includes(check.verdict) && !check.evidence.length) fail("review.checks." + check.id, "нужны доказательства");
              return value;
            }
      - index: 112
        fact:
          id: sha256:f5860bde94e76f2588e8f1415fd378bcce63ceace6d00342816f2d2366e2e898
          kind: file
