            id: archiview-reviews

            title: Содержимое архитектурной проверки

            kind: module

            purpose: Описывать проверку по контрактам и доказательствам
            выбранных снимков и проверять её целостность.

            responsibilities:
              R1: Определять состав манифеста, проверяемые пункты и структуру результата.
              R2: Проверять ссылки отчёта на сохранённые факты и пункты, формировать явно структурную оценку.
            boundaries:
              B1: Публикация попыток, уплотнение и расчёт актуальности выполняются вне этого модуля.
            invariants:
