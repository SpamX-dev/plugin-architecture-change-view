              return contentDigest({ root: snapshot.root, modules: snapshot.modules,
                facts: snapshot.facts ?? [], complete: snapshot.complete,
                diagnostics: snapshot.diagnostics, evidenceLimitations: snapshot.evidenceLimitations ?? [] });
