            import type { Validator } from "../serialization/schema.js";


            import type { ReviewReport } from "./types.js";


            const hash: Validator = (v, at) =>
            /^sha256:[a-f0-9]{64}$/.test(String(v)) ? undefined : fail(at,
            "ожидается sha256:<64 hex>");

