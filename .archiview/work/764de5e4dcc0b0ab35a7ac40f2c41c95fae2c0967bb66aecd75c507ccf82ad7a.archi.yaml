          responsibilities:
            R1: Публиковать канонический скилл module-boundaries из пакета ArchiView как
              ресурс MCP.
            R3: Давать агенту инвентаризацию каталогов проекта.
            R4: Предоставлять цепочку действующих контрактов по указанному пути.
            R2: При включении панели предоставлять её ресурс и инструменты в той же
              MCP-сессии.
          boundaries:
            B1: Принимать запросы чтения контрактов только с допустимыми аргументами и в
              пределах выбранного проекта.
            B3: Регистрировать операции панели только при явном запуске с параметром
              --panel.
          invariants: {}
        document_state: documented
      - module_id: archiview-node-runtime
        directory: src/runtime
        contract:
          id: archiview-node-runtime
          kind: module
          purpose: Находить ресурсы действующего пакета ArchiView и предоставлять
            диагностику ошибок Node.
          responsibilities:
            R1: Определять расположение ресурсов и команду запуска CLI для исходной и
              автономной поставки.
            R2: Приводить ошибки Node к общему виду с сохранением доступных диагностических
              полей.
          boundaries:
            B2: При поиске ресурсов использовать пакет запущенного ArchiView независимо от
