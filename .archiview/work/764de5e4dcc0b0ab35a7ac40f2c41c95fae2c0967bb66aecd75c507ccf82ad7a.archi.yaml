        contract:
          id: archiview-http
          kind: module
          purpose: Предоставлять локальный HTTP-интерфейс для дерева модулей, контрактов и
            проверок выбранной пары снимков.
          responsibilities:
            R1: Обслуживать клиентское приложение и API сравнения, деталей модуля и истории
              проверок.
            R2: По явному действию пользователя сохранять снимок или структурную проверку;
              импортировать проверенный пакет внешнего анализа через CLI.
          boundaries:
            B1: Сбор структуры, принадлежность файлов и статусы вычисляются общей моделью
              снимков.
            B2: Схемы, доказательства и хранение результатов принадлежат общей модели;
              отрисовка — web/archiview.
          invariants:
            I1: Сервер слушает только loopback и не выдаёт произвольные файлы.
            I2: Просмотр не изменяет исходники; новая сохранённая база не меняет выбор
              пользователя.
            I3: Дерево, документ и проверка привязаны к точным снимкам, включая удалённые
              модули.
