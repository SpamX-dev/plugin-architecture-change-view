                  for (let attempt = 0; ; attempt++) {
                    try { await link(ownerFile, lock); break; }
                    catch (error) {
                      if (error.code !== "EEXIST") throw error;
                      const info = await lstat(lock).catch((error) => { if (error.code !== "ENOENT") throw error; return null; });
