    children:
      - module_id: archiview-application
        directory: src/application
        contract:
          id: archiview-application
          kind: module
          purpose: Вести сессию одного проекта и выполнять сценарии выбора сравнения,
            просмотра его истории и подготовки анализа для всех клиентов
            ArchiView.
          responsibilities:
            R1: Управлять выбранной папкой проекта, рабочей сессией, сравнениями и
              ограниченным кешем представлений.
            R2: Формировать дерево, детали модулей и хронологию через общую модель снимков и
              отчётов; предоставлять расположение сохранённого анализа
              относительно текущего корня проекта.
            R3: Подготавливать анализ выбранного снимка, сохранять базы и обслуживать импорт
              результатов.
            R4: Направлять операции панели из общей рабочей папки в сессию выбранного
              репозитория.
          boundaries:
            B1: Не зависит от HTTP, MCP, Codex или DOM; получает аргументы и возвращает
              данные либо прикладную ошибку.
            B2: Схемы, доказательства, сбор исходников и хранение неизменяемых результатов
              принадлежат общей модели.
          invariants:
            I1: Сессия привязана к одному корню; каталог установки не выбирается вместо
              проекта автоматически.
            I2: Исторический просмотр не заменяет опубликованное текущее состояние и не
              перечитывает изменённый код вместо выбранного снимка.
            I3: Подготовка и передача запроса анализа не считаются завершённой
              содержательной проверкой.
            I4: История, снимки и запросы анализа каждого репозитория принадлежат его
              собственной сессии и хранилищу.
            I5: Сохранённое представление показывает опубликованную пару и её
              доказательства; открытие представления не наблюдает и не публикует
              рабочее дерево.
        document_state: documented
      - module_id: archiview-codex
        directory: src/codex
        contract:
          id: archiview-codex
          kind: module
          purpose: Открывать существующее веб-приложение ArchiView как локальное MCP App в
            Codex.
          responsibilities:
            R1: Предоставлять общему MCP-серверу ресурс панели и обработчики её
              инструментов. Точка открытия панели привязана к боковой вкладке
              чата.
            R2: Скрывать операции UI от модели через visibility app; передавать данные и
              ошибки просмотра только в метаданных результата.
            R3: Автоматически привязывать экземпляр к выбранной рабочей папке чата Codex;
              отличать отсутствие папки от недоступности контекста и запрещать
              просмотр вне проектов.
            R4: Подключать встроенную панель к Codex через MCP Apps и вызывать инструменты
              хоста для определения и выбора проекта.
          boundaries:
            B1: Вычисления и подготовка анализа принадлежат application; MCP-адаптер
              проверяет аргументы и вызывает сервис напрямую.
            B2: Адаптер использует MCP Apps для UI и предоставленный хостом канал Codex App
              Tools только для чтения метаданных текущего чата и рабочих папок;
              не читает внутренние базы и файлы стенограмм Codex.
          invariants:
            I1: Один процесс обслуживает один фиксированный корень; адаптер не открывает
              HTTP-порт и не требует сертификатов.
            I2: Отключение MCP-клиента завершает сессию и запрещает новые операции.
            I3: UI подключается к хосту до чтения дерева проекта; навигация не отправляет
              сообщения агенту и не обновляет контекст модели.
            I7: Выбор опубликованного сравнения и чтение его карточек доступны во время
              фоновой проверки другого репозитория и учитывают выбранную рабочую
              папку.
            I4: Автоматическое получение папки не вызывает модель. Отсутствие привязки
              ArchiView не означает отсутствие рабочей папки чата; неизвестный
              контекст не выдаётся за отсутствие проекта.
            I5: Отсутствие истории чата или временная недоступность его контекста не
              блокируют загрузку UI; исходный cwd MCP сохраняет рабочую папку
              чата и проверяется по каталогу папок хоста.
            I6: При неизвестной папке панель предлагает ручной ввод; в Windows нативный
              диалог открывается только явной кнопкой пользователя.
              Подтверждённое отсутствие проекта не обходится этой формой.
        document_state: documented
      - module_id: archiview-contracts
        directory: src/contracts
        contract:
          id: archiview-contracts
          kind: module
          purpose: Читать декларации ответственности и находить каталоги исходников,
