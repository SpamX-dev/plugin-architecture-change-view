    children:
      - module_id: archiview-application
        directory: src/application
        contract:
          id: archiview-application
          kind: module
          purpose: Предоставлять операции просмотра и анализа одного проекта независимо от
            транспорта и клиента.
          responsibilities:
            R1: Управлять выбранной папкой проекта, рабочей сессией, сравнениями и
              ограниченным кешем представлений.
            R2: Формировать дерево, детали модулей и хронологию через общую модель снимков и
              отчётов; предоставлять расположение сохранённого анализа
              относительно текущего корня проекта.
            R3: Подготавливать анализ выбранного снимка, сохранять базы и обслуживать импорт
              результатов.
          boundaries:
            B1: Не зависит от HTTP, MCP, Codex или DOM; получает аргументы и возвращает
              данные либо прикладную ошибку.
            B2: Схемы, доказательства, сбор исходников и хранение неизменяемых результатов
              принадлежат общей модели.
          invariants:
            I1: Сессия привязана к одному корню; каталог установки не выбирается вместо
              проекта автоматически.
            I2: Исторический просмотр не заменяет опубликованное текущее состояние и не
              перечитывает изменённый код вместо выбранного снимка.
            I3: Подготовка и передача запроса анализа не считаются завершённой
              содержательной проверкой.
        document_state: documented
      - module_id: archiview-codex
        directory: src/codex
        contract:
          id: archiview-codex
          kind: module
          purpose: Открывать существующее веб-приложение ArchiView как локальное MCP App в
            Codex.
          responsibilities:
            R1: Регистрировать UI-ресурс, открытие панели в боковой вкладке чата и явные
              операции прикладного сервиса для UI; не добавлять глобальную точку
              открытия отдельного окна.
            R2: Скрывать операции UI от модели через visibility app; передавать данные и
              ошибки просмотра только в метаданных результата.
            R3: Автоматически привязывать экземпляр к выбранной рабочей папке чата Codex;
              отличать отсутствие папки от недоступности контекста и запрещать
              просмотр вне проектов.
          boundaries:
            B1: Вычисления и подготовка анализа принадлежат application; MCP-адаптер
              проверяет аргументы и вызывает сервис напрямую.
            B2: Адаптер использует MCP Apps для UI и предоставленный хостом канал Codex App
              Tools только для чтения метаданных текущего чата и рабочих папок;
              не читает внутренние базы и файлы стенограмм Codex.
          invariants:
            I1: Один процесс обслуживает один фиксированный корень; адаптер не открывает
              HTTP-порт и не требует сертификатов.
            I2: Отключение MCP-клиента завершает сессию и запрещает новые операции.
            I3: UI подключается к хосту до чтения дерева проекта; навигация не отправляет
              сообщения агенту и не обновляет контекст модели.
            I4: Автоматическое получение папки не вызывает модель. Отсутствие привязки
              ArchiView не означает отсутствие рабочей папки чата; неизвестный
              контекст не выдаётся за отсутствие проекта.
            I5: Отсутствие истории чата или временная недоступность его контекста не
              блокируют загрузку UI; исходный cwd MCP сохраняет рабочую папку
              чата и проверяется по каталогу папок хоста.
            I6: При неизвестной папке панель предлагает ручной ввод; в Windows нативный
              диалог открывается только явной кнопкой пользователя.
              Подтверждённое отсутствие проекта не обходится этой формой.
        document_state: documented
      - module_id: archiview-contracts
        directory: src/contracts
        contract:
          id: archiview-contracts
          kind: module
          purpose: Читать декларации ответственности и находить каталоги исходников,
            которым нужен контракт.
          responsibilities:
            R1: Проверять структуру arch.yaml и сохранять состояние отсутствующих,
              повреждённых и прежних описаний.
            R2: Находить исходники проекта и предоставлять инвентаризацию каталогов и
              цепочки родительских контрактов.
          boundaries:
            B1: Предметные выводы по реализации и публикация отчётов принадлежат другим
              модулям.
          invariants:
            I1: Пути чтения ограничены выбранным проектом, при неполном обходе возвращается
              диагностика.
            I2: Наличие документа подтверждает только его структурное состояние.
        document_state: documented
      - module_id: archiview-http
        directory: src/archiview
        contract:
          id: archiview-http
          kind: module
          purpose: Предоставлять самостоятельные HTTP и CLI адаптеры к прикладному сервису
            ArchiView.
          responsibilities:
            R1: Обслуживать клиентское приложение и API сравнения, деталей модуля и истории
              проверок.
            R2: Преобразовывать HTTP-запросы в вызовы сервиса, а прикладные ошибки — в
              ответы транспорта.
            R3: Предоставлять команды CLI для экспорта, импорта и проверки переносимых
              результатов.
          boundaries:
            B1: Операции просмотра, хронология и подготовка анализа принадлежат application;
              адаптер не дублирует их реализацию.
            B2: Схемы, доказательства и хранение результатов принадлежат общей модели;
              отрисовка — web/archiview.
          invariants:
            I1: Сервер слушает только loopback и не выдаёт произвольные файлы.
            I2: Просмотр не изменяет исходники; новая сохранённая база не меняет выбор
              пользователя.
            I3: Дерево, документ и проверка привязаны к точным снимкам, включая удалённые
              модули.
            I4: Междоменный доступ панели к API требует отдельного случайного токена;
              обычный просмотр сохраняет проверку Origin.
            I5: Подготовка запроса и его передача агенту не считаются завершённой
              содержательной проверкой.
        document_state: documented
      - module_id: archiview-node-runtime
        directory: src/runtime
        contract:
          id: archiview-node-runtime
          kind: module
          purpose: Предоставлять общие для модулей Node сведения о среде выполнения
            ArchiView.
          responsibilities:
            R1: Разрешать ресурсы и команду CLI относительно действующего пакета в исходной
              и автономной поставке.
            R2: Представлять ошибки платформы с сохранением диагностических полей файловых и
              дочерних процессов.
          boundaries:
            B1: Выбор рабочего проекта, вычисление отчётов и протокол хоста принадлежат
              потребителям.
          invariants:
            I1: Поиск ресурсов пакета не зависит от рабочей папки пользователя.
        document_state: documented
      - module_id: archiview-project-location
        directory: src/project
        contract:
          id: archiview-project-location
          kind: module
          purpose: Определять допустимую область файловых операций с данными ArchiView и
            идентичность истории при переносе проекта.
          responsibilities:
            R1: Разрешать пути локального и внешнего хранилища, проверяя их фактическое
              расположение.
            R2: Читать и фиксировать исходный корень истории проекта.
          boundaries:
            B1: Сбор снимков, хранение истории и публикация отчётов принадлежат потребителям
              этих правил.
          invariants:
            I1: При переносе происхождение истории сохраняется, а операции с исходниками
              используют выбранный корень.
            I2: Создание манифеста идентичности не заменяет существующий манифест с другим
              происхождением.
        document_state: documented
      - module_id: archiview-reports
        directory: src/reports
        contract:
          id: archiview-reports
          kind: module
          purpose: Вычислять переносимые состояния модулей, входы проверок и актуальность
            оценок для заданной пары снимков.
          responsibilities:
            R1: Вычислять технические отчёты и проверять идентичность входов, результатов и
              неизменяемых попыток.
            R2: Сопоставлять изменения кода, контрактов и зависимостей с областью проверки и
              агрегировать оценки дерева.
          boundaries:
            B1: Чтение проектов, блокировка и запись публикации принадлежат другим модулям.
          invariants:
            I1: Оценки current и change, собственное состояние и состояние поддерева
              вычисляются раздельно.
            I2: Кеш подготовленной модели ограничен выбранной парой снимков и изолирован от
              последующих изменений входов.
        document_state: documented
      - module_id: archiview-reviews
        directory: src/reviews
        contract:
          id: archiview-reviews
          kind: module
          purpose: Описывать проверку по контрактам и доказательствам выбранных снимков и
            проверять её целостность.
          responsibilities:
            R1: Определять состав манифеста, проверяемые пункты и структуру результата.
            R2: Проверять ссылки отчёта на сохранённые факты и пункты, формировать явно
              структурную оценку.
          boundaries:
            B1: Публикация попыток, уплотнение и расчёт актуальности выполняются вне этого
              модуля.
          invariants:
            I1: Структурная проверка оставляет смысловые пункты непроверенными.
            I2: Ссылки разрешаются в снимке указанной стороны с учётом области манифеста.
        document_state: documented
      - module_id: archiview-serialization
        directory: src/serialization
        contract:
          id: archiview-serialization
          kind: module
          purpose: Предоставлять общее чтение YAML, средства проверки структуры и
            канонические отпечатки внешних данных.
          responsibilities:
            R1: Читать однозначные JSON-совместимые значения из YAML и предоставлять
              примитивы проверки их структуры.
            R2: Канонизировать значения и вычислять согласованный SHA-256 по байтам UTF-8.
          boundaries:
            B1: Схемы конкретных контрактов и проверок определяются их владельцами.
          invariants:
            I1: Порядок ключей словаря не влияет на каноническую форму. Порядок массива
              сохраняется.
            I2: Неоднозначные ключи, ссылки YAML и недопустимые типы отклоняются до
              использования данных.
        document_state: documented
      - module_id: archiview-snapshots
        directory: src/snapshots
        contract:
          id: archiview-snapshots
          kind: module
          purpose: Фиксировать состояние исходников и сравнивать собственные файлы,
            контракты и расположение модулей.
          responsibilities:
            R1: Собирать снимки рабочего дерева, коммита и индекса Git с происхождением
              файлов и наблюдаемых фактов.
            R2: Сопоставлять версии модулей и вычислять различия файлов и композиции дерева.
          boundaries:
            B1: Публикация, оценка проверок и выбор представления принадлежат хранилищу,
              модели отчётов и прикладной сессии.
          invariants:
            I1: Идентичность содержимого включает факты и неполноту, время захвата и
              пользовательская метка её не меняют.
            I2: Сравнение сохраняет удалённые модули и различает изменение собственных
              файлов и изменение потомков.
        document_state: documented
      - module_id: archiview-storage
        directory: src/storage
        contract:
          id: archiview-storage
          kind: module
          purpose: Сохранять снимки, проверки и опубликованные отчёты проекта с
            возможностью переноса и восстановления.
          responsibilities:
            R1: Обслуживать хранилище одного проекта, перенос прежних данных и историю
              локальных состояний.
            R2: Проверять целостность, уплотнять и публиковать переносимую историю, сверять
              подготовленные для Git отчёты с индексом.
          boundaries:
            B1: Смысловая оценка и модель актуальности определяются вне хранилища.
          invariants:
            I1: Проверка выбранной публикации и её замена выполняются под общей блокировкой
              записи.
            I2: Перенос сохраняет происхождение и содержимое неизменяемых попыток. Чтение и
              запись ограничены допустимой файловой областью.
        document_state: documented
      - module_id: dsh-adapter
        directory: src/dsh
        contract:
          id: dsh-adapter
          kind: module
          purpose: Поставлять ArchiView в DeepSeek Harness как плагин хоста — инструменты
            чтения контрактов, маршруты панели и публикацию скилла без запуска
            модели самим просмотром.
          responsibilities:
            R1: Регистрировать в реестре инструментов dsh чтение инвентаризации и контекста
              каталогов, не добавляя данные панели в контекст модели.
            R2: Публиковать канонический скилл module-boundaries в реестре скиллов dsh из
              единственного файла пакета, без копий в пользовательских
              каталогах.
            R3: Отдавать браузерной половине шаблон панели и операции просмотра по
              префиксным маршрутам, проверяя каждый запрос политикой соединения
              хоста.
            R4: Держать сессии прикладного сервиса по корню проекта, разрешая корень по
              рабочему каталогу чата вкладки, и закрывать реестр при выгрузке
              плагина.
            R5: Передавать браузерной половине префикс маршрутов панели через внедрение
              конфигурации в документ клиента, чтобы настройка хоста не
              расходилась с адресом вкладки.
          boundaries:
            B1: Прикладные операции принадлежат application; адаптер не дублирует сравнение,
              снимки, проверки и анализ.
            B2: Отображение модулей принадлежит web, а браузерная регистрация вкладки —
              client.
            B3: MCP-сервер и панель Codex принадлежат codex; этот модуль их не импортирует и
              не заменяет.
            B4: Генерация проекта, Git-история и хранилище отчётов остаются в существующих
              модулях ядра; адаптер только передаёт им корень и аргументы
              запроса.
          invariants:
            I1: Маршрут панели не запускает модель и не возвращает данные просмотра в
              контекст агента.
            I2: До проверки политики соединения запрос не читает проект и не создаёт сессию.
            I3: Корень вкладки задаётся рабочим каталогом из заголовка чата, прочитанного
              хостом. Для прямого просмотра действует настроенный корень или
              рабочий каталог процесса. URL может выбирать чат по
              идентификатору, но не задаёт путь проекта. Настроенный корень
              ограничивает чтение модельных инструментов.
            I4: Публикация скилла не создаёт второго источника текста — используется файл
              пакета.
            I5: Необязательные сервисы хоста (скиллы, хранилище и контроллер сессий)
              читаются только при наличии и не блокируют активацию плагина.
        document_state: documented
