    contract:
      schema_version: 1
      id: architecture-core
      title: Модель архитектуры и MCP
      kind: module
      purpose: Обслуживать MCP, читать и проверять контракты, формировать и сравнивать
        снимки архитектуры и хранить результаты проверок.
      responsibilities:
        R1: Обходить дерево исходников с учётом ограничений и предоставлять цепочки
          родительских контрактов.
        R2: Проверять схемы arch.yaml и review.yaml, идентичность модулей, отпечатки
          входов и разрешимость доказательств.
        R3: Собирать снимки файлов и контрактов; вычислять изменения, перемещения и
          устаревание отчётов.
        R4: Сохранять неизменяемые пакеты результатов и выполнять структурные проверки с
          явным указанием непроверенных пунктов.
        R5: Сохранять происхождение истории отдельно от фактического пути исходников и
          переносить прежнее внешнее хранилище в локальную папку данных без
          изменения сохранённых пакетов.
        R6: Автоматически уплотнять YAML-отчёты по модулям, сохраняя содержательные
          проверки и доказательства; вычислять собственную и агрегированную
          актуальность по явным входам, включая зависимости, отдельно от полноты
          проверки и подтверждённости перечня зависимостей. Собственная проверка
          содержит только локальный контракт; совместимость размещения
          подмодулей оценивается в композиции родителя, без переноса его пунктов
          в чеклист детей.
        R7: Проверять согласованность переносимых отчётов с подготовленным индексом Git.
        R8: Сохранять наблюдённые состояния между коммитами с временем и привязкой к
          ревизии; предоставлять последовательность коммитов и точные снимки
          истории без изменения исходников.
      boundaries:
        B3: Адаптер Codex находится в codex; вызывает прикладной сервис через скрытые от
          модели инструменты UI без HTTP-сервера.
        B4: Адаптер dsh находится в dsh; регистрирует инструменты, маршруты панели и
          скилл хоста, получая прикладные операции из application.
        B1: Прикладные операции находятся в application; HTTP и CLI в archiview являются
          адаптерами, отображение принадлежит web.
        B2: Семантический вывод ответственности выполняет агент или внешний анализатор.
          Наличие контракта не доказывает его выполнения.
      invariants:
        I1: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости,
          сборка и папки .archiview не расширяют анализ. Запись данных
          допускается в .archiview корня проекта либо явно выбранном внешнем
          хранилище; ссылки не меняют эту область.
        I2: Неполнота обхода и доказательств сообщается явно.
        I3: Снимки и отчёты не заменяют arch.yaml и не согласуют новую ответственность.
        I4: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых
          файлах.
        I5: Структурное различие контрактов не создаёт замечание; оценка нарушения
          требует отдельного анализа.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным
          адаптерам. Извлечение символов, разрешение зависимостей и индексация
          AST принадлежат ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено выбранным корнем проекта. Вкладка чата получает этот
          корень от хоста; явно настроенный для модельных инструментов корень
          ограничивает их чтение.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-change-view
        section: invariants
        id: I5
        text: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются
          строгим TypeScript перед сборкой; классы сохраняют единственную
          ответственность внутри границ своих модулей.
