            import { createReadStream } from "node:fs";

            import { lstat, readFile, realpath } from "node:fs/promises";

            import path from "node:path";

            import { SOURCE_EXTENSIONS, excludedProjectPath, projectFiles,
              regularProjectFile } from "./inventory.mjs";
            import { contractDocument, digest as contentDigest } from
            "./formats.mjs";

            import { readSnapshotRoot } from "./project-state.mjs";


            /** Контракты читаются в обоих форматах; новый формат имеет
            безусловный приоритет. */

            const isContract = (file) => ["arch.yaml",
            "module.md"].includes(path.posix.basename(file));

            const isSource = (file) =>
            SOURCE_EXTENSIONS.has(path.posix.extname(file).toLowerCase());


            /** Стабильная контрольная сумма структуры, не зависящая от времени
            индексации. */

            function digest(value) {
              return createHash("sha256").update(value).digest("hex");
            }


            /** Относительные пути снимков используют единые разделители на всех
            платформах. */

            function portable(value) {
              return value.split(path.sep).join("/");
            }


            /** Запускает только Git без оболочки, ограничивая время и объём
            ответа. */

            async function git(root, args, input = "", maxBytes = 16 * 1024 *
            1024) {
              return new Promise((resolve, reject) => {
                const child = spawn("git", args, { cwd: root, windowsHide: true,
                  stdio: ["pipe", "pipe", "pipe"] });
                const chunks = [];
                let bytes = 0;
                let diagnostic = "";
                let failure;
                const timer = setTimeout(() => {
                  failure = new Error("Git operation timed out");
                  child.kill();
                }, 30000);
                child.on("error", (error) => { clearTimeout(timer); reject(error); });
                child.stdout.on("data", (chunk) => {
                  bytes += chunk.length;
                  if (bytes > maxBytes) {
                    failure = new Error("Git response exceeds the size limit");
                    child.kill();
                  } else chunks.push(chunk);
