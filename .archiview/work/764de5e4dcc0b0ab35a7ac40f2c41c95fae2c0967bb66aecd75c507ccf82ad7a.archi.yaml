          invariants: {}
        document_state: documented
      - module_id: archiview-project-location
        directory: src/project
        contract:
          id: archiview-project-location
          kind: module
          purpose: Определять принадлежность исходников и допустимое место хранения
            истории проекта.
          responsibilities:
            R1: Проверять фактическое расположение локального или явно выбранного внешнего
              хранилища.
            R2: Определять происхождение истории, в том числе после переноса проекта.
            R3: Находить рабочие деревья Git в выбранной папке и определять репозиторий для
              указанного пути.
          boundaries:
            B2: Отклонять путь данных, если его фактическое расположение выходит за пределы
              выбранного хранилища.
            B3: Отклонять внешнее хранилище, фактически расположенное внутри дерева
              исходников проекта.
            B4: При регистрации истории отклонять попытку заменить уже сохранённое
              происхождение другим.
          invariants: {}
        document_state: documented
      - module_id: archiview-reports
        directory: src/reports
        contract:
          id: archiview-reports
          kind: module
          purpose: Определять состояние модулей и актуальность архитектурных оценок для
            выбранной пары снимков.
          responsibilities:
            R1: Формировать технический отчёт по модулю для заданного сравнения.
            R3: Подготавливать вход содержательной проверки с точными ссылками на снимки и
              проверяемые пункты.
            R4: Проверять соответствие принятой попытки её входам и неизменность её
              результата.
            R2: Оценивать актуальность проверки по изменениям в заявленной области.
            R5: Агрегировать оценки по дереву с сохранением собственной оценки каждого
              модуля.
            R6: Выявлять несовместимые выводы проверок одного состояния модуля.
          boundaries:
            B2: Определять актуальность текущего состояния и оценки перехода между снимками
              раздельно.
            B3: Считать собственную проверку родителя устаревшей при изменении состава
              непосредственных детей или смысла их контрактов.
            B4: Изменения реализации ребёнка и его собственные замечания сами по себе не
              меняют собственный вердикт родителя.
            B5: Сохранённые зависимости из LLM-проверок учитывать только как происхождение
              доказательств.
            B6: Отражать отсутствие проверки зависимостей в полноте анализа независимо от
              актуальности его входов.
            B7: Считать конфликтом противоположные определённые выводы либо несовместимые
              статусы одного замечания.
          invariants: {}
        document_state: documented
      - module_id: archiview-reviews
        directory: src/reviews
        contract:
          id: archiview-reviews
          kind: module
          purpose: Связывать проверку модуля с контрактами и доказательствами из выбранных
            снимков.
          responsibilities:
            R1: Формировать манифест проверки с областью анализа и проверяемыми пунктами
              контрактов.
            R2: Проверять, что ссылки результата разрешаются в сохранённых данных указанной
              стороны сравнения.
            R3: Формировать результат автоматической проверки структуры контрактов.
          boundaries:
            B2: Структурная проверка оставляет выполнение смысловых пунктов непроверенным.
            B3: При собственной проверке модуля в чеклист входят только пункты его
              контракта.
            B4: В замечании по собственной проверке допустима ссылка на границу или
              инвариант предка, сохранённые в контексте модуля.
            B5: При проверке ссылок учитывать только доказательства из области манифеста.
          invariants: {}
        document_state: documented
      - module_id: archiview-serialization
        directory: src/serialization
        contract:
          id: archiview-serialization
          kind: module
          purpose: Читать структурированные данные ArchiView и получать воспроизводимый
            отпечаток их содержимого.
          responsibilities:
            R1: Читать YAML как однозначное JSON-совместимое значение.
            R3: Предоставлять проверки структуры данных с указанием поля, в котором
              обнаружена ошибка.
            R2: Вычислять SHA-256 канонической записи значения в UTF-8.
          boundaries:
            B2: При чтении отклонять неоднозначные ключи, ссылки YAML и значения вне
              поддерживаемых типов.
            B3: При канонизации считать порядок ключей словаря несущественным, сохраняя
              последовательность элементов массива.
          invariants: {}
        document_state: documented
      - module_id: archiview-snapshots
        directory: src/snapshots
        contract:
          id: archiview-snapshots
          kind: module
          purpose: Фиксировать состояния исходников и показывать, как между ними
            изменились модули проекта.
          responsibilities:
            R1: Собирать снимок выбранного состояния с происхождением файлов, наблюдаемыми
              фактами и признаками неполноты.
            R3: Определять состав модулей для выбранного состояния исходников.
            R2: Сопоставлять версии модулей, сохраняя в сравнении перемещения и удаления.
            R4: Различать изменение собственных файлов модуля и изменение его потомков.
          boundaries:
            B2: Для рабочего дерева учитывать также новые файлы исходников, ещё не
              добавленные в Git.
            B3: Определять идентичность содержимого снимка с учётом фактов и неполноты,
              независимо от времени захвата и пользовательской метки.
          invariants:
            I3: Рабочее дерево входит в поддерживаемые источники снимков.
            I4: Индекс Git доступен как самостоятельный источник снимка подготовленного
              состояния.
            I5: Сохранённый коммит Git доступен как источник исторического снимка.
        document_state: documented
      - module_id: archiview-storage
        directory: src/storage
        contract:
          id: archiview-storage
          kind: module
          purpose: Сохранять историю проекта для последующего просмотра и переноса.
          responsibilities:
            R1: Сохранять локальные состояния проекта с временем наблюдения и известной
              базовой ревизией Git.
            observations: Сохранять между запусками порядок наблюдаемых изменений файлов
              самого модуля, его контракта и объявлений непосредственных детей.
            R2: Уплотнять историю и обновлять публикацию по выбранным снимкам, используя
              технические отчёты и статусы из модели отчётов.
            R3: Предоставлять для чтения целостное опубликованное сравнение, проверки модуля
              и их доказательства, в том числе после переноса истории.
            R4: При открытии локального хранилища переносить историю из прежнего внешнего
              хранилища с сохранением принадлежности исходному проекту.
            R5: Сверять подготовленную к коммиту публикацию с исходниками и контрактами в
              индексе Git.
            R6: Проверять целостность сохраняемой и читаемой истории.
          boundaries:
            B4: Хранилище публикует сравнение только при полноте каждого входящего в него
              снимка.
            B5: Хранилище принимает повторную запись той же проверки с тем же ID без
              создания второй попытки. Другое содержимое под занятым ID
              отклоняется.
            B6: При уплотнении хранилище сохраняет все принятые содержательные проверки и их
              доказательства.
          invariants: {}
        document_state: documented
      - module_id: dsh-adapter
        directory: src/dsh
        contract:
          id: dsh-adapter
          kind: module
          purpose: Предоставлять агенту DeepSeek Harness контекст контрактов, а
            пользователю — панель ArchiView для проекта его чата.
          responsibilities:
            R1: Предоставлять агенту dsh инструменты инвентаризации и чтения цепочки
              контрактов.
            R2: Публиковать канонический текст module-boundaries из пакета в реестре скиллов
              хоста.
            R3: Предоставлять вкладке страницу ArchiView и операции просмотра для выбранного
              проекта.
            R4: Вести сессии проектов по рабочим папкам чатов и закрывать их при выгрузке
              плагина.
            R5: Сообщать вкладке адрес панели с учётом настройки хоста.
          boundaries:
            B5: Обращаться к проекту и создавать сессию только после проверки запроса
              политикой соединения хоста.
            B6: При запросах просмотра обслуживать панель без запуска модели и без передачи
              просмотренных данных в контекст агента.
            B7: Для вкладки выбирать проект по рабочей папке чата, которую сообщил хост.
            B8: Для прямого просмотра использовать настроенный корень или рабочую папку
              процесса.
            B9: Ограничивать доступ модельных инструментов настроенным корнем, а при его
              отсутствии использовать рабочую папку чата.
            B10: Активировать доступные операции плагина и при отсутствии необязательных
              сервисов хоста.
          invariants: {}
