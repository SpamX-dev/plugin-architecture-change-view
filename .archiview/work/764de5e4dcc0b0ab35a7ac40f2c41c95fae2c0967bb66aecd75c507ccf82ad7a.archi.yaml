        text: >
          schema_version: 1

          id: architecture-core

          title: Модель архитектуры и MCP

          kind: module

          purpose: Обслуживать MCP, читать и проверять контракты, формировать и
          сравнивать снимки архитектуры
            и хранить результаты проверок.
          responsibilities:
            R1: Обходить дерево исходников с учётом ограничений и предоставлять цепочки родительских контрактов.
            R2: Проверять схемы arch.yaml и review.yaml, идентичность модулей, отпечатки входов и разрешимость
              доказательств.
            R3: Собирать снимки файлов и контрактов; вычислять изменения, перемещения и устаревание отчётов.
            R4: Сохранять неизменяемые пакеты результатов и выполнять структурные проверки с явным указанием
              непроверенных пунктов.
            R5: Сохранять происхождение истории отдельно от фактического пути исходников и переносить прежнее
              внешнее хранилище в локальную папку данных без изменения сохранённых пакетов.
            R6: Автоматически уплотнять YAML-отчёты по модулям, сохраняя содержательные проверки и доказательства;
              вычислять собственную и агрегированную актуальность по явным входам, включая зависимости,
              отдельно от полноты проверки и подтверждённости перечня зависимостей.
              Собственная проверка содержит только локальный контракт; совместимость размещения
              подмодулей оценивается в композиции родителя, без переноса его пунктов в чеклист детей.
            R7: Проверять согласованность переносимых отчётов с подготовленным индексом Git.
            R8: Сохранять наблюдённые состояния между коммитами с временем и привязкой к ревизии;
              предоставлять последовательность коммитов и точные снимки истории без изменения исходников.
          boundaries:
            B3: Адаптер Codex находится в codex; вызывает прикладной сервис через скрытые от модели инструменты UI без HTTP-сервера.
            B4: Адаптер dsh находится в dsh; регистрирует инструменты, маршруты панели и скилл хоста,
              получая прикладные операции из application.
            B1: Прикладные операции находятся в application; HTTP и CLI в archiview являются адаптерами, отображение принадлежит web.
            B2: Семантический вывод ответственности выполняет агент или внешний анализатор. Наличие контракта не
              доказывает его выполнения.
          invariants:
            I1: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости, сборка и папки
              .archiview не расширяют анализ. Запись данных допускается в .archiview корня проекта
              либо явно выбранном внешнем хранилище; ссылки не меняют эту область.
            I2: Неполнота обхода и доказательств сообщается явно.
            I3: Снимки и отчёты не заменяют arch.yaml и не согласуют новую ответственность.
            I4: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых файлах.
            I5: Структурное различие контрактов не создаёт замечание; оценка нарушения требует отдельного анализа.
