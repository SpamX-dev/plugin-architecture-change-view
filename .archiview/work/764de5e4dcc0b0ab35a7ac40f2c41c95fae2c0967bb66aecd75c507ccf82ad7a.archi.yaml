              help: { type: "boolean", short: "h" },
              panel: { type: "boolean" },
            } });

            if (values.help) {
              process.stdout.write(packageInfo.name + " [--root DIR] [--extension .ext] " +
                "[--max-files 50000] [--panel]\n");
