            I2: Исторический просмотр не заменяет опубликованное текущее состояние и не
              перечитывает изменённый код вместо выбранного снимка.
            I3: Подготовка и передача запроса анализа не считаются завершённой
              содержательной проверкой.
            I4: История, снимки и запросы анализа каждого репозитория принадлежат его
              собственной сессии и хранилищу.
            I5: Сохранённое представление показывает опубликованную пару и её
              доказательства; открытие представления не наблюдает и не публикует
              рабочее дерево.
