    children:
      - module_id: archiview-application
        directory: src/application
        contract:
          id: archiview-application
          kind: module
          responsibilities:
            R1: Вести сессию проекта с выбранной парой снимков.
            R2: Предоставлять дерево сравнения, карточки его модулей и хронологию состояний.
            R3: Подготавливать запрос анализа выбранной версии модуля.
            R6: Принимать результат для сохранённого запроса анализа.
            R7: Сохранять выбранный полный снимок как базу, оставляя открытое пользователем
              сравнение прежним.
            R4: Направлять операции общей рабочей папки в сессию соответствующего
              репозитория.
            R5: Уведомлять клиентов о необходимости сверки после изменений рабочего дерева
              или состояния Git.
            R8: Предоставлять текущее дерево изменений относительно HEAD с учётом новых
              файлов независимо от загрузки статусов проверок.
            R9: Сохранять правку пункта выбранного рабочего контракта и принимать отмену
              последнего удаления для соответствующей версии документа.
            R10: Регистрировать каркас прототипов в выбранном репозитории, изменять их
              контракты и удалять выбранный прототип с сохранением исходников и
              дочерних модулей.
          boundaries:
            B3: Сессия работает с выбранным корнем проекта на протяжении своей жизни.
            B4: История, снимки и запросы анализа доступны только в контексте
              соответствующего репозитория.
            B5: Историческое представление использует выбранный снимок и сохраняет текущую
              публикацию.
            B6: Открытие сохранённого представления читает опубликованную пару и её
              доказательства без нового наблюдения рабочего дерева.
            B7: Сессия подтверждает завершение содержательной проверки только после импорта
              результата.
            B8: В поручение агенту не входит определение зависимостей модулей.
          invariants: {}
        document_state: documented
      - module_id: archiview-codex
        directory: src/codex
        contract:
          id: archiview-codex
          kind: module
          responsibilities:
            R1: Предоставлять MCP-серверу ресурс встроенной панели и операции просмотра
              проекта.
            R2: Возвращать результаты и ошибки просмотра только интерфейсу панели.
            R3: Определять рабочую папку текущего чата и предоставлять ручной выбор, если
              определить её не удалось.
            R4: Подключать веб-приложение к хосту Codex через MCP Apps.
            R5: Обеспечивать чтение опубликованного сравнения и карточек во время фоновой
              сверки другого репозитория.
          boundaries:
            B2: Для автоматического выбора папки использовать только доступные через хост
              сведения о чате и его рабочих папках.
            B3: Привязывать экземпляр панели к существующей папке один раз.
            B4: Открывать интерфейс и при недоступном контексте чата, сохраняя возможность
              явного выбора проекта.
            B5: Открывать системный диалог выбора папки Windows только по явному действию
              пользователя.
            B6: При навигации не вызывать модель и не передавать ей результаты просмотра.
            B7: Для работы встроенной панели не открывать локальный HTTP-сервер.
            B8: После отключения MCP-клиента завершать сессию и отклонять новые операции
              панели.
          invariants: {}
        document_state: documented
      - module_id: archiview-contracts
        directory: src/contracts
        contract:
          id: archiview-contracts
          kind: module
          responsibilities:
            R1: Проверять однозначность карты каталогов и соответствие ID каждого контракта
              записи в карте.
            R2: Выдавать инвентаризацию каталогов с состоянием их деклараций и указанием,
              какие документы требуется создать или исправить.
            R3: Возвращать цепочку контрактов от корня репозитория до выбранного пути.
          boundaries:
            B2: Для пути внутри вложенного репозитория использовать карту этого репозитория.
              Область уникальности ID ограничена одной картой.
            B3: При неполном обходе выдавать диагностику вместе с найденными каталогами.
            B1: При проверке документа оценивать только его структуру и связь с картой.
          invariants: {}
        document_state: documented
      - module_id: archiview-http
        directory: src/archiview
        contract:
          id: archiview-http
          kind: module
          responsibilities:
            R1: Предоставлять веб-приложение и данные выбранного сравнения, включая
              документы удалённых модулей.
            R2: Возвращать клиенту результат запрошенной операции или диагностический ответ
              с причиной отказа.
            R3: Предоставлять операции экспорта, импорта и проверки отчётов в исходной и
              автономной поставках.
          boundaries:
            B3: При самостоятельном запуске принимать соединения только на локальном
              интерфейсе.
            B4: По файловым маршрутам выдавать только ресурсы приложения.
            B5: Допускать междоменный вызов API панели только с её токеном.
            B6: При запуске пакетной команды построения, экспорта или проверки индекса
              завершать операцию до выхода из CLI.
            B7: При отдельном импорте проверки продолжать работу в режиме сервера, а при
              импорте с построением отчёта завершать пакетную операцию.
          invariants:
            I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
            I8: Операции с переносимыми результатами доступны из командной строки.
        document_state: documented
      - module_id: archiview-mcp
        directory: src/mcp
        contract:
          id: archiview-mcp
          kind: module
          responsibilities:
            R1: Публиковать канонический скилл module-boundaries из пакета ArchiView как
              ресурс MCP.
            R3: Давать агенту инвентаризацию каталогов проекта.
            R4: Предоставлять цепочку действующих контрактов по указанному пути.
            R5: Принимать от агента план модулей для создания каркаса в выбранном
              репозитории.
            R2: При включении панели предоставлять её ресурс и инструменты в той же
              MCP-сессии.
          boundaries:
            B1: Принимать запросы чтения контрактов только с допустимыми аргументами и в
              пределах выбранного проекта.
            B3: Регистрировать операции панели только при явном запуске с параметром
              --panel.
          invariants: {}
        document_state: documented
      - module_id: archiview-node-runtime
        directory: src/runtime
        contract:
          id: archiview-node-runtime
          kind: module
          responsibilities:
            R1: Определять расположение ресурсов и команду запуска CLI для исходной и
              автономной поставки.
            R2: Приводить ошибки Node к общему виду с сохранением доступных диагностических
              полей.
          boundaries:
            B2: При поиске ресурсов использовать пакет запущенного ArchiView независимо от
              рабочей папки пользователя.
          invariants: {}
        document_state: documented
      - module_id: archiview-project-location
        directory: src/project
        contract:
          id: archiview-project-location
          kind: module
          responsibilities:
            R1: Проверять фактическое расположение локального или явно выбранного внешнего
              хранилища.
            R2: Определять происхождение истории, в том числе после переноса проекта.
            R3: Находить рабочие деревья Git в выбранной папке и определять репозиторий для
              указанного пути.
          boundaries:
            B2: Отклонять путь данных, если его фактическое расположение выходит за пределы
              выбранного хранилища.
            B3: Отклонять внешнее хранилище, фактически расположенное внутри дерева
              исходников проекта.
            B4: При регистрации истории отклонять попытку заменить уже сохранённое
              происхождение другим.
          invariants: {}
        document_state: documented
      - module_id: archiview-reports
        directory: src/reports
        contract:
          id: archiview-reports
          kind: module
          responsibilities:
            R1: Формировать технический отчёт по модулю для заданного сравнения.
            R3: Подготавливать вход содержательной проверки с точными ссылками на снимки и
              проверяемые пункты.
            R4: Проверять соответствие принятой попытки её входам и неизменность её
              результата.
            R2: Оценивать актуальность проверки по изменениям в заявленной области.
            R5: Агрегировать оценки по дереву с сохранением собственной оценки каждого
              модуля.
            R6: Выявлять несовместимые выводы проверок одного состояния модуля.
          boundaries:
            B2: Определять актуальность текущего состояния и оценки перехода между снимками
              раздельно.
            B3: Считать собственную проверку родителя устаревшей при изменении состава
              непосредственных детей или смысла их контрактов.
            B4: Изменения реализации ребёнка и его собственные замечания сами по себе не
              меняют собственный вердикт родителя.
            B5: Сохранённые зависимости из LLM-проверок учитывать только как происхождение
              доказательств.
            B6: Отражать отсутствие проверки зависимостей в полноте анализа независимо от
              актуальности его входов.
            B7: Считать конфликтом противоположные определённые выводы либо несовместимые
              статусы одного замечания.
          invariants: {}
        document_state: documented
      - module_id: archiview-reviews
        directory: src/reviews
        contract:
          id: archiview-reviews
          kind: module
          responsibilities:
            R1: Формировать манифест проверки с областью анализа и проверяемыми пунктами
              контрактов.
            R2: Проверять, что ссылки результата разрешаются в сохранённых данных указанной
              стороны сравнения.
            R3: Формировать результат автоматической проверки структуры контрактов.
          boundaries:
            B2: Структурная проверка оставляет выполнение смысловых пунктов непроверенным.
            B3: При собственной проверке модуля в чеклист входят только пункты его
              контракта.
            B4: В замечании по собственной проверке допустима ссылка на границу или
              инвариант предка, сохранённые в контексте модуля.
            B5: При проверке ссылок учитывать только доказательства из области манифеста.
          invariants: {}
        document_state: documented
      - module_id: archiview-serialization
        directory: src/serialization
        contract:
          id: archiview-serialization
          kind: module
          responsibilities:
            R1: Читать YAML как однозначное JSON-совместимое значение.
            R3: Предоставлять проверки структуры данных с указанием поля, в котором
              обнаружена ошибка.
            R2: Вычислять SHA-256 канонической записи значения в UTF-8.
          boundaries:
            B2: При чтении отклонять неоднозначные ключи, ссылки YAML и значения вне
              поддерживаемых типов.
            B3: При канонизации считать порядок ключей словаря несущественным, сохраняя
              последовательность элементов массива.
          invariants: {}
        document_state: documented
      - module_id: archiview-snapshots
        directory: src/snapshots
        contract:
          id: archiview-snapshots
          kind: module
          responsibilities:
            R1: Собирать снимок выбранного состояния с происхождением файлов, наблюдаемыми
              фактами и признаками неполноты.
            R3: Определять состав модулей для выбранного состояния исходников.
            R2: Сопоставлять версии модулей, сохраняя в сравнении перемещения и удаления.
            R4: Различать изменение собственных файлов модуля и изменение его потомков.
          boundaries:
            B2: Для рабочего дерева учитывать также новые файлы исходников, ещё не
              добавленные в Git.
            B3: Определять идентичность содержимого снимка с учётом фактов и неполноты,
              независимо от времени захвата и пользовательской метки.
          invariants:
            I3: Рабочее дерево входит в поддерживаемые источники снимков.
            I4: Индекс Git доступен как самостоятельный источник снимка подготовленного
              состояния.
            I5: Сохранённый коммит Git доступен как источник исторического снимка.
        document_state: documented
      - module_id: archiview-storage
        directory: src/storage
        contract:
          id: archiview-storage
          kind: module
          responsibilities:
            R1: Сохранять локальные состояния проекта с временем наблюдения и известной
              базовой ревизией Git.
            observations: Сохранять между запусками порядок наблюдаемых изменений файлов
              самого модуля, его контракта и объявлений непосредственных детей.
            R2: Уплотнять историю и обновлять публикацию по выбранным снимкам, используя
              технические отчёты и статусы из модели отчётов.
            R3: Предоставлять для чтения целостное опубликованное сравнение, проверки модуля
              и их доказательства, в том числе после переноса истории.
            R4: При открытии локального хранилища переносить историю из прежнего внешнего
              хранилища с сохранением принадлежности исходному проекту.
            R5: Сверять подготовленную к коммиту публикацию с исходниками и контрактами в
              индексе Git.
            R6: Проверять целостность сохраняемой и читаемой истории.
          boundaries:
            B4: Хранилище публикует сравнение только при полноте каждого входящего в него
              снимка.
            B5: Хранилище принимает повторную запись той же проверки с тем же ID без
              создания второй попытки. Другое содержимое под занятым ID
              отклоняется.
            B6: При уплотнении хранилище сохраняет все принятые содержательные проверки и их
              доказательства.
          invariants: {}
        document_state: documented
      - module_id: dsh-adapter
        directory: src/dsh
        contract:
          id: dsh-adapter
          kind: module
          responsibilities:
            R1: Предоставлять агенту dsh инструменты инвентаризации и чтения цепочки
              контрактов.
            R2: Публиковать канонический текст module-boundaries из пакета в реестре скиллов
              хоста.
            R3: Предоставлять вкладке страницу ArchiView и операции просмотра для выбранного
              проекта.
            R4: Вести сессии проектов по рабочим папкам чатов и закрывать их при выгрузке
              плагина.
            R5: Сообщать вкладке адрес панели с учётом настройки хоста.
            R6: Давать агенту возможность создать каркас прототипов в репозитории проекта.
          boundaries:
            B5: Обращаться к проекту и создавать сессию только после проверки запроса
              политикой соединения хоста.
            B6: При запросах просмотра обслуживать панель без запуска модели и без передачи
              просмотренных данных в контекст агента.
            B7: Для вкладки выбирать проект по рабочей папке чата, которую сообщил хост.
            B8: Для прямого просмотра использовать настроенный корень или рабочую папку
              процесса.
            B9: Ограничивать доступ модельных инструментов настроенным корнем, а при его
              отсутствии использовать рабочую папку чата.
            B10: Активировать доступные операции плагина и при отсутствии необязательных
              сервисов хоста.
          invariants: {}
        document_state: documented
