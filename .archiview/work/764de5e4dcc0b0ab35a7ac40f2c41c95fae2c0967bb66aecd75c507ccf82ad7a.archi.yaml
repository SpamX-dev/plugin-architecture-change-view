    children:
      - module_id: archiview-application
        directory: src/application
        contract:
          id: archiview-application
          kind: module
          boundaries:
            B3: Сессия работает с выбранным корнем проекта на протяжении своей жизни.
            B4: История, снимки и запросы анализа доступны только в контексте
              соответствующего репозитория.
            B5: Историческое представление использует выбранный снимок и сохраняет текущую
              публикацию.
            B6: Открытие сохранённого представления читает опубликованную пару и её
              доказательства без нового наблюдения рабочего дерева.
            B7: Сессия подтверждает завершение содержательной проверки только после импорта
              результата.
            B8: В поручение агенту не входит определение зависимостей модулей.
          invariants: {}
        document_state: documented
      - module_id: archiview-codex
        directory: src/codex
        contract:
          id: archiview-codex
          kind: module
          boundaries:
            B2: Для автоматического выбора папки использовать только доступные через хост
              сведения о чате и его рабочих папках.
            B3: Привязывать экземпляр панели к существующей папке один раз.
            B4: Открывать интерфейс и при недоступном контексте чата, сохраняя возможность
              явного выбора проекта.
            B5: Открывать системный диалог выбора папки Windows только по явному действию
              пользователя.
            B6: При навигации не вызывать модель и не передавать ей результаты просмотра.
            B7: Для работы встроенной панели не открывать локальный HTTP-сервер.
            B8: После отключения MCP-клиента завершать сессию и отклонять новые операции
              панели.
          invariants: {}
        document_state: documented
      - module_id: archiview-contracts
        directory: src/contracts
        contract:
          id: archiview-contracts
          kind: module
          boundaries:
            B2: Для пути внутри вложенного репозитория использовать карту этого репозитория.
              Область уникальности ID ограничена одной картой.
            B3: При неполном обходе выдавать диагностику вместе с найденными каталогами.
            B1: При проверке документа оценивать только его структуру и связь с картой.
          invariants: {}
        document_state: documented
      - module_id: archiview-http
        directory: src/archiview
        contract:
          id: archiview-http
          kind: module
          boundaries:
            B3: При самостоятельном запуске принимать соединения только на локальном
              интерфейсе.
            B4: По файловым маршрутам выдавать только ресурсы приложения.
            B5: Допускать междоменный вызов API панели только с её токеном.
            B6: При запуске пакетной команды построения, экспорта или проверки индекса
              завершать операцию до выхода из CLI.
            B7: При отдельном импорте проверки продолжать работу в режиме сервера, а при
              импорте с построением отчёта завершать пакетную операцию.
          invariants:
            I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
            I8: Операции с переносимыми результатами доступны из командной строки.
        document_state: documented
      - module_id: archiview-mcp
        directory: src/mcp
        contract:
          id: archiview-mcp
          kind: module
          boundaries:
            B1: Принимать запросы чтения контрактов только с допустимыми аргументами и в
              пределах выбранного проекта.
            B3: Регистрировать операции панели только при явном запуске с параметром
              --panel.
          invariants: {}
        document_state: documented
      - module_id: archiview-node-runtime
        directory: src/runtime
        contract:
          id: archiview-node-runtime
          kind: module
          boundaries:
            B2: При поиске ресурсов использовать пакет запущенного ArchiView независимо от
              рабочей папки пользователя.
          invariants: {}
        document_state: documented
      - module_id: archiview-project-location
        directory: src/project
        contract:
          id: archiview-project-location
          kind: module
          boundaries:
            B2: Отклонять путь данных, если его фактическое расположение выходит за пределы
              выбранного хранилища.
            B3: Отклонять внешнее хранилище, фактически расположенное внутри дерева
              исходников проекта.
            B4: При регистрации истории отклонять попытку заменить уже сохранённое
              происхождение другим.
          invariants: {}
        document_state: documented
      - module_id: archiview-reports
        directory: src/reports
        contract:
          id: archiview-reports
          kind: module
          boundaries:
            B2: Определять актуальность текущего состояния и оценки перехода между снимками
              раздельно.
            B3: Считать собственную проверку родителя устаревшей при изменении состава
              непосредственных детей или смысла их контрактов.
            B4: Изменения реализации ребёнка и его собственные замечания сами по себе не
              меняют собственный вердикт родителя.
            B5: Сохранённые зависимости из LLM-проверок учитывать только как происхождение
              доказательств.
            B6: Отражать отсутствие проверки зависимостей в полноте анализа независимо от
              актуальности его входов.
            B7: Считать конфликтом противоположные определённые выводы либо несовместимые
              статусы одного замечания.
          invariants: {}
        document_state: documented
      - module_id: archiview-reviews
        directory: src/reviews
        contract:
          id: archiview-reviews
          kind: module
          boundaries:
            B2: Структурная проверка оставляет выполнение смысловых пунктов непроверенным.
            B3: При собственной проверке модуля в чеклист входят только пункты его
              контракта.
            B4: В замечании по собственной проверке допустима ссылка на границу или
              инвариант предка, сохранённые в контексте модуля.
            B5: При проверке ссылок учитывать только доказательства из области манифеста.
          invariants: {}
        document_state: documented
      - module_id: archiview-serialization
        directory: src/serialization
        contract:
          id: archiview-serialization
          kind: module
          boundaries:
            B2: При чтении отклонять неоднозначные ключи, ссылки YAML и значения вне
              поддерживаемых типов.
            B3: При канонизации считать порядок ключей словаря несущественным, сохраняя
              последовательность элементов массива.
          invariants: {}
        document_state: documented
      - module_id: archiview-snapshots
        directory: src/snapshots
        contract:
          id: archiview-snapshots
          kind: module
          boundaries:
            B2: Для рабочего дерева учитывать также новые файлы исходников, ещё не
              добавленные в Git.
            B3: Определять идентичность содержимого снимка с учётом фактов и неполноты,
              независимо от времени захвата и пользовательской метки.
          invariants:
            I3: Рабочее дерево входит в поддерживаемые источники снимков.
            I4: Индекс Git доступен как самостоятельный источник снимка подготовленного
              состояния.
            I5: Сохранённый коммит Git доступен как источник исторического снимка.
        document_state: documented
      - module_id: archiview-storage
        directory: src/storage
        contract:
          id: archiview-storage
          kind: module
          boundaries:
            B4: Хранилище публикует сравнение только при полноте каждого входящего в него
              снимка.
            B5: Хранилище принимает повторную запись той же проверки с тем же ID без
              создания второй попытки. Другое содержимое под занятым ID
              отклоняется.
            B6: При уплотнении хранилище сохраняет все принятые содержательные проверки и их
              доказательства.
          invariants: {}
        document_state: documented
      - module_id: dsh-adapter
        directory: src/dsh
        contract:
          id: dsh-adapter
          kind: module
          boundaries:
            B5: Обращаться к проекту и создавать сессию только после проверки запроса
              политикой соединения хоста.
            B6: При запросах просмотра обслуживать панель без запуска модели и без передачи
              просмотренных данных в контекст агента.
            B7: Для вкладки выбирать проект по рабочей папке чата, которую сообщил хост.
            B8: Для прямого просмотра использовать настроенный корень или рабочую папку
              процесса.
            B9: Ограничивать доступ модельных инструментов настроенным корнем, а при его
              отсутствии использовать рабочую папку чата.
            B10: Активировать доступные операции плагина и при отсутствии необязательных
              сервисов хоста.
          invariants: {}
        document_state: documented
