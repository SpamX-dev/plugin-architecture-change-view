          kind: module
          purpose: Фиксировать состояние исходников и сравнивать собственные файлы,
            контракты и расположение модулей.
          responsibilities:
            R1: Собирать снимки рабочего дерева, коммита и индекса Git с происхождением
              файлов и наблюдаемых фактов.
            R2: Сопоставлять версии модулей и вычислять различия файлов и композиции дерева.
          boundaries:
            B1: Публикация, оценка проверок и выбор представления принадлежат хранилищу,
              модели отчётов и прикладной сессии.
          invariants:
            I1: Идентичность содержимого включает факты и неполноту, время захвата и
              пользовательская метка её не меняют.
            I2: Сравнение сохраняет удалённые модули и различает изменение собственных
              файлов и изменение потомков.
        document_state: documented
      - module_id: archiview-storage
        directory: src/storage
        contract:
          id: archiview-storage
          kind: module
          purpose: Сохранять снимки, проверки и опубликованные отчёты проекта с
            возможностью переноса и восстановления.
          responsibilities:
            R1: Обслуживать хранилище одного проекта, при открытии локального хранилища
              переносить в него данные из прежнего внешнего каталога. Сохранять
              локальные состояния с временем наблюдения и базовой ревизией Git,
              когда она известна.
            R2: Проверять целостность, уплотнять и публиковать переносимую историю, сверять
              подготовленные для Git отчёты с индексом.
          boundaries:
            B1: Смысловая оценка и модель актуальности определяются вне хранилища.
          invariants:
            I1: Проверка выбранной публикации и её замена выполняются под общей блокировкой
              записи.
            I2: Перенос сохраняет происхождение и содержимое неизменяемых попыток. Чтение и
              запись ограничены допустимой файловой областью.
            I3: При уплотнении истории сохраняются содержательные проверки и их
              доказательства.
        document_state: documented
      - module_id: dsh-adapter
        directory: src/dsh
        contract:
          id: dsh-adapter
          kind: module
          purpose: Предоставлять агенту DeepSeek Harness правила и контекст контрактов, а
            пользователю — панель ArchiView для проекта его чата.
          responsibilities:
            R1: Регистрировать в реестре инструментов dsh чтение инвентаризации и контекста
              каталогов, не добавляя данные панели в контекст модели.
            R2: Публиковать канонический скилл module-boundaries в реестре скиллов dsh из
              единственного файла пакета, без копий в пользовательских
              каталогах.
            R3: Отдавать браузерной половине шаблон панели и операции просмотра по
              префиксным маршрутам, проверяя каждый запрос политикой соединения
              хоста.
            R4: Держать сессии прикладного сервиса по корню проекта, разрешая корень по
              рабочему каталогу чата вкладки, и закрывать реестр при выгрузке
              плагина.
            R5: Передавать вкладке настроенный хостом префикс маршрутов панели.
          boundaries:
            B1: Для операций просмотра адаптер передаёт корень проекта и аргументы запроса
              прикладному сервису.
            B2: Хост и вкладка используют общий адрес веб-панели и идентификатор чата для
              привязки к проекту. Содержимое панели поступает из общего
              веб-интерфейса ArchiView.
            B3: Интеграция с dsh независима от MCP-сервера и панели Codex.
            B4: Адаптер работает с существующим проектом и получает его историю Git и отчёты
              через прикладной сервис.
          invariants:
            I1: Маршрут панели не запускает модель и не возвращает данные просмотра в
              контекст агента.
            I2: До проверки политики соединения запрос не читает проект и не создаёт сессию.
            I3: Корень вкладки задаётся рабочим каталогом из заголовка чата, прочитанного
              хостом. Для прямого просмотра действует настроенный корень или
              рабочий каталог процесса. Панель выбирает репозиторий внутри этой
              папки. Модельные инструменты используют настроенный корень или
              рабочую папку чата. Настроенный корень ограничивает доступные
              пути.
            I4: Публикация скилла не создаёт второго источника текста — используется файл
              пакета.
            I5: Необязательные сервисы хоста (скиллы, хранилище и контроллер сессий)
              читаются только при наличии и не блокируют активацию плагина.
        document_state: documented
