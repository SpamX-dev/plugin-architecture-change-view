                child.on("close", (code) => {
                  clearTimeout(timer);
                  if (failure || code !== 0) {
                    const error = failure ?? new Error(diagnostic.trim() || "Git exited with code " + code);
                    error.exitCode = code;
                    reject(error);
                  }
                  else resolve(Buffer.concat(chunks));
