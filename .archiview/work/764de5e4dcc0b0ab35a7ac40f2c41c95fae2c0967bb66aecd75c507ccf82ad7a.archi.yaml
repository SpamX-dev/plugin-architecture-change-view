            import { constants } from "node:fs";

            import { copyFile, mkdir, readdir, readFile, rename, rm, lstat,
            writeFile } from "node:fs/promises";

            import os from "node:os";

            import path from "node:path";

            import { stringify } from "yaml";

            import { parseYaml } from "./formats.mjs";

            import { snapshotDigest } from "./snapshots.mjs";

            import { assertStateLocation, ensureProjectIdentity,
            projectStateDirectory, readSnapshotRoot } from
            "./project-state.mjs";


            /** Адресует переносимое хранилище внутри выбранного проекта. */

            export function defaultSnapshotDirectory(root) { return
            projectStateDirectory(root); }


            /** Вычисляет прежнее внешнее размещение исключительно для переноса
            существующей истории. */

            export function legacySnapshotDirectory(root) {
              const key = createHash("sha256").update(root).digest("hex").slice(0, 20);
              return path.join(os.homedir(), ".archiview", key);
