          text: >
            /**
             * Строгие форматы arch.yaml/review.yaml v1 и единый SHA-256 для их входов.
             * Проверяет структуру, а разрешение ссылок на факты выполняет модель проверок.
             * Неизвестные поля и неоднозначный YAML отвергаются до использования данных.
             */
            import { createHash } from "node:crypto";

            import { parseDocument } from "yaml";


            /** Канонический JSON сортирует ключи словарей, сохраняя порядок
            массивов. */

            export function canonical(value) {
              if (Array.isArray(value)) return "[" + value.map((v) => canonical(v ?? null)).join(",") + "]";
              if (value && typeof value === "object") return "{" + Object.keys(value).filter((key) => value[key] !== undefined).sort()
                .map((key) => JSON.stringify(key) + ":" + canonical(value[key])).join(",") + "}";
              return JSON.stringify(value ?? null);
            }


            /** Все внешние отпечатки используют одинаковые байты UTF-8 и
            префикс алгоритма. */

            export function digest(value) {
              return "sha256:" + createHash("sha256").update(canonical(value)).digest("hex");
            }


            /** Минимальный словарь валидаторов: каждая ошибка содержит точный
            путь поля. */

            const fail = (at, message) => { throw new Error(at + ": " +
            message); };

            const string = (v, at) => typeof v === "string" && v.trim() ?
            undefined : fail(at, "ожидается непустая строка");

            const object = (v, at) => v && typeof v === "object" &&
            !Array.isArray(v) ? undefined : fail(at, "ожидается словарь");

            const enumeration = (...values) => (v, at) => values.includes(v) ?
            undefined : fail(at, "допустимо: " + values.join(", "));

            const nullable = (check) => (v, at) => v === null ? undefined :
            check(v, at);

