            /** Манифест отделяет собственный чеклист от сохранённого контекста
            предков. */

            export function reviewManifest(before, after, module, analyzer =
            ANALYZER, contractScope = "own") {
              return { schema_version: 1, comparison: { baseline: snapshotReference(before), current: snapshotReference(after) },
