            const packageInfo = JSON.parse(await readFile(new
            URL("../package.json", import.meta.url)));

            /** Параметры запуска; повторяемый --extension добавляет расширения
            исходников. */

            const { values } = parseArgs({ options: {
              root: { type: "string" }, extension: { type: "string", multiple: true },
