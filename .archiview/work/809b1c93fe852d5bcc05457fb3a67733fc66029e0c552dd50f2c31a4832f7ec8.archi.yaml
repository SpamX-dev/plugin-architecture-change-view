          text: |
            /**
             * Автономная локальная поставка: бандлы Node и самодостаточный UI SDK исключают
             * npm install внутри кеша плагинов. Результат всегда находится только в dist/codex.
             */
            import { build } from "esbuild";
            import { cp, mkdir, readFile, rm, writeFile } from "node:fs/promises";
            import { fileURLToPath } from "node:url";

            const root = new URL("../", import.meta.url);
            const output = new URL("dist/codex/", root);
            await mkdir(new URL("src/", output), { recursive: true });
            // Панель должна выполнить ui/initialize без загрузки скриптов с loopback:
            // хост может применять отдельную CSP для ресурсов и сетевых запросов.
            const panelBundle = await build({
              entryPoints: [fileURLToPath(new URL("web/archiview/app.mjs", root))],
              bundle: true, write: false, platform: "browser", target: "es2022", format: "esm",
              plugins: [{ name: "panel-sdk", setup(builder) {
                // Только приложение внутри Codex получает резервную форму и нативный выбор.
                builder.onResolve({ filter: /^\.\/client\.mjs$/ }, (args) => args.importer === fileURLToPath(new URL("web/archiview/app.mjs", root)) ? {
                  path: fileURLToPath(new URL("src/codex/panel-client.mjs", root)),
                } : undefined);
                builder.onResolve({ filter: /^\.\/mcp-app-sdk\.mjs$/ }, () => ({
                  path: fileURLToPath(new URL(import.meta.resolve("@modelcontextprotocol/ext-apps/app-with-deps"))),
                }));
              } }],
            });
            const [template, styles] = await Promise.all([
              readFile(new URL("web/archiview/index.html", root), "utf8"),
              readFile(new URL("web/archiview/styles.css", root), "utf8"),
            ]);
            const panelHtml = template
              .replace('<link rel="stylesheet" href="/styles.css">', () => `<style>${styles.replace(/<\/style/gi, "<\\/style")}</style>`)
              .replace('<script type="module" src="/app.mjs"></script>', () => `<script type="module">${panelBundle.outputFiles[0].text.replace(/<\/script/gi, "<\\/script")}</script>`);
            await writeFile(new URL("dist/panel.html", root), panelHtml);
            await mkdir(new URL("dist/", output), { recursive: true });
            await writeFile(new URL("dist/panel.html", output), panelHtml);
            await build({
              entryPoints: { server: fileURLToPath(new URL("src/server.mjs", root)), cli: fileURLToPath(new URL("src/cli.mjs", root)) },
              outdir: fileURLToPath(new URL("src/", output)), outExtension: { ".js": ".mjs" },
              bundle: true, platform: "node", target: "node22", format: "esm",
              banner: { js: 'import { createRequire as archiviewCreateRequire } from "node:module"; const require = archiviewCreateRequire(import.meta.url);' },
            });
            for (const name of ["web", "skills", "docs"]) await cp(new URL(name, root), new URL(name, output), { recursive: true });
            for (const name of ["package.json", "README.md", "LICENSE"])
              await cp(new URL(name, root), new URL(name, output));
            // Формат Codex поддерживает env_vars: переносимый mcp.json v1 не умеет
            // передавать канал контекста из окружения хоста. Общий portable-пакет не меняется.
            const portablePlugin = JSON.parse(await readFile(new URL("plugin.json", root), "utf8"));
            const portableMcp = JSON.parse(await readFile(new URL("mcp.json", root), "utf8"));
            await mkdir(new URL(".codex-plugin/", output), { recursive: true });
            await writeFile(new URL(".codex-plugin/plugin.json", output), JSON.stringify({
              name: portablePlugin.name, version: portablePlugin.version, description: portablePlugin.description,
              skills: "./skills/", mcpServers: "./.mcp.json", requires_local_executor: true,
              interface: portablePlugin.extensions["com.openai"].interface,
            }, null, 2) + "\n");
            const codexServer = { ...portableMcp.mcpServers.archiview,
              env_vars: ["CODEX_APP_TOOLS_PIPE_PATH", "CODEX_APP_TOOLS_CALLER_HOST_ID"] };
            delete codexServer.type;
            await writeFile(new URL(".mcp.json", output), JSON.stringify({ mcpServers: { archiview: codexServer } }, null, 2) + "\n");
            // Оставшиеся от прежних сборок portable-манифесты перекрыли бы конфигурацию Codex.
            for (const name of ["plugin.json", "mcp.json", "src/codex/session-start.mjs"])
              await rm(new URL(name, output), { force: true });
            await cp(new URL(import.meta.resolve("@modelcontextprotocol/ext-apps/app-with-deps")),
              new URL("web/archiview/mcp-app-sdk.mjs", output));
            // Автономный пакет использует версию Codex-плагина; общая npm/dsh-версия не меняется.
            const metadata = JSON.parse(await readFile(new URL("package.json", output), "utf8"));
            metadata.version = portablePlugin.version;
            delete metadata.dependencies;
            delete metadata.devDependencies;
            delete metadata.scripts;
            // dist/codex — самостоятельный пакет Codex: записи плагина dsh здесь не публикуются.
            delete metadata.main;
            delete metadata.exports;
            delete metadata.dsh;
            delete metadata.peerDependencies;
            delete metadata.peerDependenciesMeta;
            metadata.bin.archiview = "src/cli.mjs";
            metadata.files = metadata.files.filter((name) => !["plugin.json", "mcp.json"].includes(name));
            metadata.files.push(".codex-plugin", ".mcp.json");
            await writeFile(new URL("package.json", output), JSON.stringify(metadata, null, 2) + "\n");
            process.stdout.write("Codex plugin built: " + fileURLToPath(output) + "\n");
      - index: 19
        fact:
          id: sha256:11b7fc35b58f0a34c824dd90b5a5d94f145e307f5944251cd403e585bf47218c
          kind: file
          path: scripts/install-plugin.mjs
          start_line: 1
          end_line: 48
          text: >
            /**
             * Явная установка локального пакета Codex. Native legacy-загрузчик не раскрывает
             * PLUGIN_ROOT в .mcp.json, поэтому после штатной установки пути привязываются к
             * возвращённому каталогу кеша. Сборка и остальные плагины конфигурацию не меняют.
             */
            import { execFile } from "node:child_process";

            import { constants } from "node:fs";

            import { copyFile, readFile, realpath, writeFile } from
            "node:fs/promises";

            import path from "node:path";

            import { fileURLToPath, pathToFileURL } from "node:url";

            import { promisify } from "node:util";


            /** Сохраняет исходный шаблон и разрешает только конфигурацию MCP
            установленного ArchiView. */

            export async function configureInstalledCodexPlugin(installedPath) {
              const root = await realpath(installedPath);
              const manifest = JSON.parse(await readFile(path.join(root, ".codex-plugin/plugin.json"), "utf8"));
              if (manifest.name !== "archiview" || manifest.mcpServers !== "./.mcp.json") throw new Error("Unexpected installed ArchiView manifest");
              const file = path.join(root, ".mcp.json");
              const configuration = JSON.parse(await readFile(file, "utf8"));
              const server = configuration.mcpServers?.archiview;
              if (server?.command !== "node" || !Array.isArray(server.args) || !server.args.includes("--panel")) throw new Error("Unexpected installed ArchiView server");
              // Оригинальный шаблон сохраняется один раз; повторная настройка идемпотентна.
              try { await copyFile(file, path.join(root, ".mcp.json.template"), constants.COPYFILE_EXCL); }
              catch (error) { if (error.code !== "EEXIST") throw error; }
              server.args = server.args.map((argument) => argument.replaceAll("${PLUGIN_ROOT}", root));
              // Без cwd Codex передаёт рабочую папку чата, в том числе до первого сообщения.
              // Каталог установки нужен только для поиска кода и не должен подменять этот контекст.
              delete server.cwd;
              server.env = { ...server.env, PLUGIN_ROOT: root };
              await writeFile(file, JSON.stringify(configuration, null, 2) + "\n");
              return { installedPath: root, version: manifest.version, configuration };
            }


            /** Установщик CLI выбирает версию и каталог; код не вычисляет путь
            кеша по имени пользователя. */

            export async function installCodexPlugin({ executable = "codex", cwd
            = fileURLToPath(new URL("../", import.meta.url)) } = {}) {
              const { stdout } = await promisify(execFile)(executable,
                ["plugin", "add", "archiview@archiview-local", "--json"], { cwd, windowsHide: true });
              const installed = JSON.parse(stdout);
              if (installed.pluginId !== "archiview@archiview-local" || typeof installed.installedPath !== "string") throw new Error("Unexpected Codex install result");
              const configured = await configureInstalledCodexPlugin(installed.installedPath);
              return { ...installed, installedPath: configured.installedPath, mcpPathsResolved: true };
            }


            if (process.argv[1] && import.meta.url ===
            pathToFileURL(path.resolve(process.argv[1])).href) {
              const installed = await installCodexPlugin();
              process.stdout.write(JSON.stringify(installed, null, 2) + "\n");
            }
      - index: 20
        fact:
          id: sha256:9fe7c3b7bbe34e61d22fd68fb8416aa11b308cbf7367be3f75139b261ca848e8
          kind: file
          path: scripts/preview-panel.mjs
          start_line: 1
          end_line: 110
          text: >
            /**
             * Ручной протокольный стенд: настоящий UI и прикладной сервис во временном проекте,
             * с явно обозначенным тестовым хостом MCP Apps. Не запускает модель и не подменяет
             * проверку в настоящем Codex. Позволяет проверить bridge без сети в iframe и отказ отправки.
             */
            import { createServer } from "node:http";

            import { mkdtemp, mkdir, writeFile, rm, readFile } from
            "node:fs/promises";

            import path from "node:path";

            import os from "node:os";

            import { stringify, parse } from "yaml";

            import { createCodexPanel } from "../src/codex/panel.mjs";

            import { createCodexProjectBinding } from
            "../src/codex/project-context.mjs";

            import { AnalysisRequests } from "../src/application/analysis.mjs";

            import { SnapshotStore } from "../src/snapshot-store.mjs";

            import { ReportStore } from "../src/report-store.mjs";

            import { digest } from "../src/formats.mjs";


            const root = await mkdtemp(path.join(os.tmpdir(),
            "archiview-panel-preview-"));

            await mkdir(path.join(root, "domain"));

            for (const [directory, id, title] of [[".", "preview", "Тестовый
            проект"], ["domain", "domain", "Игровой модуль"]]) {
              await writeFile(path.join(root, directory, "arch.yaml"), stringify({ schema_version: 1, id, title,
                kind: "module", purpose: "Обслуживать тестовый игровой модуль.",
                responsibilities: { R1: "Вычислять значение без изменения состояния." },
                boundaries: { B1: "Не обращаться к сети." }, invariants: { I1: "Результат детерминирован." } }));
            }

            await writeFile(path.join(root, "domain/value.js"), "export const
            value = () => 42;\n");

            const binding = process.argv.includes("--unknown-context") ? await
            createCodexProjectBinding(undefined, {
              readContext: async () => ({ status: "unknown" }),
            }) : process.argv.includes("--select-project") ? undefined : root;

            const panel = createCodexPanel(binding);

            const resource = (await panel.resource()).contents[0];

            // В iframe запрещена вся сеть; только тестовый хост снаружи
            пересылает MCP-сообщения.

            const panelPolicy = "default-src 'none'; script-src 'unsafe-inline';
            style-src 'unsafe-inline'; " +
              "img-src data:; connect-src 'none'";
            const constrainedHtml = resource.text.replace("<head>", `<head><meta
            http-equiv="Content-Security-Policy" content="${panelPolicy}">`);

            const messages = [];

            const host = createServer(async (request, response) => {
              if (request.url === "/tools" && request.method === "POST") {
                let body = ""; for await (const chunk of request) body += chunk;
                const call = JSON.parse(body);
                response.writeHead(200, { "Content-Type": "application/json" });
                return response.end(JSON.stringify(await panel.callUi(call.name, call.arguments)));
              }
              if (request.url === "/messages") {
                response.writeHead(200, { "Content-Type": "application/json" }); return response.end(JSON.stringify(messages));
              }
              if (request.url === "/message" && request.method === "POST") {
                let body = ""; for await (const chunk of request) body += chunk;
                messages.push(JSON.parse(body)); response.writeHead(204); return response.end();
              }
              if (request.url === "/complete" && request.method === "POST") {
                // Искусственный результат стенда явно помечен test; он хранится только во временном проекте.
                const store = new SnapshotStore(root); await store.open();
                const reports = new ReportStore(store);
                const directory = path.join(root, ".archiview/snapshots/analysis");
                const id = /"requestId":"([a-f0-9-]+)"/.exec(messages.at(-1)?.content?.[0]?.text ?? "")?.[1];
                if (!id) { response.writeHead(400); return response.end("No accepted request"); }
                const input = parse(await readFile(path.join(directory, id, "input.yaml"), "utf8"));
                input.report.analysis.model = { provider: "test", id: "UI protocol fixture" };
                input.report.analysis.prompt_digest = digest("UI protocol fixture");
                input.manifest.model = input.report.analysis.model;
                input.manifest.prompt_digest = input.report.analysis.prompt_digest;
                input.report.analysis.coverage = { status: "partial", limitations: ["Искусственный результат протокольного стенда; анализ кода не выполнялся."] };
                await writeFile(path.join(directory, id, "result.yaml"), stringify(input, { aliasDuplicateObjects: false }));
                await new AnalysisRequests(store, reports).complete(id);
                response.writeHead(204); return response.end();
              }
              response.writeHead(200, { "Content-Type": "text/html; charset=utf-8" });
              response.end(`<!doctype html><html lang="ru"><meta charset="utf-8"><title>ArchiView — тестовый хост MCP Apps</title>
                <style>body{margin:0;font:14px system-ui;background:#f4f6f5}header{padding:10px 16px;display:flex;gap:14px;align-items:center}iframe{width:100%;height:calc(100vh - 55px);border:0}#count{margin-left:auto}</style>
                <header><strong>Тестовый хост MCP Apps</strong><span id="connection">Ожидаем подключения</span><label><input id="reject" type="checkbox">Отклонять поручения</label><button id="complete">Импортировать тестовый результат</button><span id="count">Поручений: 0</span></header>
                <iframe id="panel" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
                <script type="module">
                  const frame = document.querySelector("iframe");
                  const panelHtml = ${JSON.stringify(constrainedHtml).replace(/</g, "\\u003c")};
                  let count = 0;
                  window.addEventListener("message", async (event) => {
                    if (event.source !== frame.contentWindow || !event.data?.method) return;
                    if (event.data.method === "ui/notifications/initialized") document.querySelector("#connection").textContent = "MCP Apps подключён";
                    if (event.data.id === undefined) return;
                    const message = event.data;
                    let result = {};
                    if (message.method === "ui/initialize") result = { protocolVersion: message.params.protocolVersion,
                      hostInfo: { name: "ArchiView protocol test host", version: "1" }, hostCapabilities: { message: { text: {} }, serverTools: {} },
                      hostContext: { theme: "light", displayMode: "inline", availableDisplayModes: ["inline"] } };
                    if (message.method === "ui/message") {
                      result = { isError: document.querySelector("#reject").checked };
                      if (!result.isError) {
                        await fetch("/message", { method: "POST", body: JSON.stringify(message.params) });
                        document.querySelector("#count").textContent = "Поручений: " + (++count);
                      }
                    }
                    if (message.method === "tools/call") result = await (await fetch("/tools", { method: "POST", body: JSON.stringify(message.params) })).json();
                    frame.contentWindow.postMessage({ jsonrpc: "2.0", id: message.id, result }, "*");
                  });
                  document.querySelector("#complete").onclick = () => fetch("/complete", { method: "POST" });
                  frame.srcdoc = panelHtml;
                </script></html>`);
            });

            await new Promise((resolve) => host.listen(0, "127.0.0.1",
            resolve));

            process.stdout.write("UI protocol preview: http://127.0.0.1:" +
            host.address().port + "\nTemporary project: " + root + "\n");

            /** Убирает только временный проект, созданный этим стендом, и
            принадлежащие ему серверы. */

            async function close() {
              host.closeAllConnections(); host.close();
              await panel.close();
              await rm(root, { recursive: true, force: true });
              process.exit();
            }

            for (const signal of ["SIGINT", "SIGTERM"]) process.once(signal,
            close);
