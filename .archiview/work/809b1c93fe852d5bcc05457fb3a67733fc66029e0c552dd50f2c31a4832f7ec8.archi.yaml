              command: string;
              args: string[];
              cwd?: string;
              env?: Record<string, string>;
            }

            interface CodexConfiguration { mcpServers: { archiview:
            InstalledServer } }

            interface CodexManifest { name: string; version: string; mcpServers:
            string }

            interface CodexOptions { executable?: string; cwd?: string }

            interface InstallResult { pluginId: string; installedPath: string;
