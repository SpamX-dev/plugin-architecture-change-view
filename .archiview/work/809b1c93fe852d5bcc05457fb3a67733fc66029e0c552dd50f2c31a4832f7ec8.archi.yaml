          text: >
            import { build } from "esbuild";

            import { copyFile, mkdir } from "node:fs/promises";

            import path from "node:path";

            import { fileURLToPath } from "node:url";


            export async function buildWeb(root = new URL("../",
            import.meta.url)) {
              const assets = new URL("dist/web/archiview/", root);
              await mkdir(assets, { recursive: true });
              await build({
                absWorkingDir: fileURLToPath(root),
                entryPoints: {
                  app: "web/web-ui/web-entry.ts",
                  client: "web/web-ui/archiview-client/client.ts",
                  review: "web/web-ui/views/review.ts",
                },
                outdir: fileURLToPath(assets),
                outExtension: { ".js": ".mjs" },
                bundle: true, platform: "browser", target: "es2022", format: "esm",
              });
              for (const name of ["index.html", "styles.css", "favicon.svg"]) {
                await copyFile(new URL("web/web-ui/views/" + name, root), new URL(name, assets));
              }
            }


            if (process.argv[1] && path.resolve(process.argv[1]) ===
            fileURLToPath(import.meta.url)) await buildWeb();
      - index: 76
        fact:
          id: sha256:3400ae744b27bf1a63696b634c49c1838335ae87ed87bc490905c28b1b7e6bf3
          kind: file
          path: builds/build.ts
          start_line: 1
          end_line: 23
          text: >
            import { build } from "esbuild";

            import { copyFile, mkdir, readFile, writeFile } from
            "node:fs/promises";

            import { fileURLToPath } from "node:url";

            import { buildWeb } from "./build-web.js";


            const root = new URL("../", import.meta.url);

            const output = new URL("dist/", root);

            await buildWeb(root);

            await build({
              absWorkingDir: fileURLToPath(root),
              entryPoints: ["cli/packaged-cli.ts"],
              outfile: fileURLToPath(new URL("cli.mjs", output)),
              bundle: true, format: "esm", platform: "node", target: "node22",
              banner: { js: 'import { createRequire } from "node:module"; const require = createRequire(import.meta.url);' },
            });

            const { name, version, type, license, engines } = JSON.parse(await
            readFile(new URL("package.json", root), "utf8"));

            await writeFile(new URL("package.json", output), JSON.stringify({
            name, version, type, license, engines, bin: { archiview: "cli.mjs" }
            }, null, 2) + "\n");

            await mkdir(new URL("docs/", output), { recursive: true });

            await mkdir(new URL("skills/module-boundaries/", output), {
            recursive: true });

            for (const file of ["LICENSE", "skills/module-boundaries/SKILL.md",
            "docs/report-format-v2.md", "docs/arch-review-format-v1.md",
            "docs/module-roles.md",
            "docs/report-storage-and-compaction-design.md"]) {
              await copyFile(new URL(file, root), new URL(file, output));
            }
