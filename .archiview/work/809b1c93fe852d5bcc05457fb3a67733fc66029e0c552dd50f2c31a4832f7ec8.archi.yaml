                    frame.contentWindow.postMessage({ jsonrpc: "2.0", id: message.id, result }, "*");
                  });
                  document.querySelector("#complete").onclick = () => fetch("/complete", { method: "POST" });
                  frame.srcdoc = panelHtml;
                </script></html>`);
            });

            await new Promise<void>((resolve) => host.listen(0, "127.0.0.1",
            resolve));

            process.stdout.write("UI protocol preview: http://127.0.0.1:" +
            (host.address() as AddressInfo).port + "\nTemporary project: " +
            root + "\n");

            /** Убирает только временный проект, созданный этим стендом, и
            принадлежащие ему серверы. */

            async function close() {
              host.closeAllConnections(); host.close();
              await panel.close();
              await rm(root, { recursive: true, force: true });
              process.exit();
            }

            for (const signal of ["SIGINT", "SIGTERM"]) process.once(signal,
            close);
