      - index: 15
        fact:
          id: sha256:128fc8ce75994eb17e8dafb26ddd40d49cf09d87a4d490d22a22d4498698c14c
          kind: file
          path: scripts/build-plugin.mjs
          start_line: 1
          end_line: 52
          text: |
            /**
             * Автономная локальная поставка: бандлы Node и самодостаточный UI SDK исключают
             * npm install внутри кеша плагинов. Результат всегда находится только в dist/codex.
             */
            import { build } from "esbuild";
            import { cp, mkdir, readFile, writeFile } from "node:fs/promises";
            import { fileURLToPath } from "node:url";

            const root = new URL("../", import.meta.url);
            const output = new URL("dist/codex/", root);
            await mkdir(new URL("src/", output), { recursive: true });
            // Панель должна выполнить ui/initialize без загрузки скриптов с loopback:
            // хост может применять отдельную CSP для ресурсов и сетевых запросов.
            const panelBundle = await build({
              entryPoints: [fileURLToPath(new URL("web/archiview/app.mjs", root))],
              bundle: true, write: false, platform: "browser", target: "es2022", format: "esm",
              plugins: [{ name: "panel-sdk", setup(builder) {
                builder.onResolve({ filter: /^\.\/mcp-app-sdk\.mjs$/ }, () => ({
                  path: fileURLToPath(new URL(import.meta.resolve("@modelcontextprotocol/ext-apps/app-with-deps"))),
                }));
              } }],
            });
            const [template, styles] = await Promise.all([
              readFile(new URL("web/archiview/index.html", root), "utf8"),
              readFile(new URL("web/archiview/styles.css", root), "utf8"),
            ]);
            const panelHtml = template
              .replace('<link rel="stylesheet" href="/styles.css">', () => `<style>${styles.replace(/<\/style/gi, "<\\/style")}</style>`)
              .replace('<script type="module" src="/app.mjs"></script>', () => `<script type="module">${panelBundle.outputFiles[0].text.replace(/<\/script/gi, "<\\/script")}</script>`);
            await writeFile(new URL("dist/panel.html", root), panelHtml);
            await mkdir(new URL("dist/", output), { recursive: true });
            await writeFile(new URL("dist/panel.html", output), panelHtml);
            await build({
              entryPoints: { server: fileURLToPath(new URL("src/server.mjs", root)), cli: fileURLToPath(new URL("src/cli.mjs", root)) },
              outdir: fileURLToPath(new URL("src/", output)), outExtension: { ".js": ".mjs" },
              bundle: true, platform: "node", target: "node22", format: "esm",
              banner: { js: 'import { createRequire as archiviewCreateRequire } from "node:module"; const require = archiviewCreateRequire(import.meta.url);' },
            });
            for (const name of ["web", "skills", "docs"]) await cp(new URL(name, root), new URL(name, output), { recursive: true });
            for (const name of ["plugin.json", "mcp.json", "package.json", "README.md", "LICENSE"])
              await cp(new URL(name, root), new URL(name, output));
            await cp(new URL(import.meta.resolve("@modelcontextprotocol/ext-apps/app-with-deps")),
              new URL("web/archiview/mcp-app-sdk.mjs", output));
            // Версии npm и плагина согласованы; пакет не требует установки зависимостей в кеше.
            const metadata = JSON.parse(await readFile(new URL("package.json", output), "utf8"));
            delete metadata.dependencies;
            delete metadata.devDependencies;
            delete metadata.scripts;
            metadata.bin.archiview = "src/cli.mjs";
            await writeFile(new URL("package.json", output), JSON.stringify(metadata, null, 2) + "\n");
            process.stdout.write("Codex plugin built: " + fileURLToPath(output) + "\n");
      - index: 16
        fact:
          id: sha256:4310b53816f859ebf6d8c6f07f01be2391223a3c562c2da7ec50d5670a6d3a8d
          kind: file
          path: scripts/preview-panel.mjs
          start_line: 1
          end_line: 102
          text: >
            /**
             * Ручной протокольный стенд: настоящий UI и HTTP backend во временном проекте,
             * с явно обозначенным тестовым хостом MCP Apps. Не запускает модель и не подменяет
             * проверку в настоящем Codex. Позволяет проверить bridge, CORS и отказ отправки.
             */
            import { createServer } from "node:http";

            import { mkdtemp, mkdir, writeFile, rm, readFile } from
            "node:fs/promises";

            import path from "node:path";

            import os from "node:os";

            import { stringify, parse } from "yaml";

            import { createCodexPanel } from "../src/codex/panel.mjs";

            import { loadPanelTls } from "../src/codex/tls.mjs";

            import { AnalysisRequests } from "../src/archiview/analysis.mjs";

            import { SnapshotStore } from "../src/snapshot-store.mjs";

            import { ReportStore } from "../src/report-store.mjs";

            import { digest } from "../src/formats.mjs";


            const root = await mkdtemp(path.join(os.tmpdir(),
            "archiview-panel-preview-"));

            await mkdir(path.join(root, "domain"));

            for (const [directory, id, title] of [[".", "preview", "Тестовый
            проект"], ["domain", "domain", "Игровой модуль"]]) {
              await writeFile(path.join(root, directory, "arch.yaml"), stringify({ schema_version: 1, id, title,
                kind: "module", purpose: "Обслуживать тестовый игровой модуль.",
                responsibilities: { R1: "Вычислять значение без изменения состояния." },
                boundaries: { B1: "Не обращаться к сети." }, invariants: { I1: "Результат детерминирован." } }));
            }

            await writeFile(path.join(root, "domain/value.js"), "export const
            value = () => 42;\n");

            const panel =
            createCodexPanel(process.argv.includes("--select-project") ?
            undefined : root,
              { tls: process.argv.includes("--https") ? await loadPanelTls() : undefined });
            const resource = (await panel.resource()).contents[0];

            // Воспроизводит ограничение Codex: внешние JS/CSS запрещены,
            loopback разрешён

            // только для API. Нельзя случайно проверить панель в более
            свободной среде.

            const panelPolicy = "default-src 'none'; script-src 'unsafe-inline';
            style-src 'unsafe-inline'; " +
              "img-src data:; connect-src " + resource._meta.ui.csp.connectDomains.join(" ");
            const constrainedHtml = resource.text.replace("<head>", `<head><meta
            http-equiv="Content-Security-Policy" content="${panelPolicy}">`);

            const messages = [];

            const host = createServer(async (request, response) => {
              if (request.url === "/messages") {
                response.writeHead(200, { "Content-Type": "application/json" }); return response.end(JSON.stringify(messages));
              }
              if (request.url === "/message" && request.method === "POST") {
                let body = ""; for await (const chunk of request) body += chunk;
                messages.push(JSON.parse(body)); response.writeHead(204); return response.end();
              }
              if (request.url === "/complete" && request.method === "POST") {
                // Искусственный результат стенда явно помечен test; он хранится только во временном проекте.
                const store = new SnapshotStore(root); await store.open();
                const reports = new ReportStore(store);
                const directory = path.join(root, ".archiview/snapshots/analysis");
                const id = /"requestId":"([a-f0-9-]+)"/.exec(messages.at(-1)?.content?.[0]?.text ?? "")?.[1];
                if (!id) { response.writeHead(400); return response.end("No accepted request"); }
                const input = parse(await readFile(path.join(directory, id, "input.yaml"), "utf8"));
                input.report.analysis.model = { provider: "test", id: "UI protocol fixture" };
                input.report.analysis.prompt_digest = digest("UI protocol fixture");
                input.manifest.model = input.report.analysis.model;
                input.manifest.prompt_digest = input.report.analysis.prompt_digest;
                input.report.analysis.coverage = { status: "partial", limitations: ["Искусственный результат протокольного стенда; анализ кода не выполнялся."] };
                await writeFile(path.join(directory, id, "result.yaml"), stringify(input, { aliasDuplicateObjects: false }));
                await new AnalysisRequests(store, reports).complete(id);
                response.writeHead(204); return response.end();
              }
              response.writeHead(200, { "Content-Type": "text/html; charset=utf-8" });
              response.end(`<!doctype html><html lang="ru"><meta charset="utf-8"><title>ArchiView — тестовый хост MCP Apps</title>
                <style>body{margin:0;font:14px system-ui;background:#f4f6f5}header{padding:10px 16px;display:flex;gap:14px;align-items:center}iframe{width:100%;height:calc(100vh - 55px);border:0}#count{margin-left:auto}</style>
                <header><strong>Тестовый хост MCP Apps</strong><span id="connection">Ожидаем подключения</span><label><input id="reject" type="checkbox">Отклонять поручения</label><button id="complete">Импортировать тестовый результат</button><span id="count">Поручений: 0</span></header>
                <iframe id="panel" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
                <script type="module">
                  const frame = document.querySelector("iframe");
                  const panelHtml = ${JSON.stringify(constrainedHtml).replace(/</g, "\\u003c")};
                  let count = 0;
                  window.addEventListener("message", async (event) => {
                    if (event.source !== frame.contentWindow || !event.data?.method) return;
                    if (event.data.method === "ui/notifications/initialized") document.querySelector("#connection").textContent = "MCP Apps подключён";
                    if (event.data.id === undefined) return;
                    const message = event.data;
                    let result = {};
                    if (message.method === "ui/initialize") result = { protocolVersion: message.params.protocolVersion,
                      hostInfo: { name: "ArchiView protocol test host", version: "1" }, hostCapabilities: { message: { text: {} } },
                      hostContext: { theme: "light", displayMode: "inline", availableDisplayModes: ["inline"] } };
                    if (message.method === "ui/message") {
                      result = { isError: document.querySelector("#reject").checked };
                      if (!result.isError) {
                        await fetch("/message", { method: "POST", body: JSON.stringify(message.params) });
                        document.querySelector("#count").textContent = "Поручений: " + (++count);
                      }
                    }
