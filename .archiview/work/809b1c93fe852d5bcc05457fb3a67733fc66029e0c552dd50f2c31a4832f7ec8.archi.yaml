    contract:
      schema_version: 1
      id: archiview-distribution
      title: Сборка локального плагина
      kind: module
      purpose: Собирать автономные пакеты локальных плагинов Codex и dsh из исходников
        ArchiView.
      responsibilities:
        R1: Упаковывать сервер, CLI, веб-ресурсы, схемы обмена и скиллы в переносимый
          каталог без зависимости от node_modules установленного плагина.
        R2: Предоставлять явно обозначенный протокольный стенд во временном проекте для
          проверки UI, bridge и отказа хоста без запуска модели.
        R3: По отдельной явной команде устанавливать пакет Codex штатным установщиком и
          разрешать пути его MCP-конфигурации относительно фактического
          установленного каталога. Находить CLI через явно заданный путь, PATH
          или установку приложения Codex в Windows.
        R4: Собирать переносимый Windows x64-архив с локальным marketplace, установщиком
          и Node с его лицензией; устанавливать встроенный рантайм относительно
          фактического каталога кеша целевой машины.
      boundaries:
        B1: Сборка не меняет пользовательскую конфигурацию Codex и не публикует плагин.
      invariants:
        I1: Сгенерированные файлы находятся в dist; исходные файлы и данные проектов не
          заменяются.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным
          адаптерам. Извлечение символов, разрешение зависимостей и индексация
          AST принадлежат ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено настроенным корнем проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-change-view
        section: invariants
        id: I5
        text: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются
          строгим TypeScript перед сборкой; классы сохраняют единственную
          ответственность внутри границ своих модулей.
