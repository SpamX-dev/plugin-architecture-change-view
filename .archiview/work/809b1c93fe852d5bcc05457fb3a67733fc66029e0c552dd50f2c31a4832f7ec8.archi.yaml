    contract:
      schema_version: 1
      id: archiview-distribution
      title: Сборка локального плагина
      kind: module
      purpose: Собирать автономный локальный плагин Codex из исходников ArchiView.
      responsibilities:
        R1: Упаковывать сервер, CLI, веб-ресурсы, схемы обмена и скиллы в переносимый
          каталог без зависимости от node_modules установленного плагина.
        R2: Предоставлять явно обозначенный протокольный стенд во временном проекте для
          проверки UI, bridge и отказа хоста без запуска модели.
      boundaries:
        B1: Сборка не меняет пользовательскую конфигурацию Codex и не публикует плагин.
      invariants:
        I1: Сгенерированные файлы находятся в dist; исходные файлы и данные проектов не
          заменяются.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex принадлежит отдельному адаптеру. Извлечение
          символов, разрешение зависимостей и индексация AST принадлежат
          ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено настроенным корнем проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
