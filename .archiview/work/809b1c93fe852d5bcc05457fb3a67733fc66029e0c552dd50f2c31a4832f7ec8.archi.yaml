        fact:
          id: sha256:11b7fc35b58f0a34c824dd90b5a5d94f145e307f5944251cd403e585bf47218c
          kind: file
          path: scripts/install-plugin.mjs
          start_line: 1
          end_line: 48
          text: >
            /**
             * Явная установка локального пакета Codex. Native legacy-загрузчик не раскрывает
             * PLUGIN_ROOT в .mcp.json, поэтому после штатной установки пути привязываются к
             * возвращённому каталогу кеша. Сборка и остальные плагины конфигурацию не меняют.
             */
            import { execFile } from "node:child_process";

            import { constants } from "node:fs";

            import { copyFile, readFile, realpath, writeFile } from
            "node:fs/promises";

            import path from "node:path";

            import { fileURLToPath, pathToFileURL } from "node:url";

            import { promisify } from "node:util";


            /** Сохраняет исходный шаблон и разрешает только конфигурацию MCP
            установленного ArchiView. */

            export async function configureInstalledCodexPlugin(installedPath) {
              const root = await realpath(installedPath);
              const manifest = JSON.parse(await readFile(path.join(root, ".codex-plugin/plugin.json"), "utf8"));
              if (manifest.name !== "archiview" || manifest.mcpServers !== "./.mcp.json") throw new Error("Unexpected installed ArchiView manifest");
              const file = path.join(root, ".mcp.json");
              const configuration = JSON.parse(await readFile(file, "utf8"));
              const server = configuration.mcpServers?.archiview;
              if (server?.command !== "node" || !Array.isArray(server.args) || !server.args.includes("--panel")) throw new Error("Unexpected installed ArchiView server");
              // Оригинальный шаблон сохраняется один раз; повторная настройка идемпотентна.
              try { await copyFile(file, path.join(root, ".mcp.json.template"), constants.COPYFILE_EXCL); }
              catch (error) { if (error.code !== "EEXIST") throw error; }
              server.args = server.args.map((argument) => argument.replaceAll("${PLUGIN_ROOT}", root));
              // Без cwd Codex передаёт рабочую папку чата, в том числе до первого сообщения.
              // Каталог установки нужен только для поиска кода и не должен подменять этот контекст.
              delete server.cwd;
              server.env = { ...server.env, PLUGIN_ROOT: root };
              await writeFile(file, JSON.stringify(configuration, null, 2) + "\n");
              return { installedPath: root, version: manifest.version, configuration };
            }


            /** Установщик CLI выбирает версию и каталог; код не вычисляет путь
            кеша по имени пользователя. */

            export async function installCodexPlugin({ executable = "codex", cwd
            = fileURLToPath(new URL("../", import.meta.url)) } = {}) {
              const { stdout } = await promisify(execFile)(executable,
                ["plugin", "add", "archiview@archiview-local", "--json"], { cwd, windowsHide: true });
              const installed = JSON.parse(stdout);
              if (installed.pluginId !== "archiview@archiview-local" || typeof installed.installedPath !== "string") throw new Error("Unexpected Codex install result");
              const configured = await configureInstalledCodexPlugin(installed.installedPath);
              return { ...installed, installedPath: configured.installedPath, mcpPathsResolved: true };
            }


            if (process.argv[1] && import.meta.url ===
            pathToFileURL(path.resolve(process.argv[1])).href) {
              const installed = await installCodexPlugin();
              process.stdout.write(JSON.stringify(installed, null, 2) + "\n");
            }
      - index: 20
        fact:
          id: sha256:9fe7c3b7bbe34e61d22fd68fb8416aa11b308cbf7367be3f75139b261ca848e8
          kind: file
          path: scripts/preview-panel.mjs
          start_line: 1
          end_line: 110
          text: >
            /**
             * Ручной протокольный стенд: настоящий UI и прикладной сервис во временном проекте,
             * с явно обозначенным тестовым хостом MCP Apps. Не запускает модель и не подменяет
             * проверку в настоящем Codex. Позволяет проверить bridge без сети в iframe и отказ отправки.
             */
            import { createServer } from "node:http";

            import { mkdtemp, mkdir, writeFile, rm, readFile } from
            "node:fs/promises";

            import path from "node:path";

            import os from "node:os";

            import { stringify, parse } from "yaml";

            import { createCodexPanel } from "../src/codex/panel.mjs";

            import { createCodexProjectBinding } from
            "../src/codex/project-context.mjs";

            import { AnalysisRequests } from "../src/application/analysis.mjs";

            import { SnapshotStore } from "../src/snapshot-store.mjs";

            import { ReportStore } from "../src/report-store.mjs";

            import { digest } from "../src/formats.mjs";


            const root = await mkdtemp(path.join(os.tmpdir(),
            "archiview-panel-preview-"));

            await mkdir(path.join(root, "domain"));

            for (const [directory, id, title] of [[".", "preview", "Тестовый
            проект"], ["domain", "domain", "Игровой модуль"]]) {
              await writeFile(path.join(root, directory, "arch.yaml"), stringify({ schema_version: 1, id, title,
                kind: "module", purpose: "Обслуживать тестовый игровой модуль.",
                responsibilities: { R1: "Вычислять значение без изменения состояния." },
                boundaries: { B1: "Не обращаться к сети." }, invariants: { I1: "Результат детерминирован." } }));
            }

            await writeFile(path.join(root, "domain/value.js"), "export const
            value = () => 42;\n");

            const binding = process.argv.includes("--unknown-context") ? await
            createCodexProjectBinding(undefined, {
              readContext: async () => ({ status: "unknown" }),
            }) : process.argv.includes("--select-project") ? undefined : root;

            const panel = createCodexPanel(binding);

            const resource = (await panel.resource()).contents[0];

            // В iframe запрещена вся сеть; только тестовый хост снаружи
            пересылает MCP-сообщения.

            const panelPolicy = "default-src 'none'; script-src 'unsafe-inline';
            style-src 'unsafe-inline'; " +
              "img-src data:; connect-src 'none'";
            const constrainedHtml = resource.text.replace("<head>", `<head><meta
            http-equiv="Content-Security-Policy" content="${panelPolicy}">`);

            const messages = [];

            const host = createServer(async (request, response) => {
              if (request.url === "/tools" && request.method === "POST") {
                let body = ""; for await (const chunk of request) body += chunk;
                const call = JSON.parse(body);
                response.writeHead(200, { "Content-Type": "application/json" });
                return response.end(JSON.stringify(await panel.callUi(call.name, call.arguments)));
              }
              if (request.url === "/messages") {
                response.writeHead(200, { "Content-Type": "application/json" }); return response.end(JSON.stringify(messages));
              }
              if (request.url === "/message" && request.method === "POST") {
                let body = ""; for await (const chunk of request) body += chunk;
                messages.push(JSON.parse(body)); response.writeHead(204); return response.end();
              }
              if (request.url === "/complete" && request.method === "POST") {
                // Искусственный результат стенда явно помечен test; он хранится только во временном проекте.
                const store = new SnapshotStore(root); await store.open();
                const reports = new ReportStore(store);
                const directory = path.join(root, ".archiview/snapshots/analysis");
                const id = /"requestId":"([a-f0-9-]+)"/.exec(messages.at(-1)?.content?.[0]?.text ?? "")?.[1];
                if (!id) { response.writeHead(400); return response.end("No accepted request"); }
                const input = parse(await readFile(path.join(directory, id, "input.yaml"), "utf8"));
                input.report.analysis.model = { provider: "test", id: "UI protocol fixture" };
                input.report.analysis.prompt_digest = digest("UI protocol fixture");
                input.manifest.model = input.report.analysis.model;
                input.manifest.prompt_digest = input.report.analysis.prompt_digest;
                input.report.analysis.coverage = { status: "partial", limitations: ["Искусственный результат протокольного стенда; анализ кода не выполнялся."] };
                await writeFile(path.join(directory, id, "result.yaml"), stringify(input, { aliasDuplicateObjects: false }));
                await new AnalysisRequests(store, reports).complete(id);
                response.writeHead(204); return response.end();
              }
