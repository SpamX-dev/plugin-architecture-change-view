            title: Сборка локального плагина

            kind: module

            purpose: Собирать автономные пакеты локальных плагинов Codex и dsh
            из исходников ArchiView.

            responsibilities:
              R1: Упаковывать сервер, CLI, веб-ресурсы, схемы обмена и скиллы в переносимый каталог без зависимости от node_modules установленного плагина.
              R2: Предоставлять явно обозначенный протокольный стенд во временном проекте для проверки UI, bridge и отказа хоста без запуска модели.
              R3: По отдельной явной команде устанавливать пакет Codex штатным установщиком и разрешать пути его MCP-конфигурации относительно фактического установленного каталога.
            boundaries:
              B1: Сборка не меняет пользовательскую конфигурацию Codex и не публикует плагин.
            invariants:
