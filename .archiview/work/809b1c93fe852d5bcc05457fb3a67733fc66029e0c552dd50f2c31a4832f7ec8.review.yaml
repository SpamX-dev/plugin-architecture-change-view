            из исходников ArchiView.

            responsibilities:
              R1: Упаковывать сервер, CLI, веб-ресурсы, схемы обмена и скиллы в переносимый каталог без зависимости от node_modules установленного плагина.
              R2: Предоставлять явно обозначенный протокольный стенд во временном проекте для проверки UI, bridge и отказа хоста без запуска модели.
              R3: По отдельной явной команде устанавливать пакет Codex штатным установщиком и разрешать пути его MCP-конфигурации относительно фактического установленного каталога.
                Находить CLI через явно заданный путь, PATH или установку приложения Codex в Windows.
              R4: Собирать переносимый Windows x64-архив с локальным marketplace, установщиком и Node с его лицензией;
                устанавливать встроенный рантайм относительно фактического каталога кеша целевой машины.
            boundaries:
              B1: Сборка не меняет пользовательскую конфигурацию Codex и не публикует плагин.
            invariants:
              I1: Сгенерированные файлы находятся в dist; исходные файлы и данные проектов не заменяются.
        - id: sha256:00e9d8b4cffcface1cf1159dd97feec458b7e5bfce9b19a8b60166e75fc282ae
          kind: file
          path: scripts/build-dsh.mjs
          start_line: 1
          end_line: 118
          text: >
            /**
             * Сборка плагина dsh: две половины одного пакета и автономный каталог установки.
             *
             * `dist/dsh/lib/index.js` — хост-половина для Node: cordis-плагин, который регистрирует
             * инструменты, маршруты и скилл. `dist/dsh/lib/client.js` — браузерная половина в
             * формате загрузчика dsh: бандл лишь регистрирует фабрику через
             * `window.__ModuleLoader__.load`, а тело выполняется при первом открытии
             * вкладки.
             *
             * `dist/dsh` — самостоятельный пакет для установки в профиль: только собранные
             * половины, интерфейс, скилл и документы, без зависимостей и devDependencies.
             * Бандл CLI нужен потому, что поручение анализа ссылается на `src/cli.mjs`
             * относительно корня установленного пакета.
             *
             * Пакеты `@deepseek-ai/*` остаются внешними: их предоставляет хост dsh и его
             * таблица платформы, поэтому бандл не несёт вторую копию cordis или React.
             * Остальные зависимости прикладного сервиса встраиваются в `lib/index.js`,
             * чтобы установленный пакет не требовал node_modules.
             *
             * @module plugin-architecture-change-view/scripts/build-dsh
             */

            import { build } from "esbuild";

            import { cp, mkdir, readFile, writeFile } from "node:fs/promises";

            import { fileURLToPath } from "node:url";


            /** Корень пакета. */

            const root = new URL("../", import.meta.url);

            /** Каталог автономного пакета для установки в профиль dsh. */

            const distribution = new URL("dist/dsh/", root);

            /** Обе половины создаются сразу в пакете: сборка не пишет за
            пределами dist. */

            const output = new URL("lib/", distribution);

            /** Идентификатор бандла в загрузчике клиента dsh — имя пакета. */

            const metadata = JSON.parse(await readFile(new URL("package.json",
            root), "utf8"));


            /** Общее для Node-бандлов: CJS-зависимости получают рабочий
            `require`. */

            const nodeBanner = {
              js: 'import { createRequire as archiviewCreateRequire } from "node:module";\n' +
                "const require = archiviewCreateRequire(import.meta.url);",
            };


            await mkdir(output, { recursive: true });


            // Хост-половина: один ESM-файл, который загрузчик импортирует по
            имени пакета.

            await build({
              entryPoints: [fileURLToPath(new URL("src/dsh/host.mjs", root))],
              outfile: fileURLToPath(new URL("index.js", output)),
              bundle: true,
              platform: "node",
              target: "node22",
              format: "esm",
              external: ["@deepseek-ai/*"],
              banner: nodeBanner,
            });


            // Браузерная половина: CJS-бандл внутри фабрики загрузчика dsh.

            const client = await build({
              entryPoints: [fileURLToPath(new URL("src/dsh/client/index.mjs", root))],
              bundle: true,
              write: false,
              platform: "browser",
              target: "es2022",
              format: "cjs",
              external: ["react", "react/jsx-runtime", "@deepseek-ai/*"],
            });


            const wrapped = `window.__ModuleLoader__.load({
              id: ${JSON.stringify(metadata.name)},
              factory: (require) => {
                var module = { exports: {} };
                var exports = module.exports;
            ${client.outputFiles[0].text}
                return module.exports;
              },
            });

            `;

            await writeFile(new URL("client.js", output), wrapped);


            // Автономный пакет установки: CLI кладётся на путь, который ожидает
            поручение анализа.

            await mkdir(new URL("src/", distribution), { recursive: true });

            await build({
              entryPoints: [fileURLToPath(new URL("src/cli.mjs", root))],
              outfile: fileURLToPath(new URL("src/cli.mjs", distribution)),
              bundle: true,
              platform: "node",
              target: "node22",
              format: "esm",
              banner: nodeBanner,
            });

            for (const name of ["web", "skills", "docs"]) {
              await cp(new URL(name, root), new URL(name, distribution), { recursive: true });
            }

            await cp(new URL("LICENSE", root), new URL("LICENSE",
            distribution));

            await cp(new URL("cordis.patch.yml", root), new
            URL("cordis.patch.yml", distribution));


            const manifest = {
              name: metadata.name,
              version: metadata.version,
              description: metadata.description,
              type: "module",
              main: "lib/index.js",
              exports: {
                ".": "./lib/index.js",
                "./client": "./lib/client.js",
                "./package.json": "./package.json",
              },
              files: ["lib", "src/cli.mjs", "web", "skills", "docs", "cordis.patch.yml", "LICENSE"],
              dsh: metadata.dsh,
              peerDependencies: metadata.peerDependencies,
              peerDependenciesMeta: metadata.peerDependenciesMeta,
              license: metadata.license,
              engines: metadata.engines,
            };

            await writeFile(new URL("package.json", distribution),
            JSON.stringify(manifest, null, 2) + "\n");


            process.stdout.write("dsh plugin built: " + fileURLToPath(output) +
            "\n");

            process.stdout.write("dsh package: " + fileURLToPath(distribution) +
            "\n");
        - id: sha256:81988bdb9706d7588c696ca9ab94e9e0da6c09e4def0d448b75d67570495e499
          kind: file
          path: scripts/build-plugin.mjs
          start_line: 1
          end_line: 82
          text: |
            /**
             * Автономная локальная поставка: бандлы Node и самодостаточный UI SDK исключают
             * npm install внутри кеша плагинов. Результат всегда находится только в dist/codex.
             */
            import { build } from "esbuild";
            import { cp, mkdir, readFile, rm, writeFile } from "node:fs/promises";
            import { fileURLToPath } from "node:url";

            const root = new URL("../", import.meta.url);
            const output = new URL("dist/codex/", root);
            await mkdir(new URL("src/", output), { recursive: true });
            // Панель должна выполнить ui/initialize без загрузки скриптов с loopback:
            // хост может применять отдельную CSP для ресурсов и сетевых запросов.
            const panelBundle = await build({
              entryPoints: [fileURLToPath(new URL("web/archiview/app.mjs", root))],
              bundle: true, write: false, platform: "browser", target: "es2022", format: "esm",
              plugins: [{ name: "panel-sdk", setup(builder) {
                // Только приложение внутри Codex получает резервную форму и нативный выбор.
                builder.onResolve({ filter: /^\.\/client\.mjs$/ }, (args) => args.importer === fileURLToPath(new URL("web/archiview/app.mjs", root)) ? {
                  path: fileURLToPath(new URL("src/codex/panel-client.mjs", root)),
                } : undefined);
                builder.onResolve({ filter: /^\.\/mcp-app-sdk\.mjs$/ }, () => ({
                  path: fileURLToPath(new URL(import.meta.resolve("@modelcontextprotocol/ext-apps/app-with-deps"))),
                }));
              } }],
            });
            const [template, styles] = await Promise.all([
              readFile(new URL("web/archiview/index.html", root), "utf8"),
              readFile(new URL("web/archiview/styles.css", root), "utf8"),
            ]);
            const panelHtml = template
              .replace('<link rel="stylesheet" href="/styles.css">', () => `<style>${styles.replace(/<\/style/gi, "<\\/style")}</style>`)
              .replace('<script type="module" src="/app.mjs"></script>', () => `<script type="module">${panelBundle.outputFiles[0].text.replace(/<\/script/gi, "<\\/script")}</script>`);
            await writeFile(new URL("dist/panel.html", root), panelHtml);
            await mkdir(new URL("dist/", output), { recursive: true });
            await writeFile(new URL("dist/panel.html", output), panelHtml);
            await build({
              entryPoints: { server: fileURLToPath(new URL("src/server.mjs", root)), cli: fileURLToPath(new URL("src/cli.mjs", root)) },
              outdir: fileURLToPath(new URL("src/", output)), outExtension: { ".js": ".mjs" },
              bundle: true, platform: "node", target: "node22", format: "esm",
              banner: { js: 'import { createRequire as archiviewCreateRequire } from "node:module"; const require = archiviewCreateRequire(import.meta.url);' },
            });
            for (const name of ["web", "skills", "docs"]) await cp(new URL(name, root), new URL(name, output), { recursive: true });
            for (const name of ["package.json", "README.md", "LICENSE"])
              await cp(new URL(name, root), new URL(name, output));
            // Формат Codex поддерживает env_vars: переносимый mcp.json v1 не умеет
            // передавать канал контекста из окружения хоста. Общий portable-пакет не меняется.
            const portablePlugin = JSON.parse(await readFile(new URL("plugin.json", root), "utf8"));
            const portableMcp = JSON.parse(await readFile(new URL("mcp.json", root), "utf8"));
            await mkdir(new URL(".codex-plugin/", output), { recursive: true });
            await writeFile(new URL(".codex-plugin/plugin.json", output), JSON.stringify({
              name: portablePlugin.name, version: portablePlugin.version, description: portablePlugin.description,
              skills: "./skills/", mcpServers: "./.mcp.json", requires_local_executor: true,
              interface: portablePlugin.extensions["com.openai"].interface,
            }, null, 2) + "\n");
            const codexServer = { ...portableMcp.mcpServers.archiview,
              env_vars: ["CODEX_APP_TOOLS_PIPE_PATH", "CODEX_APP_TOOLS_CALLER_HOST_ID"] };
            delete codexServer.type;
            await writeFile(new URL(".mcp.json", output), JSON.stringify({ mcpServers: { archiview: codexServer } }, null, 2) + "\n");
            // Оставшиеся от прежних сборок portable-манифесты перекрыли бы конфигурацию Codex.
            for (const name of ["plugin.json", "mcp.json", "src/codex/session-start.mjs"])
              await rm(new URL(name, output), { force: true });
            await cp(new URL(import.meta.resolve("@modelcontextprotocol/ext-apps/app-with-deps")),
              new URL("web/archiview/mcp-app-sdk.mjs", output));
            // Автономный пакет использует версию Codex-плагина; общая npm/dsh-версия не меняется.
            const metadata = JSON.parse(await readFile(new URL("package.json", output), "utf8"));
            metadata.version = portablePlugin.version;
            delete metadata.dependencies;
            delete metadata.devDependencies;
            delete metadata.scripts;
            // dist/codex — самостоятельный пакет Codex: записи плагина dsh здесь не публикуются.
            delete metadata.main;
            delete metadata.exports;
            delete metadata.dsh;
            delete metadata.peerDependencies;
            delete metadata.peerDependenciesMeta;
            metadata.bin.archiview = "src/cli.mjs";
            metadata.files = metadata.files.filter((name) => !["plugin.json", "mcp.json"].includes(name));
            metadata.files.push(".codex-plugin", ".mcp.json");
            await writeFile(new URL("package.json", output), JSON.stringify(metadata, null, 2) + "\n");
            process.stdout.write("Codex plugin built: " + fileURLToPath(output) + "\n");
        - id: sha256:e6e7c2766a8508ca13d7fd00945df8c89cc2c659c7abe55d97da1e7d93f4f26e
          kind: file
          path: scripts/build-portable.mjs
          start_line: 1
          end_line: 68
          text: >
            /**
             * Переносимый Windows x64-пакет включает плагин, локальный marketplace,
             * установщик и Node с лицензией. ZIP не содержит настроек исходной машины.
             * Повторная сборка заменяет только свой явно проверенный каталог внутри dist.
             */
            import { execFile } from "node:child_process";

            import { createHash } from "node:crypto";

            import { copyFile, cp, mkdir, readFile, rm, stat, writeFile } from
            "node:fs/promises";

            import path from "node:path";

            import { fileURLToPath } from "node:url";

            import { promisify } from "node:util";


            if (process.platform !== "win32" || process.arch !== "x64") throw
            new Error("Build this Windows x64 package using Node x64 on
            Windows.");

            await import("./build-plugin.mjs");

            const root = fileURLToPath(new URL("../", import.meta.url));

            const dist = path.resolve(root, "dist");

            const manifest = JSON.parse(await readFile(path.join(dist, "codex",
            ".codex-plugin", "plugin.json"), "utf8"));

            if (!/^\d+\.\d+\.\d+(?:[-+][\w.-]+)?$/.test(manifest.version)) throw
            new Error("Invalid portable package version");

            const name = "archiview-codex-" + manifest.version + "-windows-x64";

            const output = path.resolve(dist, name), archive =
            path.resolve(dist, name + ".zip");

            if (path.dirname(output) !== dist || path.dirname(archive) !== dist)
            throw new Error("Portable output must stay inside dist");


            // Лицензия соответствует ровно тому Node, чей исполняемый файл
            включён в архив.

            const licenseUrl = "https://raw.githubusercontent.com/nodejs/node/v"
            + process.versions.node + "/LICENSE";

            const response = await fetch(licenseUrl);

            if (!response.ok) throw new Error("Cannot retrieve the bundled Node
            license: " + response.status);

            const license = await response.text();

            if (!license.includes("Node.js") || !license.includes("Permission is
            hereby granted")) throw new Error("Unexpected Node license
            document");

            await rm(output, { recursive: true, force: true });

            await mkdir(path.join(output, "scripts"), { recursive: true });

            await cp(path.join(dist, "codex"), path.join(output, "plugin"), {
            recursive: true });

            await mkdir(path.join(output, "plugin", "runtime"));

            await copyFile(process.execPath, path.join(output, "plugin",
            "runtime", "node.exe"));

            await writeFile(path.join(output, "plugin", "runtime",
            "LICENSE.txt"), license);

            await writeFile(path.join(output, "plugin", "runtime",
            "VERSION.txt"), process.version + " windows-x64\n" + licenseUrl +
            "\n");

            const configurationPath = path.join(output, "plugin", ".mcp.json");

            const configuration = JSON.parse(await readFile(configurationPath,
            "utf8"));

            configuration.mcpServers.archiview.command =
            "${PLUGIN_ROOT}/runtime/node.exe";

            await writeFile(configurationPath, JSON.stringify(configuration,
            null, 2) + "\n");

            for (const file of ["install-plugin.mjs", "install-portable.mjs"])
            await copyFile(path.join(root, "scripts", file), path.join(output,
            "scripts", file));

            await copyFile(path.join(root, "scripts", "install-portable.ps1"),
            path.join(output, "Install.ps1"));

            await mkdir(path.join(output, ".agents", "plugins"), { recursive:
            true });

            await writeFile(path.join(output, ".agents", "plugins",
            "marketplace.json"), JSON.stringify({
              name: "archiview-local", plugins: [{ name: "archiview", source: { source: "local", path: "./plugin" },
                policy: { installation: "AVAILABLE", authentication: "ON_INSTALL" }, category: "Developer Tools" }],
            }, null, 2) + "\n");

            await writeFile(path.join(output, "INSTALL.md"), [
              "# ArchiView " + manifest.version + " — Windows x64", "",
              "На ноутбуке должно быть установлено приложение Codex для Windows. Node.js " + process.version + " включён в пакет; npm и отдельная установка Node.js не нужны.", "",
              "1. Распакуйте ZIP в постоянную папку, например `C:\\Tools\\ArchiView`.",
              "2. Откройте PowerShell в распакованной папке, рядом с `Install.ps1`.",
              "3. Выполните:", "", "```powershell", "powershell -NoProfile -ExecutionPolicy Bypass -File .\\Install.ps1", "```", "",
              "4. Перезапустите Codex и откройте ArchiView в чате с выбранной папкой проекта.", "",
              "Скрипт регистрирует эту папку как локальный marketplace, устанавливает плагин в кеш Codex и настраивает пути на этом компьютере. Сохраните распакованную папку для последующего обновления.", "",
              "Если Codex установлен нестандартно, перед запуском задайте `$env:ARCHIVIEW_CODEX_EXECUTABLE = 'C:\\путь\\к\\codex.exe'`.", "",
            ].join("\n"));


            // .NET включает в ZIP служебные каталоги .agents и .codex-plugin
            вместе с остальными файлами.

            await rm(archive, { force: true });

            const powershell = path.join(process.env.SystemRoot, "System32",
            "WindowsPowerShell", "v1.0", "powershell.exe");

            await promisify(execFile)(powershell, ["-NoProfile",
            "-NonInteractive", "-Command",
              "Add-Type -AssemblyName System.IO.Compression.FileSystem; [System.IO.Compression.ZipFile]::CreateFromDirectory($env:ARCHIVIEW_PACKAGE_SOURCE, $env:ARCHIVIEW_PACKAGE_ZIP, [System.IO.Compression.CompressionLevel]::Optimal, $true)"], {
              windowsHide: true, env: { ...process.env, ARCHIVIEW_PACKAGE_SOURCE: output, ARCHIVIEW_PACKAGE_ZIP: archive },
            });

            const checksum = createHash("sha256").update(await
            readFile(archive)).digest("hex");

            await writeFile(archive + ".sha256", checksum + "  " +
            path.basename(archive) + "\n");

            process.stdout.write(JSON.stringify({ archive, bytes: (await
            stat(archive)).size, sha256: checksum, node: process.version },
            null, 2) + "\n");
