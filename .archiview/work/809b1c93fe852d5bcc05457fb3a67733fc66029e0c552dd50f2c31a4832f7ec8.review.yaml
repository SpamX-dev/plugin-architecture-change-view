                I5: Отсутствие истории чата или временная недоступность его контекста не блокируют загрузку UI; исходный cwd MCP сохраняет рабочую папку чата и проверяется по каталогу папок хоста.
                I6: При неизвестной папке панель предлагает ручной ввод; в Windows нативный диалог открывается только явной кнопкой пользователя. Подтверждённое отсутствие проекта не обходится этой формой.
