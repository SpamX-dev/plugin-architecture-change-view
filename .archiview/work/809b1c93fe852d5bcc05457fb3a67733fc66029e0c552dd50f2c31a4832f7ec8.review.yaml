                  замечания и сохранённые доказательства. Ошибки показываются в
                  замечаниях без дублирующего общего вердикта; пункт и его
                  владелец доступны из замечания. Основной чеклист содержит
                  только собственные пункты выбранного состояния модуля; пункты
                  предков и повторы версий в него не включаются. Изменение
                  текста пункта и замечания к нему представлены независимо;
                  каждое замечание доступно отдельным переходом из пункта.
                  Открытые замечания обозначаются жуком на вкладке замечаний и в
                  дереве; свёрнутый родитель показывает также замечания скрытых
                  потомков, раскрытый — только собственные.
