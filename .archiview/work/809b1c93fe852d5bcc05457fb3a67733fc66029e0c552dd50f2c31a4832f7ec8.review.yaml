            const clause = shape({ snapshot: side, module_id: string, section,
            id: string });

            const snapshot = shape({ id: string, digest: hash });

            const observation = shape({ summary: string, responsibilities:
            array(shape({ text: string, evidence: array(evidence, 1) })) });

