            новые версии добавляются после проверки совместимости. */

            export const SUPPORTED_TECHNICAL_ANALYZER_VERSIONS =
            Object.freeze(["1.0.1", "1.0.2"]);


            /** Идентификатор модуля никогда не становится пользовательским
            фрагментом пути. */

            export const moduleReportName = (id) => digest(id).slice(7);


            /** YAML допускает только JSON-подобные значения, строковые ключи и
            один документ. */

            export function parseReportYaml(text) {
