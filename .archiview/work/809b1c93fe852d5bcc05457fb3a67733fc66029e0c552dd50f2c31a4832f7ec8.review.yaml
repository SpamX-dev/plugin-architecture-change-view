                во вкладке, не дублируя интерфейс и операции просмотра.
              responsibilities:
                R1: Регистрировать тип вкладки в полосе extension с идентификатором пакета и записью
                  в справочнике панели.
                R2: Регистрировать тело вкладки под тем же идентификатором в ключевом слоте панели.
                R3: Показывать страницу по адресу, который сообщает хост, передавать хосту идентификатор
                  чата вкладки и сохранять транспорт и разметку страницы внутри iframe.
                R4: Передавать явные поручения анализа и исправления замечания из панели в чат вкладки по сообщению моста, не
                  создавая ходов при обычной навигации.
              boundaries:
                B1: Вкладка не читает файлы проекта и не вызывает прикладной сервис напрямую.
                B2: Интерфейс и транспорт операций принадлежат web; клиент не описывает операции повторно.
                B3: Адрес страницы задаёт хост через внедрение конфигурации; клиент не вычисляет корень
                  проекта и не задаёт маршрут собственной константой. Без внедрения действует стандартный
                  префикс, совпадающий с настройкой хоста по умолчанию.
              invariants:
                I1: Регистрации типа и тела живут ровно столько же, сколько плагин.
                I2: Без маршрутов хоста вкладка показывает страницу хоста и не подменяет её скрытым
                  обходом или прямым чтением проекта.
                I3: Идентификатор типа уникален в клиенте и не совпадает с kind встроенных вкладок.
                I4: Мост принимает только сообщения родительского окна с тем же origin и только от
                  собственного iframe; отказ передачи виден панели, а не выдаётся за успех.
