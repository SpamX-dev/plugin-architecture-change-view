                B2: Адаптер использует MCP Apps для UI и предоставленный хостом канал Codex App Tools только для чтения метаданных текущего чата и рабочих папок; не читает внутренние базы и файлы стенограмм Codex.
              invariants:
                I1: Один процесс обслуживает один фиксированный корень; адаптер не открывает HTTP-порт и не требует сертификатов.
