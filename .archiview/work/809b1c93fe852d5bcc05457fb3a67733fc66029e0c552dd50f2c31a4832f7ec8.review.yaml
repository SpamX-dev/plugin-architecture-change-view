              responsibilities:
                R1: Регистрировать UI-ресурс, открытие панели в боковой вкладке чата и явные операции прикладного сервиса для UI; не добавлять глобальную точку открытия отдельного окна.
                R2: Скрывать операции UI от модели через visibility app; передавать данные и ошибки просмотра только в метаданных результата.
                R3: Автоматически привязывать экземпляр к выбранной рабочей папке чата Codex; отличать отсутствие папки от недоступности контекста и запрещать просмотр вне проектов.
              boundaries:
