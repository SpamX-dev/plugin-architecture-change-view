              R1: Читать YAML как однозначное JSON-совместимое значение.
              R3: Предоставлять проверки структуры данных с указанием поля, в котором обнаружена ошибка.
              R2: Вычислять SHA-256 канонической записи значения в UTF-8.
            boundaries:
              B2: При чтении отклонять неоднозначные ключи, ссылки YAML и значения вне поддерживаемых типов.
              B3: При канонизации считать порядок ключей словаря несущественным, сохраняя последовательность элементов массива.
