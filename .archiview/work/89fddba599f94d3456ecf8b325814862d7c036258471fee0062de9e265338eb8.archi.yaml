            import { declaredRoles } from "../../framework/contracts/roles.js";

            import { canonical } from "../../framework/serialization/digest.js";


            export interface ContractFieldChange {
              key: string;
              before: unknown;
              after: unknown;
              status: "unchanged" | "added" | "modified" | "removed";
            }


            export interface RoleChange {
              id: string;
              status: "added" | "unchanged" | "removed";
            }


            /** Сначала роли выбранного снимка в порядке YAML, затем исчезнувшие
            роли в порядке базы. */

            export function compareRoles(before: Partial<Contract> | null |
            undefined, after: Partial<Contract> | null | undefined, compare:
            boolean): RoleChange[] {
