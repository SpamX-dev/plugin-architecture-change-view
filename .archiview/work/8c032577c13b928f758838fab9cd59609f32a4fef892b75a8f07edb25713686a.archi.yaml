      - index: 61
        fact:
          id: sha256:9ec5cb26762ea73bb5de0c5e34fef1840c8ec8bb8e0a26fe726d91858455b0c5
          kind: file
          path: src/archiview/command.ts
          start_line: 1
          end_line: 111
          text: >
            import type { DependencySelector, ReviewInput } from
            "../reports/types.js";

            /**
             * CLI локального просмотра, построения переносимых отчётов и обмена входами
             * с агентом. Проверка индекса читает staged-набор, остальные операции сохраняют
             * данные только в выбранном хранилище ArchiView.
             */
            import { parseArgs } from "node:util";

            import { readFile, writeFile, lstat } from "node:fs/promises";

            import { stringify } from "yaml";

            import { createWorkspaceSession } from
            "../application/workspace-session.js";

            import type { SessionOperations } from "../application/api.js";

            import type { SnapshotStore } from "../storage/snapshot-store.js";

            import { readReviewBundle } from "../storage/review-store.js";

            import { parseYaml } from "../serialization/yaml.js";

            import { digest } from "../serialization/digest.js";

            import { createReviewInput } from "../reports/review-input.js";

            import { checkPreparedIndex } from "../storage/report-index.js";


            async function serve(workspace: SessionOperations & { root: string
            }, port: number, prepareWeb?: () => Promise<void>, store?:
            SnapshotStore) {
              await prepareWeb?.();
              const { createArchiViewHttpServer } = await import("./http.js");
              const server = createArchiViewHttpServer(workspace);
              server.on("error", (error) => { process.stderr.write("ArchiView: " + error.message + "\n"); process.exitCode = 1; });
              server.listen(port, "127.0.0.1", () => {
                process.stdout.write("ArchiView Local: http://127.0.0.1:" + (server.address() as import("node:net").AddressInfo).port +
                  "\nProject: " + workspace.root + "\n");
                if (store) process.stdout.write("State: " + store.directory + "\n");
                if (store?.migration) process.stdout.write("History copied: " + store.migration.snapshots +
                  " snapshots, " + store.migration.reviews + " reviews\n");
              });
              for (const signal of ["SIGINT", "SIGTERM"]) process.once(signal, () => server.close(() => process.exit()));
            }


            export async function runCli(prepareWeb?: () => Promise<void>) {
              const { values } = parseArgs({ options: {
                root: { type: "string" }, port: { type: "string", default: "4317" },
                "state-dir": { type: "string" }, help: { type: "boolean", short: "h" },
                "import-review": { type: "string" }, "build-report": { type: "boolean" },
                "complete-analysis": { type: "string" },
                "prepare-analysis": { type: "string" },
                "check-index": { type: "boolean" }, "export-review-input": { type: "string" },
                output: { type: "string" }, dependencies: { type: "string" },
                "dependencies-complete": { type: "boolean" },
              } });
              if (values.help) {
                process.stdout.write("ArchiView — archiview [--root DIR] [--port 4317] [--state-dir DIR]\n" +
                  "  --build-report                       Построить и уплотнить отчёты без сервера\n" +
                  "  --import-review FILE_OR_BUNDLE       Импортировать YAML review или прежний пакет\n" +
                  "  --complete-analysis REQUEST_ID       Проверить и импортировать result.yaml запроса панели\n" +
                  "  --prepare-analysis REQUEST_ID [--dependencies FILE] [--dependencies-complete]\n" +
                  "  --export-review-input MODULE_ID --output FILE [--dependencies FILE] [--dependencies-complete]\n" +
                  "  --check-index                        Проверить код и отчёты в подготовленном индексе Git\n");
              } else if (values["check-index"]) {
                const result = await checkPreparedIndex(values.root ?? process.cwd());
                process.stdout.write("Index verified: " + result.modules + " modules, " + result.reviews + " reviews\n");
              } else {
                const batch = values["build-report"] || values["export-review-input"] || values["complete-analysis"] || values["prepare-analysis"];
                const port = Number(values.port);
                if (!batch && (!Number.isInteger(port) || port < 0 || port > 65535)) throw new Error("--port must be between 0 and 65535");
                const workspace = await createWorkspaceSession({
                  root: values.root ?? process.cwd(), stateDirectory: values["state-dir"],
                });
                if (!batch && !values["import-review"]) return serve(workspace, port, prepareWeb);
                // Batch commands operate on their explicit --root. A workspace container has no shared history.
                const { store, reports, analysis } = await workspace.session(".");
                if (values["complete-analysis"]) {
                  const result = await analysis.complete(values["complete-analysis"]);
                  process.stdout.write("Analysis imported: " + result.reviewId + "\n");
                }
                if (values["prepare-analysis"]) {
                  const dependencies = values.dependencies ? parseYaml(await readFile(values.dependencies, "utf8"), (value) => { if (!Array.isArray(value)) throw new Error("Dependencies must be a YAML sequence"); return value as DependencySelector[]; }) : [];
                  const file = await analysis.prepare(values["prepare-analysis"], dependencies, Boolean(values["dependencies-complete"]));
                  process.stdout.write("Analysis input exported: " + file + "\n");
                }
                if (values["import-review"]) {
                  const source = values["import-review"];
                  const value = (await lstat(source)).isDirectory() ? await readReviewBundle(source) :
                    parseYaml(await readFile(source, "utf8"), (data) => data);
                  // Входной шаблон редактируется агентом; хеш manifest вычисляет инструмент.
                  // Все связи, доказательства и результаты проверяются при сохранении.
                  if (value && typeof value === "object" && "kind" in value && value.kind === "review-input") {
                    const input = value as ReviewInput;
                    input.report.analysis.input_digest = digest(input.manifest);
                  }
                  const id = await reports.saveReview(value);
                  process.stdout.write("Review imported: " + JSON.stringify(id) + "\n");
                }
                if (values["export-review-input"]) {
                  if (!values.output) throw new Error("--export-review-input requires --output");
                  const comparison = await reports.publishedComparison();
                  if (!comparison) throw new Error("No complete published comparison");
                  const dependencies = values.dependencies ? parseYaml(await readFile(values.dependencies, "utf8"), (data) => {
                    if (!Array.isArray(data)) throw new Error("Dependencies must be a YAML sequence");
                    return data;
                  }) : [];
                  const input = createReviewInput(digest(store.snapshotRoot), comparison.baseline, comparison.current,
                    values["export-review-input"], { dependencies, dependencyCoverage: {
                      status: values["dependencies-complete"] ? "complete" : "unknown",
                      potential_influence: values["dependencies-complete"] ? [] : [{ scope: "project" }],
                    } });
                  await writeFile(values.output, stringify(input, { aliasDuplicateObjects: false }), { flag: "wx" });
                  process.stdout.write("Review input exported: " + values.output + "\n");
                }
                if (batch) {
                  process.stdout.write("Reports prepared: " + store.directory + "\n");
                } else {
                  await serve(workspace, port, prepareWeb, store);
                }
              }
            }
      - index: 62
        fact:
          id: sha256:97db58bbf2f580045a08682e5ce817681459ffe1e26b5b59afbfb87e985de9e4
          kind: file
          path: src/archiview/http.ts
          start_line: 1
          end_line: 134
          text: >
            import { callSessionOperation, comparisonQueryArguments,
            repositoryArguments } from "../application/arguments.js";

            import type { SessionOperations } from "../application/api.js";

            import type { IncomingMessage, ServerResponse } from "node:http";

            /** HTTP-адаптер самостоятельного ArchiView: статические ресурсы,
            маршрутизация и защита origin. */

            import { createServer } from "node:http";

            import { readFile } from "node:fs/promises";

            import { createWorkspaceSession } from
            "../application/workspace-session.js";

            import { applicationError, ApplicationError } from
            "../application/errors.js";

            import { packageUrl, webAssetUrl } from
            "../runtime/package-paths.js";


            /** Сопоставляет прикладную ошибку HTTP-статусу, не добавляя HTTP в
            сервис. */

            const errorStatus: Record<string, number> = { INVALID_ARGUMENT: 400,
            REPOSITORY_UNAVAILABLE: 400, NOT_FOUND: 404, STALE_VIEW: 409,
            INCOMPLETE_VIEW: 422 };


            /** Читает ограниченный JSON-запрос; проверка предметных аргументов
            остаётся в сервисе. */

            async function bodyOf(request: IncomingMessage):
            Promise<Record<string, unknown>> {
              const chunks: Buffer[] = [];
              let bytes = 0;
              for await (const chunk of request) {
                const input: unknown = chunk;
                if (typeof input !== "string" && !(input instanceof Uint8Array)) throw new ApplicationError("INVALID_ARGUMENT", "Некорректное тело запроса");
                const data = Buffer.from(input);
                bytes += data.byteLength;
                if (bytes > 4096) throw new ApplicationError("REQUEST_TOO_LARGE", "Слишком большой запрос");
                chunks.push(data);
              }
              // Decode once: a TCP chunk may end in the middle of a Cyrillic UTF-8 character.
              let value: unknown;
              try { value = JSON.parse(Buffer.concat(chunks, bytes).toString("utf8") || "{}"); }
              catch { throw new ApplicationError("INVALID_ARGUMENT", "Некорректный JSON запроса"); }
              if (!value || typeof value !== "object" || Array.isArray(value)) throw new ApplicationError("INVALID_ARGUMENT", "Ожидается объект параметров");
              return value as Record<string, unknown>;
            }


            /**
             * Разбирает request-target относительно уже проверенного Host. Цель приходит из
             * сети и может быть синтаксически некорректной; такая ошибка становится
             * прикладной, чтобы обработчик ответил 400, а не завершил процесс отказом Promise.
             */
            function requestUrl(request: IncomingMessage, serverOrigin: string)
            {
              try {
                const target = new URL(request.url ?? "/", serverOrigin);
                if (target.origin === serverOrigin) return target;
              } catch {
                // Report malformed and non-local targets through the same transport error.
              }
              throw new ApplicationError("INVALID_ARGUMENT", "Некорректная цель запроса");
            }


            /** Programmatic access to the server and its initialized store. The
            standalone CLI only needs the HTTP adapter. */

            export async function createArchiView({ root, stateDirectory,
            panelToken }: { root: string; stateDirectory?: string; panelToken?:
            string }) {
              const workspace = await createWorkspaceSession({ root, stateDirectory });
              const session = await workspace.session();
              return { ...session, ...workspace, server: createArchiViewHttpServer(workspace, panelToken) };
            }


            export function createArchiViewHttpServer(session:
            SessionOperations, panelToken?: string) {
              const assets = new Map<string, [URL, string]>(([
                ["/", ["index.html", "text/html"]], ["/app.mjs", ["app.mjs", "text/javascript"]],
                ["/client.mjs", ["client.mjs", "text/javascript"]],
                ["/favicon.svg", ["favicon.svg", "image/svg+xml"]],
                ["/panel-bridge.mjs", ["panel-bridge.mjs", "text/javascript"]],
                ["/review.mjs", ["review.mjs", "text/javascript"]], ["/styles.css", ["styles.css", "text/css"]],
              ] satisfies [string, [string, string]][]).map(([route, [file, type]]) => [route, [new URL(file, webAssetUrl), type]]));
              let sdkUrl;
              try { sdkUrl = new URL(import.meta.resolve("@modelcontextprotocol/ext-apps/app-with-deps")); }
              catch { sdkUrl = new URL("web/archiview/mcp-app-sdk.mjs", packageUrl); }
              assets.set("/mcp-app-sdk.mjs", [sdkUrl, "text/javascript"]);
              const json = (response: ServerResponse, status: number, value: unknown) => {
                response.writeHead(status, { "Content-Type": "application/json; charset=utf-8" });
                response.end(JSON.stringify(value));
              };
              return createServer(async (request, response) => {
                // Обработчик асинхронный и не имеет внешнего catch, поэтому все способные
                // бросить этапы, включая разбор request-target, входят в единый перехват.
                try {
                  response.setHeader("Cache-Control", "no-store");
                  response.setHeader("X-Content-Type-Options", "nosniff");
                  response.setHeader("Content-Security-Policy", "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'");
                  const host = request.headers.host;
                  if (!["127.0.0.1:" + request.socket.localPort, "localhost:" + request.socket.localPort].includes(host ?? "")) {
                    return json(response, 403, { error: "Недопустимый адрес запроса" });
                  }
                  const serverOrigin = "http://" + host;
                  const url = requestUrl(request, serverOrigin);
                  const origin = request.headers.origin;
                  const crossOrigin = origin !== undefined && origin !== serverOrigin;
                  if (panelToken && crossOrigin) {
                    response.setHeader("Access-Control-Allow-Origin", origin);
                    response.setHeader("Vary", "Origin");
                    if (request.method === "OPTIONS") {
                      response.setHeader("Access-Control-Allow-Methods", "GET, POST, OPTIONS");
                      response.setHeader("Access-Control-Allow-Headers", "Authorization, Content-Type");
                      response.setHeader("Access-Control-Allow-Private-Network", "true");
                      response.writeHead(204); return response.end();
                    }
                  }
                  if (crossOrigin && !(panelToken && request.method === "GET" && assets.has(url.pathname) && url.pathname !== "/") &&
                      !(panelToken && request.headers.authorization === "Bearer " + panelToken)) {
                    return json(response, 403, { error: "Запрос должен исходить из ArchiView или авторизованной панели" });
                  }
                  if (request.method === "GET" && url.pathname === "/favicon.ico") {
                    response.writeHead(302, { Location: "/favicon.svg" });
                    return response.end();
                  }
                  if (request.method === "GET" && assets.has(url.pathname)) {
                    const [asset, contentType] = assets.get(url.pathname)!;
                    const content = await readFile(asset);
                    response.writeHead(200, { "Content-Type": contentType.startsWith("text/") ? contentType + "; charset=utf-8" : contentType });
                    return response.end(content);
                  }
                  const args: Record<string, unknown> = Object.fromEntries(url.searchParams);
                  const repository = url.searchParams.get("repository");
                  if (request.method === "GET" && url.pathname === "/api/comparison") {
                    return json(response, 200, await callSessionOperation(session, "getComparison", comparisonQueryArguments(args)));
                  }
                  if (request.method === "GET" && url.pathname === "/api/module") return json(response, 200, await callSessionOperation(session, "getModule", args));
                  if (request.method === "GET" && /^\/api\/analysis\/[a-f0-9-]{36}$/.test(url.pathname))
                    return json(response, 200, await callSessionOperation(session, "getAnalysis", repositoryArguments(repository, { id: url.pathname.split("/").at(-1) })));
                  if (request.method === "POST") {
                    if (url.pathname === "/api/analysis") return json(response, 201, await callSessionOperation(session, "prepareAnalysis", repositoryArguments(repository, await bodyOf(request))));
                    if (url.pathname === "/api/reviews") return json(response, 200, await callSessionOperation(session, "buildReview", repositoryArguments(repository, await bodyOf(request))));
                    if (url.pathname === "/api/snapshots") return json(response, 201, await callSessionOperation(session, "saveSnapshot", repositoryArguments(repository, await bodyOf(request))));
                  }
                  return json(response, 404, { error: "Ресурс не найден" });
                } catch (cause) {
                  // После начала ответа заголовки уже отправлены: второй ответ невозможен.
                  if (response.headersSent) return response.destroy();
                  const error = applicationError(cause);
                  return json(response, error.code === "REQUEST_TOO_LARGE" ? 413 : errorStatus[error.code] ?? 500,
                    { error: error.message, code: error.code });
                }
              });
            }
