    contract:
      schema_version: 1
      id: archiview-http
      title: Локальный сервер ArchiView
      kind: module
      purpose: Предоставлять локальный HTTP-интерфейс для дерева модулей, контрактов и
        проверок выбранной пары снимков.
      responsibilities:
        R1: Обслуживать клиентское приложение и API сравнения, деталей модуля и истории
          проверок.
        R2: Автоматически строить и уплотнять структурные отчёты при открытии и
          обновлении сравнения; по явному действию сохранять базовый снимок и
          импортировать внешний анализ через CLI.
        R3: Предоставлять хронологию коммитов, наблюдённых изменений и текущего
          результата; сохранять независимость исторического просмотра от
          публикации текущего состояния.
        R4: Подготавливать привязанные к снимку запросы анализа модуля и импортировать
          результаты агента с проверкой неизменности входов.
      boundaries:
        B1: Сбор структуры, принадлежность файлов и статусы вычисляются общей моделью
          снимков.
        B2: Схемы, доказательства и хранение результатов принадлежат общей модели;
          отрисовка — web/archiview.
      invariants:
        I1: Сервер слушает только loopback и не выдаёт произвольные файлы.
        I2: Просмотр не изменяет исходники; новая сохранённая база не меняет выбор
          пользователя.
        I3: Дерево, документ и проверка привязаны к точным снимкам, включая удалённые
          модули.
        I4: Междоменный доступ панели к API требует отдельного случайного токена;
          обычный просмотр сохраняет проверку Origin.
        I5: Подготовка запроса и его передача агенту не считаются завершённой
          содержательной проверкой.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex принадлежит отдельному адаптеру. Извлечение
          символов, разрешение зависимостей и индексация AST принадлежат
          ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено настроенным корнем проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-core
        section: boundaries
        id: B1
        text: Локальный HTTP-интерфейс находится в подмодуле archiview; отображение
          принадлежит web.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: Семантический вывод ответственности выполняет агент или внешний
          анализатор. Наличие контракта не доказывает его выполнения.
      - module_id: architecture-core
        section: boundaries
        id: B3
        text: Адаптер Codex находится в codex; он открывает веб-интерфейс и не заменяет
          HTTP API инструментами MCP.
      - module_id: architecture-core
        section: invariants
        id: I1
        text: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости,
          сборка и папки .archiview не расширяют анализ. Запись данных
          допускается в .archiview корня проекта либо явно выбранном внешнем
          хранилище; ссылки не меняют эту область.
      - module_id: architecture-core
        section: invariants
        id: I2
        text: Неполнота обхода и доказательств сообщается явно.
      - module_id: architecture-core
        section: invariants
        id: I3
        text: Снимки и отчёты не заменяют arch.yaml и не согласуют новую
          ответственность.
      - module_id: architecture-core
        section: invariants
        id: I4
        text: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых
          файлах.
