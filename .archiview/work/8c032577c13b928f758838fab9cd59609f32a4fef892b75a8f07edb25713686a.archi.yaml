          id: archiview-http

          title: Локальный сервер ArchiView

          kind: module

          extensions:
            archiview.roles: [web-endpoints, cli]
          purpose: Предоставлять самостоятельные HTTP и CLI адаптеры к
          прикладному сервису ArchiView.

          responsibilities:
            R1: Обслуживать клиентское приложение и API сравнения, деталей модуля и истории проверок.
            R2: Преобразовывать HTTP-запросы в вызовы сервиса, а прикладные ошибки — в ответы транспорта.
            R3: Предоставлять точку запуска CLI и команды экспорта, импорта и проверки переносимых результатов
              при запуске из исходников и из собранного пакета.
          boundaries:
            B1: Операции просмотра, хронология и подготовка анализа принадлежат application; адаптер не дублирует их реализацию.
            B2: Схемы, доказательства и хранение результатов принадлежат общей модели; отрисовка — web/archiview.
          invariants:
            I1: Сервер слушает только loopback и не выдаёт произвольные файлы.
            I2: Просмотр не изменяет исходники; новая сохранённая база не меняет выбор пользователя.
            I3: Дерево, документ и проверка привязаны к точным снимкам, включая удалённые модули.
            I4: Междоменный доступ панели к API требует отдельного случайного токена; обычный просмотр сохраняет проверку Origin.
            I5: Подготовка запроса и его передача агенту не считаются завершённой содержательной проверкой.
            I6: Обычный запуск CLI может отдать веб-интерфейс до подготовки сравнения. Пакетные команды завершают свои операции до выхода.
