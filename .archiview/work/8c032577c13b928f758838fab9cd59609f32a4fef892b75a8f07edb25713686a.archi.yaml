    contract:
      schema_version: 1
      id: archiview-http
      title: Локальный сервер ArchiView
      kind: module
      extensions:
        archiview.roles:
          - web-endpoints
          - cli
      purpose: Давать самостоятельный локальный доступ к просмотру проекта и операциям
        с переносимыми отчётами.
      responsibilities:
        R1: Предоставлять веб-приложение и данные выбранного сравнения, включая
          документы удалённых модулей.
        R2: Возвращать клиенту результат запрошенной операции или диагностический ответ
          с причиной отказа.
        R3: Предоставлять операции экспорта, импорта и проверки отчётов в исходной и
          автономной поставках.
      boundaries:
        B3: При самостоятельном запуске принимать соединения только на локальном
          интерфейсе.
        B4: По файловым маршрутам выдавать только ресурсы приложения.
        B5: Допускать междоменный вызов API панели только с её токеном.
        B6: При запуске пакетной команды построения, экспорта или проверки индекса
          завершать операцию до выхода из CLI.
        B7: При отдельном импорте проверки продолжать работу в режиме сервера, а при
          импорте с построением отчёта завершать пакетную операцию.
      invariants:
        I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
        I8: Операции с переносимыми результатами доступны из командной строки.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Просмотр и подготовка анализа сохраняют исходники и согласованные
          контракты проекта без изменений.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: При подготовке контекста ArchiView не строит граф зависимостей по символам
          исходного кода.
      - module_id: architecture-change-view
        section: boundaries
        id: B3
        text: В общей рабочей папке ArchiView читает контракты и историю модуля в
          пределах репозитория, которому он принадлежит.
      - module_id: architecture-change-view
        section: boundaries
        id: B4
        text: Панель обращается к агенту только по явному поручению пользователя
          провести анализ или исправить замечание.
      - module_id: architecture-change-view
        section: boundaries
        id: B5
        text: Автоматическая проверка структуры может подтвердить наличие контракта и
          корректность формата, но не выполнение обязанностей.
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает встроенную панель Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает встроенную панель DeepSeek Harness.
      - module_id: architecture-change-view
        section: invariants
        id: I9
        text: Самостоятельный локальный запуск входит в обязательные варианты поставки
          приложения.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: При структурном сравнении фиксировать различия контрактов без
          автоматического вывода о нарушении ответственности.
      - module_id: architecture-core
        section: boundaries
        id: B6
        text: При обходе учитывать исходники только внутри выбранного корня, исключая
          зависимости, результаты сборки и служебные данные ArchiView.
      - module_id: architecture-core
        section: boundaries
        id: B7
        text: Записывать данные истории только в каталог ArchiView проекта либо в явно
          выбранное внешнее хранилище.
      - module_id: architecture-core
        section: boundaries
        id: B8
        text: Разрешать исторические доказательства по содержимому выбранных снимков.
