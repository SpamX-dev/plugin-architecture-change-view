    contract:
      schema_version: 1
      id: archiview-http
      title: Локальный сервер ArchiView
      kind: module
      extensions:
        archiview.roles:
          - web-endpoints
          - cli
      purpose: Давать самостоятельный локальный доступ к просмотру проекта и операциям
        с переносимыми отчётами.
      responsibilities:
        R1: Предоставлять веб-приложение и данные выбранного сравнения, включая
          документы удалённых модулей.
        R2: Возвращать клиенту результат запрошенной операции или диагностический ответ
          с причиной отказа.
        R3: Предоставлять операции экспорта, импорта и проверки отчётов в исходной и
          автономной поставках.
      boundaries:
        B3: При самостоятельном запуске принимать соединения только на локальном
          интерфейсе.
        B4: По файловым маршрутам выдавать только ресурсы приложения.
        B5: Допускать междоменный вызов API панели только с её токеном.
        B6: При запуске пакетной команды построения, экспорта или проверки индекса
          завершать операцию до выхода из CLI.
        B7: При отдельном импорте проверки продолжать работу в режиме сервера, а при
          импорте с построением отчёта завершать пакетную операцию.
      invariants:
        I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
        I8: Операции с переносимыми результатами доступны из командной строки.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Просмотр и подготовка анализа сохраняют исходники и согласованные
          контракты проекта без изменений.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
