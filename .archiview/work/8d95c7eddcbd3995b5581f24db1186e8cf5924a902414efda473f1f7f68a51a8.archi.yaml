            schema_version: 1

            id: archiview-project-location

            title: Расположение данных и происхождение проекта

            kind: module

            extensions:
              archiview.roles: [domain]
            responsibilities:
              R1: Проверять фактическое расположение локального или явно выбранного внешнего хранилища.
              R2: Определять происхождение истории, в том числе после переноса проекта.
              R3: Находить рабочие деревья Git в выбранной папке и определять репозиторий для указанного пути.
            boundaries:
              B2: Отклонять путь данных, если его фактическое расположение выходит за пределы выбранного хранилища.
              B3: Отклонять внешнее хранилище, фактически расположенное внутри дерева исходников проекта.
              B4: При регистрации истории отклонять попытку заменить уже сохранённое происхождение другим.
            invariants: {}
