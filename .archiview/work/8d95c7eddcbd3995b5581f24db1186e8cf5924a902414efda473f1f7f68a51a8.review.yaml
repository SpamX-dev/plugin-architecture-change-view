            available: true
            digest: sha256:ad3ef0f903f288e00b3277a2d0ff0cd7510be5dea51211147238a2ca3841fa0b
            content: >
              /** Normalize unknown exceptions while retaining
              filesystem/process diagnostics. */

              export interface ErrorDetails extends Error { code?: string |
              number; stderr?: string; exitCode?: number | null; }

              export function errorDetails(error: unknown): ErrorDetails {
                if (error instanceof Error) return error;
                const value = error && typeof error === "object" ? error as Record<string, unknown> : {};
                const result: ErrorDetails = new Error(typeof value.message === "string" ? value.message : String(error));
                if (typeof value.code === "string" || typeof value.code === "number") result.code = value.code;
                if (typeof value.stderr === "string") result.stderr = value.stderr;
                if (typeof value.exitCode === "number" || value.exitCode === null) result.exitCode = value.exitCode;
                return result;
              }
