              всех платформах. */

              function portable(value: string) {
                return value.split(path.sep).join("/");
              }


              /** Запускает только Git без оболочки, ограничивая время и объём
              ответа. */

              async function git(root: string, args: string[], input: string |
              Buffer = "", maxBytes = 16 * 1024 * 1024): Promise<Buffer> {
                return new Promise((resolve, reject) => {
                  const child = spawn("git", args, { cwd: root, windowsHide: true,
                    stdio: ["pipe", "pipe", "pipe"] });
                  const chunks: Buffer[] = [];
                  let bytes = 0;
                  let diagnostic = "";
                  let failure: (Error & {exitCode?: number | null}) | undefined;
                  const timer = setTimeout(() => {
                    failure = new Error("Git operation timed out");
                    child.kill();
                  }, 30000);
                  child.on("error", (error) => { clearTimeout(timer); reject(error); });
                  child.stdout.on("data", (chunk) => {
                    bytes += chunk.length;
                    if (bytes > maxBytes) {
                      failure = new Error("Git response exceeds the size limit");
                      child.kill();
                    } else chunks.push(chunk);
                  });
                  child.stderr.on("data", (chunk) => {
                    diagnostic = (diagnostic + chunk.toString()).slice(-4096);
                  });
                  child.stdin.on("error", () => {});
