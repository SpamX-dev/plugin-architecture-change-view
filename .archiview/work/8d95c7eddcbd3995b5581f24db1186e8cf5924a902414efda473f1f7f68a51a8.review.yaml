                I1: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости, сборка и папки
                  .archiview не расширяют анализ. Запись данных допускается в .archiview корня проекта
                  либо явно выбранном внешнем хранилище; ссылки не меняют эту область.
                I2: Неполнота обхода и доказательств сообщается явно.
