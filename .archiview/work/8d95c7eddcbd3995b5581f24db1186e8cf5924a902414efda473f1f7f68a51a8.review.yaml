            коммита или индекса Git. */

            import { snapshotDigest, structureHash } from "./identity.js";

            import type {
              FileRecord, Fact, SnapshotModule, Snapshot, SnapshotOptions, GitRevision,
            } from "./types.js";

            import { errorDetails } from "../runtime/errors.js";

            import { spawn } from "node:child_process";

            import { createHash } from "node:crypto";

            import { createReadStream } from "node:fs";

            import { lstat, readFile, realpath } from "node:fs/promises";

            import path from "node:path";

            import { SOURCE_EXTENSIONS, excludedProjectPath, projectFiles,
            regularProjectFile } from "../contracts/inventory.js";

            import { contractDocument } from "../contracts/document.js";

            import { digest as contentDigest } from
            "../serialization/digest.js";

            import { readSnapshotRoot } from "../project/identity.js";


            /** Контракты читаются в обоих форматах; новый формат имеет
            безусловный приоритет. */

            const isContract = (file: string) => ["arch.yaml",
            "module.md"].includes(path.posix.basename(file));

            const isSource = (file: string) =>
            SOURCE_EXTENSIONS.has(path.posix.extname(file).toLowerCase());


            /** Относительные пути снимков используют единые разделители на всех
            платформах. */

            function portable(value: string) {
              return value.split(path.sep).join("/");
            }


            /** Запускает только Git без оболочки, ограничивая время и объём
            ответа. */

            async function git(root: string, args: string[], input = "",
            maxBytes = 16 * 1024 * 1024): Promise<Buffer> {
              return new Promise((resolve, reject) => {
                const child = spawn("git", args, { cwd: root, windowsHide: true,
                  stdio: ["pipe", "pipe", "pipe"] });
                const chunks: Buffer[] = [];
                let bytes = 0;
                let diagnostic = "";
                let failure: (Error & {exitCode?: number | null}) | undefined;
                const timer = setTimeout(() => {
                  failure = new Error("Git operation timed out");
                  child.kill();
                }, 30000);
                child.on("error", (error) => { clearTimeout(timer); reject(error); });
                child.stdout.on("data", (chunk) => {
                  bytes += chunk.length;
                  if (bytes > maxBytes) {
                    failure = new Error("Git response exceeds the size limit");
                    child.kill();
                  } else chunks.push(chunk);
                });
                child.stderr.on("data", (chunk) => {
                  diagnostic = (diagnostic + chunk.toString()).slice(-4096);
                });
                child.stdin.on("error", () => {});
                child.on("close", (code) => {
                  clearTimeout(timer);
                  if (failure || code !== 0) {
                    const error: Error & {exitCode?: number | null} = failure ?? new Error(diagnostic.trim() || "Git exited with code " + code);
                    error.exitCode = code;
                    reject(error);
                  }
                  else resolve(Buffer.concat(chunks));
                });
                child.stdin.end(input);
              });
            }


            /** Определяет корень и алгоритм Git; отсутствие Git допускает
            файловые снимки. */

            async function gitInfo(root: string) {
              let repository;
