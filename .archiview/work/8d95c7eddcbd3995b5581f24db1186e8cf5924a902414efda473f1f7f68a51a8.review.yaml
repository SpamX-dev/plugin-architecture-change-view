            import type { ComparisonResponse, ModuleResponse } from
            "./support.js";

            import type { AddressInfo } from "node:net";

            import type { TestContext } from "node:test";

            /** Реальные файловые и Git-сценарии переносимой истории, миграции и
            исключения данных из анализа. */

            import assert from "node:assert/strict";

            import { execFileSync } from "node:child_process";

            import { once } from "node:events";

            import { mkdir, mkdtemp, readFile, rm, symlink, writeFile } from
            "node:fs/promises";

            import os from "node:os";

            import path from "node:path";

            import test from "node:test";

            import { stringify } from "yaml";

            import { createArchiView } from "../src/archiview/http.js";

