  children: []
  technical:
    normalization: archiview/module-state/v1
    module_id: archiview-web-api-client
    directory: web/web-ui/archiview-client
    own_files:
      - path: web/web-ui/archiview-client/client.ts
        digest: sha256:62f0203cf9cd9d92c146f119f71cb5c8788f8bc6ddf241103bdfe60113b3ee3e
        normalization: text-lf/v1
    contract:
      schema_version: 1
      id: archiview-web-api-client
      title: ArchiViewClient
      kind: module
      extensions:
        archiview.roles:
          - web-client
      purpose: Предоставлять презентерам доступ к операциям просмотра и анализа через
        HTTP API веб-сервиса.
      boundaries: {}
      invariants: {}
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B6
        text: Не является IDE и не стремится заменить функционал IDE
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает встроенную панель Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает встроенную панель DeepSeek Harness.
      - module_id: architecture-change-view
        section: invariants
        id: I9
        text: Локальный запуск в браузере входит в обязательные варианты поставки
          приложения.
      - module_id: architecture-web
        section: boundaries
        id: B2
        text: Действия просмотра оставляют исходники и согласованные контракты без
          изменений.
      - module_id: architecture-web
        section: boundaries
        id: B3
        text: Интерфейс отображает полученные документы и исходники только как данные.
      - module_id: archiview-client
        section: boundaries
        id: B1
        text: Отображать смысловую оценку из выбранного отчёта. Статус изменения файлов
          сам по себе не определяет качество архитектуры.
      - module_id: archiview-client
        section: boundaries
        id: B10
        text: После копирования промпта исправления сохранять текущий статус замечания.
      - module_id: archiview-client
        section: boundaries
        id: B11
        text: Сохранять доступ к удалённым модулям и доказательствам выбранного
          исторического состояния.
      - module_id: archiview-client
        section: boundaries
        id: B2
        text: Копировать промпт анализа или исправления по явному действию пользователя.
      - module_id: archiview-client
        section: boundaries
        id: B3
        text: В основном чеклисте показывать только собственные пункты модуля для
          выбранного состояния.
      - module_id: archiview-client
        section: boundaries
        id: B4
        text: В счётчики замечаний и действия исправления включать только содержательные
          замечания. Изменения текста пунктов показывать в контракте.
      - module_id: archiview-client
        section: boundaries
        id: B5
        text: Свёрнутая ветвь учитывает потребность скрытых потомков в анализе, а
          раскрытая строка показывает собственный статус модуля.
      - module_id: archiview-client
        section: boundaries
        id: B6
        text: В карточке текущего состояния показывать полноту проверки зависимостей без
          перечня зависимостей из прежнего отчёта.
      - module_id: archiview-client
        section: boundaries
        id: B7
        text: Устаревание одной лишь оценки перехода не требует повторного анализа
          текущего состояния.
      - module_id: archiview-client
        section: boundaries
        id: B8
        text: Обеспечивать просмотр дерева Git во время загрузки статусов проверок.
      - module_id: archiview-client
        section: boundaries
        id: B9
        text: Подтверждать завершение анализа по импорту результата.
