          purpose: Сохранять снимки, проверки и опубликованные отчёты проекта с
          возможностью переноса и восстановления.

          responsibilities:
            R1: Обслуживать хранилище одного проекта, при открытии локального хранилища переносить в него
              данные из прежнего внешнего каталога. Сохранять локальные состояния с временем наблюдения
              и базовой ревизией Git, когда она известна.
            R2: Проверять целостность, уплотнять и публиковать переносимую историю, сверять подготовленные для Git отчёты с индексом.
