            export interface ChangeCursor {
              schema_version: number;
              headRevision: string | null;
              digest: string;
              recordId: string | null;
              sequence: number;
              capturedAt: string;
            }


            export interface ChangeState {
              changes: ChangeRecord[];
              diagnostics: string[];
              errors?: string[];
            }
