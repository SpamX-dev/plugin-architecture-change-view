          инструментами. Просмотр не изменяет исходники проекта.
        B2: Экспорт скиллов в Codex принадлежит отдельному адаптеру. Извлечение
          символов, разрешение зависимостей и индексация AST принадлежат
          ast-index.
      invariants:
        I1: Чтение ограничено настроенным корнем проекта.
        I2: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
        I3: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
        I4: Структурная проверка не выдаёт наличие файла за семантическое соответствие.
