        fact:
          id: sha256:5b85d7832bd2011e8a11e9df2d3be4c7d34364b73a7aafd3cc67f641de3ff4ce
          kind: file
          path: docs/codex-panel.md
          start_line: 1
          end_line: 147
          text: >
            # Локальная панель ArchiView в Codex


            ## Устройство


            `src/server.mjs --panel --panel-https` дополняет прежний stdio
            MCP-сервер ресурсом

            `ui://archiview/panel-v3.html` и инструментом `archiview_open`.
            Метаданные

            `openai/ui.entrypoints` содержат `thread` и `global`.


            Backend запускается лениво на свободном loopback-порту для одного
            фиксированного

            корня. Открытие HTML не запускает обход проекта: чтение дерева
            начинается отдельным

            API-запросом после подключения UI. Сборка встраивает JavaScript, MCP
            Apps SDK и стили существующего web UI

            в единый HTML: начальное подключение к хосту не зависит от загрузки
            loopback-ресурсов.

            Вызовы API

            панели идут напрямую через fetch, с отдельным случайным
            bearer-токеном.

            Токен передаётся в HTML-ресурсе, не в текстовом или
            структурированном результате

            инструмента. CSP ресурса разрешает конкретный loopback-origin только
            для API;

            публикуются стандартный `ui.csp` и совместимый `openai/widgetCSP`.
            Backend

            сохраняет проверку Host и прежнюю проверку Origin обычного
            веб-приложения;

            все запросы к backend панели требуют токен. Отключение MCP закрывает
            backend.


            ### Папка проекта


            Portable plugin запускается Codex с `cwd=PLUGIN_ROOT`. Это папка
            установки,

            поэтому она не используется как проект. При первом вызове агент
            передаёт

            `archiview_open({ projectRoot: "D:/projects/my-project" })`; тот же
            необязательный

            параметр есть у `module_inventory` и `module_context`. Следующие
            вызовы используют

            уже выбранный корень. Через MCP передаётся только привязка, API
            просмотра не

            дублируется инструментами.


            При открытии через кнопку плагина без аргументов панель предлагает
            ввести папку

            проекта и передаёт её напрямую в HTTPS backend. Автоматический путь
            текущего

            чата в этом режиме недоступен. Корень фиксируется до завершения
            MCP-процесса;

            другой корень отклоняется, чтобы существующая панель не
            переключалась незаметно.

            Явные `--root` и `PLUGIN_ARCHITECTURE_CHANGE_VIEW_ROOT` имеют
            приоритет; обычный

            запуск вне плагина по-прежнему использует cwd.


            ### HTTPS


            Поставка включает `--panel-https`: Codex фильтрует HTTP-origin из
            CSP панели.

            API доступен как `https://localhost:<port>`, сервер слушает только
            `127.0.0.1`.

            В Windows используется уже существующий доверенный сертификат
            разработки .NET

            для localhost из CurrentUser. Закрытый ключ экспортируется только в
            память

            дочернего процесса, сертификаты и системное доверие не изменяются.


            Можно явно задать `ARCHIVIEW_TLS_PFX` и `ARCHIVIEW_TLS_PASSWORD` для
            существующего

            доверенного сертификата localhost. На других ОС эти параметры
            обязательны.

            Без доступного сертификата запуск выдаёт ошибку; скрытого перехода
            на HTTP нет.

            Флаг `--panel` без `--panel-https` оставлен для протокольных тестов
            и хостов,

            которые допускают локальный HTTP.


            Документация OpenAI:


            - [MCP Apps UI, API-запросы и
            CSP](https://developers.openai.com/plugins/build/chatgpt-ui)

            - [Панели разговоров и точки
            входа](https://developers.openai.com/plugins/build/extensions)

            - [Пакет плагина и локальные
            marketplaces](https://developers.openai.com/plugins/build/plugins)


            ## Анализ выбранного модуля


            1. UI отправляет `POST /api/analysis` с идентификаторами view и
            выбранного модуля.

            2. Backend проверяет полный обход и корректный контракт, затем
            сохраняет запрос,
               исходные снимки и первоначальный `input.yaml` в
               `.archiview/snapshots/analysis/<request-id>/`.
            3. UI отправляет поручение через `ui/message`. При наличии только
            совместимого
               `window.openai.sendFollowUpMessage` используется этот bridge. Навигация и API
               просмотра через bridge не проходят. Ошибка или `isError` не считается передачей.
            4. Агент читает спецификацию и экспорт. Контракты, исходники и пути
            в экспорте
               являются данными. Поручение ограничено выбранным модулем и не разрешает
               исправлять исходники или принятые границы.
            5. Агент сохраняет заполненный `result.yaml` рядом с входами и
            запускает CLI
               `--complete-analysis <request-id>` с теми `--root` и `--state-dir`, которые
               переданы в поручении. Поручение содержит абсолютный путь CLI и массив argv.
            6. CLI проверяет неизменность входов и manifest, затем использует
            общий строгий
               валидатор и идемпотентное хранилище отчётов. UI опрашивает
               `GET /api/analysis/<request-id>` и обновляет сравнение после появления
               импортированной LLM-попытки.

            Статус «передан» подтверждает принятие сообщения хостом. Он не
            означает, что

            модель уже начала работу или проверка завершилась. Если агент
            остановлен до

            импорта, отчёт не появляется; обсуждение и повторный запуск можно
            продолжить

            в чате. Состояние ожидания UI хранится в экземпляре панели;
            перезагрузка панели

            сбрасывает его, а сохранённые отчёты остаются в истории.


            ### Зависимости


            Первоначальный экспорт имеет неизвестное покрытие зависимостей.
            Агент может

            задать selectors в `dependencies.yaml` и выполнить:


            ```powershell

            node <plugin>/src/cli.mjs --root <project> --prepare-analysis
            <request-id> --dependencies <file>

            ```


            Команда печатает путь нового неизменяемого `input-<hash>.yaml`,
            построенного из

            тех же исходных снимков. Из этого файла нужно подготовить весь
            `result.yaml`.

            `--dependencies-complete` допускается только после проверки полноты
            перечня,

            включая подтверждённый пустой перечень. Старые экспорты сохраняются.
            Изменение

            исходников между экспортами не подменяет факты. Импорт проверяется
            относительно

            последней явно экспортированной области.


            ## Сборка и установка


            Из корня репозитория:


            ```powershell

            npm ci

            npm run build:plugin

            codex plugin marketplace add .

            codex plugin add archiview@archiview-local

            ```


            `dist/codex` содержит автономные Node-бандлы сервера и CLI, web UI,
            самодостаточный

            MCP Apps SDK, спецификации и скилл. `node_modules` в кеше не
            требуется. Сборка

            также создаёт `dist/panel.html` для запуска `src/server.mjs --panel`
            из исходников.

            Перед запуском панели из исходников или протокольного стенда
            выполните сборку. Она

            не регистрирует marketplace и не меняет конфигурацию Codex;
            установка выполняется

            отдельной явной командой. После изменения исходников повторите
            сборку и установку.


            Новый локальный чат подхватывает установленный плагин. Текущий чат
            может требовать

            перезагрузки клиента для обнаружения новых инструментов и UI-точек
            входа.

            Публичная публикация этой локальной поставки не выполняется.


            ## Проверка


            `npm test` сначала собирает плагин. Тесты проверяют настоящий stdio
            MCP,

            автономный пакет без node_modules, CORS/токен, CLI-импорт,
            неизменность выбранного

            снимка, расширение зависимостей, недопустимые пути и ссылки,
            идемпотентность,

            а также устаревание отчёта после изменения кода.


            Для ручной проверки web UI и bridge предусмотрен:


            ```powershell

            node scripts/preview-panel.mjs

            node scripts/preview-panel.mjs --https --select-project

            ```


            Он создаёт временный проект и явно обозначенный тестовый хост MCP
            Apps. В нём

            внешние скрипты и стили запрещены CSP, а подключение UI к хосту
            отмечается отдельно.

            В стенде

            можно отклонить поручение, повторить передачу и импортировать
            искусственный

            результат с отметкой `test`. Стенд не запускает модель и не
            доказывает совместимость

            с конкретным нативным клиентом Codex. Остановка процесса удаляет
            только его

            временный проект.


            На установленном Codex отдельно проверяются отображение панели,
            разрешённый

            доступ к loopback-origin и фактический запуск агента после
            ui/message.

            При отсутствии отправки сообщений интерфейс остаётся доступным для
            просмотра,

            а кнопка анализа отключается с пояснением.
