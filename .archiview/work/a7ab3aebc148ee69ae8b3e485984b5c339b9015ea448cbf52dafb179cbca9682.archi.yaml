    contract:
      schema_version: 1
      id: architecture-change-view
      title: Контракты и просмотр архитектуры
      kind: module
      purpose: Задавать локальные контракты ответственности каталогов и предоставлять
        агентам правила их ведения, а пользователю — ArchiView для просмотра
        архитектуры и изменений.
      responsibilities:
        R1: Публиковать канонический скилл module-boundaries и MCP-инструменты чтения
          контрактов.
        R2: Проверять покрытие всех каталогов исходного кода контрактами arch.yaml и
          направлять агента на немедленный перенос старых описаний либо анализ и
          создание отсутствующих.
        R3: Формировать снимки структуры, контрактов и доказательств; сохранять и
          отображать неизменяемые review.yaml для выбранного сравнения.
      boundaries:
        B1: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
        B2: Экспорт скиллов в Codex принадлежит отдельному адаптеру. Извлечение
          символов, разрешение зависимостей и индексация AST принадлежат
          ast-index.
      invariants:
        I1: Чтение ограничено настроенным корнем проекта.
        I2: Снимки и результаты анализа размещаются отдельно от исходников.
        I3: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
        I4: Структурная проверка не выдаёт наличие файла за семантическое соответствие.
    document_state: documented
    inherited: []
