    inherited: []
    children:
      - module_id: architecture-core
        directory: src
        contract:
          id: architecture-core
          kind: module
          purpose: Обслуживать MCP, читать и проверять контракты, формировать и сравнивать
            снимки архитектуры и хранить результаты проверок.
          responsibilities:
            R1: Обходить дерево исходников с учётом ограничений и предоставлять цепочки
              родительских контрактов.
            R2: Проверять схемы arch.yaml и review.yaml, идентичность модулей, отпечатки
              входов и разрешимость доказательств.
            R3: Собирать снимки файлов и контрактов; вычислять изменения, перемещения и
              устаревание отчётов.
            R4: Сохранять неизменяемые пакеты результатов и выполнять структурные проверки с
              явным указанием непроверенных пунктов.
            R5: Сохранять происхождение истории отдельно от фактического пути исходников и
              переносить прежнее внешнее хранилище в локальную папку данных без
              изменения сохранённых пакетов.
            R6: Автоматически уплотнять YAML-отчёты по модулям, сохраняя содержательные
              проверки и доказательства; вычислять собственную и агрегированную
              актуальность по явным входам, включая зависимости, отдельно от
              полноты проверки и подтверждённости перечня зависимостей.
              Собственная проверка содержит только локальный контракт;
              совместимость размещения подмодулей оценивается в композиции
              родителя, без переноса его пунктов в чеклист детей.
            R7: Проверять согласованность переносимых отчётов с подготовленным индексом Git.
            R8: Сохранять наблюдённые состояния между коммитами с временем и привязкой к
              ревизии; предоставлять последовательность коммитов и точные снимки
              истории без изменения исходников.
          boundaries:
            B3: Адаптер Codex находится в codex; вызывает прикладной сервис через скрытые от
              модели инструменты UI без HTTP-сервера.
            B4: Адаптер dsh находится в dsh; регистрирует инструменты, маршруты панели и
              скилл хоста, получая прикладные операции из application.
            B1: Прикладные операции находятся в application; HTTP и CLI в archiview являются
              адаптерами, отображение принадлежит web.
            B2: Семантический вывод ответственности выполняет агент или внешний анализатор.
              Наличие контракта не доказывает его выполнения.
          invariants:
            I1: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости,
              сборка и папки .archiview не расширяют анализ. Запись данных
              допускается в .archiview корня проекта либо явно выбранном внешнем
              хранилище; ссылки не меняют эту область.
            I2: Неполнота обхода и доказательств сообщается явно.
            I3: Снимки и отчёты не заменяют arch.yaml и не согласуют новую ответственность.
            I4: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых
              файлах.
            I5: Структурное различие контрактов не создаёт замечание; оценка нарушения
              требует отдельного анализа.
        document_state: documented
      - module_id: architecture-tests
        directory: test
        contract:
          id: architecture-tests
          kind: module
          purpose: Проверять наблюдаемый контракт MCP, форматы архитектурных данных,
            снимки, доказательства и локальный HTTP-интерфейс ArchiView.
          responsibilities:
            R1: Проверять покрытие каталогов, цепочки ограничений, валидацию схем, статусы и
              перемещения модулей.
            R2: Проверять неизменность истории, разрешение доказательств, устаревание и
              границы файловой области.
            R3: Проверять реальные stdio- и HTTP-сценарии на изолированных проектах.
            R4: Проверять авторизацию панели, привязку анализа к неизменяемым входам и
              доставку запроса агенту без подмены анализа структурной проверкой.
              Проверять точную ссылку поручения исправления на сохранённую
              попытку и замечание.
            R5: Проверять перенос ZIP-пакета Codex и запуск установленного плагина со
              встроенным Node в изолированном профиле без системного Node и npm
              в PATH.
            R6: Проверять сборку и перенос пакета dsh — сборщик пишет только в dist, точки
              входа опубликованного пакета разрешаются, а перенесённый CLI
              запускается без node_modules.
          boundaries:
            B1: Тесты не подменяют содержательный анализ пользовательской ответственности
              эвристикой.
          invariants:
            I1: Используются временные проекты, принадлежащие тестам внутренние или внешние
              хранилища и отдельные порты. Переносимость проверяется на копиях в
              другом файловом корне.
            I2: Неполный результат и повреждённые данные обнаруживаются явно; рабочие
              исходники не изменяются проверками.
        document_state: documented
      - module_id: architecture-web
        directory: web
        contract:
          id: architecture-web
          kind: group
          purpose: Объединять клиентские интерфейсы просмотра архитектурных модулей.
          responsibilities:
            R1: Представлять полученные от сервера данные и действия навигации.
          boundaries:
            B1: Чтение проекта, вычисление изменений и хранение снимков принадлежат серверу.
          invariants:
            I1: Содержимое контрактов, отчётов и исходников отображается как данные.
            I2: Клиент не изменяет исходники и принятые границы ответственности.
        document_state: documented
      - module_id: archiview-distribution
        directory: scripts
        contract:
          id: archiview-distribution
          kind: module
          purpose: Собирать автономные пакеты локальных плагинов Codex и dsh из исходников
            ArchiView.
          responsibilities:
            R1: Упаковывать сервер, CLI, веб-ресурсы, схемы обмена и скиллы в переносимый
              каталог без зависимости от node_modules установленного плагина.
            R2: Предоставлять явно обозначенный протокольный стенд во временном проекте для
              проверки UI, bridge и отказа хоста без запуска модели.
            R3: По отдельной явной команде устанавливать пакет Codex штатным установщиком и
              разрешать пути его MCP-конфигурации относительно фактического
              установленного каталога. Находить CLI через явно заданный путь,
              PATH или установку приложения Codex в Windows.
            R4: Собирать переносимый Windows x64-архив с локальным marketplace, установщиком
              и Node с его лицензией; устанавливать встроенный рантайм
              относительно фактического каталога кеша целевой машины.
          boundaries:
