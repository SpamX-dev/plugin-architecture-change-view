    contract:
      schema_version: 1
      id: architecture-change-view
      title: Контракты и просмотр архитектуры
      kind: module
      purpose: Задавать локальные контракты ответственности каталогов и предоставлять
        агентам правила их ведения, а пользователю — ArchiView для просмотра
        архитектуры и изменений.
      responsibilities:
        R1: Публиковать канонический скилл module-boundaries и MCP-инструменты чтения
          контрактов.
        R2: Проверять покрытие всех каталогов исходного кода контрактами arch.yaml и
          направлять агента на немедленный перенос старых описаний либо анализ и
          создание отсутствующих.
        R3: Формировать снимки структуры, контрактов и доказательств; сохранять и
          отображать неизменяемые review.yaml для выбранного сравнения.
        R4: Автоматически строить и уплотнять переносимые YAML-отчёты, сохраняя историю
          содержательных проверок и отдельно определяя актуальность модуля и его
          поддерева.
        R5: Поставлять локальный плагин Codex с веб-панелью, явным запуском анализа
          выбранного модуля и передачей агенту поручения исправить выбранное
          замечание.
        R6: Поставлять плагин dsh — инструменты чтения, маршруты панели и публикацию
          скилла в хосте DeepSeek Harness без запуска модели самим просмотром.
      boundaries:
        B1: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
        B2: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным
          адаптерам. Извлечение символов, разрешение зависимостей и индексация
          AST принадлежат ast-index.
      invariants:
        I5: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются
          строгим TypeScript перед сборкой; классы сохраняют единственную
          ответственность внутри границ своих модулей.
        I1: Чтение ограничено настроенным корнем проекта.
        I2: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
        I3: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
        I4: Структурная проверка не выдаёт наличие файла за семантическое соответствие.
    document_state: documented
    inherited: []
