    contract:
      id: architecture-change-view
      kind: module
      purpose: Дать пользователям инструмент ревизии и анализа архитектуры приложений.
      boundaries:
        B6: Не является IDE и не стремится заменить функционал IDE
      invariants:
        I9: Локальный запуск в браузере входит в обязательные варианты поставки
          приложения.
        I10: Приложение поддерживает интеграцию с Codex.
        I11: Приложение поддерживает интеграцию с DeepSeek Harness.
    inherited: []
    children:
      - module_id: architecture-tests
        directory: test
        contract:
          id: architecture-tests
          kind: module
          purpose: Проверять наблюдаемое поведение ArchiView от чтения контрактов до
            просмотра и переноса установленного приложения.
          boundaries:
            B2: Сценарии записи используют проекты и хранилища, принадлежащие тесту.
            B3: Для проверки переносимости запускать копию поставки из другого файлового
              корня.
          invariants: {}
        document_state: documented
      - module_id: architecture-web
        directory: web
        contract:
          id: architecture-web
          kind: group
          purpose: Предоставлять пользователю просмотр архитектуры проекта, редактирование
            контрактов и запуск анализа выбранного модуля.
          boundaries:
            B2: Действия просмотра оставляют исходники и согласованные контракты без
              изменений.
            B3: Интерфейс отображает полученные документы и исходники только как данные.
          invariants: {}
        document_state: documented
      - module_id: archiview-analyse
        directory: analyse
        contract:
          id: archiview-analyse
          kind: group
          purpose: Объединять виды анализа проекта с доступом к его файлам и сохранённым
            результатам.
          boundaries: {}
          invariants:
            I1: Каждый вид анализа реализуется в отдельном модуле.
        document_state: documented
      - module_id: archiview-bridges
        directory: bridges
        contract:
          id: archiview-bridges
          kind: group
          purpose: Регистрировать работающие harness и создавать в выбранном хосте чат для
            поручения ArchiView.
          boundaries: {}
          invariants:
            I1: Мосты обеспечивают регистрацию хоста и доставку поручений для Codex Desktop
              и DeepSeek Harness.
        document_state: documented
      - module_id: archiview-cli
        directory: cli
        contract:
          id: archiview-cli
          kind: module
          purpose: Принимать команды чтения и изменения данных проекта и выводить
            результат их выполнения.
          boundaries: {}
          invariants:
            I1: Импорт результата анализа доступен из командной строки.
        document_state: documented
      - module_id: archiview-distribution
        directory: builds
        contract:
          id: archiview-distribution
          kind: module
          purpose: Собирать из исходников пакеты для локального запуска ArchiView и
            поставки плагинов.
          boundaries: {}
          invariants:
            I2: OS Windows 11
            I3: OS Linux
            I4: OS Mac
        document_state: documented
      - module_id: archiview-framework
        directory: framework
        contract:
          id: archiview-framework
          kind: group
          purpose: Регламентировать доменную модель ArchiView — состав, смысл и связи
            проектов, модулей, контрактов, снимков и отчётов.
          boundaries:
            B1: Для фактов о репозитории и результатов анализа задавать только их
              представление и допустимые связи.
          invariants: {}
        document_state: documented
      - module_id: archiview-module-operations
        directory: module-operations
        contract:
          id: archiview-module-operations
          kind: module
          purpose: Является модулем предоставления операции производимых над проектными
            сущностями
          boundaries:
            B2: Только выбранный проект
          invariants:
            I1: OS Windows 11
            I2: OS Mac
            I3: OS Linux
        document_state: documented
      - module_id: archiview-skills
        directory: skills
        contract:
          id: archiview-skills
          kind: group
          purpose: Предоставлять для поставки ArchiView единый набор именованных скиллов.
          boundaries: {}
          invariants: {}
        document_state: documented
      - module_id: archiview-storage
        directory: storage
        contract:
          id: archiview-storage
          kind: module
          purpose: Обеспечивать файловым хранилищам ArchiView безопасный доступ к
            состоянию проекта, проверку происхождения, чтение архивов и
            согласование параллельных записей.
          boundaries: {}
          invariants: {}
        document_state: documented
      - module_id: archiview-tools
        directory: tools
        contract:
          id: archiview-tools
          kind: module
          purpose: Предоставлять разработчику инструменты установки и локальной проверки
            ArchiView.
          boundaries:
            B1: Устанавливать ArchiView в профиль пользователя только по явной команде.
            B2: Проводить стендовую проверку на временном проекте без обращения к модели.
          invariants: {}
        document_state: documented
