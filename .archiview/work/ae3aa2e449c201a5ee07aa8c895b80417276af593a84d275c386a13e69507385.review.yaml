              const inventory = { schema_version: 1, root, complete: listed.complete, discovery: listed.discovery,
                sourceFiles: sourcePaths.length, modules, diagnostics: listed.diagnostics,
                preparation: "Исправьте ошибки карты и контрактов. Для нового модуля изучите исходники и контракты предков. " + ADD_MAPPING };
              return { inventory, scannedFiles: listed.files.length };
            }


            /** A workspace lists modules by repository; contract ids stay local
            to that repository. */

            export async function moduleInventory(projectRoot: string, options:
            InventoryOptions = {}) {
              const root = await realpath(projectRoot);
              const projects = await discoverWorkspaceProjects(root);
              const repositories = projects.map(project => project.repository);
              if (!repositories.length) throw new Error("Для ArchiView требуется рабочее дерево Git");
              const nestedUnder = (repository: string) => repositories.filter(child => child !== repository &&
                (repository === "." || child.startsWith(repository + "/"))).map(child => path.posix.relative(repository, child));
              if (options.repository !== undefined || repositories.length === 1 && repositories[0] === ".") {
                const repository = options.repository ?? ".";
                const project = projects.find(candidate => candidate.repository === repository);
                if (!project) throw new Error("Репозиторий не входит в выбранную рабочую папку: " + repository);
                const selected = await resolveWorkspaceRepository(root, repository);
                const { inventory } = await repositoryInventory(selected, options, nestedUnder(repository));
                return { ...inventory, repositories: [repository], projects: [project] };
              }
              const modules: InventoryModule[] = [];
              const diagnostics: string[] = [];
              let sourceFiles = 0;
              let complete = true;
              let remaining = options.maxFiles ?? 50000;
              for (const repository of repositories) {
                if (remaining <= 0) {
                  complete = false;
                  diagnostics.push("File limit reached before repository " + repository);
                  break;
                }
                const { inventory: result, scannedFiles } = await repositoryInventory(
                  await resolveWorkspaceRepository(root, repository), { ...options, maxFiles: remaining }, nestedUnder(repository));
                remaining -= scannedFiles;
                const prefix = (item: string) => path.posix.join(repository, item);
                modules.push(...result.modules.map((item) => ({ ...item, repository, directory: prefix(item.directory),
                  document: prefix(item.document), files: item.files?.map(prefix) })));
                diagnostics.push(...result.diagnostics.map((message) => repository + ": " + message));
                complete &&= result.complete;
                sourceFiles += result.sourceFiles;
              }
              return { schema_version: 1, root, discovery: "workspace", repositories, projects, complete, sourceFiles, modules, diagnostics,
                preparation: "Изменяйте карту и контракты в репозитории, указанном в поле repository модуля." };
            }


            /** Resolve either a file or a directory, then read the chain inside
            its owning repository. */

            export async function moduleContext(projectRoot: string, sourcePath
            = ".") {
              const { root, directory: sourceDirectory, workspaceRoot, repository, existingDirectory, plannedPath } = await locateSourceRepository(projectRoot, sourcePath);
              const tree = await readModuleTree(root);
              const plannedDirectory = plannedPath && (tree.has(plannedPath) || [...tree.keys()].some(dir => dir.startsWith(plannedPath + "/")));
              const directory = plannedDirectory ? plannedPath : sourceDirectory;
              const chain = [];
              let current = directory;
              while (true) {
                const id = tree.get(current);
                const exists = current === "." || existingDirectory === current || existingDirectory.startsWith(current + "/");
                if (exists) chain.push(await documentAt(root, current, id));
                else {
                  const planned = id && resolveModuleDocument(current, id, await readContractStorageFile(root, moduleDocumentPath(id)));
                  chain.push(planned && isPrototype(planned.contract) ? planned : { ...resolveModuleDocument(current, id, null),
                    action: "Каталог ещё не создан. " + ADD_MAPPING });
                }
                if (current === ".") break;
                current = path.posix.dirname(current);
              }
              return { schema_version: 1, root, directory, workspaceRoot, repository, contracts: chain.reverse() };
            }
