          text: >
            import { realpath } from "node:fs/promises";

            import path from "node:path";

            import { discoverWorkspaceProjects, locateSourceRepository,
            resolveWorkspaceRepository } from "../project/workspace.js";

            import { errorDetails } from "../../node-errors.js";

            import type { ModuleDocument } from "./module-tree.js";

            import { isPrototype } from "../../framework/contracts/types.js";

            import {
              assertModuleDirectory, ADD_MAPPING, listModuleContractPaths,
              MODULE_TREE_FILE, moduleDocumentPath, readContractStorageFile, readModuleTree, resolveModuleDocument,
            } from "./module-tree.js";

            import { excludedProjectPath, portable, projectFiles,
            regularProjectFile, SOURCE_EXTENSIONS } from "./source-files.js";


            export { excludedProjectPath, projectFiles, regularProjectFile,
            SOURCE_EXTENSIONS } from "./source-files.js";


            interface InventoryModule extends ModuleDocument {
              repository?: string;
              sourceFiles?: number;
              required?: boolean;
              files?: string[];
              preparation?: string;
            }


            async function documentAt(root: string, directory: string, id?:
            string): Promise<InventoryModule> {
              const text = id ? await readContractStorageFile(root, moduleDocumentPath(id)) : null;
              const document = resolveModuleDocument(directory, id, text);
              await assertModuleDirectory(root, directory, !id || isPrototype(document.contract));
              return document;
            }


            function includeDirectory(directories: Map<string, number>,
            directory: string, source: boolean) {
              while (true) {
                directories.set(directory, (directories.get(directory) ?? 0) + Number(source));
                if (directory === ".") return;
                directory = path.posix.dirname(directory);
              }
            }


            /** Inventories source paths and mapped resources, and reports
            broken central storage explicitly. */

            interface InventoryOptions { extensions?: Set<string>; maxFiles?:
            number; repository?: string }


            async function repositoryInventory(root: string, options:
            InventoryOptions, nested: string[]) {
              const extensions = options.extensions ?? SOURCE_EXTENSIONS;
              const owned = (relative: string) => !nested.some((child) => relative === child || relative.startsWith(child + "/"));
              const listed = await projectFiles(root, options.maxFiles ?? 50000, owned);
              const directories = new Map<string, number>();
              const sourcePaths: string[] = [];
              let tree = new Map<string, string>();
              let treeError: string | undefined;
              try {
                tree = await readModuleTree(root);
              } catch (cause) {
                treeError = MODULE_TREE_FILE + ": " + errorDetails(cause).message;
                listed.diagnostics.push(treeError);
                listed.complete = false;
              }
              for (const directory of tree.keys()) {
                if (owned(directory)) includeDirectory(directories, directory, false);
                else {
                  listed.complete = false;
                  listed.diagnostics.push(MODULE_TREE_FILE + ": " + directory + " belongs to a nested repository");
                }
              }
              if (!treeError) {
                try {
                  const registered = new Set([...tree.values()].map(moduleDocumentPath));
                  for (const file of await listModuleContractPaths(root)) {
                    if (!registered.has(file)) {
                      listed.diagnostics.push(file + " is not registered in " + MODULE_TREE_FILE);
                      listed.complete = false;
                    }
                  }
                } catch (cause) {
                  listed.diagnostics.push(errorDetails(cause).message);
                  listed.complete = false;
                }
              }
              for (const file of listed.files) {
                if (!extensions.has(path.extname(file).toLowerCase())) continue;
                try {
                  if (!await regularProjectFile(root, file)) continue;
                } catch (cause) {
                  listed.complete = false;
                  listed.diagnostics.push(file + ": " + errorDetails(cause).message);
                  continue;
                }
                const relative = portable(file);
                sourcePaths.push(relative);
                includeDirectory(directories, path.posix.dirname(relative), true);
              }
              const modules: InventoryModule[] = [];
              for (const [directory, sourceFiles] of [...directories].sort(([a], [b]) => a.localeCompare(b))) {
                const id = tree.get(directory);
                let entry: InventoryModule;
                try {
                  if (treeError) {
                    entry = { directory, document: MODULE_TREE_FILE, status: "invalid", errors: [treeError] };
                  } else {
                    const { text, ...document } = await documentAt(root, directory, id);
                    entry = document;
                    if (id && entry.status === "missing") {
                      listed.diagnostics.push(directory + ": missing " + entry.document);
                      listed.complete = false;
                    }
                  }
                } catch (cause) {
                  const message = directory + ": " + errorDetails(cause).message;
                  listed.diagnostics.push(message);
                  listed.complete = false;
                  entry = { directory, document: id ? moduleDocumentPath(id) : MODULE_TREE_FILE,
                    status: "unreadable", errors: [message] };
                }
                entry.sourceFiles = sourceFiles;
                entry.required = sourceFiles > 0;
                entry.files = sourcePaths.filter((file) => path.posix.dirname(file) === directory);
                entry.preparation = entry.status === "documented" ? "ready" :
                  entry.status === "missing" && !id ? "analyze_and_write" : "repair";
                modules.push(entry);
              }
              const inventory = { schema_version: 1, root, complete: listed.complete, discovery: listed.discovery,
                sourceFiles: sourcePaths.length, modules, diagnostics: listed.diagnostics,
                preparation: "Исправьте ошибки карты и контрактов. Для нового модуля изучите исходники и контракты предков. " + ADD_MAPPING };
              return { inventory, scannedFiles: listed.files.length };
            }


            /** A workspace lists modules by repository; contract ids stay local
            to that repository. */

            export async function moduleInventory(projectRoot: string, options:
            InventoryOptions = {}) {
              const root = await realpath(projectRoot);
              const projects = await discoverWorkspaceProjects(root);
              const repositories = projects.map(project => project.repository);
              if (!repositories.length) throw new Error("Для ArchiView требуется рабочее дерево Git");
              const nestedUnder = (repository: string) => repositories.filter(child => child !== repository &&
                (repository === "." || child.startsWith(repository + "/"))).map(child => path.posix.relative(repository, child));
              if (options.repository !== undefined || repositories.length === 1 && repositories[0] === ".") {
                const repository = options.repository ?? ".";
                const project = projects.find(candidate => candidate.repository === repository);
                if (!project) throw new Error("Репозиторий не входит в выбранную рабочую папку: " + repository);
                const selected = await resolveWorkspaceRepository(root, repository);
                const { inventory } = await repositoryInventory(selected, options, nestedUnder(repository));
                return { ...inventory, repositories: [repository], projects: [project] };
              }
              const modules: InventoryModule[] = [];
              const diagnostics: string[] = [];
              let sourceFiles = 0;
              let complete = true;
              let remaining = options.maxFiles ?? 50000;
              for (const repository of repositories) {
                if (remaining <= 0) {
                  complete = false;
                  diagnostics.push("File limit reached before repository " + repository);
                  break;
                }
                const { inventory: result, scannedFiles } = await repositoryInventory(
                  await resolveWorkspaceRepository(root, repository), { ...options, maxFiles: remaining }, nestedUnder(repository));
                remaining -= scannedFiles;
                const prefix = (item: string) => path.posix.join(repository, item);
                modules.push(...result.modules.map((item) => ({ ...item, repository, directory: prefix(item.directory),
                  document: prefix(item.document), files: item.files?.map(prefix) })));
                diagnostics.push(...result.diagnostics.map((message) => repository + ": " + message));
                complete &&= result.complete;
                sourceFiles += result.sourceFiles;
              }
              return { schema_version: 1, root, discovery: "workspace", repositories, projects, complete, sourceFiles, modules, diagnostics,
                preparation: "Изменяйте карту и контракты в репозитории, указанном в поле repository модуля." };
            }


            /** Resolve either a file or a directory, then read the chain inside
            its owning repository. */

            export async function moduleContext(projectRoot: string, sourcePath
            = ".") {
              const { root, directory: sourceDirectory, workspaceRoot, repository, existingDirectory, plannedPath } = await locateSourceRepository(projectRoot, sourcePath);
              const tree = await readModuleTree(root);
              const plannedDirectory = plannedPath && (tree.has(plannedPath) || [...tree.keys()].some(dir => dir.startsWith(plannedPath + "/")));
              const directory = plannedDirectory ? plannedPath : sourceDirectory;
              const chain = [];
              let current = directory;
              while (true) {
                const id = tree.get(current);
                const exists = current === "." || existingDirectory === current || existingDirectory.startsWith(current + "/");
                if (exists) chain.push(await documentAt(root, current, id));
                else {
                  const planned = id && resolveModuleDocument(current, id, await readContractStorageFile(root, moduleDocumentPath(id)));
                  chain.push(planned && isPrototype(planned.contract) ? planned : { ...resolveModuleDocument(current, id, null),
                    action: "Каталог ещё не создан. " + ADD_MAPPING });
                }
                if (current === ".") break;
                current = path.posix.dirname(current);
              }
              return { schema_version: 1, root, directory, workspaceRoot, repository, contracts: chain.reverse() };
            }
        - id: sha256:6cad4fe58447245397bcfdcc91233cf61a8dd18601bfe77529c8579b3e32fc6e
          kind: file
          path: analyse/project-sources/module-tree.ts
          start_line: 1
          end_line: 73
          text: >
            import { isUtf8 } from "node:buffer";

            import { lstat, readdir, readFile, realpath } from
            "node:fs/promises";

            import path from "node:path";

            import { assertStateLocation, STATE_DIRECTORY, within } from
            "../../storage/paths.js";

            import { errorDetails } from "../../node-errors.js";

            import {
              isModuleContractPath, MAX_DOCUMENT_BYTES, MAX_TREE_BYTES, MODULE_DIRECTORY, MODULE_TREE_FILE, parseModuleTree,
            } from "../../framework/contracts/module-tree.js";

            import { excludedProjectPath, portable } from "./source-files.js";


            export * from "../../framework/contracts/module-tree.js";


            async function existingEntry(file: string) {
              try { return await lstat(file); }
              catch (cause) { if (errorDetails(cause).code !== "ENOENT") throw cause; }
            }


            /** Resolves the caller's source path, retaining the filesystem's
            spelling. */

            export async function resolveSourceDirectory(root: string,
            directory: string) {
              const requested = path.resolve(root, directory);
              if (!within(root, requested)) throw new Error("directory is outside project");
              const target = await realpath(requested);
              if (!within(root, target)) throw new Error("directory resolves outside project");
              if (excludedProjectPath(path.relative(root, target))) throw new Error("directory is excluded from project sources");
              if (path.relative(requested, target) !== "") throw new Error("source directory uses a directory link: " + directory);
              if (!(await lstat(target)).isDirectory()) throw new Error("directory is not a directory: " + directory);
              return portable(path.relative(root, target));
            }


            /** Git tree paths are case-sensitive even when the local filesystem
            accepts aliases. */

            export async function assertModuleDirectory(root: string, directory:
            string, planned = false): Promise<void> {
              if (planned && directory !== "." && !await existingEntry(path.join(root, directory))) {
                return assertModuleDirectory(root, path.posix.dirname(directory), true);
              }
              const actual = await resolveSourceDirectory(root, directory);
              if (actual !== directory) throw new Error("Mapped directory " + directory + " does not match " + actual);
            }


            export function decodeContractText(bytes: Buffer, document: string)
            {
              if (!isUtf8(bytes)) throw new Error(document + " contains invalid UTF-8");
              return bytes.toString("utf8");
            }


            export async function readContractStorageFile(root: string,
            relative: string): Promise<string | null> {
              if (relative !== MODULE_TREE_FILE && !isModuleContractPath(relative)) {
                throw new Error("Invalid contract storage path: " + relative);
              }
              const file = path.join(root, relative);
              await assertStateLocation(root, path.join(root, STATE_DIRECTORY), file);
              const info = await existingEntry(file);
              if (!info) return null;
              if (portable(path.relative(root, await realpath(file))) !== relative) return null;
              if (!info.isFile()) throw new Error("Contract storage entry must be a regular file: " + relative);
              const limit = relative === MODULE_TREE_FILE ? MAX_TREE_BYTES : MAX_DOCUMENT_BYTES;
              if (info.size > limit) throw new Error(relative + " exceeds " + limit / 1024 + " KiB");
              return decodeContractText(await readFile(file), relative);
            }


            export async function readModuleTree(root: string) {
              const text = await readContractStorageFile(root, MODULE_TREE_FILE);
              return text === null ? new Map<string, string>() : parseModuleTree(text);
            }


            /** Lists only direct YAML entries, including unregistered contracts
            that need repair. */

            export async function listModuleContractPaths(root: string) {
              const directory = path.join(root, MODULE_DIRECTORY);
              await assertStateLocation(root, path.join(root, STATE_DIRECTORY), directory);
              if (!await existingEntry(directory)) return [];
              if (portable(path.relative(root, await realpath(directory))) !== MODULE_DIRECTORY) return [];
              const names = await readdir(directory);
              return names.filter((name) => name.endsWith(".yaml")).sort().map((name) => MODULE_DIRECTORY + "/" + name);
            }
