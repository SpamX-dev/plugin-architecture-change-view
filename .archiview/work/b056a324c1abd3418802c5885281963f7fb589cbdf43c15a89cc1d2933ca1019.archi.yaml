      document:
        state: documented
        text: >
          schema_version: 1

          id: archiview-reports

          title: Модель переносимых отчётов

          kind: module

          extensions:
            archiview.roles: [domain]
          purpose: Вычислять переносимые состояния модулей, входы проверок и
          актуальность оценок для заданной пары снимков.

          responsibilities:
            R1: Вычислять технические отчёты и проверять идентичность входов, результатов и неизменяемых попыток.
            R2: Сопоставлять изменения кода, контрактов и зависимостей с областью проверки и агрегировать оценки дерева.
          boundaries:
            B1: Чтение проектов, блокировка и запись публикации принадлежат другим модулям.
          invariants:
            I1: Оценки current и change, собственное состояние и состояние поддерева вычисляются раздельно.
            I2: Кеш подготовленной модели ограничен выбранной парой снимков и изолирован от последующих изменений входов.
            I3: Актуальность определяется по собственным входам проверки и явно выбранному поддереву.
              Зависимости из LLM-отчётов сохраняются как происхождение доказательств, но не отслеживаются;
              их изменения и недоступность не инвалидируют анализ. Отключённое слежение обозначается
              ограничением полноты независимо от актуальности.
              Различия формулировок и покрытия совместимых проверок текущего состояния не создают конфликт;
              конфликт отражает противоположные определённые выводы или статусы одного замечания.
            I4: Собственная проверка родителя сопоставляет его код и контракт с объявлениями непосредственных детей.
              Изменение состава детей или смысла их контрактов требует перепроверки композиции.
              Реализация детей, их замечания, оценки изменений и внутренний состав не влияют на собственный вердикт и актуальность родителя.
