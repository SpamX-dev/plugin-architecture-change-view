            import type { ReviewEntry } from "./types.js";

            import { digest } from "../serialization/digest.js";

            import { ANALYZER } from "../reviews/bundle.js";


            /** Внешняя структура не считается LLM-попыткой даже при наличии
            пустых findings. */

            export function isSemanticReview(entry: ReviewEntry | ReviewReport |
            ReviewBundle) {
