                if (ancestors.has(id)) throw new Error("Cyclic review resolution");
                const next = new Set([...ancestors, id]);
                for (const target of byId.get(id)?.resolution?.review_ids ?? []) visit(target, next);
              };
              for (const id of byId.keys()) visit(id);
              return entries;
            }
