    contract:
      schema_version: 1
      id: archiview-reports
      title: Модель переносимых отчётов
      kind: module
      extensions:
        archiview.roles:
          - domain
      purpose: Вычислять переносимые состояния модулей, входы проверок и актуальность
        оценок для заданной пары снимков.
      responsibilities:
        R1: Вычислять технические отчёты и проверять идентичность входов, результатов и
          неизменяемых попыток.
        R2: Сопоставлять изменения кода, контрактов и зависимостей с областью проверки и
          агрегировать оценки дерева.
      boundaries:
        B1: Чтение проектов, блокировка и запись публикации принадлежат другим модулям.
      invariants:
        I1: Оценки current и change, собственное состояние и состояние поддерева
          вычисляются раздельно.
        I2: Кеш подготовленной модели ограничен выбранной парой снимков и изолирован от
          последующих изменений входов.
        I3: Актуальность определяется по входам проверки с учётом использованных
          зависимостей. Полнота проверки и полнота перечня зависимостей
          оцениваются отдельно от актуальности.
        I4: Входы проверки композиции родителя включают контракты его непосредственных
          детей.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Извлечение символов, разрешение зависимостей и индексация AST находятся за
          пределами ArchiView и относятся к ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено выбранным корнем проекта. Вкладка чата получает этот
          корень от хоста; явно настроенный для модельных инструментов корень
          ограничивает их чтение.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: Устойчивую ответственность задаёт контракт в .archiview/modules; карта
          modules.tree связывает его id с каталогом проекта. Эвристические
          оценки и текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-change-view
        section: invariants
        id: I5
        text: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются
          строгим TypeScript перед сборкой; классы сохраняют единственную
          ответственность внутри границ своих модулей.
      - module_id: architecture-change-view
        section: invariants
        id: I6
        text: Обе интеграции получают правила ведения контрактов из канонического скилла
          пакета.
      - module_id: architecture-change-view
        section: invariants
        id: I7
        text: Панель обращается к агенту только по явному поручению пользователя
          проанализировать модуль или исправить замечание.
      - module_id: architecture-change-view
        section: invariants
        id: I8
        text: Каждый Git-репозиторий рабочей папки версионирует свои контракты вместе с
          кодом. Панель и агент сохраняют принадлежность модуля его репозиторию.
      - module_id: architecture-core
        section: boundaries
        id: B1
        text: Адаптеры вызывают общие прикладные операции просмотра. Прикладной сервис
          принимает данные проекта и возвращает результат независимо от
          транспорта, хоста и способа отображения.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: Семантический вывод ответственности выполняет агент или внешний
          анализатор. Наличие контракта не доказывает его выполнения.
      - module_id: architecture-core
        section: boundaries
        id: B5
        text: Адаптеры и сборщики снимков используют общую модель контрактов. Чтение и
          проверка контрактов доступны независимо от MCP, HTTP и хоста.
      - module_id: architecture-core
        section: invariants
        id: I1
        text: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости,
          сборка и папки .archiview не расширяют анализ. Запись данных
          допускается в .archiview корня проекта либо явно выбранном внешнем
          хранилище; ссылки не меняют эту область.
      - module_id: architecture-core
        section: invariants
        id: I2
        text: Неполнота обхода и доказательств сообщается явно.
      - module_id: architecture-core
        section: invariants
        id: I3
        text: Снимки и отчёты не заменяют контракт модуля и не согласуют новую
          ответственность.
      - module_id: architecture-core
        section: invariants
        id: I4
        text: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых
          файлах.
      - module_id: architecture-core
        section: invariants
        id: I5
        text: Структурное различие контрактов не создаёт замечание; оценка нарушения
          требует отдельного анализа.
      - module_id: architecture-core
        section: invariants
        id: I6
        text: Успешная проверка индекса означает, что подготовленные к коммиту отчёты
          описывают состояние исходников и контрактов из того же индекса Git.
