    contract:
      schema_version: 1
      id: archiview-reports
      title: Модель переносимых отчётов
      kind: module
      extensions:
        archiview.roles:
          - domain
      purpose: Определять состояние модулей и актуальность архитектурных оценок для
        выбранной пары снимков.
      responsibilities:
        R1: Формировать технический отчёт по модулю для заданного сравнения.
        R3: Подготавливать вход содержательной проверки с точными ссылками на снимки и
          проверяемые пункты.
        R4: Проверять соответствие принятой попытки её входам и неизменность её
          результата.
        R2: Оценивать актуальность проверки по изменениям в заявленной области.
        R5: Агрегировать оценки по дереву с сохранением собственной оценки каждого
          модуля.
        R6: Выявлять несовместимые выводы проверок одного состояния модуля.
      boundaries:
        B2: Определять актуальность текущего состояния и оценки перехода между снимками
          раздельно.
        B3: Считать собственную проверку родителя устаревшей при изменении состава
          непосредственных детей или смысла их контрактов.
        B4: Изменения реализации ребёнка и его собственные замечания сами по себе не
          меняют собственный вердикт родителя.
        B5: Сохранённые зависимости из LLM-проверок учитывать только как происхождение
          доказательств.
        B6: Отражать отсутствие проверки зависимостей в полноте анализа независимо от
          актуальности его входов.
        B7: Считать конфликтом противоположные определённые выводы либо несовместимые
          статусы одного замечания.
      invariants: {}
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Просмотр и подготовка анализа сохраняют исходники и согласованные
          контракты проекта без изменений.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: При подготовке контекста ArchiView не строит граф зависимостей по символам
          исходного кода.
      - module_id: architecture-change-view
        section: boundaries
        id: B3
        text: В общей рабочей папке ArchiView читает контракты и историю модуля в
          пределах репозитория, которому он принадлежит.
      - module_id: architecture-change-view
        section: boundaries
        id: B4
        text: Панель обращается к агенту только по явному поручению пользователя
          провести анализ или исправить замечание.
      - module_id: architecture-change-view
        section: boundaries
        id: B5
        text: Автоматическая проверка структуры может подтвердить наличие контракта и
          корректность формата, но не выполнение обязанностей.
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает встроенную панель Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает встроенную панель DeepSeek Harness.
      - module_id: architecture-change-view
        section: invariants
        id: I9
        text: Самостоятельный локальный запуск входит в обязательные варианты поставки
          приложения.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: При структурном сравнении фиксировать различия контрактов без
          автоматического вывода о нарушении ответственности.
      - module_id: architecture-core
        section: boundaries
        id: B6
        text: При обходе учитывать исходники только внутри выбранного корня, исключая
          зависимости, результаты сборки и служебные данные ArchiView.
      - module_id: architecture-core
        section: boundaries
        id: B7
        text: Записывать данные истории только в каталог ArchiView проекта либо в явно
          выбранное внешнее хранилище.
      - module_id: architecture-core
        section: boundaries
        id: B8
        text: Разрешать исторические доказательства по содержимому выбранных снимков.
