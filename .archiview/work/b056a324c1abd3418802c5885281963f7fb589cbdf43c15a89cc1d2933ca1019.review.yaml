          - selector:
              kind: file
              path: src/contracts/document.ts
            available: true
            digest: sha256:e51e7067068e1fe15fa9e0dfa8204a7bdc9133f32c3dda4a379ba838164ad1d6
            content: >
              import { fail, string, object, enumeration, shape, strings,
              references, extensions } from "../serialization/schema.js";


              import type { Validator } from "../serialization/schema.js";


              import type { Contract, ContractDocument } from "./types.js";

              import { errorDetails } from "../errors.js";

              import { parseYaml } from "../serialization/yaml.js";


              const clauses = (min: number): Validator => (v, at) => {
                object(v, at);
                if (Object.keys(v as object).length < min) fail(at, "нужен хотя бы один пункт");
                for (const [key, text] of Object.entries(v as Record<string, unknown>)) { string(key, at); string(text, at + "." + key); }
              };


              /** Контракт не содержит путь, историю или результаты анализа; они
              принадлежат снимкам. */

              export function validateArch(input: unknown): Contract {
                const value = input as Contract;
                shape({ schema_version: enumeration(1), id: string, title: string, kind: enumeration("module", "group"),
                  purpose: string, responsibilities: clauses(1), boundaries: clauses(0), invariants: clauses(0) },
                { rationale: string, owners: strings, tags: strings, references, extensions })(value, "arch");
                return value;
              }


              /** Старый файл возвращается только как материал немедленного
              переноса, не как контракт. */

              export function contractDocument(text: string | null | undefined,
              format = "arch.yaml"): ContractDocument {
                if (!text?.trim()) return { state: "empty", text: text ?? null, format, contract: null };
                if (format === "module.md") return { state: "migration_required", text, format, contract: null,
                  action: "Немедленно перенесите ответственность в arch.yaml, проверьте его и удалите module.md." };
                try { return { state: "documented", text, format, contract: parseYaml(text, validateArch) }; }
                catch (cause) { const error = errorDetails(cause); return { state: "invalid", text, format, contract: null, errors: [error.message] }; }
              }
          - selector:
              kind: file
              path: src/reviews/bundle.ts
            available: true
            digest: sha256:769e55c7aebdfbc6aef86c455ad55c1661c8e4233c6d22543df5d7d8f2598545
            content: >
              import type { SnapshotData, SnapshotModule, Snapshot,
              ComparisonModule } from "../snapshots/types.js";

              import type {
                Side, ReviewBundle, ReviewReport, ReviewManifest, ClauseReference, ClauseInput,
                ClauseCheck, Finding, EvidenceReference,
              } from "./types.js";

              /**
               * Проверка структуры и связи отчёта со снимками. Не выводит семантику кода:
               * пункты ответственности получают not_checked, а наблюдения — явное ограничение.
               * Полноценный внешний анализ использует тот же формат и сохранённые доказательства.
               */
              import { randomUUID } from "node:crypto";

              import path from "node:path";

              import { digest } from "../serialization/digest.js";

              import { validateReview } from "./schema.js";

              import { snapshotDigest } from "../snapshots/identity.js";


              /** Версия включает алгоритм структурной проверки; настройки
              участвуют в manifest. */

              export const ANALYZER = { name: "archiview-structure", version:
              "1.0.2",
                config_digest: digest({ semantic: false, inherited: ["boundaries", "invariants"] }) };

              /** Точная ссылка на сохранённое содержание, независимо от
              пользовательской метки. */

              export const snapshotReference = (snapshot: Snapshot | null |
              undefined) => snapshot ?
                { id: snapshot.id, digest: snapshot.digest ?? snapshotDigest(snapshot) } : null;

              /**
               * Собственная проверка содержит только локальный контракт. Режим effective
               * нужен для проверки целостности прежних неизменяемых отчётов с пунктами предков.
               */
              export function effectiveClauses(snapshot: SnapshotData | null,
              directory: string | null | undefined, side: Side, contractScope =
              "effective"): ClauseInput[] {
                if (!["own", "effective"].includes(contractScope)) throw new Error("Unsupported contract scope");
                if (!snapshot || directory == null) return [];
                const parents = new Set([directory]);
                let parent = directory;
                while (contractScope === "effective" && parent !== ".") { parent = path.posix.dirname(parent); parents.add(parent); }
                return snapshot.modules.filter((m) => parents.has(m.directory) && m.document.state === "documented" && m.document.contract)
                  .flatMap((m) => (["responsibilities", "boundaries", "invariants"] as const)
                    .filter((section) => section !== "responsibilities" || m.directory === directory)
                    .flatMap((section) => Object.entries(m.document.contract![section]).map(([id, text]) => ({
                      reference: { snapshot: side, module_id: m.document.contract!.id, section, id }, text,
                    }))));
              }


              type ReviewedModule = Pick<ComparisonModule, "moduleId" |
              "baselinePath" | "currentPath" | "before" | "after">;


              /** Манифест отделяет собственный чеклист от сохранённого
              контекста предков. */

              export function reviewManifest(before: Snapshot | null, after:
              Snapshot, module: ReviewedModule, analyzer = ANALYZER,
              contractScope = "own"): ReviewManifest {
                return { schema_version: 1, comparison: { baseline: snapshotReference(before), current: snapshotReference(after) },
                  module: { id: module.moduleId ?? null, baseline_path: module.baselinePath ?? null, current_path: module.currentPath ?? null },
                  analyzer, scope: "module", ...(contractScope === "own" ? { contract_scope: "own" } : {}), contracts: {
                    baseline: effectiveClauses(before, module.baselinePath, "baseline", contractScope),
                    current: effectiveClauses(after, module.currentPath, "current", contractScope),
                  }, instructions: "Проверять структуру контрактов; смысл кода не анализировать.", context: {} };
              }


              /**
               * База и текущее состояние проверяются отдельно. Повторная проверка текущего
               * кода по базовому пункту нужна лишь при изменении или удалении этого пункта;
               * старый формат сохраняет первоначальные требования к набору проверок.
               */
              export function requiredClauseChecks(manifest: ReviewManifest,
              hasCurrent: boolean) {
                const baseline = manifest.contracts?.baseline ?? [];
                const current = manifest.contracts?.current ?? [];
                const previousRequirements = manifest.contract_scope === "own" ? baseline.filter((item) =>
                  !current.some((other) => other.reference.module_id === item.reference.module_id &&
                    other.reference.section === item.reference.section && other.reference.id === item.reference.id && other.text === item.text)) : baseline;
                return [...baseline.map((item) => ({ item, subject: "baseline" as const })),
                  ...current.map((item) => ({ item, subject: "current" as const })),
                  ...(hasCurrent ? previousRequirements.map((item) => ({ item, subject: "current" as const })) : [])];
              }


              /** Новый локальный чеклист не может расширяться пунктами чужого
              контракта. */

              export function validateContractScope(report: ReviewReport,
              manifest: ReviewManifest) {
                const scope = manifest.contract_scope ?? "effective";
                if (!["own", "effective"].includes(scope)) throw new Error("Unsupported contract scope");
