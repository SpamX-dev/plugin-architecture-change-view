            import { parseReportYaml } from "../serialization/yaml.js";

            import type { SnapshotStore } from "./snapshot-store.js";

            import type { SnapshotData, Snapshot, ComparisonModule } from
            "../snapshots/types.js";

            import type { ReviewBundle } from "../reviews/types.js";

            import type {
              ModuleState, ReviewOptions, ReviewEntry, TechnicalReport, SnapshotFragment,
              PublishedComparison, ReviewHistory,
            } from "../reports/types.js";

            import { errorDetails } from "../errors.js";

            /**
             * Переносимое хранилище технических отчётов и полной истории содержательных проверок.
             * work содержит самостоятельную публикацию; snapshots хранит локальное накопление.
             * Публикация заменяется целиком под межпроцессным lock с журналом восстановления.
             */
            import { cp, link, lstat, mkdir, readFile, readdir, rename, rm,
            writeFile } from "node:fs/promises";

            import { randomUUID } from "node:crypto";

            import path from "node:path";

            import { stringify } from "yaml";

            import { canonical, digest } from "../serialization/digest.js";

            import { readReviewBundle } from "./review-store.js";

            import { snapshotDigest } from "../snapshots/identity.js";

            import { createReportModel } from "../reports/model.js";

            import { createReviewEntry } from "../reports/review-entry.js";

            import { isSemanticReview, validateReviewRelations } from
            "../reports/review-identity.js";

            import { validateReviewEntry } from
            "../reports/review-validation.js";

            import { REPORT_SCHEMA_VERSION } from "../reports/types.js";


            const HASH = /^[a-f0-9]{64}$/;

            const START = "# BEGIN ArchiView managed";

            const END = "# END ArchiView managed";

            const MANAGED = [START, "/snapshots/", "/reviews/", "/saved-*.json",
            "/.pending-*", "/.snapshot-*", "/.identity-*", END].join("\n");

            const clone = <T>(value: T): T => JSON.parse(JSON.stringify(value));

            const payload = ({ registration_order, ...entry }: ReviewEntry) =>
            entry;

            const originalBundle = ({ report, manifest, baseline, current }:
            Pick<ReviewEntry,"report"|"manifest"|"baseline"|"current">) => ({
            report, manifest, baseline, current });

            const semantic = isSemanticReview;

            const snapshotContentDigest = (snapshot: Snapshot) =>
            snapshot.digest ?? snapshotDigest(snapshot);


            /** Обе версии используют одинаковые правила технического состояния;
            новые версии добавляются после проверки совместимости. */

            export const SUPPORTED_TECHNICAL_ANALYZER_VERSIONS =
            Object.freeze(["1.0.1", "1.0.2"]);


            /** Идентификатор модуля никогда не становится пользовательским
            фрагментом пути. */

            export const moduleReportName = (id: string) => digest(id).slice(7);


            /** Проверяет минимум переносимой технической схемы и её
            содержательный отпечаток. */

            export function validateArchiReport(input: unknown): TechnicalReport
            {
              const value = input as TechnicalReport;
              if (!value || value.schema_version !== REPORT_SCHEMA_VERSION || value.kind !== "archi" || typeof value.module_id !== "string" || !value.module_id || !HASH.test(value.check_hash)) throw new Error("Invalid archi report schema");
              if (Object.keys(value).some((key) => !["schema_version", "kind", "module_id", "project_id", "check_hash", "input_manifest", "baseline", "current", "change", "structure", "publication", "review_status", "storage_diagnostics"].includes(key))) throw new Error("Unknown archi report field");
              if (!value.input_manifest || digest(value.input_manifest).slice(7) !== value.check_hash) throw new Error("Technical check hash mismatch");
              if (value.input_manifest.project_id !== value.project_id || value.input_manifest.module_id !== value.module_id) throw new Error("Technical report identity mismatch");
              const version = value.input_manifest.analyzer?.version;
              if (!SUPPORTED_TECHNICAL_ANALYZER_VERSIONS.includes(version)) throw new Error(
                "Версия анализатора технического отчёта «" + (typeof version === "string" ? version : "не указана") +
                "» не поддерживается. Поддерживаемые версии: " + SUPPORTED_TECHNICAL_ANALYZER_VERSIONS.join(", ") + ".");
              for (const side of ["baseline", "current"] as const) {
                const state = value[side];
                const reference = side === "baseline" ? value.input_manifest.baseline?.state : value.input_manifest.current;
                const expected = state ? { exists: true, directory: state.directory, self_digest: state.technical_digest, subtree_digest: state.subtree_digest } : { exists: false };
                if ((side !== "baseline" || value.input_manifest.baseline) && canonical(reference) !== canonical(expected)) throw new Error("Technical state reference mismatch");
                if (state) {
                  if (state.module_id !== value.module_id || state.technical.module_id !== value.module_id || state.self.module_id !== value.module_id || state.technical.directory !== state.directory || state.self.directory !== state.directory) throw new Error("Technical state identity mismatch");
                  for (const key of ["technical", "self", "subtree", "semantic_subtree"] as const) if (digest(state[key]) !== state[`${key}_digest` as keyof ModuleState]) throw new Error("Technical state digest mismatch");
                }
              }
              if (value.publication && (!Number.isSafeInteger(value.publication.generation) || value.publication.generation < 1 || !/^sha256:[a-f0-9]{64}$/.test(value.publication.comparison_key))) throw new Error("Invalid publication identity");
              if (value.storage_diagnostics && (!Array.isArray(value.storage_diagnostics) || value.storage_diagnostics.some((item) => typeof item !== "string"))) throw new Error("Invalid storage diagnostics");
              return value;
            }


            const technicalCore = ({ publication, review_status,
            storage_diagnostics, ...report }: TechnicalReport) => report;


            /** Проверка содержательной записи сохраняет исходный v1 пакет без
            переписывания. */

            function validateEntry(entry: ReviewEntry) {
              if (!entry || entry.schema_version !== REPORT_SCHEMA_VERSION || entry.kind !== "review" || typeof entry.module_id !== "string" || !entry.module_id || typeof entry.review_id !== "string" || !entry.review_id || !HASH.test(entry.check_hash)) throw new Error("Invalid review entry schema");
