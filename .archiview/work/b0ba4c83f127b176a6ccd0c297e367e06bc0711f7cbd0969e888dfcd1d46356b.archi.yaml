              const modules: InventoryModule[] = [];
              const diagnostics: string[] = [];
              let sourceFiles = 0;
              let complete = true;
              let remaining = options.maxFiles ?? 50000;
              for (const repository of repositories) {
                if (remaining <= 0) {
