            content: >
              /** Минимальный словарь валидаторов: каждая ошибка содержит точный
              путь поля. */

              export const fail = (at: string, message: string): never => {
              throw new Error(at + ": " + message); };

              export type Validator = (v: unknown, at: string) => void;

              export const string: Validator = (v, at) => typeof v === "string"
              && v.trim() ? undefined : fail(at, "ожидается непустая строка");

              export const object: Validator = (v, at) => v && typeof v ===
              "object" && !Array.isArray(v) ? undefined : fail(at, "ожидается
              словарь");

              export const enumeration = (...values: unknown[]): Validator =>
              (v, at) => values.includes(v) ? undefined : fail(at, "допустимо: "
              + values.join(", "));

              export const nullable = (check: Validator): Validator => (v, at)
              => v === null ? undefined : check(v, at);

              export const array = (check: Validator, min = 0): Validator => (v,
              at) => {
                if (!Array.isArray(v) || v.length < min) fail(at, "ожидается массив, минимум " + min);
                (v as unknown[]).forEach((item, i) => check(item, at + "[" + i + "]"));
              };

              export const shape = (required: Record<string, Validator>,
              optional: Record<string, Validator> = {}): Validator => (v, at) =>
              {
                object(v, at);
                for (const [key, check] of Object.entries(required)) check((v as Record<string, unknown>)[key], at + "." + key);
                for (const key of Object.keys(v as object)) {
                  if (Object.hasOwn(required, key)) continue;
                  if (!Object.hasOwn(optional, key)) fail(at + "." + key, "неизвестное поле");
                  optional[key]((v as Record<string, unknown>)[key], at + "." + key);
                }
              };

              export const strings = array(string);

              export const references = array(shape({ title: string, uri: string
              }));

              export const extensions: Validator = (v, at) => {
                object(v, at);
                for (const key of Object.keys(v as object)) if (!/^[^.\s]+\.[^\s]+$/.test(key)) fail(at, "расширению нужно пространство имён");
              };
          - selector:
              kind: file
              path: src/serialization/yaml.ts
            available: true
            digest: sha256:280b4b638e95da5bfb1a1abbf5cabfc47e75d9f70c26e69a9607c16de1589ec7
            content: >
              import { parseDocument, isAlias, isMap, isScalar, isSeq } from
              "yaml";


              /** Парсер запрещает дубликаты, aliases, нестандартные теги и
              несколько документов. */

              export function parseYaml<T>(text: string, validate: (value:
              unknown) => T): T {
                const doc = parseDocument(text, { uniqueKeys: true, strict: true, version: "1.2", intAsBigInt: true });
                if (doc.errors.length || doc.warnings.length) throw new Error([...doc.errors, ...doc.warnings].map((e) => e.message).join("; "));
                // Ограничиваем YAML обычными типами данных до преобразования: иначе ключ 1
                // превратится в строку, а .nan потеряет смысл при каноническом JSON-хешировании.
                const inspect = (node: unknown): void => {
                  if (node == null) return;
                  if (typeof node === "object" && "tag" in node && node.tag &&
                      !["str", "int", "float", "bool", "null", "map", "seq"].some((name) => node.tag === "tag:yaml.org,2002:" + name))
                    throw new Error("Custom YAML tag");
                  if (isAlias(node)) throw new Error("YAML aliases are not allowed");
                  if (isMap(node)) {
                    for (const pair of node.items) {
                      if (!isScalar(pair.key) || typeof pair.key.value !== "string") throw new Error("YAML mapping keys must be strings");
                      inspect(pair.key);
                      inspect(pair.value);
                    }
                  } else if (isSeq(node)) node.items.forEach(inspect);
                  else if (isScalar(node) && typeof node.value === "bigint") {
                    const number = Number(node.value);
                    if (!Number.isFinite(number) || BigInt(number) !== node.value) throw new Error("YAML integer cannot be represented exactly");
                    node.value = number;
                  } else if (!isScalar(node) || !["string", "boolean", "number"].includes(typeof node.value) && node.value !== null ||
                    typeof node.value === "number" && !Number.isFinite(node.value)) throw new Error("Unsupported YAML value");
                };
                inspect(doc.contents);
                return validate(doc.toJS({ maxAliasCount: 0 }));
              }


              /** Decodes persisted records before format-specific integrity
              checks. */

              export function parseReportYaml<T = unknown>(text: string): T {
                return parseYaml(text, (value) => value as T);
              }
