                const directory = pending.pop()!;
                const entries = await readdir(directory, { withFileTypes: true }).catch((cause: unknown) => {
                  const { code } = errorDetails(cause);
                  if (directory !== root && (code === "ENOENT" || code === "ENOTDIR")) return [];
