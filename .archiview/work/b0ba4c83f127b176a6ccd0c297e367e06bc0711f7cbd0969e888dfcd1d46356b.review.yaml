              приложении ArchiView,
                где команда может сопоставить состояние проекта с ответственностью его модулей.
              responsibilities:
                R1: Поставлять агентам канонические правила ведения контрактов и средства чтения контекста каталога.
                R2: Давать агенту возможность установить, каким каталогам требуется создание, перенос или
                  исправление контракта.
                R3: Предоставлять пользователю изменения для выбранной пары снимков вместе с результатами
                  проверок и теми доказательствами, на которых основаны выводы.
                R4: Автоматически поддерживать переносимую историю проверок, в которой видна актуальность
                  выводов для отдельного модуля и его поддерева.
                R7: Поставлять одно приложение для самостоятельного запуска и для работы в Codex
                  и DeepSeek Harness с общими контрактами и форматом истории проекта.
              boundaries:
                B1: Запись и содержательный анализ контрактов выполняет агент своими файловыми инструментами.
                  Просмотр не изменяет исходники проекта.
                B2: Извлечение символов, разрешение зависимостей и индексация AST находятся за пределами
                  ArchiView и относятся к ast-index.
              invariants:
                I5: Приложение, адаптеры, интерфейс, сборочные скрипты и тесты проверяются строгим TypeScript перед сборкой; классы сохраняют единственную ответственность внутри границ своих модулей.
                I1: Чтение ограничено выбранным корнем проекта. Вкладка чата получает этот корень
                  от хоста; явно настроенный для модельных инструментов корень ограничивает их чтение.
                I2: Снимки и результаты анализа по умолчанию находятся в переносимой папке .archiview
                  внутри корня проекта. Эта папка исключена из анализа исходников; прежние сохранённые
                  факты и отчёты не переписываются при переносе проекта.
                I3: Устойчивую ответственность задаёт контракт в .archiview/modules; карта modules.tree
                  связывает его id с каталогом проекта. Эвристические оценки и текущий код не разрешают её расширять.
                I4: Структурная проверка не выдаёт наличие файла за семантическое соответствие.
                I6: Обе интеграции получают правила ведения контрактов из канонического скилла пакета.
                I8: Каждый Git-репозиторий рабочей папки версионирует свои контракты вместе с кодом. Панель и агент сохраняют принадлежность модуля его репозиторию.
                I7: Панель обращается к агенту только по явному поручению пользователя проанализировать модуль
                  или исправить замечание.
