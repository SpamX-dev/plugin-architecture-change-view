              "object" && !Array.isArray(v) ? undefined : fail(at, "ожидается
              словарь");

              export const enumeration = (...values: unknown[]): Validator =>
              (v, at) => values.includes(v) ? undefined : fail(at, "допустимо: "
              + values.join(", "));

              export const nullable = (check: Validator): Validator => (v, at)
              => v === null ? undefined : check(v, at);

              export const array = (check: Validator, min = 0): Validator => (v,
              at) => {
                if (!Array.isArray(v) || v.length < min) fail(at, "ожидается массив, минимум " + min);
                (v as unknown[]).forEach((item, i) => check(item, at + "[" + i + "]"));
              };

              export const shape = (required: Record<string, Validator>,
              optional: Record<string, Validator> = {}): Validator => (v, at) =>
              {
                object(v, at);
                for (const [key, check] of Object.entries(required)) check((v as Record<string, unknown>)[key], at + "." + key);
                for (const key of Object.keys(v as object)) {
                  if (Object.hasOwn(required, key)) continue;
                  if (!Object.hasOwn(optional, key)) fail(at + "." + key, "неизвестное поле");
                  optional[key]((v as Record<string, unknown>)[key], at + "." + key);
                }
              };

              export const strings = array(string);

              export const references = array(shape({ title: string, uri: string
              }));

              export const extensions: Validator = (v, at) => {
                object(v, at);
                for (const key of Object.keys(v as object)) if (!/^[^.\s]+\.[^\s]+$/.test(key)) fail(at, "расширению нужно пространство имён");
              };
          - selector:
              kind: file
              path: src/serialization/yaml.ts
            available: true
            digest: sha256:72106665ae89f00090f371a4a56dc0cf67222a8e62d69f6c9929b6e301383998
            content: >
              import { parseDocument, isAlias, isMap, isScalar, isSeq } from
              "yaml";


              /** Парсер запрещает дубликаты, aliases, нестандартные теги и
              несколько документов. */

              export function parseYaml<T>(text: string, validate: (value:
              unknown) => T): T {
                const doc = parseDocument(text, { uniqueKeys: true, strict: true, version: "1.2" });
                if (doc.errors.length || doc.warnings.length) throw new Error([...doc.errors, ...doc.warnings].map((e) => e.message).join("; "));
                // Ограничиваем YAML обычными типами данных до преобразования: иначе ключ 1
                // превратится в строку, а .nan потеряет смысл при каноническом JSON-хешировании.
                const inspect = (node: unknown): void => {
                  if (node == null) return;
                  if (typeof node === "object" && "tag" in node && node.tag &&
                      !["str", "int", "float", "bool", "null", "map", "seq"].some((name) => node.tag === "tag:yaml.org,2002:" + name))
                    throw new Error("Custom YAML tag");
                  if (isAlias(node)) throw new Error("YAML aliases are not allowed");
                  if (isMap(node)) {
                    for (const pair of node.items) {
                      if (!isScalar(pair.key) || typeof pair.key.value !== "string") throw new Error("YAML mapping keys must be strings");
                      inspect(pair.key);
                      inspect(pair.value);
                    }
                  } else if (isSeq(node)) node.items.forEach(inspect);
                  else if (!isScalar(node) || !["string", "boolean", "number"].includes(typeof node.value) && node.value !== null ||
                    typeof node.value === "number" && !Number.isFinite(node.value)) throw new Error("Unsupported YAML value");
                };
                inspect(doc.contents);
                return validate(doc.toJS({ maxAliasCount: 0 }));
              }


              /** Decodes persisted records before format-specific integrity
              checks. */

              export function parseReportYaml<T = unknown>(text: string): T {
                return parseYaml(text, (value) => value as T);
              }
          - selector:
              kind: file
              path: test/inventory.test.ts
            available: true
            digest: sha256:40b47d8580343692a28cecdaac4076bbccb1d3da9beab638483cd8909f9a92d7
            content: >
              import type { TestContext } from "node:test";

              /** Проверки покрытия исходников, цепочки контрактов и ограничения
              корня. */

              import assert from "node:assert/strict";

              import { execFile } from "node:child_process";

              import { mkdir, mkdtemp, readFile, rm, symlink, writeFile } from
              "node:fs/promises";

              import os from "node:os";

              import path from "node:path";

              import test from "node:test";

              import { promisify } from "node:util";

              import { moduleContext, moduleInventory } from
              "../src/contracts/inventory.js";


              /** Запускает Git без оболочки в изолированном тестовом
              репозитории. */

              const runFile = promisify(execFile);


              /** Создаёт временный проект с автоматической уборкой только его
              каталога. */

              async function project(t: TestContext, files: Record<string,
              string>) {
                const root = await mkdtemp(path.join(os.tmpdir(), "architecture-change-view-"));
                t.after(() => rm(root, { recursive: true, force: true }));
                for (const [file, text] of Object.entries(files)) {
                  await mkdir(path.dirname(path.join(root, file)), { recursive: true });
                  await writeFile(path.join(root, file), text);
                }
                return root;
              }


              test("covers each source directory and its containers; retains
              planned modules", async (t) => {
                const root = await project(t, {
                  "module.md": "Project boundary", "src/module.md": "Application boundary",
                  "src/main.ts": "export const main = 1;",
                  "src/domain/order.ts": "export class Order {}",
                  "src/empty/run.py": "pass", "src/empty/module.md": "  \n",
                  "test/check.js": "export const check = true;",
                  "future/module.md": "Responsibility of an agreed future module",
                  "node_modules/dependency/index.js": "ignored",
                  "dist/bundle.js": "ignored", "docs/README.md": "prose",
                });
                const result = await moduleInventory(root);
                const modules = new Map(result.modules.map((entry) => [entry.directory, entry]));
                assert.equal(result.complete, true);
                assert.equal(result.sourceFiles, 4);
                assert.deepEqual([...modules.keys()].sort(),
                  [".", "future", "src", "src/domain", "src/empty", "test"].sort());
                assert.equal(modules.get(".")!.sourceFiles, 4);
                assert.equal(modules.get("src")!.sourceFiles, 3);
                assert.equal(modules.get("src/domain")!.status, "missing");
                assert.equal(modules.get("src/empty")!.status, "empty");
                assert.equal(modules.get("future")!.required, false);
                assert.equal(modules.get("future")!.status, "migration_required");
              });


              test("reads root-to-target contracts without hiding a missing
              child description", async (t) => {
                const root = await project(t, {
                  "module.md": "Root responsibility", "src/module.md": "Source responsibility",
                  "src/domain/order.ts": "class Order {}",
                });
                const context = await moduleContext(root, "src/domain");
                assert.deepEqual(context.contracts.map((entry) => entry.directory),
                  [".", "src", "src/domain"]);
                assert.equal(context.contracts[0].text, "Root responsibility");
                assert.equal(context.contracts[1].text, "Source responsibility");
                assert.equal(context.contracts[2].status, "missing");
                assert.equal(await readFile(path.join(root, "src/domain/order.ts"), "utf8"),
                  "class Order {}");
                await assert.rejects(moduleContext(root, "../"), /outside project/);
                await assert.rejects(moduleContext(root, root), /must be relative/);
              });


              test("respects Git ignores, includes untracked source and skips
              deleted tracked files", async (t) => {
                const root = await project(t, {
                  ".gitignore": "ignored/\n", "ignored/generated.ts": "ignored",
                  "src/live.ts": "export const live = 1;",
                  "src/deleted.ts": "export const deleted = 1;",
                  "src/untracked.py": "pass",
                });
                await runFile("git", ["init", "--quiet"], { cwd: root, windowsHide: true });
                await runFile("git", ["add", "src/deleted.ts"], { cwd: root, windowsHide: true });
                await rm(path.join(root, "src/deleted.ts"));
                const result = await moduleInventory(root);
                assert.equal(result.discovery, "git");
                assert.equal(result.complete, true);
                assert.equal(result.sourceFiles, 2);
                assert.deepEqual(result.modules.map((entry) => entry.directory), [".", "src"]);
                const subtree = await moduleInventory(path.join(root, "src"));
                assert.equal(subtree.sourceFiles, 2);
                assert.deepEqual(subtree.modules.map((entry) => entry.directory), ["."]);
              });


              test("marks bounded inventory and unreadable contracts as
              incomplete", async (t) => {
                const root = await project(t, { "a.rs": "fn a() {}", "b.rs": "fn b() {}",
                  "c.rs": "fn c() {}" });
                const limited = await moduleInventory(root, { maxFiles: 2 });
                assert.equal(limited.complete, false);
                assert.ok(limited.diagnostics.some((entry) => entry.includes("File limit")));
                await mkdir(path.join(root, "module.md"));
                const broken = await moduleInventory(root);
                assert.equal(broken.complete, false);
                assert.equal(broken.modules[0].status, "unreadable");
              });


              test("does not follow directory links outside the project", async
              (t) => {
                const root = await project(t, { "main.rs": "fn main() {}" });
                const external = await project(t, { "module.md": "External private boundary",
                  "secret.ts": "private" });
                await symlink(external, path.join(root, "outside"),
                  process.platform === "win32" ? "junction" : "dir");
                const inventory = await moduleInventory(root);
                assert.equal(inventory.sourceFiles, 1);
                assert.equal(inventory.modules.length, 1);
                await assert.rejects(moduleContext(root, "outside"), /outside project/);
              });
