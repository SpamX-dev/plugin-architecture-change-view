            content: >
              import { realpath } from "node:fs/promises";

              import path from "node:path";

              import { errorDetails } from "../runtime/errors.js";


              /** Зарезервированное хранилище данных, исключаемое из анализа
              исходников. */

              export const STATE_DIRECTORY = ".archiview";


              /** Выбирает папку данных относительно проекта; абсолютный внешний
              путь сохраняется. */

              export function projectStateDirectory(root: string, directory =
              STATE_DIRECTORY) {
                const target = path.resolve(root, directory);
                if (within(root, target) && !within(path.join(root, STATE_DIRECTORY), target)) {
                  throw new Error("State storage must be under .archiview or outside source project");
                }
                return target;
              }


              /** Проверяет вложенность разрешённых абсолютных путей, включая
              сам каталог. */

              function within(root: string, target: string) {
                const relative = path.relative(root, target);
                return relative === "" || (!path.isAbsolute(relative) && relative !== ".." && !relative.startsWith(".." + path.sep));
              }


              /**
               * Разрешает данные только в зарезервированной папке проекта либо во внешнем
               * хранилище. Ссылки не могут перенаправить локальные данные в исходники или наружу.
               */
              export async function assertStateLocation(root: string, directory:
              string, target = directory) {
                const local = within(root, directory);
                if (local && !within(path.join(root, STATE_DIRECTORY), directory)) {
                  throw new Error("State storage inside source project must be under .archiview");
                }
                if (!within(directory, target)) throw new Error("Path escapes state storage");
                let ancestor = target;
                while (true) {
                  try {
                    const resolved = await realpath(ancestor);
                    const destination = path.resolve(resolved, path.relative(ancestor, target));
                    if (local && path.relative(target, destination) !== "") throw new Error("Local state storage cannot use directory links");
                    if (!local && within(root, destination)) throw new Error("External state storage resolves inside source project");
                    return;
                  } catch (errorCause) { const error = errorDetails(errorCause);
                    if (error.code !== "ENOENT") throw error;
                    const parent = path.dirname(ancestor);
                    if (parent === ancestor) throw error;
                    ancestor = parent;
                  }
                }
              }
          - selector:
              kind: file
              path: src/runtime/errors.ts
            available: true
            digest: sha256:045b2700510faa06603e136457c966aee7ef6f5fa916470360fd04c7ca23f837
            content: >
              /** Normalize unknown exceptions while retaining
              filesystem/process diagnostics. */

              export interface ErrorDetails extends Error { code?: string;
              stderr?: string; exitCode?: number | null; }

              export function errorDetails(error: unknown): ErrorDetails {
                if (error instanceof Error) return error;
                const value = error && typeof error === "object" ? error as Record<string, unknown> : {};
                const result: ErrorDetails = new Error(typeof value.message === "string" ? value.message : String(error));
                if (typeof value.code === "string") result.code = value.code;
                if (typeof value.stderr === "string") result.stderr = value.stderr;
                if (typeof value.exitCode === "number" || value.exitCode === null) result.exitCode = value.exitCode;
                return result;
              }
          - selector:
              kind: file
              path: src/serialization/schema.ts
            available: true
            digest: sha256:a239469fc2d72dfcd84c76b101f35d11cf7d672bd5165eede5fae058767eba0c
            content: >
              /** Минимальный словарь валидаторов: каждая ошибка содержит точный
              путь поля. */

              export const fail = (at: string, message: string): never => {
              throw new Error(at + ": " + message); };

              export type Validator = (v: unknown, at: string) => void;

              export const string: Validator = (v, at) => typeof v === "string"
              && v.trim() ? undefined : fail(at, "ожидается непустая строка");

              export const object: Validator = (v, at) => v && typeof v ===
              "object" && !Array.isArray(v) ? undefined : fail(at, "ожидается
              словарь");

              export const enumeration = (...values: unknown[]): Validator =>
              (v, at) => values.includes(v) ? undefined : fail(at, "допустимо: "
              + values.join(", "));

              export const nullable = (check: Validator): Validator => (v, at)
              => v === null ? undefined : check(v, at);

              export const array = (check: Validator, min = 0): Validator => (v,
              at) => {
                if (!Array.isArray(v) || v.length < min) fail(at, "ожидается массив, минимум " + min);
                (v as unknown[]).forEach((item, i) => check(item, at + "[" + i + "]"));
              };

              export const shape = (required: Record<string, Validator>,
              optional: Record<string, Validator> = {}): Validator => (v, at) =>
              {
                object(v, at);
                for (const [key, check] of Object.entries(required)) check((v as Record<string, unknown>)[key], at + "." + key);
                for (const key of Object.keys(v as object)) {
                  if (Object.hasOwn(required, key)) continue;
                  if (!Object.hasOwn(optional, key)) fail(at + "." + key, "неизвестное поле");
                  optional[key]((v as Record<string, unknown>)[key], at + "." + key);
                }
              };

              export const strings = array(string);

              export const references = array(shape({ title: string, uri: string
              }));

              export const extensions: Validator = (v, at) => {
                object(v, at);
                for (const key of Object.keys(v as object)) if (!/^[^.\s]+\.[^\s]+$/.test(key)) fail(at, "расширению нужно пространство имён");
              };
          - selector:
              kind: file
              path: src/serialization/yaml.ts
            available: true
            digest: sha256:72106665ae89f00090f371a4a56dc0cf67222a8e62d69f6c9929b6e301383998
            content: >
              import { parseDocument, isAlias, isMap, isScalar, isSeq } from
              "yaml";


              /** Парсер запрещает дубликаты, aliases, нестандартные теги и
              несколько документов. */

              export function parseYaml<T>(text: string, validate: (value:
              unknown) => T): T {
                const doc = parseDocument(text, { uniqueKeys: true, strict: true, version: "1.2" });
                if (doc.errors.length || doc.warnings.length) throw new Error([...doc.errors, ...doc.warnings].map((e) => e.message).join("; "));
                // Ограничиваем YAML обычными типами данных до преобразования: иначе ключ 1
                // превратится в строку, а .nan потеряет смысл при каноническом JSON-хешировании.
                const inspect = (node: unknown): void => {
                  if (node == null) return;
                  if (typeof node === "object" && "tag" in node && node.tag &&
                      !["str", "int", "float", "bool", "null", "map", "seq"].some((name) => node.tag === "tag:yaml.org,2002:" + name))
                    throw new Error("Custom YAML tag");
                  if (isAlias(node)) throw new Error("YAML aliases are not allowed");
                  if (isMap(node)) {
                    for (const pair of node.items) {
                      if (!isScalar(pair.key) || typeof pair.key.value !== "string") throw new Error("YAML mapping keys must be strings");
                      inspect(pair.key);
                      inspect(pair.value);
                    }
                  } else if (isSeq(node)) node.items.forEach(inspect);
                  else if (!isScalar(node) || !["string", "boolean", "number"].includes(typeof node.value) && node.value !== null ||
                    typeof node.value === "number" && !Number.isFinite(node.value)) throw new Error("Unsupported YAML value");
                };
                inspect(doc.contents);
                return validate(doc.toJS({ maxAliasCount: 0 }));
              }


              /** Decodes persisted records before format-specific integrity
              checks. */

              export function parseReportYaml<T = unknown>(text: string): T {
                return parseYaml(text, (value) => value as T);
              }
