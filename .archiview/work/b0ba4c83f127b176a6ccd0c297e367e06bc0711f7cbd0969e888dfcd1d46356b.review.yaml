      findings:
        - id: finding-1
          kind: responsibility_gap
          certainty: confirmed
          severity: warning
          lifecycle: persisting
          summary: Инвентаризация принимает повреждённую ссылку arch.yaml за отсутствующий
            контракт.
          details: В documentAt (inventory.ts:140–156) успешный lstat обнаруживает запись
            arch.yaml, но проверка типа файла выполняется только после realpath.
            Если цель ссылки отсутствует, ENOENT из realpath попадает в общий
            возврат missing (строки 171–175). Для каталога с исходниками
            moduleInventory переводит такой результат в analyze_and_write без
            диагностики неполноты (строки 239–249). Подтверждение, что
            архитектурный контракт отсутствует, в этом случае неверно.
          clauses:
            - snapshot: current
              module_id: archiview-contracts
              section: responsibilities
              id: R1
          evidence:
            - snapshot: current
              fact_id: sha256:8e31fe006836b6bb3fd87cdda160b671fcbb4079f20c578f4d0bcdb433f5826e
            - snapshot: baseline
