          text: >
            schema_version: 1

            id: archiview-workspace-presenter

            title: Workspace Presenter

            kind: module

            extensions:
              archiview.roles: [service]
            purpose: Готовить дерево рабочей области для отображения и
            обрабатывать выбор проекта, снимка и модуля.

            boundaries:
              B1: Открывать дерево Git для навигации, как только получена структура, и добавлять статусы анализа по мере их загрузки.
