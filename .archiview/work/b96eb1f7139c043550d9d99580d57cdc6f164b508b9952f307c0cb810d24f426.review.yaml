          kind: boundary_violation
          certainty: confirmed
          severity: warning
          lifecycle: unknown
          summary: Явный режим импорта в JSDoc ведёт к неверному модулю при условном
            разрешении пути
          details: 'В CommonJS-проекте с NodeNext спецификатор #shape имеет ветви import →
            esm/model.mts и require → cjs/model.cts. Компилятор, поставляемый с
            SCIP, принимает все шесть файлов без диагностик. Для JSDoc @import с
            with { "resolution-mode": "import" } и для @typedef с тем же
            атрибутом import() он разрешает esm/model.mts. Граф v3 показывает
            обе связи с cjs/model.cts. Контрольные импорты дают ожидаемые цели:
            JSDoc без атрибута ведёт к cjs, собственный TypeScript import type с
            атрибутом ведёт к esm. Функция record не передаёт режим
            синтаксического узла, а importResolver восстанавливает цель по
            формату файла.'
          recommendation: При восстановлении отсутствующего файлового occurrence
            использовать режим разрешения конкретного литерала, включая атрибуты
            JSDoc, и передавать его в resolveModuleName. Проверить обе формы при
            разных целях ветвей import и require.
