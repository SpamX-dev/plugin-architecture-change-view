            schema_version: 1

            id: archiview-module-relations

            title: Module relations

            kind: module

            extensions:
              archiview.roles: [service]
            purpose: Определять прямые связи модулей выбранного снимка по
            ссылкам на символы и сохранять места их использования.

            boundaries:
              B1: Учитывать связи между собственными файлами разных модулей выбранного репозитория.
              B2: Показывать ближайший модуль, указанный в импорте или реэкспорте исходного файла.
              B3: Поставляемый индексатор определяет связи исходников TypeScript и JavaScript.
