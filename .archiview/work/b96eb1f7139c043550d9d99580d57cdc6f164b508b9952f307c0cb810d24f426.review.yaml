            import { digest } from "../../framework/serialization/digest.js";

            import type { Snapshot } from "../../framework/snapshots/types.js";

            import { errorDetails } from "../../node-errors.js";

            import { assertStateLocation, projectStateDirectory } from
            "../../storage/paths.js";

            import { regularProjectFile } from
            "../project-sources/source-files.js";

            import { excludedProjectPath } from
            "../../framework/project/paths.js";

