            string, onLiteral?: (specifier: string, range: number[], sideEffect:
            boolean) => void) => Set<string>>;

            export function importResolver(root: string, projects: string[]):
            Promise<(file: string, specifier: string) => string | undefined>;
        - id: sha256:800cc43f97d6a79abe64600907f88dbc4328c30da4f354ac6a34ae2cc1df07be
          kind: file
          path: analyse/module-relations/import-sites.mjs
          start_line: 1
          end_line: 74
          text: >
            import { createRequire } from "node:module";

            import path from "node:path";


            /** Use the same TypeScript parser and UTF-16 coordinates as the
            SCIP indexer. */

            async function compiler() {
              return typeof ARCHIVIEW_SCIP_COMPILER === "undefined"
                ? createRequire(createRequire(import.meta.url).resolve("@sourcegraph/scip-typescript"))("typescript")
                : (await import(new URL(ARCHIVIEW_SCIP_COMPILER, import.meta.url).href)).default;
            }


            export async function loadImportSites() {
              const ts = await compiler();
              return function importSites(file, text, onLiteral) {
                const source = ts.createSourceFile(file, text, ts.ScriptTarget.Latest);
                const sites = new Set();
                function record(literal, sideEffect = false) {
                  if (!literal || !ts.isStringLiteralLike(literal)) return;
                  const { line, character } = source.getLineAndCharacterOfPosition(literal.getStart(source));
                  sites.add((line + 1) + ":" + (character + 1));
                  if (onLiteral) {
                    const end = source.getLineAndCharacterOfPosition(literal.end);
                    onLiteral(literal.text, line === end.line
                      ? [line, character, end.character] : [line, character, end.line, end.character], sideEffect);
                  }
                }
                function visit(node) {
                  if (ts.isImportDeclaration(node) || ts.isExportDeclaration(node) || ts.isJSDocImportTag(node)) {
                    record(node.moduleSpecifier, ts.isImportDeclaration(node) && !node.importClause);
                  } else if (ts.isExternalModuleReference(node)) {
                    record(node.expression);
                  } else if (ts.isImportTypeNode(node) && ts.isLiteralTypeNode(node.argument)) {
                    record(node.argument.literal);
                  } else if (ts.isCallExpression(node)) {
                    const callee = node.expression;
                    const requireCall = ts.isIdentifier(callee) && callee.text === "require";
                    if (callee.kind === ts.SyntaxKind.ImportKeyword || requireCall) record(node.arguments[0]);
                  }
                  ts.forEachChild(node, visit);
                  node.jsDoc?.forEach(visit);
                }
                visit(source);
                return sites;
              };
            }


            // Resolve a file import using the same compiler options as the
            importing project.

            export async function importResolver(root, projects) {
              const ts = await compiler();
              const key = file => ts.sys.useCaseSensitiveFileNames ? path.normalize(file) : path.normalize(file).toLowerCase();
              const optionsByFile = new Map();
              const visited = new Set();
              function readProject(configFile) {
                if (visited.has(key(configFile))) return;
                visited.add(key(configFile));
                const parsed = ts.getParsedCommandLineOfConfigFile(configFile, {}, { ...ts.sys, onUnRecoverableConfigFileDiagnostic() {} });
                if (!parsed) return;
                for (const ref of parsed.projectReferences || []) readProject(ts.resolveProjectReferencePath(ref));
                for (const file of parsed.fileNames) {
                  if (!optionsByFile.has(key(file))) optionsByFile.set(key(file), parsed.options);
                }
              }
              return (file, specifier) => {
                if (!visited.size) {
                  for (const config of projects.length ? projects : ["tsconfig.json"]) readProject(path.resolve(root, config));
                }
                const source = path.join(root, file);
                const options = optionsByFile.get(key(source));
                if (!options) return;
                const mode = ts.getImpliedNodeFormatForFile(source, undefined, ts.sys, options);
                const resolved = ts.resolveModuleName(specifier, source, options, ts.sys, undefined, undefined, mode).resolvedModule;
                return resolved && path.relative(root, resolved.resolvedFileName).split(path.sep).join("/");
              };
            }
        - id: sha256:a0afc5ef470808085c57307a77ecec714271080618c0b5071fac2022766fcce1
          kind: file
          path: analyse/module-relations/inferred-project.ts
          start_line: 1
          end_line: 55
          text: >
            import { copyFile, mkdir, stat, symlink, writeFile } from
            "node:fs/promises";

            import { randomUUID } from "node:crypto";

            import path from "node:path";

            import { errorDetails } from "../../node-errors.js";

            import { regularProjectFile } from
            "../project-sources/source-files.js";

            import { supportsFile } from "./graph.js";


            /** Give loose JS/TS files a real project root without creating a
            tsconfig in the checkout.
             * The indexer qualifies symbols in unnamed packages relative to the config's directory. */
            export async function inferredProject(root: string, scratch: string,
            files: Iterable<string>, missing: string[], configured: string[]) {
              const project = path.join(scratch, "project");
              const directories = new Set(["."]);
              for (const file of files) {
                if (!supportsFile(file) && path.extname(file).toLowerCase() !== ".json") continue;
                if (!await regularProjectFile(root, file)) throw new Error("Файл изменился во время построения: " + file);
                const target = path.join(project, file);
                await mkdir(path.dirname(target), { recursive:true });
                await copyFile(path.join(root, file), target);
                let directory = path.posix.dirname(file);
                while (!directories.has(directory)) {
                  directories.add(directory);
                  directory = path.posix.dirname(directory);
                }
              }
              for (const dir of directories) {
                const dependencies = path.join(root, dir, "node_modules");
                try { if (!(await stat(dependencies)).isDirectory()) continue; }
                catch (cause) { if (errorDetails(cause).code === "ENOENT") continue; throw cause; }
                await symlink(dependencies, path.join(project, dir, "node_modules"), process.platform === "win32" ? "junction" : "dir");
              }
              // Loose files inherit the nearest project's resolver (including paths and module mode).
              // Keep each temporary config in the same directory as its original so unnamed SCIP symbols align.
              const roots = configured.map(config => ({config, directory: path.posix.dirname(config)}))
                .sort((a, b) => Number(a.directory === ".") - Number(b.directory === ".") || b.directory.length - a.directory.length);
              const groups = new Map<string, string[]>();
              for (const file of missing) {
                const config = roots.find(({directory}) => directory === "." || file.startsWith(directory + "/"))?.config ?? "";
                const group = groups.get(config) ?? [];
                group.push(file);
                groups.set(config, group);
              }
              const configs = [];
              for (const [base, inputs] of groups) {
                const directory = base ? path.posix.dirname(base) : ".";
                const config = path.posix.join(directory, ".archiview-" + randomUUID() + ".json");
                await writeFile(path.join(project, config), JSON.stringify({
                  ...(base ? { extends: "./" + path.posix.basename(base) } : {}),
                  compilerOptions: base ? { allowJs: true } : { allowJs: true, module: "NodeNext" },
                  files: inputs.map(file => path.posix.relative(directory, file)), include: [], exclude: [],
                }), { flag: "wx" });
                configs.push(config);
              }
              return { root: project, configs };
            }
        - id: sha256:46b65b69cf574a60f3feea34dffd439b9ca9362f52769313a50bfebc035d6b2b
          kind: file
          path: analyse/module-relations/store.ts
          start_line: 1
          end_line: 143
          text: >
            import { execFile } from "node:child_process";

            import { randomUUID } from "node:crypto";

            import { createRequire } from "node:module";

            import { mkdir, mkdtemp, readFile, realpath, rename, rm, writeFile }
            from "node:fs/promises";

            import { tmpdir } from "node:os";

            import path from "node:path";

            import { fileURLToPath } from "node:url";

            import { promisify } from "node:util";

            import { fromBinary } from "@bufbuild/protobuf";

            import { IndexSchema } from "@scip-code/scip";

            import { digest } from "../../framework/serialization/digest.js";

            import type { Snapshot } from "../../framework/snapshots/types.js";

            import { errorDetails } from "../../node-errors.js";

            import { assertStateLocation, projectStateDirectory } from
            "../../storage/paths.js";

            import { regularProjectFile } from
            "../project-sources/source-files.js";

            import { excludedProjectPath } from
            "../../framework/project/paths.js";

            import { GitTreeReader } from "../git-changes/git-tree.js";

            import { readGitHeadRevision } from "../git-changes/capture.js";

            import type { RelationGraph } from
            "../../framework/module-relations/types.js";

            import { directImportEdges, extractEdges, indexImportSites,
            projectDocuments, supportsFile } from "./graph.js";

            import { inferredProject } from "./inferred-project.js";


            declare const ARCHIVIEW_SCIP_WORKER: string;

            const run = promisify(execFile);

            const active = new Map<string, Promise<RelationGraph>>();


            export class RelationBuildError extends Error {
              constructor(readonly code: "INCOMPLETE_VIEW" | "STALE_VIEW" | "INVALID_ARGUMENT", message: string) { super(message); }
            }


            /** A saved evidence snapshot and a lightweight Git view of the same
            files share this key. */

            function inputs(snapshot: Snapshot) {
              return digest([snapshot.root, snapshot.modules.map(m => [m.directory, m.documentPath,
                m.files.map(f => [f.path, f.hash, f.mode ?? "100644"])])]);
            }


            function graphPath(directory: string, key: string) {
              return path.join(directory, "snapshots", "relations", key.slice(7) + ".json");
            }


            export async function readRelationGraph(root: string, state: string
            | undefined, snapshot: Snapshot) {
              if (!snapshot.complete) return null;
              const directory = projectStateDirectory(root, state);
              const key = inputs(snapshot);
              const file = graphPath(directory, key);
              await assertStateLocation(root, directory, file);
              try {
                const graph: RelationGraph = JSON.parse(await readFile(file, "utf8"));
                if ((graph.version !== 1 && graph.version !== 2) || graph.inputs !== key) throw new Error("Некорректный сохранённый граф связей");
                if (graph.indexed !== graph.eligible) return null;
                if (graph.version === 1) graph.edges = await directImportEdges(graph.edges, graph.sources);
                return graph;
              } catch (cause) {
                if (errorDetails(cause).code === "ENOENT") return null;
                throw cause;
              }
            }


            export function rebuildRelationGraph(root: string, state: string |
            undefined, snapshot: Snapshot): Promise<RelationGraph> {
              const directory = projectStateDirectory(root, state);
              const key = inputs(snapshot);
              const destination = graphPath(directory, key);
              const pending = active.get(destination);
              if (pending) return pending;
              const task = build(root, directory, snapshot, key, destination).finally(() => active.delete(destination));
              active.set(destination, task);
              return task;
            }


            async function build(root: string, directory: string, snapshot:
            Snapshot, key: string, destination: string): Promise<RelationGraph>
            {
              if (!snapshot.complete) throw new RelationBuildError("INCOMPLETE_VIEW", "Для построения связей нужен полный снимок.");
              const reader = new GitTreeReader(root, snapshot.root);
              async function verifyInputs() {
                const current = await reader.working(await readGitHeadRevision(root));
                if (!current.complete || inputs(current) !== key) throw new RelationBuildError("STALE_VIEW", "Рабочее дерево изменилось. Обновите сравнение и повторите построение.");
              }
              await verifyInputs();
              const owners = new Map(snapshot.modules.flatMap(m =>
                m.files.filter(f => !excludedProjectPath(f.path)).map(f => [f.path, m.directory] as const)));
              const eligible = [...owners.keys()].filter(supportsFile);
              if (!eligible.length) throw new RelationBuildError("INVALID_ARGUMENT", "В снимке нет файлов TypeScript или JavaScript.");
              const tempRoot = await realpath(tmpdir());
              const temp = await mkdtemp(path.join(tempRoot, "archiview-scip-"));
              const output = path.join(temp, "index.scip");
              try {
                const projects = [...owners.keys()].filter(file => /^(?:ts|js)config\.json$/.test(path.posix.basename(file)));
                const worker = typeof ARCHIVIEW_SCIP_WORKER === "undefined"
                  ? createRequire(import.meta.url).resolve("@sourcegraph/scip-typescript")
                  : fileURLToPath(new URL(ARCHIVIEW_SCIP_WORKER, import.meta.url));
                async function indexProject(cwd: string, configs: string[]) {
                  try {
                    await run(process.execPath, [worker, "index", "--output", output, "--no-progress-bar", "--", ...configs],
                      { cwd, windowsHide: true, maxBuffer: 16 * 1024 * 1024 });
                  } catch (cause) {
                    const failure = cause as { stderr?: string; stdout?: string; message?: string };
                    if (failure.stdout?.includes("error: no files got indexed.")) return;
                    throw new Error("Не удалось построить индекс SCIP. " + (failure.stderr?.trim() || failure.stdout?.trim() || failure.message || "").slice(-1600));
                  }
                  return fromBinary(IndexSchema, await readFile(output));
                }
                const configured = projects.length ? await indexProject(root, projects) : undefined;
                const configuredDocs = configured ? projectDocuments(configured, owners) : [];
                const covered = new Set(configuredDocs.map(doc => doc.file));
                const missing = eligible.filter(file => !covered.has(file));
                const inferred = missing.length ? await inferredProject(root, temp, owners.keys(), missing, projects) : undefined;
                const supplement = inferred && await indexProject(inferred.root, inferred.configs);
                const looseDocs = supplement ? projectDocuments(supplement, owners).filter(doc => !covered.has(doc.file)) : [];
                for (const { file } of looseDocs) covered.add(file);
                const skipped = missing.filter(file => !covered.has(file));
                if (skipped.length) throw new RelationBuildError("INCOMPLETE_VIEW", "SCIP не проиндексировал файлы: " + skipped.join(", "));
                const docs = [...configuredDocs, ...looseDocs];
                const sources: Record<string,string> = Object.create(null);
                for (const file of new Set(docs.map(d => d.file))) {
                  if (!await regularProjectFile(root, file)) throw new RelationBuildError("STALE_VIEW", "Файл изменился: " + file);
                  sources[file] = (await readFile(path.join(root, file), "utf8")).replace(/\r\n?/g, "\n");
                }
                const imports = await indexImportSites(root, projects, configuredDocs, sources, docs);
                if (inferred) {
                  const looseImports = await indexImportSites(inferred.root, inferred.configs, looseDocs, sources, docs);
                  for (const [file, sites] of looseImports) imports.set(file, sites);
                }
                const { edges, indexed } = extractEdges(docs, owners);
                const direct = await directImportEdges(edges, sources, imports);
                const evidence = new Set(direct.flatMap(edge => edge.symbols.flatMap(s => [s.definition.file, ...s.uses.map(u => u.file)])));
                const info = (configured ?? supplement)?.metadata?.toolInfo;
                const graph: RelationGraph = { version: 2, inputs: key, snapshotDigest: snapshot.digest,
                  indexer: [info?.name, info?.version].filter(Boolean).join(" "), indexed, eligible: eligible.length,
                  edges: direct, sources: Object.fromEntries([...evidence].map(file => [file, sources[file]])) };
                await verifyInputs();
                await assertStateLocation(root, directory, destination);
                await mkdir(path.dirname(destination), { recursive: true });
                const pending = path.join(path.dirname(destination), ".pending-" + randomUUID());
                try {
                  await writeFile(pending, JSON.stringify(graph), { flag: "wx" });
                  await rename(pending, destination);
                } finally { await rm(pending, {force:true}); }
                return graph;
              } finally {
                if (path.dirname(await realpath(temp)) === tempRoot && path.basename(temp).startsWith("archiview-scip-"))
                  await rm(temp, { recursive: true, force: true, maxRetries: 3 });
              }
            }
