              I1: Граф охватывает все исходники проекта на поддерживаемых индексатором языках и читается с привязкой к содержимому снимка.
        - id: sha256:a3eb4a14e7a0baf6ba79baee902a2efd4a8515668c5384b68051d45d755db61b
          kind: file
          path: analyse/module-relations/graph.ts
          start_line: 1
