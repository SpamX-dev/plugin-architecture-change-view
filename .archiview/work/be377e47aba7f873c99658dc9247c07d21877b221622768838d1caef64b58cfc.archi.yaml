    contract:
      schema_version: 1
      id: archiview-module-boundaries-skill
      title: Правила ведения контрактов
      kind: module
      extensions:
        archiview.roles:
          - resources
      responsibilities:
        R1: Определять правила создания и пересмотра контрактов, включая выбор ролей и
          распределение пунктов между разделами.
        R2: Определять, как проверить контракт по сохранённым доказательствам и оформить
          результат.
      boundaries:
        B2: Правила собственной проверки ограничивают чеклист пунктами модуля и
          допускают ссылку на нарушенное ограничение предка.
        B3: Правила проверки композиции ограничивают область родителя декларациями
          непосредственных детей.
        B4: Инструкция исключает вывод зависимостей из перечня прочитанных агентом
          доказательств.
      invariants: {}
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Просмотр и подготовка анализа сохраняют исходники и согласованные
          контракты проекта без изменений.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: При подготовке контекста ArchiView не строит граф зависимостей по символам
          исходного кода.
      - module_id: architecture-change-view
        section: boundaries
        id: B3
        text: В общей рабочей папке ArchiView читает контракты и историю модуля в
          пределах репозитория, которому он принадлежит.
      - module_id: architecture-change-view
        section: boundaries
        id: B4
        text: Панель обращается к агенту только по явному поручению пользователя
          провести анализ или исправить замечание.
      - module_id: architecture-change-view
        section: boundaries
        id: B5
        text: Автоматическая проверка структуры может подтвердить наличие контракта и
          корректность формата, но не выполнение обязанностей.
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает встроенную панель Codex.
