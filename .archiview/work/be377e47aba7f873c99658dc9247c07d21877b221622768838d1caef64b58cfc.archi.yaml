          text: >
            ---

            name: module-boundaries

            description: "Вести arch.yaml при работе с исходниками и просмотре
            архитектуры: сразу переносить module.md, анализировать код при
            отсутствии контракта, соблюдать границы каталогов и предков."

            ---


            # Ответственность каталогов


            Структура репозитория задаёт карту системы. Единственный действующий
            контракт

            каталога — arch.yaml по схеме v1. module.md не является
            альтернативным форматом.


            ## Подготовка контрактов


            1. Сначала вызови module_inventory для анализируемого проекта. Для
            целевых
               каталогов прочитай module_context и границы всех предков от корня.
            2. Если есть module.md, немедленно перенеси его смысл в arch.yaml.
            Сохрани
               обязанности, границы и ограничения, присвой устойчивые идентификаторы модулю
               и пунктам. Проверь новый YAML, затем удали module.md. Не поддерживай две копии.
               Если оба файла уже существуют, сначала сверь их: расхождение не разрешается
               молчаливым выбором одной версии или потерей старого ограничения.
            3. Если нет ни arch.yaml, ни module.md, изучи код каталога и его
            поддерева,
               публичные входы, зависимости, тесты и контракты предков. По результату анализа
               запиши arch.yaml. Имя папки, перечень файлов и шаблонный текст не заменяют
               анализа. Наличие противоречивого кода не разрешает новую обязанность.
            4. Пустой или невалидный arch.yaml исправь до продолжения работы.
            Отсутствие
               контракта не оставляй конечным результатом инвентаризации.
            5. При подготовке просмотра подготовь контракты всего выбранного
            дерева,
               включая контейнеры исходников, тесты и скрипты. Если у каталога ресурсов есть
               собственная архитектурная обязанность, опиши её в arch.yaml. Контракт включит
               каталог в дерево, даже если в нём только инструкции или другие материалы.
               При локальном изменении кода подготовь затронутые каталоги и их предков.
               Зависимости и сгенерированные результаты сборки исключаются. Не создавай
               пустые будущие каталоги.
            6. Перенос формата и создание отсутствующего контракта на основе
            анализа входят
               в этот workflow и не требуют отдельного подтверждения. Расширение ранее
               принятой ответственности требует согласования, если оно уже не разрешено
               текущей задачей пользователя.

            ## Содержание arch.yaml v1


            Обязательны schema_version: 1, id, title, kind (module или group),
            purpose,

            responsibilities, boundaries, invariants. Последние три поля —
            словари

            «устойчивый идентификатор пункта → строка». responsibilities
            содержит минимум

            один пункт; boundaries и invariants могут быть пустыми словарями.

            Необязательны rationale, owners и tags (массивы строк), references
            (массив

            объектов title/uri), extensions (словарь с ключами вида
            organization.field).

            Неизвестные поля, повторяющиеся YAML-ключи, aliases и произвольные
            теги запрещены.


            - id уникален в проекте и сохраняется при перемещении каталога.

            - Идентификаторы пунктов сохраняются при уточнении, не
            переиспользуются для
              другого требования. Путь и родитель выводятся из расположения файла.
            - Каждый каталог исходников имеет свой arch.yaml. Предок не заменяет
            ребёнка.
              Контекст предков учитывается при размещении модулей; соответствие состава
              назначению и границам проверяется в композиции родителя. Собственный чеклист
              ребёнка содержит только пункты его arch.yaml. Изменение контекста предка само
              по себе не инвалидирует локальную проверку ребёнка.
            - В контракте родителя опиши общий результат в purpose, его
            собственные обязанности в
              responsibilities и правила взаимодействия дочерних модулей в boundaries или invariants.
              Конкретную операцию декларирует в своём arch.yaml модуль, который за неё отвечает.
              При переносе операции между детьми контракт родителя меняется только тогда, когда меняется
              его собственная обязанность, обещанный результат или правило взаимодействия.
            - При пересмотре сверь убираемые пункты с контрактами исполнителей и
            сохрани у владельца
              требования, которые до этого были записаны только у предка.
            - Для kind: group без собственного кода укажи, какой результат даёт
            объединение модулей.

            - Для `extensions.archiview.roles` выбирай роли по собственным
            обязанностям модуля.
              `domain` охватывает предметные правила и прикладные сценарии. `app` указывай,
              если модуль объединяет части в приложение и отвечает за него целиком.
              `root` указывай, когда каталог отвечает за состав дерева исходников и границы
              взаимодействия модулей. Если прежняя точка входа в корне указывает на другую роль,
              проверь её реализацию и вызывающие стороны. Зафиксируй расхождение с назначением
              каталога и при согласованном переносе обнови точки запуска вместе с контрактами.
              `resources` указывай у владельца содержания или состава поставляемых материалов.
              У каталога скиллов проверь, отвечает ли он за набор умений, у отдельного скилла —
              за текст инструкций. Сборку и публикацию ресурса описывай у их исполнителей.
              Если единственное основание для метки — операция ребёнка, оставь её у ребёнка.
              Если у группы нет собственной роли, опусти поле. При совпадении ролей проверь,
              какую отдельную операцию выполняет каждый модуль. См. [справочник ролей](../../docs/module-roles.md).
            - Фиксируй устойчивые обязанности. Не включай даты, историю, TODO,
            проценты,
              результаты проверок, статусы реализации и перечни текущих классов и файлов.
            - Не расширяй границы, чтобы оправдать уже написанное изменение.


            ## Снимки и проверки


            ArchiView автоматически строит технические *.archi.yaml и уплотняет
            отчёты

            в <root>/.archiview/work. Реальные содержательные попытки хранятся в

            *.review.yaml с неизменяемыми входами и доказательствами; текущая
            актуальность

            вычисляется отдельно для самого модуля, поддерева и оценки
            изменения.

            Локальные snapshots исключаются из Git. Для переноса сохраняй
            project.json,

            .gitignore и work; абсолютный корень в прежних снимках является
            происхождением

            истории, а не путём чтения исходников после переноса.


            Перед содержательной проверкой экспортируй входы через

            archiview --root ROOT --export-review-input MODULE_ID --output FILE.

            Перечень используемых зависимостей передавай через --dependencies
            FILE;

            --dependencies-complete используй только после проверки полноты
            перечня.

            Заполни модель, prompt, проверки пунктов и доказательства;
            импортируй через

            --import-review FILE --build-report. Не меняй сохранённые входы под
            готовый вывод:

            при изменении области экспортируй их заново. Перед коммитом выполняй
            --check-index

            после добавления исходников и уплотнённых данных в индекс Git.
            Формат обмена:

            plugin-architecture-change-view/docs/report-format-v2.md.

            Текущее соответствие и оценка изменения — отдельные результаты.
            Пустой список

            замечаний не доказывает успешную проверку. Непроверенные пункты
            обозначай

            not_checked, ограничения — в analysis.coverage. Не выдавай
            структурную проверку

            за анализ смысла кода. Прежний снимок не переписывается при миграции
            контрактов.

            В зависимости включай реально используемый контракт/API.
            Расположение каталога

            внутри другого модуля и чтение контекста, тестов или потребителей не
            означают

            зависимость собственной проверки от всего их поддерева реализации.


            ## Работа с инструментами


            MCP публикует этот файл как skill://module-boundaries.


            - module_inventory: покрытие исходных каталогов, ошибки схемы,
            повторяющиеся id,
              собственные исходники и preparation: ready, migrate, analyze_and_write, repair.
            - module_context: цепочка контрактов от корня до directory, включая
            пропуски и
              старый текст только как материал переноса.

            Инструменты читают проект. Агент выполняет анализ и запись своими
            файловыми

            инструментами. При недоступном сервере прочитай дерево и контракты
            напрямую и

            продолжи подготовку. complete: false не доказывает полноту
            найденного дерева.

            После записи повтори инвентаризацию, проверь отсутствие module.md в
            выбранном

            дереве и соответствие реализации контрактам. Полная спецификация
            находится в

            plugin-architecture-change-view/docs/arch-review-format-v1.md.
