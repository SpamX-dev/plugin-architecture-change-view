          text: >
            schema_version: 1

            id: archiview-mcp

            title: MCP-сервер ArchiView

            kind: module

            extensions:
              archiview.roles: [mcp-server]
            purpose: Предоставлять агенту ArchiView через MCP по stdio в
            контексте выбранной рабочей папки.

            responsibilities:
              R1: Публиковать канонический скилл module-boundaries из пакета ArchiView как ресурс MCP.
              R3: Давать агенту инвентаризацию каталогов проекта.
              R4: Предоставлять цепочку действующих контрактов по указанному пути.
              R5: Принимать от агента план модулей для создания каркаса в выбранном репозитории.
              R2: При включении панели предоставлять её ресурс и инструменты в той же MCP-сессии.
            boundaries:
              B1: Принимать запросы чтения контрактов только с допустимыми аргументами и в пределах выбранного проекта.
              B3: Регистрировать операции панели только при явном запуске с параметром --panel.
