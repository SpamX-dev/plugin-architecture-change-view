                    action: "Каталог ещё не создан. " + ADD_MAPPING });
                  if (current === ".") break;
                  current = path.posix.dirname(current);
                }
                return { schema_version: 1, root, directory, workspaceRoot, repository, contracts: chain.reverse() };
              }
