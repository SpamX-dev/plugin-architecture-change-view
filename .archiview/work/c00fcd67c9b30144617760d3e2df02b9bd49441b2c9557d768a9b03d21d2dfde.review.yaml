          - selector:
              kind: file
              path: src/application/project.ts
            available: true
            digest: sha256:581fb08fe0a3d38eaa0dcd0270d0df21e77ddac6fd79a7451423757dc1a9779c
            content: >
              /** Привязка процесса к проекту: каталог установки плагина не
              является рабочим проектом. */

              import { realpath, stat } from "node:fs/promises";

              import path from "node:path";

              import { ApplicationError } from "./errors.js";


              /** Позволяет один раз выбрать существующую абсолютную папку,
              затем запрещает смену корня. */

              export async function createProjectBinding(initialRoot?: string) {
                let root: string | undefined;
                async function select(requested?: unknown) {
                  if (requested !== undefined) {
                    if (typeof requested !== "string" || !path.isAbsolute(requested)) {
                      throw new ApplicationError("INVALID_ARGUMENT", "projectRoot должен быть абсолютным путём к папке проекта");
                    }
                    const candidate = await realpath(requested);
                    if (!(await stat(candidate)).isDirectory()) throw new ApplicationError("INVALID_ARGUMENT", "projectRoot должен указывать на папку");
                    if (root && candidate !== root) throw new ApplicationError("PROJECT_BOUND", "Процесс уже привязан к другому проекту: " + root);
                    root = candidate;
                  }
                  if (!root) throw new ApplicationError("PROJECT_REQUIRED", "Укажите projectRoot — абсолютный путь к проекту текущего чата");
                  return root;
                }
                if (initialRoot !== undefined) await select(path.resolve(initialRoot));
                return { select, get root() { return root; } };
              }
          - selector:
              kind: file
              path: src/codex/panel.ts
            available: true
            digest: sha256:fc7c57c3add6caafee67b795ff1877dd317201c012fefd4510658f6753bfb540
            content: >
              import { callSessionOperation } from
              "../application/arguments.js";

              /** Адаптер MCP Apps: собранный UI и скрытые операции прикладного
              сервиса, без HTTP-сервера. */

              import { readFile } from "node:fs/promises";

              import { createWorkspaceSession } from
              "../application/workspace-session.js";

              import { createProjectBinding } from "../application/project.js";

              import { applicationError, ApplicationError } from
              "../application/errors.js";

              import { packageUrl } from "../runtime/package-paths.js";

              import { UI_TOOL_METHODS, validateUiArguments } from
              "./ui-tools.js";

              import { chooseProjectDirectory } from "./directory-picker.js";


              export const PANEL_URI = "ui://archiview/panel-v6.html";

              export const PROJECT_INPUT = { type: "string", description:
              "Absolute project directory of the current chat, not the plugin
              installation. Normally selected automatically from the working
              folder supplied by Codex." };

              export const PANEL_TOOL:
              import("@modelcontextprotocol/sdk/types.js").Tool = {
                name: "archiview_open", title: "ArchiView",
                description: "Open the local architecture panel for this project. Browsing stays in the UI; only an explicit Analyze action sends a request to the agent.",
                inputSchema: { type: "object", properties: { projectRoot: PROJECT_INPUT }, additionalProperties: false },
                annotations: { readOnlyHint: false, destructiveHint: false, openWorldHint: false },
                _meta: { ui: { resourceUri: PANEL_URI }, "openai/ui": { entrypoints: [{ type: "thread" }] } },
              };


              /** Одна панель владеет одной сессией; загрузка HTML не читает
              проект и не открывает сокеты. */

              interface ProjectBinding { readonly root: string | undefined;
              select(requested?: string, metadata?: Record<string, unknown>):
              Promise<string> }

              export function createCodexPanel(rootOrBinding?: string |
              ProjectBinding, { stateDirectory, chooseDirectory =
              chooseProjectDirectory }: { stateDirectory?: string;
              chooseDirectory?: () => Promise<{ projectRoot: string | null }> }
              = {}) {
                const binding = rootOrBinding && typeof rootOrBinding === "object" ? Promise.resolve(rootOrBinding) : createProjectBinding(rootOrBinding);
                let session: ReturnType<typeof createWorkspaceSession> | null | undefined;
                let closed = false;
                let projectSelection = Promise.resolve();
                let mutations = Promise.resolve();
                const reads = new Set<Promise<void>>();
                const checkOpen = () => { if (closed) throw new ApplicationError("SESSION_CLOSED", "Сессия панели закрыта"); };
                async function service(metadata?: Record<string, unknown>) {
                  const project = await binding;
                  const root = await project.select(undefined, metadata);
                  if (!session) session = createWorkspaceSession({ root, stateDirectory }).catch((error) => { session = null; throw error; });
                  return session;
                }
                return {
                  /** Открытие UI не зависит от готовности контекста пустого чата; ошибки папки затем показывает сама панель. */
                  async open(projectRoot?: string, metadata?: Record<string, unknown>) {
                    checkOpen();
                    const project = await binding;
                    try { await project.select(projectRoot, metadata); }
                    catch (error) {
                      if (!["PROJECT_REQUIRED", "CODEX_CONTEXT_UNAVAILABLE", "PROJECT_UNAVAILABLE"].includes(applicationError(error).code)) throw error;
                      const unavailable = applicationError(error).code === "PROJECT_UNAVAILABLE";
                      return { content: [{ type: "text" as const, text: unavailable ? applicationError(error).message : "ArchiView: подготовка рабочей папки проекта." }],
                        structuredContent: { projectRequired: !unavailable, projectStatus: unavailable ? "unavailable" : "initializing" },
                        _meta: { bootstrap: applicationError(error) } };
                    }
                    const root = project.root;
                    return { content: [{ type: "text" as const, text: "ArchiView: " + root }], structuredContent: { root } };
                  },
                  /** A published tree and its cards can be read while another checkout refreshes. Bind the project before routing either request. */
                  callUi(name: string, args: unknown, metadata?: Record<string, unknown>) {
                    const method = UI_TOOL_METHODS.get(name);
                    const selectsProject = method === "setProject" || method === "chooseProject" || method === "getProject";
                    const read = method === "getModule" || (method === "getComparison" && args !== null &&
                      typeof args === "object" && "published" in args && args.published === true);
                    const ready = read || selectsProject ? projectSelection : Promise.all([projectSelection, mutations]);
                    const operation = ready.then(async () => {
                      checkOpen();
                      validateUiArguments(name, args);
                      if (!method) throw new ApplicationError("INVALID_ARGUMENT", "Неизвестная операция панели");
                      if (method === "chooseProject") {
                        try { await (await binding).select(undefined, metadata); }
                        catch (error) { if (!["PROJECT_REQUIRED", "CODEX_CONTEXT_UNAVAILABLE"].includes(applicationError(error).code)) throw error; }
                        return { content: [], _meta: { result: await chooseDirectory() } };
                      }
                      // Проверка папки не создаёт сессию и не ждёт обхода исходников или истории.
                      const result = (method === "getProject" || method === "setProject") ?
                        { root: await (await binding).select(method === "setProject" ? args.projectRoot as string : undefined, metadata) } :
                        await callSessionOperation(await service(metadata), method, args);
                      // Ни content, ни structuredContent не содержат данные просмотра.
                      return { content: [], _meta: { result } };
                    }).catch((error) => ({ isError: true, content: [], _meta: { error: applicationError(error) } }));
                    const finished = operation.then(() => {});
                    if (selectsProject) {
                      projectSelection = finished;
                    } else if (read) {
                      reads.add(finished);
                      void finished.then(() => reads.delete(finished));
                    } else {
                      mutations = finished;
                    }
                    return operation;
                  },
                  /** Полностью встроенный HTML подключается к хосту даже при запрете любых сетевых соединений UI. */
                  async resource() {
                    checkOpen();
                    const html = (await readFile(new URL("dist/panel.html", packageUrl), "utf8"))
                      .replace("<head>", '<head><meta name="archiview-transport" content="mcp"><meta name="archiview-directory-picker" content="' + (process.platform === "win32") + '">')
                      .replace('href="/" aria-label="ArchiView"', 'href="#" aria-label="ArchiView"');
                    return { contents: [{ uri: PANEL_URI, mimeType: "text/html;profile=mcp-app", text: html,
                      _meta: { ui: { csp: { connectDomains: [], resourceDomains: [] } },
                        "openai/widgetCSP": { connect_domains: [], resource_domains: [] },
                        "openai/ui": { availableDisplayModes: ["inline", "fullscreen"] } } }] };
                  },
                  /** После отключения хоста новые операции отклоняются; уже начатая запись безопасно завершается. */
                  async close() { closed = true; await Promise.all([projectSelection, mutations, ...reads]); session = null; },
                };
              }
          - selector:
              kind: file
              path: src/codex/project-context.ts
            available: true
            digest: sha256:e6a25d6d8e4dd8c3920d34dee5a4266ccaa1b7713c4ff7fc3d0c8a69eff68ab4
            content: >
              /** Привязка панели к рабочей папке чата Codex, независимо от
              projectId и наличия сообщений. */

              import { createProjectBinding } from "../application/project.js";

              import { ApplicationError } from "../application/errors.js";

              import { createHostContextReader } from "./host-context.js";


              /** Идентификатор берётся только из метаданных хоста, а не из
              аргументов инструмента модели. */

              export function threadIdFromMetadata(metadata?: Record<string,
              unknown>) {
                for (const key of ["threadId", "openai/threadId", "openai/thread_id", "codexThreadId", "codex_thread_id", "thread_id"]) {
                  const value = metadata?.[key];
                  if (typeof value === "string" && value.trim() !== "") return value;
                }
                return undefined;
              }


              /**
               * Общая прикладная привязка остаётся неизменяемой. Codex-адаптер получает папку
               * до создания сессии; сериализация первых обращений исключает конкурирующие корни.
               * Когда хост не сообщает контекст, разрешён явный выбор существующей папки.
               * Подтверждённое отсутствие проекта не обходится ручным вводом.
               */
              export async function createCodexProjectBinding(initialRoot?:
              string, { readContext = createHostContextReader() } = {}) {
                const project = await createProjectBinding(initialRoot);
                let boundThread: string | undefined;
                let queue = Promise.resolve();
                return {
                  get root() { return project.root; },
                  select(requested?: string, metadata?: Record<string, unknown>) {
                    const operation = queue.then(async () => {
                      const threadId = threadIdFromMetadata(metadata);
                      if (threadId === undefined && requested === undefined && project.root === undefined) {
                        throw new ApplicationError("CODEX_CONTEXT_UNAVAILABLE", "Не удалось получить рабочую папку чата от Codex. Повторите попытку.");
                      }
                      if (threadId !== undefined && threadId !== boundThread) {
                        const context = await readContext(threadId, { allowStartupDirectory: boundThread === undefined });
                        if (context.status === "unavailable") throw new ApplicationError("PROJECT_UNAVAILABLE", "Плагин доступен только в проектах");
                        if (context.status !== "ready") {
                          if (requested !== undefined && project.root === undefined) {
                            const root = await project.select(requested);
                            boundThread = threadId;
                            return root;
                          }
                          throw new ApplicationError("CODEX_CONTEXT_UNAVAILABLE", "Не удалось получить рабочую папку чата от Codex. Укажите папку проекта вручную.");
                        }
                        if (initialRoot === undefined) await project.select(context.root);
                        boundThread = threadId;
                      }
                      return project.select(requested);
                    });
                    queue = operation.then(() => {}, () => {});
                    return operation;
                  },
                };
              }
          - selector:
              kind: file
              path: src/codex/ui-tools.ts
            available: true
            digest: sha256:b23df33dcd854bfd69355cba2719d629f7c5c4e73464c91997ffe98c205c90ac
            content: >
              import type { SessionOperations } from "../application/api.js";

              /** Каталог операций панели. Хост видит схемы, но visibility=app
              исключает их из инструментов модели. */

              import { ApplicationError } from "../application/errors.js";

              import type { Tool } from "@modelcontextprotocol/sdk/types.js";


              type Rule = { type: "string"; maxLength: number } | { type:
              "integer"; minimum: number; maximum: number } | { type: "boolean"
              };

              type Method = "getProject" | "chooseProject" | "setProject" |
              keyof SessionOperations;

              type Operation = [string, Method, string, Record<string, Rule>,
              string[], boolean];


              const string: Rule = { type: "string", maxLength: 4096 };

              const selectedModule = { view: string, path: string, repository:
              string };

              /** Явный набор операций сервиса, без произвольного URL, имени
              функции или доступа к файлам. */

              const operations: Operation[] = [
                ["get_project", "getProject", "Resolve this panel's project directory without loading snapshots or history.", {}, [], true],
                ["choose_project", "chooseProject", "Show a native folder chooser after an explicit user click. Cancellation keeps the current input.", {}, [], false],
                ["set_project", "setProject", "Bind this panel to a project directory.", { projectRoot: string }, ["projectRoot"], false],
                ["get_comparison", "getComparison", "Load the selected repository comparison and timeline. With published=true, prefer the last complete publication.", { repository: string, target: string, baseline: string, historyLimit: { type: "integer", minimum: 1, maximum: 10000 }, published: { type: "boolean" } }, [], false],
                ["get_module", "getModule", "Load module details from an existing comparison.", selectedModule, ["view", "path"], true],
                ["prepare_analysis", "prepareAnalysis", "Prepare immutable inputs for an explicit module analysis.", selectedModule, ["view", "path"], false],
                ["get_analysis", "getAnalysis", "Read the saved status of a prepared analysis.", { id: string, repository: string }, ["id"], true],
                ["build_review", "buildReview", "Refresh a structural report for a selected module.", selectedModule, ["view", "path"], false],
                ["save_snapshot", "saveSnapshot", "Save the selected complete snapshot.", { view: string, repository: string, label: { type: "string", maxLength: 120 } }, ["view"], false],
              ];


              export const UI_TOOL_METHODS = new Map(operations.map(([name,
              method]) => ["archiview_ui_" + name, method]));

              export const UI_TOOLS = operations.map(([name, , description,
              properties, required, readOnlyHint]) => ({
                name: "archiview_ui_" + name, description,
                inputSchema: { type: "object" as const, properties, required, additionalProperties: false },
                annotations: { readOnlyHint, destructiveHint: false, openWorldHint: false },
                _meta: { ui: { visibility: ["app"] } },
              })) satisfies Tool[];


              /** SDK низкого уровня не валидирует inputSchema; проверяем тот же
              контракт перед вызовом сервиса. */

              export function validateUiArguments(name: string, args: unknown):
              asserts args is Record<string, unknown> {
                const schema = UI_TOOLS.find((tool) => tool.name === name)?.inputSchema;
                const invalid = () => { throw new ApplicationError("INVALID_ARGUMENT", "Некорректные параметры операции панели"); };
                if (!schema || !args || typeof args !== "object" || Array.isArray(args)) return invalid();
                if (Object.keys(args).some((key) => !Object.hasOwn(schema.properties, key)) ||
                    schema.required.some((key) => !Object.hasOwn(args, key))) invalid();
                for (const [key, value] of Object.entries(args)) {
                  const rule = schema.properties[key];
                  if (rule.type === "string" && (typeof value !== "string" || value.length > rule.maxLength)) invalid();
                  if (rule.type === "integer" && (typeof value !== "number" || !Number.isSafeInteger(value) || value < rule.minimum || value > rule.maximum)) invalid();
                  if (rule.type === "boolean" && typeof value !== "boolean") invalid();
                }
              }
          - selector:
              kind: file
              path: src/contracts/inventory.ts
            available: true
            digest: sha256:817d0620ac35e3af9f36af84eb32eabacec5e9d72e146c6111a62e6a01f482a7
            content: >
              import { realpath } from "node:fs/promises";

              import path from "node:path";

              import { discoverWorkspaceRepositories, locateSourceRepository,
              resolveWorkspaceRepository } from "../project/workspace.js";

              import { errorDetails } from "../runtime/errors.js";

              import type { ModuleDocument } from "./module-tree.js";

              import {
                assertModuleDirectory, ADD_MAPPING, listModuleContractPaths,
                MODULE_TREE_FILE, moduleDocumentPath, readContractStorageFile, readModuleTree, resolveModuleDocument,
              } from "./module-tree.js";

              import { excludedProjectPath, portable, projectFiles,
              regularProjectFile, SOURCE_EXTENSIONS } from "./source-files.js";


              export { excludedProjectPath, projectFiles, regularProjectFile,
              SOURCE_EXTENSIONS } from "./source-files.js";


              interface InventoryModule extends ModuleDocument {
                repository?: string;
                sourceFiles?: number;
                required?: boolean;
                files?: string[];
                preparation?: string;
              }


              async function documentAt(root: string, directory: string, id?:
              string): Promise<InventoryModule> {
                await assertModuleDirectory(root, directory);
                const text = id ? await readContractStorageFile(root, moduleDocumentPath(id)) : null;
                return resolveModuleDocument(directory, id, text);
              }


              function includeDirectory(directories: Map<string, number>,
              directory: string, source: boolean) {
                while (true) {
                  directories.set(directory, (directories.get(directory) ?? 0) + Number(source));
                  if (directory === ".") return;
                  directory = path.posix.dirname(directory);
                }
              }


              /** Inventories source paths and mapped resources, and reports
              broken central storage explicitly. */

              interface InventoryOptions { extensions?: Set<string>; maxFiles?:
              number }


              async function repositoryInventory(root: string, options:
              InventoryOptions, nested: string[]) {
                const extensions = options.extensions ?? SOURCE_EXTENSIONS;
                const owned = (relative: string) => !nested.some((child) => relative === child || relative.startsWith(child + "/"));
                const listed = await projectFiles(root, options.maxFiles ?? 50000, owned);
                const directories = new Map<string, number>();
                const sourcePaths: string[] = [];
                let tree = new Map<string, string>();
                let treeError: string | undefined;
                try {
                  tree = await readModuleTree(root);
                } catch (cause) {
                  treeError = MODULE_TREE_FILE + ": " + errorDetails(cause).message;
                  listed.diagnostics.push(treeError);
                  listed.complete = false;
                }
                for (const directory of tree.keys()) {
                  if (owned(directory)) includeDirectory(directories, directory, false);
                  else {
                    listed.complete = false;
                    listed.diagnostics.push(MODULE_TREE_FILE + ": " + directory + " belongs to a nested repository");
                  }
                }
                if (!treeError) {
                  try {
                    const registered = new Set([...tree.values()].map(moduleDocumentPath));
                    for (const file of await listModuleContractPaths(root)) {
                      if (!registered.has(file)) {
                        listed.diagnostics.push(file + " is not registered in " + MODULE_TREE_FILE);
                        listed.complete = false;
                      }
                    }
                  } catch (cause) {
                    listed.diagnostics.push(errorDetails(cause).message);
                    listed.complete = false;
                  }
                }
                for (const file of listed.files) {
                  if (!extensions.has(path.extname(file).toLowerCase())) continue;
                  try {
                    if (!await regularProjectFile(root, file)) continue;
                  } catch (cause) {
                    listed.complete = false;
                    listed.diagnostics.push(file + ": " + errorDetails(cause).message);
                    continue;
                  }
                  const relative = portable(file);
                  sourcePaths.push(relative);
                  includeDirectory(directories, path.posix.dirname(relative), true);
                }
                const modules: InventoryModule[] = [];
                for (const [directory, sourceFiles] of [...directories].sort(([a], [b]) => a.localeCompare(b))) {
                  const id = tree.get(directory);
                  let entry: InventoryModule;
                  try {
                    if (treeError) {
                      entry = { directory, document: MODULE_TREE_FILE, status: "invalid", errors: [treeError] };
                    } else {
                      const { text, ...document } = await documentAt(root, directory, id);
                      entry = document;
                      if (id && entry.status === "missing") {
                        listed.diagnostics.push(directory + ": missing " + entry.document);
                        listed.complete = false;
                      }
                    }
                  } catch (cause) {
                    const message = directory + ": " + errorDetails(cause).message;
                    listed.diagnostics.push(message);
                    listed.complete = false;
                    entry = { directory, document: id ? moduleDocumentPath(id) : MODULE_TREE_FILE,
                      status: "unreadable", errors: [message] };
                  }
                  entry.sourceFiles = sourceFiles;
                  entry.required = sourceFiles > 0;
                  entry.files = sourcePaths.filter((file) => path.posix.dirname(file) === directory);
                  entry.preparation = entry.status === "documented" ? "ready" :
                    entry.status === "missing" && !id ? "analyze_and_write" : "repair";
                  modules.push(entry);
                }
                const inventory = { schema_version: 1, root, complete: listed.complete, discovery: listed.discovery,
                  sourceFiles: sourcePaths.length, modules, diagnostics: listed.diagnostics,
                  preparation: "Исправьте ошибки карты и контрактов. Для нового модуля изучите исходники и контракты предков. " + ADD_MAPPING };
                return { inventory, scannedFiles: listed.files.length };
              }


              /** A workspace lists modules by repository; contract ids stay
              local to that repository. */

              export async function moduleInventory(projectRoot: string,
              options: InventoryOptions = {}) {
                const root = await realpath(projectRoot);
                const repositories = await discoverWorkspaceRepositories(root);
                if (!repositories.length || repositories.length === 1 && repositories[0] === ".") {
                  const { inventory } = await repositoryInventory(root, options, []);
                  return { ...inventory, repositories };
                }
                const modules: InventoryModule[] = [];
                const diagnostics: string[] = [];
                let sourceFiles = 0;
                let complete = true;
                let remaining = options.maxFiles ?? 50000;
                for (const repository of repositories) {
                  if (remaining <= 0) {
                    complete = false;
                    diagnostics.push("File limit reached before repository " + repository);
                    break;
                  }
