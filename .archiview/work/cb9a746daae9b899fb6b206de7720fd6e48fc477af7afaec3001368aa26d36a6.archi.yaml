                for (const [index, { directory, module: ancestor }] of moduleTrail(currentView().modules, module).entries()) {
                  if (index) breadcrumbs.append(el("span", "breadcrumb-separator", "/"));
                  const button = el("button", "breadcrumb", directory === "." ?
