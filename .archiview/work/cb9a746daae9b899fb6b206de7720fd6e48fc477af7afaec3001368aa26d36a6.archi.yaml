      id: archiview-client
      title: Интерфейс ArchiView
      kind: module
      purpose: Давать навигацию по дереву модулей и показывать контракты, изменения и
        результаты архитектурных проверок.
      responsibilities:
        R1: Владеть поиском, фильтрами, выбором модуля и представлением его
          структурированного контракта.
        R2: Показывать разницу контрактов, состав файлов, историю проверок, две итоговые
          оценки, замечания и сохранённые доказательства.
        R3: Раздельно показывать собственную актуальность и актуальность поддерева,
          причины перепроверки, ограничения покрытия и расхождения
          содержательных оценок.
        R4: Представлять хронологию коммитов, незакоммиченных изменений и текущего
          сжатого состояния; выбирать просматриваемое состояние в едином списке
          от свежих состояний к ранним.
      boundaries:
        B2: Действия просмотра используют HTTP API; только явный запрос анализа
          передаётся агенту через bridge хоста.
        B1: Снимки, статусы и вычисленное устаревание получает через API; семантические
          оценки берёт из выбранного отчёта.
