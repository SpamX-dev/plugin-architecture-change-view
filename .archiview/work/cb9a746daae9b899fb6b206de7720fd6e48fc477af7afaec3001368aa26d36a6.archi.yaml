          kind: file
          path: web/archiview/types.ts
          start_line: 1
          end_line: 51
          text: >
            import type { ModuleDetail, ModuleReview, SessionOperations } from
            "../../src/application/api.js";

            import type { ClauseReference, Finding as SavedFinding,
            FreshnessReason, ReviewReport, Side, Coverage } from
            "../../src/reviews/types.js";

            import type { Contract } from "../../src/contracts/types.js";

            import type { SnapshotReference, Fact } from
            "../../src/snapshots/types.js";

            import type { AggregateAssessment } from
            "../../src/reports/types.js";


            export type { ComparisonArgs, ComparisonView, ModuleDetail,
            ModuleSummary, TimelineEntry } from "../../src/application/api.js";

            export type { Assessment, ClauseCheck as Check, ClauseReference,
            Coverage, EvidenceReference, Observation, Side } from
            "../../src/reviews/types.js";

            export type { Contract, ContractDocument, Section } from
            "../../src/contracts/types.js";

            export type { ChangeStatus, Fact } from
            "../../src/snapshots/types.js";


            /** Older saved reviews can omit details shown by current producers.
            */

            export type Reason = string | (FreshnessReason & { message?: string;
            description?: string });

            export type Freshness = Pick<AggregateAssessment, "status"> & {
              conflict?: boolean; current_violation?: boolean; coverage?: Coverage; reasons?: Reason[];
            };

            export type Finding = Pick<SavedFinding, "id" | "severity" |
            "summary" | "clauses" | "evidence"> & Partial<SavedFinding> & {
            assessmentOnly?: boolean };

            export type ReviewBundle = Pick<ModuleReview, "contracts"> &
            Partial<Pick<ModuleReview, "reviewFile" | "stale" | "dependencies">>
            & {
              freshness?: Partial<Record<"current" | "change", Freshness>>;
              facts: Record<Side, (Pick<Fact, "id" | "path"> & Partial<Fact>)[]>;
              report: Pick<ReviewReport, "id" | "module" | "assessment" | "observed" | "checks"> & {
                comparison: Partial<Record<Side, SnapshotReference | null>>;
                analysis: Pick<ReviewReport["analysis"], "created_at" | "coverage">;
                findings: Finding[];
              };
            };


            export interface AnalysisRecord { id?: string; viewId?: string;
            prompt?: string; status: string; message?: string }

            export interface FixRecord { status: string; message: string }

            export interface FindingTarget { reviewId: string; findingId:
            string; severity?: string; summary?: string; label?: string }

            export interface PanelBridge { call?: (name: string, args:
            Record<string, unknown>) => Promise<unknown>; send?: (prompt:
            string) => Promise<void> }

            export interface PromptAction { mode: "send" | "copy"; deliver:
            (prompt: string) => Promise<void> }

            export interface ClientOptions { mode: string; connection?:
            Promise<PanelBridge | null> | PanelBridge | null; fetcher?: typeof
            fetch; base?: string; sessionId?: string }

            export interface ArchiViewClient extends SessionOperations {
              setProject(args: { projectRoot: string }): Promise<{ root: string }>;
            }

            export interface ContractRenderOptions {
              contractDiff: ModuleDetail["contractDiff"]; previousReferences?: Contract["references"]; titleElement?: HTMLElement; groupElement?: HTMLElement;
              hideHeading?: boolean; rawChanged?: boolean; showRawDiff?: () => void; review?: ReviewBundle; openFinding?: (target: FindingTarget) => void;
            }

            export interface ReviewRenderOptions {
              reviewId?: string; findingId?: string; projectRoot?: string; fixMode?: string; fixStates?: Map<string, FixRecord>;
              fixFinding?: (prompt: string) => Promise<void>; fixChanged?: (reviewId: string) => void;
              openClause?: (reference: ClauseReference, review: ReviewBundle) => void;
            }

            export function errorMessage(error: unknown): string { return error
            instanceof Error ? error.message : String(error); }

            export function errorCode(error: unknown): string | undefined {
              return typeof error === "object" && error !== null && "code" in error && typeof error.code === "string" ? error.code : undefined;
            }

            export function isRecord(value: unknown): value is Record<string,
            unknown> { return typeof value === "object" && value !== null &&
            !Array.isArray(value); }
