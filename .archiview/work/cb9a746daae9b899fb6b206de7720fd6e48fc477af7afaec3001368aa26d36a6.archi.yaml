            anywhere; }

            .mobile-only { display: none; }

            @media (min-width: 1550px) { .content { padding: 0 55px;
            }.document-panel { max-width: 1120px; } }

            @media (max-width: 1150px) {
              .brand-caption, .local-indicator { display: none; }.topbar { padding: 0 22px; }
              .comparison-bar { padding: 0 22px; }.project-path { max-width: 270px; }
              .comparison-picker { gap: 8px; }
              .comparison-picker select { width: 275px; }
              .content { padding: 0 25px; }.module-title-row h1 { font-size: 22px; }
              .module-meta { gap: 20px; padding: 15px; }.meta-item + .meta-item { padding-left: 20px; }
              .meta-value { font-size: 10px; }.module-heading { flex-wrap: wrap; gap: 12px; }
              .view-label { display: none; }.markdown { padding: 23px; }
            }

            @media (max-width: 800px) {
              body { height: 100dvh; }.topbar { height: 65px; padding: 0 15px; gap: 10px; }
              .brand { font-size: 21px; }.brand-mark { width: 30px; height: 30px; }
              .topbar-actions { gap: 5px; }.button { font-size: 10px; padding: 6px 9px; }
              #refresh { font-size: 0; gap: 0; width: 33px; }.comparison-bar { height: 103px; padding: 11px 18px; flex-wrap: wrap; gap: 10px; align-content: center; }
              .project-heading { gap: 2px; }.project-path { display: none; }.project-heading strong { font-size: 11px; }
              .comparison-picker { margin: 0; width: 100%; }.comparison-picker select { width: auto; max-width: 100%; min-width: 0; flex: 1; font-size: 11px; padding: 7px; }
              .app-shell { display: block; }.sidebar, .tree-resizer { display: none; }
              .tree-open .sidebar { display: flex; position: absolute; z-index: 5; top: 0; left: 0; bottom: 0; width: min(420px, 93%); box-shadow: 10px 0 30px #234a2c20; }
              .content { height: 100%; padding: 0 20px; }.content-topline { padding: 16px 0; justify-content: flex-start; }
              .mobile-only { display: inline-flex; font-size: 9px; padding: 4px 7px; min-height: 25px; }
              .module-title-row h1 { font-size: 22px; }.module-meta { margin: 19px 0 23px; gap: 15px; flex-wrap: wrap; }.meta-item + .meta-item { padding-left: 15px; }
              #copy-path { display: none; }.tabs { gap: 23px; }.document-version { font-size: 8px; }.markdown { font-size: 12px; padding: 22px 20px; }.paper-heading { padding: 12px 15px; }
              .paper-note { font-size: 8px; }.document-panel { padding-top: 20px; }.diff-line { grid-template-columns: 28px 28px 20px minmax(0,1fr); font-size: 9px; }.diff-labels { grid-template-columns: 28px 28px 1fr; }.line-number { padding-right: 6px; }
            }

            @media (prefers-reduced-motion: reduce) { *, *::before, *::after {
            animation: none !important; scroll-behavior: auto !important; } }


            /* Структурированные контракты и независимые результаты анализа. */

            .tabs { gap: 22px; flex-wrap: wrap; }

            .tabs-row { flex-wrap: wrap; gap: 10px; }

            .tabs-row .document-version { margin-left: auto; }

