            dialog { border: 1px solid #d7e2da; border-radius: 12px; padding:
            30px; max-width: 450px; width: calc(100% - 36px); color: #46634f;
            box-shadow: 0 20px 90px #163b2930; }

            dialog::backdrop { background: #183d2b40; backdrop-filter:
