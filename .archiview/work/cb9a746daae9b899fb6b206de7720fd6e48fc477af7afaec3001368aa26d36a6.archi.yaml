              .paper-note { font-size: 8px; }.document-panel { padding-top: 20px; }.diff-line { grid-template-columns: 28px 28px 20px minmax(0,1fr); font-size: 9px; }.diff-labels { grid-template-columns: 28px 28px 1fr; }.line-number { padding-right: 6px; }
            }

