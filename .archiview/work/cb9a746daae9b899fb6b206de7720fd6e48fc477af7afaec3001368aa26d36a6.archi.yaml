        digest: sha256:58ee9e67db95b7c62e804a682b0b5f87fd1605eb3a2374cb0a68b2da1c424036
        normalization: text-lf/v1
    contract:
      schema_version: 1
      id: archiview-client
      title: web-ui
      kind: group
      extensions:
        archiview.roles:
          - src
      purpose: Давать пользователю возможность изучить изменения модуля, проверить
        доказательства и поручить дальнейший анализ.
      boundaries:
        B1: Отображать смысловую оценку из выбранного отчёта. Статус изменения файлов
          сам по себе не определяет качество архитектуры.
        B2: Копировать промпт анализа или исправления по явному действию пользователя.
        B3: В основном чеклисте показывать только собственные пункты модуля для
          выбранного состояния.
        B4: В счётчики замечаний и действия исправления включать только содержательные
          замечания. Изменения текста пунктов показывать в контракте.
        B5: Свёрнутая ветвь учитывает потребность скрытых потомков в анализе, а
          раскрытая строка показывает собственный статус модуля.
        B6: В карточке текущего состояния показывать полноту проверки зависимостей без
          перечня зависимостей из прежнего отчёта.
        B7: Устаревание одной лишь оценки перехода не требует повторного анализа
          текущего состояния.
        B8: Обеспечивать просмотр дерева Git во время загрузки статусов проверок.
        B9: Подтверждать завершение анализа по импорту результата.
        B10: После копирования промпта исправления сохранять текущий статус замечания.
        B11: Сохранять доступ к удалённым модулям и доказательствам выбранного
          исторического состояния.
      invariants: {}
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B6
        text: Не является IDE и не стремится заменить функционал IDE
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает встроенную панель Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает встроенную панель DeepSeek Harness.
      - module_id: architecture-change-view
        section: invariants
        id: I9
        text: Локальный запуск в браузере входит в обязательные варианты поставки
          приложения.
      - module_id: architecture-web
        section: boundaries
        id: B2
        text: Действия просмотра оставляют исходники и согласованные контракты без
          изменений.
      - module_id: architecture-web
        section: boundaries
        id: B3
        text: Интерфейс отображает полученные документы и исходники только как данные.
