    contract:
      schema_version: 1
      id: archiview-client
      title: Интерфейс ArchiView
      kind: module
      extensions:
        archiview.roles:
          - ui
          - http-client
          - mcp-client
      purpose: Давать навигацию по дереву модулей и показывать контракты, изменения и
        результаты архитектурных проверок.
      responsibilities:
        R1: Владеть поиском, фильтрами, выбором модуля и представлением его
          структурированного контракта. Различать добавленные, неизменившиеся и
          удалённые роли при сравнении собственных контрактов. В дереве
          показывать только роли выбранного состояния, в карточке — также
          удалённые.
        R2: Показывать изменения непосредственно в контракте цветом и открывать диф
          выбранного поля. Название, тип, идентификатор и назначение образуют
          одну группу с общим дифом и самым строгим статусом изменения.
          Представлять состав файлов, историю проверок, замечания и сохранённые
          доказательства. Ошибки показываются в замечаниях без дублирующего
          общего вердикта; пункт и его владелец доступны из замечания. Основной
          чеклист содержит только собственные пункты выбранного состояния
          модуля; пункты предков и повторы версий в него не включаются.
          Изменение текста пункта и замечания к нему представлены независимо;
          каждое замечание доступно отдельным переходом из пункта. Открытые
          замечания обозначаются жуком на вкладке замечаний и в дереве;
          свёрнутый родитель показывает также замечания скрытых потомков,
          раскрытый — только собственные.
        R3: Раздельно показывать собственную актуальность и актуальность поддерева,
          причины перепроверки, полноту проверки, подтверждённость перечня
          зависимостей и расхождения содержательных оценок; совпадение
          проверенных входов не скрывать из-за частичного покрытия.
        R4: Представлять хронологию коммитов, незакоммиченных изменений и текущего
          сжатого состояния; выбирать просматриваемое состояние в едином списке
          от свежих состояний к ранним. При открытии и возврате из истории в
          текущее состояние показывать доступное сохранённое сравнение с датой,
          сохранять выбор модуля при актуализации рабочего дерева и открывать
          анализ после получения актуального сравнения.
        R5: Позволять выбрать папку проекта, если хост открыл панель без привязанного
          корня.
        R6: По явному действию подготавливать поручение анализа выбранного снимка и
          передавать его агенту хоста либо копировать промпт в буфер обмена в
          самостоятельной веб-версии; завершение анализа подтверждать импортом
          результата.
        R7: По явной кнопке карточки передавать агенту поручение исправить выбранное
          замечание либо копировать его в самостоятельной веб-версии. Ссылаться
          на сохранённый анализ и устойчивые идентификаторы проверки и
          замечания; подтверждение передачи не закрывает замечание.
        R8: Запрашивать данные сравнения и выполнять выбранные пользователем операции
          просмотра через HTTP в браузере и dsh или через инструменты MCP в
          панели Codex.
        R9: Показывать репозитории рабочей папки в общей навигации и открывать детали и
          историю в контексте выбранного репозитория.
      boundaries:
        B2: Компоненты обращаются к общему клиенту просмотра. В Codex подключение к
          хосту предоставляет адаптер панели. Агент получает только явные
          поручения анализа и исправления.
        B1: Снимки, статусы и вычисленное устаревание получает через API; семантические
          оценки берёт из выбранного отчёта.
      invariants:
        I1: initial, new, changed, removed и unchanged описывают изменения файлов, а не
          качество архитектуры.
        I2: Удалённые модули и исторические доказательства остаются доступны.
        I3: Если контракт отсутствует, интерфейс указывает, что нужно проверить запись
          модуля в карте и его YAML-контракт.
        I4: Неполнота и устаревание видны рядом с выводами; содержимое документов не
          исполняется.
        I5: Изменение контракта отображается только в контракте; исторические записи
          contract_change не входят в замечания, их счётчики и действия
          исправления.
