        fact:
          id: sha256:f1b8d93daebe2514a0f7471d54dc351ec47074e2b534a4da1ed3d96bc535715c
          kind: file
          path: web/archiview/styles.css
          start_line: 1
          end_line: 386
          text: >
            /* Визуальная система ArchiView: навигационное дерево, документ и
            сравнение. */

            :root {
              font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
              color: #24332e;
              background: #f4f6f5;
              font-synthesis: none;
              --green: #207858;
              --green-dark: #195e45;
              --border: #e1e7e3;
              --muted: #53695c;
              --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
            }

            * { box-sizing: border-box; }

            [hidden] { display: none !important; }

            body { margin: 0; min-width: 360px; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; }

            button, input, select { font: inherit; }

            button, a, select { -webkit-tap-highlight-color: transparent; }

            button { cursor: pointer; }

            button:disabled { cursor: wait; opacity: .55; }

            button:focus-visible, a:focus-visible, input:focus-visible,
            select:focus-visible {
              outline: 3px solid #88c4a9; outline-offset: 3px;
            }

            svg { width: 18px; height: 18px; stroke: currentColor; stroke-width:
            1.6; flex: 0 0 auto; }

            .skip-link { position: fixed; top: -60px; left: 20px; z-index: 10;
            padding: 12px; background: white; }

            .skip-link:focus { top: 8px; }

            .topbar { height: 76px; flex-shrink: 0; background: #fff;
            border-bottom: 1px solid var(--border); display: flex; align-items:
            center; padding: 0 30px; gap: 28px; }

            /* Логотип с подписью, контекст проекта и выбор состояния составляют
            одну шапку. */

            .brand-group { display: grid; gap: 3px; flex: 0 0 auto; }

            .brand { display: flex; align-items: center; gap: 11px;
            text-decoration: none; color: #1c3e30; font-size: 23px;
            letter-spacing: -.9px; font-weight: 730; }

            .brand-mark { width: 34px; height: 34px; color: var(--green);
            stroke: none; }

            .brand-light { font-weight: 430; }

            .brand-caption { color: var(--muted); font-size: 10px; line-height:
            1.4; }

            .topbar-actions { display: flex; align-items: center; gap: 10px;
            margin-left: auto; }

            .project-context { display: flex; align-items: center; gap: 10px;
            min-width: 0; flex: 1; border-left: 1px solid var(--border);
            padding-left: 24px; }

            .live-dot { width: 6px; height: 6px; background: #5d9b7b;
            border-radius: 50%; display: inline-block; flex: 0 0 auto; }

            .button { display: inline-flex; align-items: center;
            justify-content: center; gap: 8px; min-height: 35px; padding: 7px
            13px; border-radius: 6px; border: 1px solid transparent; font-size:
            12px; font-weight: 550; white-space: nowrap; }

            .button-primary { background: var(--green); color: white;
            box-shadow: 0 1px 2px #17462b15; }

            .button-primary:hover { background: var(--green-dark); }

            .button-quiet { color: #52665a; background: white; border-color:
            var(--border); }

            .button-quiet:hover { background: #f3f7f4; border-color: #c8d6cc; }

            .button svg { width: 15px; height: 15px; }

            .is-loading svg { animation: rotate 1s linear infinite; }

            @keyframes rotate { to { transform: rotate(360deg); } }

            .project-heading { display: grid; gap: 3px; min-width: 0; }

            .project-heading strong { font-size: 13px; font-weight: 650;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

            .project-path { color: var(--muted); font-family: var(--mono);
            font-size: 10px; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }

            .comparison-picker { display: flex; min-width: 0; }

            .comparison-picker select { width: 300px; min-height: 35px; border:
            1px solid #dfe6e1; color: #435b4b; border-radius: 6px; background:
            #fafcfb; padding: 8px 28px 8px 10px; max-width: 100%; font-size:
            11px; }

            .app-shell { position: relative; display: grid;
            grid-template-columns: var(--tree-width, 420px) 8px minmax(0, 1fr);
            flex: 1; min-height: 0; }

            .sidebar { background: #f8faf8; display: flex; flex-direction:
            column; min-width: 0; min-height: 0; }

            /* Разделитель остаётся заметным и доступным с клавиатуры, не
            перекрывая содержимое панелей. */

            .tree-resizer { position: relative; cursor: col-resize;
            touch-action: none; background: #f0f4f1; border-inline: 1px solid
            var(--border); }

            .tree-resizer::after { content: ""; position: absolute; width: 2px;
            height: 38px; border-radius: 2px; background: #a4b9ac; left: 50%;
            top: 50%; transform: translate(-50%, -50%); }

            .tree-resizer:hover, .tree-resizer:focus-visible, .resizing-tree
            .tree-resizer { background: #dcece1; }

            .tree-resizer:focus-visible { outline: 2px solid var(--green);
            outline-offset: -2px; }

            .resizing-tree, .resizing-tree * { cursor: col-resize !important;
            user-select: none !important; }

            .sidebar-heading { display: flex; align-items: center;
            justify-content: space-between; padding: 25px 22px 19px; }

            .sidebar-heading h2 { margin: 0; font-size: 14px; font-weight: 650;
            letter-spacing: -.2px; }

            .count-pill { background: #eaf0eb; color: var(--muted);
            border-radius: 5px; font-size: 10px; padding: 2px 6px; }

            .search-field { margin: 0 18px 15px; background: white; border: 1px
            solid #e0e7e1; border-radius: 6px; height: 35px; display: flex;
            align-items: center; gap: 7px; padding: 0 9px; }

            .search-field svg { color: #a1ada5; width: 15px; height: 15px; }

            .search-field input { width: 100%; min-width: 0; font-size: 11px;
