    contract:
      schema_version: 1
      id: archiview-client
      title: Интерфейс ArchiView
      kind: module
      purpose: Давать навигацию по дереву модулей и показывать контракты, изменения и
        результаты архитектурных проверок.
      responsibilities:
        R1: Владеть поиском, фильтрами, выбором модуля и представлением его
          структурированного контракта.
        R2: Показывать разницу контрактов, состав файлов, историю проверок, две итоговые
          оценки, замечания и сохранённые доказательства.
      boundaries:
        B1: Снимки, статусы и вычисленное устаревание получает через API; семантические
          оценки берёт из выбранного отчёта.
      invariants:
        I1: initial, new, changed, removed и unchanged описывают изменения файлов, а не
          качество архитектуры.
        I2: Удалённые модули и исторические доказательства остаются доступны.
        I3: Отсутствие arch.yaml требует анализа и записи; module.md требует
          немедленного переноса.
        I4: Неполнота и устаревание видны рядом с выводами; содержимое документов не
          исполняется.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex принадлежит отдельному адаптеру. Извлечение
          символов, разрешение зависимостей и индексация AST принадлежат
          ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено настроенным корнем проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа размещаются отдельно от исходников.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-web
        section: boundaries
        id: B1
        text: Чтение проекта, вычисление изменений и хранение снимков принадлежат
          серверу.
      - module_id: architecture-web
        section: invariants
        id: I1
        text: Содержимое контрактов, отчётов и исходников отображается как данные.
      - module_id: architecture-web
        section: invariants
        id: I2
        text: Клиент не изменяет исходники и принятые границы ответственности.
