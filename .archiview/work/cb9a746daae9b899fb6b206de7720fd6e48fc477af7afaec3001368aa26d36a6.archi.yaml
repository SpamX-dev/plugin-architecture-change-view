              shape.setAttribute("d", side === "baseline" ? "M3 5a5 5 0 1 1-1 4M1 2v4h4M8 4v4l2 1" :
                "M4 1h5l3 3v11H4zM9 1v4h3M6 8h4M6 11h4");
              svg.append(shape);
