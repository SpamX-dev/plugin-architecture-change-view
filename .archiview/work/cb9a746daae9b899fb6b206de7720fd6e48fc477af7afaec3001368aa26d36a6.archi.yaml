                const row = (event.target instanceof Element ? event.target : null)?.closest<HTMLButtonElement>(".tree-row");
                if (!row) return;
                const rows = [...byId("tree").querySelectorAll<HTMLButtonElement>(".tree-row")].filter((node) => node.offsetParent);
