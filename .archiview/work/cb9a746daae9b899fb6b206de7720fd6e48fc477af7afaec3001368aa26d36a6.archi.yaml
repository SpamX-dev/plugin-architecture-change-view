                  <section class="module-heading">
                    <div><div class="module-title-row"><h1 id="module-title">Ответственность модулей</h1><span id="module-status"></span></div><p id="module-subtitle" class="module-subtitle">Выберите модуль в дереве слева</p></div>
                    <button id="copy-path" class="button button-quiet" type="button" disabled>Копировать путь</button>
