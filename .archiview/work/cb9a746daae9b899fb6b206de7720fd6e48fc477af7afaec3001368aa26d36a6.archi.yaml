            .freshness-card.stale, .freshness-card.unknown { background:
            #fffaf0; border-color: #e9ddbb; }

            .review-marker.unknown, .review-marker.not_reviewed { color:
            #8c8170; }

            .review-picker { width: 100%; margin: 0 0 18px; padding: 10px;
            border: 1px solid var(--border); background: white; color: #4c6655;
            border-radius: 6px; font-size: 11px; }

            .assessment-grid { display: grid; grid-template-columns: 1fr 1fr;
            gap: 14px; margin-bottom: 18px; }

            .assessment-card { border: 1px solid #dfe7e4; padding: 18px;
            border-radius: 7px; background: #f6f9f8; }

            .assessment-label { display: block; font-size: 10px; color: #687e71;
            margin-bottom: 11px; }

            .assessment-card strong { font-size: 16px; color: #456653;
            font-weight: 600; }

            .assessment-card p { font-size: 11px; line-height: 1.8; color:
            #61766a; margin: 9px 0 0; }

            .assessment-card.needs_review { background: #fffaf0; border-color:
            #e9ddbb; }

            .assessment-card.violation { background: #fff4f1; border-color:
            #efd7d1; }

            .coverage-note, .observed-note { border: 1px solid #e6e5d6;
            border-radius: 7px; padding: 15px 18px; font-size: 12px; color:
            #6c7156; background: #fcfcf7; margin-bottom: 18px; line-height: 1.8;
            }

            .coverage-note ul { padding-left: 20px; margin-bottom: 0; }

            .observed-note { background: #f7faf8; color: #526d5c; border-color:
            var(--border); }

            .finding-card, .check-card { border: 1px solid var(--border);
            border-radius: 7px; padding: 18px 20px; margin-bottom: 13px;
            background: #fff; }

            .finding-card.warning { border-left: 3px solid #c89d50;
            }.finding-card.error { border-left: 3px solid #bb6c5a; }

            .finding-meta { color: #7e887d; font-size: 10px; line-height: 1.7; }

            .finding-card h3 { font-size: 14px; color: #395944; line-height:
            1.6; margin: 8px 0; }

            .finding-card p, .check-card p { font-size: 12px; line-height: 1.75;
            color: #596f61; white-space: pre-line; }

            .check-heading { display: flex; gap: 12px; align-items: center;
            font-size: 10px; color: #7f8c83; }

            .verdict { background: #f0f3f1; color: #687e70; border-radius: 4px;
            padding: 4px 7px; }

            .verdict.violation { color: #9d5046; background: #fbeee9;
            }.verdict.consistent { color: #32754d; background: #edf6ef; }

            .evidence-links { display: flex; flex-wrap: wrap; gap: 8px; }

            .evidence-link { color: #47765a; background: #f3f8f5; border: 1px
            solid #dbe9e0; border-radius: 5px; font: 10px var(--mono); padding:
            6px 8px; overflow-wrap: anywhere; text-align: left; max-width: 100%;
            }

            .evidence-dialog { max-width: 1000px; width: calc(100vw - 50px);
            max-height: 85vh; }

            .evidence-heading { display: flex; justify-content: space-between;
            align-items: center; gap: 20px; font-size: 14px; }

            .evidence-origin { font: 11px var(--mono); overflow-wrap: anywhere;
            }

            .evidence-code { font: 12px/1.75 var(--mono); white-space: pre-wrap;
            overflow-wrap: anywhere; max-height: 60vh; overflow: auto;
            background: #f5f8f6; padding: 18px; color: #34513e; }

            @media (max-width: 800px) {
              .contract-header, .clause-section { padding: 20px; }.contract-header h2 { font-size: 20px; }
              .assessment-grid { grid-template-columns: 1fr; }.tabs { gap: 17px; }
              .tabs-row .document-version { display: none; }.review-toolbar-label { display: none; }
            }
