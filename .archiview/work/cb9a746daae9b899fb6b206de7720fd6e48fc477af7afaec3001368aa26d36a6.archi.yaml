                  <div class="tree-toolbar"><span>Структура проекта</span><button id="collapse" class="text-button" type="button">Свернуть</button></div>
                  <div id="tree" class="tree" role="tree" aria-label="Дерево модулей"><div class="loading-state">Читаем структуру проекта…</div></div>
