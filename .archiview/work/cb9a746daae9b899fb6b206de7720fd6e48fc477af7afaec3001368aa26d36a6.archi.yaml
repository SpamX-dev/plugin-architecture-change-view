    children:
      - module_id: archiview-module-presenter
        directory: web/web-ui/module-presenter
        contract:
          id: archiview-module-presenter
          kind: module
          purpose: Готовить карточку выбранного модуля, передавать правки её контракта в
            сессию выбранного репозитория и обновлять карточку после завершения
            запрошенного анализа.
          boundaries: {}
          invariants:
            I1: Пока открыта карточка того же модуля и среза, отслеживать отправленные
              запросы по requestId на любой её вкладке и при завершении заново
              запрашивать карточку.
        document_state: documented
      - module_id: archiview-view-model
        directory: web/web-ui/view-model
        contract:
          id: archiview-view-model
          kind: module
          purpose: Предоставлять общие данные веб-интерфейса, контракты действий и
            навигацию по сторонам сравнения.
          boundaries:
            B1: Сопоставлять удалённые модули с путями и предками базовой стороны сравнения.
          invariants: {}
        document_state: documented
      - module_id: archiview-views
        directory: web/web-ui/views
        contract:
          id: archiview-views
          kind: module
          purpose: Показывать дерево рабочей области и карточку модуля, передавать
            действия пользователя презентерам.
          boundaries:
            B1: Выводить текст контрактов, отчётов и исходных файлов как данные, включая
              содержащуюся в нём разметку.
          invariants: {}
        document_state: documented
      - module_id: archiview-web-api-client
        directory: web/web-ui/archiview-client
        contract:
          id: archiview-web-api-client
          kind: module
          purpose: Предоставлять презентерам доступ к операциям просмотра, редактирования
            контрактов и анализа выбранного репозитория через HTTP API
            веб-сервиса.
          boundaries: {}
          invariants: {}
        document_state: documented
      - module_id: archiview-workspace-presenter
        directory: web/web-ui/workspace-presenter
        contract:
          id: archiview-workspace-presenter
          kind: module
          purpose: Готовить дерево рабочей области для отображения, обрабатывать выбор
            проекта, снимка и модуля и предоставлять настройки выбранного
            проекта.
          boundaries:
            B1: Открывать дерево Git для навигации, как только получена структура, и
              добавлять статусы анализа по мере их загрузки.
          invariants: {}
        document_state: documented
