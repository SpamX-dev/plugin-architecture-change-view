            1.6; flex: 0 0 auto; }

            .skip-link { position: fixed; top: -60px; left: 20px; z-index: 10;
            padding: 12px; background: white; }

            .skip-link:focus { top: 8px; }

            .topbar { height: 76px; flex-shrink: 0; background: #fff;
            border-bottom: 1px solid var(--border); display: flex; align-items:
            center; padding: 0 30px; gap: 28px; }

            /* Логотип с подписью, контекст проекта и выбор состояния составляют
            одну шапку. */

            .brand-group { display: grid; gap: 3px; flex: 0 0 auto; }

            .brand { display: flex; align-items: center; gap: 11px;
            text-decoration: none; color: #1c3e30; font-size: 23px;
            letter-spacing: -.9px; font-weight: 730; }

            .brand-mark { width: 34px; height: 34px; color: var(--green);
            stroke: none; }

            .brand-light { font-weight: 430; }

            .brand-caption { color: #8b9690; font-size: 10px; line-height: 1.4;
            }

            .topbar-actions { display: flex; align-items: center; gap: 10px;
            margin-left: auto; }

            .project-context { display: flex; align-items: center; gap: 10px;
            min-width: 0; flex: 1; border-left: 1px solid var(--border);
            padding-left: 24px; }

            .live-dot { width: 6px; height: 6px; background: #5d9b7b;
