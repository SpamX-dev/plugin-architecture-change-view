              текущий результат. Публикации доступны в состоянии проекта,
              исторические версии хранятся в Git. Так выполняется часть обещания
              родителя о сохранённых результатах.
          - moduleId: archiview-project-location
            role: utility
            consumers: []
            task: Находить в рабочей папке репозитории и определять наличие карты ArchiView.
            assessment: Инвентаризация включает и репозитории без карты. Утилита даёт
              сведения для выбора проекта и ограничена его обнаружением.
              Контракты непосредственных детей не называют конкретного
              потребителя результата поиска.
          - moduleId: archiview-project-sources
            role: executor
            task: Читать файлы, карту и контракты репозитория, строить инвентаризацию и
              находить цепочку контрактов.
            assessment: Эта обязанность прямо выполняет обещание родителя предоставить
              доступ к файлам проекта. Она ограничена инвентаризацией одного
              репозитория и контекстом выбранного пути.
