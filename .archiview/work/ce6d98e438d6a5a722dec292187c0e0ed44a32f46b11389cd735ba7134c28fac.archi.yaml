    children:
      - module_id: archiview-git-changes
        directory: analyse/git-changes
        contract:
          id: archiview-git-changes
          kind: module
          purpose: Формировать, сохранять и читать отчёт о добавленных, изменённых и
            удалённых файлах между двумя состояниями репозитория.
          boundaries:
            B1: При сравнении с рабочим деревом учитывать новые файлы, которые Git ещё не
              отслеживает и не игнорирует.
          invariants:
            I1: Источники сравнения — коммиты, индекс и рабочее дерево одного
              Git-репозитория.
        document_state: documented
      - module_id: archiview-grasp
        directory: analyse/grasp
        contract:
          id: archiview-grasp
          kind: module
          purpose: Определять область и правила проверки согласованности контрактов в
            композиции модуля.
          boundaries:
            B1: Композиция охватывает выбранный модуль и его непосредственных детей.
          invariants: {}
        document_state: documented
      - module_id: archiview-implementation
        directory: analyse/implementation
        contract:
          id: archiview-implementation
          kind: module
          purpose: Определять область и правила проверки соответствия собственной
            реализации контракту модуля.
          boundaries: {}
          invariants: {}
        document_state: documented
      - module_id: archiview-module-relations
        directory: analyse/module-relations
        contract:
          id: archiview-module-relations
          kind: module
          purpose: Определять прямые связи модулей выбранного снимка по ссылкам на символы
            и сохранять места их использования.
          boundaries:
            B1: Учитывать связи между собственными файлами разных модулей выбранного
              репозитория.
            B2: Показывать ближайший модуль, указанный в импорте или реэкспорте исходного
              файла.
            B3: Поставляемый индексатор определяет связи исходников TypeScript и JavaScript.
          invariants:
            I1: Граф охватывает все исходники проекта на поддерживаемых индексатором языках
              и читается с привязкой к содержимому снимка.
        document_state: documented
      - module_id: archiview-module-review
        directory: analyse/module-review
        contract:
          id: archiview-module-review
          kind: module
          purpose: Готовить входные данные проверки модуля, сохранять проверенные отчёты и
            показывать актуальность результатов относительно выбранных снимков.
          boundaries:
            B1: Содержательная проверка относится к модулю и входным данным, указанным в её
              манифесте.
            B2: Повторный импорт того же результата сохраняет исходную запись проверки.
          invariants: {}
        document_state: documented
      - module_id: archiview-project-location
        directory: analyse/project
        contract:
          id: archiview-project-location
          kind: module
          purpose: Находить Git-репозитории в рабочей папке и определять наличие карты
            модулей ArchiView в каждом из них.
          boundaries:
            B5: Включать в результат каждый найденный репозиторий, в том числе при
              отсутствии в нём .archiview/modules.tree.
          invariants: {}
        document_state: documented
      - module_id: archiview-project-sources
        directory: analyse/project-sources
        contract:
          id: archiview-project-sources
          kind: module
          purpose: Читать принадлежащие репозиторию файлы, карту и контракты, составлять
            по ним инвентаризацию модулей рабочей папки и определять цепочку
            контрактов для выбранного пути.
          boundaries: {}
          invariants: {}
        document_state: documented
