          text: >
            schema_version: 1

            id: archiview-git-changes

            title: Git changes

            kind: module

            extensions:
              archiview.roles: [service]
            purpose: Формировать, сохранять и читать отчёт о добавленных,
            изменённых и удалённых файлах между двумя состояниями репозитория.

            boundaries:
              B1: При сравнении с рабочим деревом учитывать новые файлы, которые Git ещё не отслеживает и не игнорирует.
            invariants:
              I1: Источники сравнения — коммиты, индекс и рабочее дерево одного Git-репозитория.
          id: sha256:a1b17071d8ca09a34f4183db0a780b591ace528bee0577975f55fb7c86544561
        - kind: file
          path: .archiview/modules/archiview-grasp.yaml
          start_line: 1
          end_line: 9
          text: >
            schema_version: 1

            id: archiview-grasp

            title: GRASP

            kind: module

            purpose: Определять область и правила проверки согласованности
            контрактов в композиции модуля.

            boundaries:
              B1: Композиция охватывает выбранный модуль и его непосредственных детей.
            invariants: {}
