      extensions:
        archiview.grasp:
          - moduleId: archiview-git-changes
            role: executor
            task: Сравнивать два состояния Git-репозитория, сохранять и читать отчёт о
              добавленных, изменённых и удалённых файлах.
            assessment: I1 ограничивает пару состояний коммитами, индексом и рабочим деревом
              одного репозитория. B1 включает новые неигнорируемые файлы при
              сравнении с рабочим деревом. Результат описывает изменения файлов.
              Он дополняет граф связей и проверки модуля и имеет собственное
              правило выбора входов.
          - moduleId: archiview-grasp
            role: executor
            task: Задавать область и правила проверки согласованности контрактов в
              композиции.
            assessment: По B1 участники сравнения — выбранный модуль и его непосредственные
              дети. Проверка отвечает на вопрос, совместимы ли их контракты.
              Один и тот же контракт модуля служит также входом для проверки
              реализации, у которой свой предмет и критерии.
          - moduleId: archiview-implementation
            role: executor
            task: Задавать правила сопоставления собственной реализации с контрактом и
              выявлять участие модуля в циклах.
            assessment: B1 задаёт критерий цикла — замкнутая цепочка прямых связей одного
              снимка с местом использования для каждого перехода. Контракт
              archiview-module-relations даёт оба элемента для поддерживаемых
              исходников. Вывод об участии модуля в цикле относится к проверке
              реализации, а согласованность контрактов детей оценивает
              archiview-grasp.
          - moduleId: archiview-module-relations
            role: executor
            task: Строить граф прямых межмодульных связей выбранного снимка и сохранять
              места использования символов.
            assessment: Граф сам по себе является результатом анализа. B1 ограничивает рёбра
              собственными файлами разных модулей репозитория, B2 определяет
              ближайший модуль при импорте и реэкспорте. B3 указывает TypeScript
              и JavaScript для поставляемого индексатора. По I1 граф читается с
              привязкой к содержимому снимка. Его рёбра и места использования
              подходят для подтверждения циклов в archiview-implementation.
          - moduleId: archiview-module-review
            role: utility
            consumers:
              - archiview-grasp
              - archiview-implementation
            task: Готовить входы проверки модуля, сохранять проверенные отчёты и показывать
              их актуальность.
            assessment: Оба вида проверки модуля получают по назначению общий способ
              подготовки входов и учёта результатов. B1 связывает проверку с
              модулем и входами манифеста, B2 сохраняет исходную запись при
              повторном импорте. Этого достаточно для сопровождения отчётов.
              Критерии каждого вида проверки закреплены в контракте
              соответствующего исполнителя.
          - moduleId: archiview-project-location
            role: utility
            consumers: []
            task: Перечислять Git-репозитории рабочей папки и отмечать наличие карты
              модулей.
            assessment: B5 сохраняет в выдаче даже репозитории без карты, поэтому перечня
              достаточно для выбора репозитория и определения наличия карты.
              Чтение файлов и инвентаризация модулей закреплены за
              archiview-project-sources. Ему мог бы понадобиться этот перечень,
              но контракты не указывают получателя результата обнаружения.
          - moduleId: archiview-project-sources
            role: utility
            consumers:
              - archiview-module-review
            task: Читать файлы, карту и контракты репозитория, составлять перечень модулей и
              определять цепочку контрактов пути.
            assessment: Для подготовки входов проверки archiview-module-review нужны данные
              выбранного модуля. По назначению эта утилита предоставляет
              исходные файлы и контракты и связывает их с модулями. Этого
              достаточно для доступа к проектным данным. Глубину проверки задаёт
              её вид, поэтому доступ к цепочке контрактов сам по себе не
              расширяет область GRASP.
