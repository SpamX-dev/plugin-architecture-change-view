            purpose: Определять область и правила проверки соответствия
            собственной реализации контракту модуля.

            boundaries: {}

            invariants: {}
          id: sha256:e710bf048dfe152ff5ac10173426233a11d8f73ea5520bae5ae13577b5075fb8
        - kind: file
          path: .archiview/modules/archiview-module-relations.yaml
          start_line: 1
          end_line: 14
          text: >
            schema_version: 1

            id: archiview-module-relations

            title: Module relations

            kind: module

            extensions:
              archiview.roles: [service]
            purpose: Определять прямые связи модулей выбранного снимка по
            ссылкам на символы и сохранять места их использования.

            boundaries:
              B1: Учитывать связи между собственными файлами разных модулей выбранного репозитория.
              B2: Показывать ближайший модуль, указанный в импорте или реэкспорте исходного файла.
              B3: Поставляемый индексатор определяет связи исходников TypeScript и JavaScript.
            invariants:
              I1: Граф охватывает все исходники проекта на поддерживаемых индексатором языках и читается с привязкой к содержимому снимка.
          id: sha256:52be03793edf6a9038d13670d676faba2f7d5e8db5104be1a6d6c6dbdfe6a699
        - kind: file
          path: .archiview/modules/archiview-module-review.yaml
