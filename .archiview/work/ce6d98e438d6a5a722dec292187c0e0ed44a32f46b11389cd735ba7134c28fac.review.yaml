            role: executor
            task: Предоставить общую подготовку входов, сохранение и актуальность
              результатов проверки.
            assessment: Манифест фиксирует модуль и входы, повторная регистрация сохраняет
              исходную запись. Эти обязанности обеспечивают работу с
              результатами без смешения предметных видов анализа.
          - moduleId: archiview-project-location
            role: utility
            task: Обнаружить доступные репозитории и наличие карты модулей.
            assessment: Данные позволяют выбрать репозиторий для анализа. B5 сохраняет
              видимость проекта без карты. Какой из непосредственных модулей
              запрашивает результаты поиска, их контракты не устанавливают.
            consumers: []
