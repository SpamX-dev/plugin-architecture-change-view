            role: executor
            task: Определить правила сверки собственной реализации с контрактом.
            assessment: Его вход — собственная реализация. Такая постановка совместима с
              выделением проверки композиции в отдельный модуль.
          - moduleId: archiview-module-relations
            role: executor
            task: Определить прямые межмодульные связи и места использования.
            assessment: Один проектный снимок, ближайшая цель импорта и исходники TS/JS
              описывают самостоятельный предмет анализа.
          - moduleId: archiview-module-review
            role: utility
            task: Подготовить входы проверок и сохранить их результаты с привязкой к
              снимкам.
            assessment: Потребители — виды проверки модулей. B1 и B2 обеспечивают связь
              результата с входами и сохранение исходной записи при повторном
              импорте.
            consumers:
              - archiview-grasp
              - archiview-implementation
          - moduleId: archiview-project-location
            role: utility
            task: Найти репозитории рабочей папки и определить наличие карты.
            assessment: Даёт группе и инвентаризации перечень кандидатов, в том числе до
              создания карты.
            consumers:
              - archiview-analyse
              - archiview-project-sources
          - moduleId: archiview-project-sources
            role: utility
            task: Прочитать файлы и декларации выбранного проекта, определить его модули.
            assessment: Обеспечивает группе доступ к данным, предусмотренный назначением
              Analyse. Самостоятельный вид содержательной проверки за ним не
              закреплён.
            consumers:
              - archiview-analyse
