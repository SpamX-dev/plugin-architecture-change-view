          text: >
            import type { ProjectIdentity } from "../project-types/types.js";


            export function isProjectIdentity(value: unknown): value is
            ProjectIdentity {
              if (!value || typeof value !== "object") return false;
              const record = value as Record<string, unknown>;
              return record.schema_version === 1 && typeof record.snapshot_root === "string" &&
                record.snapshot_root.length > 0 && !record.snapshot_root.includes("\0") &&
                Object.keys(record).every(key => key === "schema_version" || key === "snapshot_root");
            }
      - index: 105
        fact:
          id: sha256:027f190a0effdadd822b52ed76c8c814916b6c81efcfa80286ec7a8b8a8639ef
          kind: file
          path: framework/project/paths.ts
          start_line: 1
          end_line: 30
          text: >
            import path from "node:path";

            import { STATE_DIRECTORY } from "./storage-paths.js";


            export { STATE_DIRECTORY };


            /** Metadata, dependencies and generated content are outside a
            source tree. */

            const EXCLUDED = new Set([
              STATE_DIRECTORY,
              ".git", ".hg", ".svn", "node_modules", "target", "dist", "build", "coverage",
              ".venv", "venv", "__pycache__", ".next", ".nuxt", ".cache", "obj",
            ]);


            export function excludedProjectPath(relative: string) {
              return relative.split(/[\\/]/).some(part => EXCLUDED.has(process.platform === "win32" ? part.toLowerCase() : part));
            }


            export function within(root: string, target: string) {
              const relative = path.relative(root, target);
              return relative === "" || (!path.isAbsolute(relative) && relative !== ".." && !relative.startsWith(".." + path.sep));
            }


            /** A repository stores its data under .archiview or in an external
            directory. */

            export function projectStateDirectory(root: string, directory =
            STATE_DIRECTORY) {
              const target = path.resolve(root, directory);
              if (within(root, target) && !within(path.join(root, STATE_DIRECTORY), target)) {
                throw new Error("State storage must be under .archiview or outside source project");
              }
              return target;
            }
      - index: 106
        fact:
          id: sha256:3da2d1714bab1d67ed2a386911419e000e8bef2a6dfe7ba88ac515e9ff31df0e
