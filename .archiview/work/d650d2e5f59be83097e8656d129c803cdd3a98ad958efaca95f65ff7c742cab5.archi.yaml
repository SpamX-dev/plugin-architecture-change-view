        text: >
          schema_version: 1

          id: dsh-adapter

          title: Плагин dsh

          kind: module

          extensions:
            archiview.roles: [host-adapter, web-endpoints]
          purpose: Предоставлять агенту DeepSeek Harness правила и контекст
          контрактов, а пользователю —
            панель ArchiView для проекта его чата.
          responsibilities:
            R1: Регистрировать в реестре инструментов dsh чтение инвентаризации и контекста каталогов,
              не добавляя данные панели в контекст модели.
            R2: Публиковать канонический скилл module-boundaries в реестре скиллов dsh из единственного
              файла пакета, без копий в пользовательских каталогах.
            R3: Отдавать браузерной половине шаблон панели и операции просмотра по префиксным маршрутам,
              проверяя каждый запрос политикой соединения хоста.
            R4: Держать сессии прикладного сервиса по корню проекта, разрешая корень по рабочему каталогу
              чата вкладки, и закрывать реестр при выгрузке плагина.
            R5: Передавать вкладке настроенный хостом префикс маршрутов панели.
          boundaries:
            B1: Для операций просмотра адаптер передаёт корень проекта и аргументы запроса прикладному сервису.
            B2: Хост и вкладка используют общий адрес веб-панели и идентификатор чата для привязки к проекту.
              Содержимое панели поступает из общего веб-интерфейса ArchiView.
            B3: Интеграция с dsh независима от MCP-сервера и панели Codex.
            B4: Адаптер работает с существующим проектом и получает его историю Git и отчёты через прикладной сервис.
          invariants:
            I1: Маршрут панели не запускает модель и не возвращает данные просмотра в контекст агента.
            I2: До проверки политики соединения запрос не читает проект и не создаёт сессию.
            I3: Корень вкладки задаётся рабочим каталогом из заголовка чата, прочитанного хостом. Для прямого
              просмотра действует настроенный корень или рабочий каталог процесса. URL может выбирать чат
              по идентификатору, но не задаёт путь проекта. Настроенный корень ограничивает чтение модельных инструментов.
            I4: Публикация скилла не создаёт второго источника текста — используется файл пакета.
            I5: Необязательные сервисы хоста (скиллы, хранилище и контроллер сессий) читаются только
              при наличии и не блокируют активацию плагина.
