          contract:
            id: archiview-application
            kind: module
            purpose: Предоставлять в сессии выбранного репозитория просмотр проекта,
              редактирование контрактов, анализ и настройку его автоматического
              запуска.
            boundaries:
              B3: Сессия работает с выбранным корнем проекта на протяжении своей жизни.
              B4: История, снимки и запросы анализа доступны только в контексте
                соответствующего репозитория.
              B5: Историческое представление использует выбранный снимок и сохраняет текущую
                публикацию.
              B6: Открытие сохранённого представления читает опубликованную пару и её
                доказательства без нового наблюдения рабочего дерева.
              B7: Сессия подтверждает завершение содержательной проверки только после импорта
                результата.
              B8: В поручение агенту не входит определение зависимостей модулей.
            invariants: {}
          children:
            - module_id: archiview-analysis-service
              directory: web/web-backend/analysis-service
              contract:
                id: archiview-analysis-service
                kind: module
                purpose: Показывать текущие потребности в анализе и исправлениях, готовить
                  поручения и принимать результаты анализа модулей.
                boundaries:
                  B1: Подтверждать завершение запроса только после появления проверенного отчёта с
                    ожидаемым reviewId.
                invariants:
                  I1: Для ручной отправки фиксировать входы анализа и использовать HostBridge
                    выбранного пользователем harness.
                  I2: Повторная доставка одного запроса в выбранный harness возвращает сохранённую
                    квитанцию без создания второго чата.
                  I3: При потере подтверждения от harness сохранять неопределённый статус
                    доставки.
                  I4: Скилл перед ответом агента и контроль при завершении хода используют один
                    список незавершённых анализов модулей, проверки связей и
                    открытых замечаний.
                  I5: Экспорт доказательств текущего анализа ограничен выбранным модулем и видом
                    проверки.
                  I6: Разбор связей актуален для проверенного графа SCIP и контрактов, а
                    доказательства замечаний принадлежат этому графу.
