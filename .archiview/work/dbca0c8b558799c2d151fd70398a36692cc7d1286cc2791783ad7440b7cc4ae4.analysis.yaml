                  B5: Допускать междоменный вызов API панели только с её токеном.
                invariants:
                  I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
              document_state: documented
            - module_id: archiview-node-runtime
              directory: web/web-backend/runtime
              contract:
