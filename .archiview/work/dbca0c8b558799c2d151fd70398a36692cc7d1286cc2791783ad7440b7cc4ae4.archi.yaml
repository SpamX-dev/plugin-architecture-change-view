                    this.timer ??= setTimeout(() => { this.timer = undefined; void this.flush(epoch); }, 75).unref();
                  });
                  watcher.on("error", () => { if (epoch === this.epoch) this.stop(); });
                  this.handles.push(watcher);
                }
              }

              private async flush(epoch: string) {
