    children:
      - module_id: archiview-analysis-service
        directory: web/web-backend/analysis-service
        contract:
          id: archiview-analysis-service
          kind: module
          purpose: Передавать в новый чат выбранного harness поручение на анализ снимка
            модуля или исправление сохранённого замечания, предоставлять статус
            доставки и результат анализа.
          boundaries:
            B1: Подтверждать завершение запроса только после появления проверенного отчёта с
              ожидаемым reviewId.
          invariants:
            I1: До доставки поручения фиксировать входные данные анализа и доставлять их
              через HostBridge выбранного пользователем harness.
            I2: Повторная доставка одного запроса в выбранный harness возвращает сохранённую
              квитанцию без создания второго чата.
            I3: При потере подтверждения от harness сохранять неопределённый статус
              доставки.
        document_state: documented
      - module_id: archiview-file-watcher
        directory: web/web-backend/file-watcher
        contract:
          id: archiview-file-watcher
          kind: module
          purpose: Предоставлять события об изменениях файловой системы.
          boundaries: {}
          invariants:
            I1: ОС Windows 11
            I2: ОС Linux
            I3: ОС Mac
        document_state: documented
      - module_id: archiview-host-bridge
        directory: web/web-backend/host-bridge
        contract:
          id: archiview-host-bridge
          kind: module
          purpose: Обнаруживать живые регистрации harness и передавать поручение
            выбранному экземпляру с подтверждением создания чата.
          boundaries: {}
          invariants: {}
        document_state: documented
      - module_id: archiview-http
        directory: web/web-backend/web-service
        contract:
          id: archiview-http
          kind: module
          purpose: Предоставлять HTTP-интерфейс для чтения и изменения данных проекта,
            запуска анализа и получения его результатов.
          boundaries:
            B3: При самостоятельном запуске принимать соединения только на локальном
              интерфейсе.
            B5: Допускать междоменный вызов API панели только с её токеном.
          invariants:
            I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
        document_state: documented
      - module_id: archiview-node-runtime
        directory: web/web-backend/runtime
        contract:
          id: archiview-node-runtime
          kind: module
          purpose: Находить ресурсы действующего пакета ArchiView и предоставлять
            диагностику ошибок Node.
          boundaries:
            B2: При поиске ресурсов использовать пакет запущенного ArchiView независимо от
              рабочей папки пользователя.
          invariants: {}
        document_state: documented
