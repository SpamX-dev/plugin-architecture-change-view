                  label: entry.revision === headRevision ? "HEAD" : "Revision " + entry.revision.slice(0, 7) })),
                  ...[...localChanges.values()].sort((a, b) => a.capturedAt.localeCompare(b.capturedAt) || a.sequence - b.sequence).map(metadata),
