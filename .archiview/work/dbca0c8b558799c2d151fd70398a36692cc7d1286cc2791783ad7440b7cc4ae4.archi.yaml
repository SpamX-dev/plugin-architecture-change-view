                const lines = part.value.split("\n");
                if (lines.at(-1) === "") lines.pop();
                for (const text of lines) rows.push({
                  kind: part.added ? "added" : part.removed ? "removed" : "same",
                  beforeLine: part.added ? null : oldLine++,
