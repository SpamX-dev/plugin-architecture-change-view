    contract:
      schema_version: 1
      id: archiview-application
      title: Прикладной сервис ArchiView
      kind: module
      extensions:
        archiview.roles:
          - domain
      purpose: Вести просмотр из общей рабочей папки и выполнять операции в контексте
        выбранного репозитория.
      responsibilities:
        R1: Вести сессию проекта с выбранной парой снимков.
        R2: Предоставлять дерево сравнения, карточки его модулей и хронологию состояний.
        R3: Подготавливать запрос анализа выбранной версии модуля.
        R6: Принимать результат для сохранённого запроса анализа.
        R7: Сохранять выбранный полный снимок как базу, оставляя открытое пользователем
          сравнение прежним.
        R4: Направлять операции общей рабочей папки в сессию соответствующего
          репозитория.
        R5: Уведомлять клиентов о необходимости сверки после изменений рабочего дерева
          или состояния Git.
        R8: Предоставлять текущее дерево изменений относительно HEAD с учётом новых
          файлов независимо от загрузки статусов проверок.
        R9: Сохранять правку пункта выбранного рабочего контракта и принимать отмену
          последнего удаления для соответствующей версии документа.
      boundaries:
        B3: Сессия работает с выбранным корнем проекта на протяжении своей жизни.
        B4: История, снимки и запросы анализа доступны только в контексте
          соответствующего репозитория.
        B5: Историческое представление использует выбранный снимок и сохраняет текущую
          публикацию.
        B6: Открытие сохранённого представления читает опубликованную пару и её
          доказательства без нового наблюдения рабочего дерева.
        B7: Сессия подтверждает завершение содержательной проверки только после импорта
          результата.
        B8: В поручение агенту не входит определение зависимостей модулей.
      invariants: {}
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Просмотр и подготовка анализа сохраняют исходники и согласованные
          контракты проекта без изменений.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: При подготовке контекста ArchiView не строит граф зависимостей по символам
          исходного кода.
      - module_id: architecture-change-view
        section: boundaries
        id: B3
        text: В общей рабочей папке ArchiView читает контракты и историю модуля в
          пределах репозитория, которому он принадлежит.
      - module_id: architecture-change-view
        section: boundaries
        id: B4
        text: Панель обращается к агенту только по явному поручению пользователя
          провести анализ или исправить замечание.
      - module_id: architecture-change-view
        section: boundaries
        id: B5
        text: Автоматическая проверка структуры может подтвердить наличие контракта и
          корректность формата, но не выполнение обязанностей.
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает встроенную панель Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает встроенную панель DeepSeek Harness.
      - module_id: architecture-change-view
        section: invariants
        id: I9
        text: Самостоятельный локальный запуск входит в обязательные варианты поставки
          приложения.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: При структурном сравнении фиксировать различия контрактов без
          автоматического вывода о нарушении ответственности.
      - module_id: architecture-core
        section: boundaries
        id: B6
        text: При обходе учитывать исходники только внутри выбранного корня, исключая
          зависимости, результаты сборки и служебные данные ArchiView.
      - module_id: architecture-core
        section: boundaries
        id: B7
        text: Записывать данные истории только в каталог ArchiView проекта либо в явно
          выбранное внешнее хранилище.
      - module_id: architecture-core
        section: boundaries
        id: B8
        text: Разрешать исторические доказательства по содержимому выбранных снимков.
