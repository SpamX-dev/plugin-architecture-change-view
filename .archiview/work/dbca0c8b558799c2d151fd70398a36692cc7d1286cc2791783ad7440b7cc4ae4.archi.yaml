          kind: module
          purpose: Задавать интерфейс передачи поручений в чат привязанной сессии с
            подтверждением доставки.
          boundaries: {}
          invariants: {}
        document_state: documented
      - module_id: archiview-http
        directory: web/web-backend/web-service
        contract:
          id: archiview-http
          kind: module
          purpose: Предоставлять HTTP-интерфейс для чтения и изменения данных проекта,
            запуска анализа и получения его результатов.
          boundaries:
            B3: При самостоятельном запуске принимать соединения только на локальном
              интерфейсе.
            B5: Допускать междоменный вызов API панели только с её токеном.
          invariants:
            I7: Для самостоятельного просмотра доступен локальный HTTP-интерфейс.
        document_state: documented
      - module_id: archiview-node-runtime
        directory: web/web-backend/runtime
        contract:
          id: archiview-node-runtime
          kind: module
          purpose: Находить ресурсы действующего пакета ArchiView и предоставлять
            диагностику ошибок Node.
          boundaries:
            B2: При поиске ресурсов использовать пакет запущенного ArchiView независимо от
              рабочей папки пользователя.
          invariants: {}
        document_state: documented
