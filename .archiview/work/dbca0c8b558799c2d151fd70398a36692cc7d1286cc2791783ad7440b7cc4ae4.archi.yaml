            "facts"> }) {
              const references = [...bundle.report.checks.flatMap((c) => c.evidence),
                ...bundle.report.findings.flatMap((f) => f.evidence),
                ...Object.values(bundle.report.observed).flatMap((o) => o?.responsibilities.flatMap((r) => r.evidence) ?? [])];
