            import type { ComparisonView, ModuleDetail, SessionOperations,
            ComparisonArgs, FileDiffArgs, ModuleArgs, SnapshotArgs } from
            "../../module-operations/api.js";

            import { fileDiff } from "../../module-operations/file-diff.js";

            import * as relations from "../../module-operations/relations.js";

            import type { Snapshot, GitRevision } from
            "../../framework/snapshots/types.js";

            import type { PublishedComparison } from
            "../../framework/static-report/types.js";

            import type { SessionView } from
            "../../module-operations/session-view.js";

