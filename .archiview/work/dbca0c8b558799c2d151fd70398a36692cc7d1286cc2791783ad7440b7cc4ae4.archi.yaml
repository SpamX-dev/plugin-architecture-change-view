    contract:
      schema_version: 1
      id: archiview-application
      title: web-backend
      kind: module
      extensions:
        archiview.roles:
          - backend
      purpose: Предоставлять в сессии выбранного репозитория просмотр проекта,
        редактирование контрактов и анализ.
      boundaries:
        B3: Сессия работает с выбранным корнем проекта на протяжении своей жизни.
        B4: История, снимки и запросы анализа доступны только в контексте
          соответствующего репозитория.
        B5: Историческое представление использует выбранный снимок и сохраняет текущую
          публикацию.
        B6: Открытие сохранённого представления читает опубликованную пару и её
          доказательства без нового наблюдения рабочего дерева.
        B7: Сессия подтверждает завершение содержательной проверки только после импорта
          результата.
        B8: В поручение агенту не входит определение зависимостей модулей.
      invariants: {}
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B6
        text: Не является IDE и не стремится заменить функционал IDE
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает интеграцию с Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает интеграцию с DeepSeek Harness.
      - module_id: architecture-change-view
        section: invariants
        id: I9
        text: Локальный запуск в браузере входит в обязательные варианты поставки
          приложения.
      - module_id: architecture-web
        section: boundaries
        id: B2
        text: Действия просмотра оставляют исходники и согласованные контракты без
          изменений.
      - module_id: architecture-web
        section: boundaries
        id: B3
        text: Интерфейс отображает полученные документы и исходники только как данные.
