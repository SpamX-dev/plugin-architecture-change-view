          id: archiview-application

          title: Прикладной сервис ArchiView

          kind: module

          extensions:
            archiview.roles: [domain]
          purpose: Вести просмотр из общей рабочей папки и выполнять операции в
          контексте выбранного репозитория.

          responsibilities:
            R1: Вести сессию проекта с выбранной парой снимков.
            R2: Предоставлять дерево сравнения, карточки его модулей и хронологию состояний.
            R3: Подготавливать запрос анализа выбранной версии модуля.
            R6: Принимать результат для сохранённого запроса анализа.
            R7: Сохранять выбранный полный снимок как базу, оставляя открытое пользователем сравнение прежним.
            R4: Направлять операции общей рабочей папки в сессию соответствующего репозитория.
            R5: Уведомлять клиентов о необходимости сверки после изменений рабочего дерева или состояния Git.
