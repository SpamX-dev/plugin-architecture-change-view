            const enumeration = (...values) => (v, at) => values.includes(v) ?
            undefined : fail(at, "допустимо: " + values.join(", "));

            const nullable = (check) => (v, at) => v === null ? undefined :
            check(v, at);

            const array = (check, min = 0) => (v, at) => {
              if (!Array.isArray(v) || v.length < min) fail(at, "ожидается массив, минимум " + min);
              v.forEach((item, i) => check(item, at + "[" + i + "]"));
