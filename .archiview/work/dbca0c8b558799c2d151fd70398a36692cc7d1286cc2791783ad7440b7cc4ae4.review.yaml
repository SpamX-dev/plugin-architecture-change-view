            export const REPORT_SCHEMA_VERSION = 2;

            const NORMALIZATION = "archiview/module-state/v1";

            const SEMANTIC_FIELDS = ["id", "kind", "purpose",
            "responsibilities", "boundaries", "invariants"];

            const compare = (a, b) => a < b ? -1 : a > b ? 1 : 0;

            const sorted = (values, key = (v) => canonical(v)) =>
            [...values].sort((a, b) => compare(key(a), key(b)));

