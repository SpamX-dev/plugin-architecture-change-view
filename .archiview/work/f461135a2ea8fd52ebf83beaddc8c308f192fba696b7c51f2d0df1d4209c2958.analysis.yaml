            snapshot: current
            module_id: archiview-module-review
            section: invariants
            id: I1
          subject: current
          verdict: consistent
          explanation: saveReview группирует входящие записи по slotKey и удаляет из
            текущей публикации прежнюю запись только заменяемого ключа. Файл
            модуля хранит results с единственным свойством для каждого
            присутствующего вида. При чтении ключ сверяется с reviewSlot.
          evidence:
            - snapshot: current
              fact_id: sha256:a5d89b8fde864581da2748856f66035316d982a2eadd26f3706a039c594161d8
        - id: check-6
          contract:
            snapshot: current
            module_id: archiview-module-review
            section: invariants
            id: I2
          subject: current
          verdict: consistent
          explanation: Сама публикация записывает текущее значение каждого вида. После
            вытеснения в служебной квитанции остаются идентификатор, отпечатки и
            порядок регистрации. Содержимое прежней зафиксированной публикации
            GitReviewArchive получает по SHA через ls-tree и cat-file из
