                return { mode, hash, stage, file: line.slice(tab + 1) };
              }).filter((item) => item.file.startsWith(".archiview/"));
              if (entries.some((entry) => entry.stage !== "0")) throw new Error("Unresolved Git index conflicts in ArchiView data");
