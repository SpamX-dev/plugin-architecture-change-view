            import type { Snapshot, SnapshotData } from
            "../../framework/snapshots/types.js";

            import { normalizeAnalysisType, type FreshnessReason, type Coverage,
            type ReviewBundle } from "../../framework/ai-report/types.js";

            import { analysisFingerprint, analysisModules } from
