          contract:
            id: archiview-module-review
            kind: module
            purpose: Готовить входные данные проверки модуля, сохранять проверенные отчёты и
              показывать актуальность результатов относительно выбранных
              снимков.
            boundaries:
              B1: Содержательная проверка относится к модулю и входным данным, указанным в её
                манифесте.
              B2: Повторный импорт того же результата сохраняет исходную запись проверки.
              B3: Опубликованные результаты анализа доступны из файлов модуля текущего формата
                для выбранного состояния проекта.
            invariants:
              I1: Для каждой пары модуля и вида анализа в рабочей публикации допускается не
                более одного результата.
              I2: История опубликованных результатов анализа хранится в Git.
