    contract:
      schema_version: 1
      id: archiview-module-review
      title: Module review
      kind: module
      extensions:
        archiview.roles:
          - service
      purpose: Готовить входные данные проверки модуля, сохранять проверенные отчёты и
        показывать актуальность результатов относительно выбранных снимков.
      boundaries:
        B1: Содержательная проверка относится к модулю и входным данным, указанным в её
          манифесте.
        B2: Повторный импорт того же результата сохраняет исходную запись проверки.
      invariants: {}
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B6
        text: Не является IDE и не стремится заменить функционал IDE
      - module_id: architecture-change-view
        section: invariants
        id: I10
        text: Приложение поддерживает интеграцию с Codex.
      - module_id: architecture-change-view
        section: invariants
        id: I11
        text: Приложение поддерживает интеграцию с DeepSeek Harness.
