            async function stamp(file: string, directory = false) {
              try {
                const info = await lstat(file, { bigint: true });
                if (directory ? !info.isDirectory() : !info.isFile()) throw new Error("Invalid published " + (directory ? "directory" : "file") + ": " + file);
