                const facts = fragments.flatMap((f) => f.facts).sort((a, b) => a.index - b.index);
                if (new Set(facts.map((f) => f.index)).size !== facts.length || facts.some((f, index) => f.index !== index)) throw new Error("Incomplete published snapshot facts");
