            import type { Snapshot, SnapshotData } from
            "../../framework/snapshots/types.js";

            import type { FreshnessReason, Coverage, ReviewBundle } from
            "../../framework/ai-report/types.js";

            import { analysisFingerprint, analysisModules } from
            "./analysis-scope.js";

            import { ANALYZER } from "./bundle.js";

            import { snapshotDigest } from
            "../../framework/snapshots/identity.js";

