            "./module-state.js";

            import { REPORT_SCHEMA_VERSION } from
            "../../framework/static-report/types.js";

            import { isSemanticReview } from "./review-identity.js";

            import { createInputs } from "./review-state.js";


            /** У прежнего пакета v1 актуальность относится к полной паре
            снимков. */

            export function reviewIsStale(bundle: ReviewBundle, before: Snapshot
            | null, after: Snapshot) {
              return (bundle.report.analysis.analyzer.name === ANALYZER.name && digest(bundle.report.analysis.analyzer) !== digest(ANALYZER)) ||
