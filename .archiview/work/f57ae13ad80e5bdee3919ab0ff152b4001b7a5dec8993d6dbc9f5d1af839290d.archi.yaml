              await rm(path.join(snapshotStore.directory, "reviews"), { recursive: true });
              assert.match((await store.list()).diagnostics.join("\n"), /reviews\/broken/);
              const file = path.join(store.work, moduleReportName("child") + ".archi.yaml");
