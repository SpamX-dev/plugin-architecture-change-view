            /** Только поля хостового API: наличие сообщений и projectId не
            определяют выбранную папку. */

            function hostData(root, folders = [root]) {
              return { chat: { thread: { id: "chat-1", cwd: root, projectId: null, hostId: "local" }, turns: [] },
                folders: { projects: folders.map((folder) => ({ projectKind: "local", hostId: "local", path: folder })) } };
            }


            /** Изолированный ответчик App Tools с запретом любых операций,
            кроме двух требуемых чтений. */

            function contextConnection(data, calls = []) {
              return () => ({
                async request(method, params) {
                  calls.push({ method, params });
                  if (method === "tools/list") return { tools: ["read_thread", "list_projects"].map((name) => ({ name, namespace: "codex_app" })) };
                  assert.equal(method, "tools/call");
                  assert.ok(["read_thread", "list_projects"].includes(params.tool));
                  const value = params.tool === "read_thread" ? data.chat : data.folders;
                  if (value instanceof Error) throw value;
                  return { success: true, contentItems: [{ type: "inputText", text: JSON.stringify(value) }] };
                },
                close() {},
              });
            }


            /** Данные и ошибки просмотра должны оставаться в UI-only
            метаданных. */

            function uiData(result) {
              assert.deepEqual(result.content, []); assert.equal(result.structuredContent, undefined);
              if (result.isError) throw Object.assign(new Error(result._meta.error.message), { code: result._meta.error.code });
