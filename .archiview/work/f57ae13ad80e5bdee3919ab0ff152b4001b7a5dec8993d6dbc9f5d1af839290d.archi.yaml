          text: >
            /** Проверки реального HTTP-контракта просмотра, удалённых модулей и
            снимков. */

            import assert from "node:assert/strict";

            import { once } from "node:events";

            import { mkdir, mkdtemp, rm, writeFile } from "node:fs/promises";

            import os from "node:os";

            import path from "node:path";

            import test from "node:test";

            import { createArchiView } from "../src/archiview/http.mjs";


            test("serves tree and historical documents; snapshot creation
            preserves selected baseline", async (t) => {
              const temporary = await mkdtemp(path.join(os.tmpdir(), "archiview-http-"));
              t.after(() => rm(temporary, { recursive: true, force: true }));
              const root = path.join(temporary, "project");
              await mkdir(path.join(root, "gone"), { recursive: true });
              await writeFile(path.join(root, "module.md"), "# Root responsibility");
              await writeFile(path.join(root, "gone/module.md"), "# Historical responsibility");
              await writeFile(path.join(root, "gone/code.js"), "export const old = true;");
              const { server } = await createArchiView({ root,
                stateDirectory: path.join(temporary, "snapshots") });
              server.listen(0, "127.0.0.1");
              await once(server, "listening");
              t.after(() => new Promise((resolve) => {
                server.closeAllConnections();
                server.close(resolve);
              }));
              const url = "http://127.0.0.1:" + server.address().port;
              const page = await fetch(url);
              assert.equal(page.status, 200);
              assert.ok((await page.text()).includes("ArchiView"));
              for (const asset of ["/app.mjs", "/review.mjs", "/styles.css"]) {
                assert.equal((await fetch(url + asset)).status, 200);
              }
              const first = await (await fetch(url + "/api/comparison")).json();
              await rm(path.join(root, "gone"), { recursive: true });
              const view = await (await fetch(url + "/api/comparison?baseline=" + first.before.id)).json();
              assert.equal(view.counts.removed, 1);
              const detail = await (await fetch(url + "/api/module?" + new URLSearchParams({
                view: view.id, path: "gone",
              }))).json();
              assert.equal(detail.before.document.text, "# Historical responsibility");
              assert.equal(detail.after, null);
              assert.ok(detail.diff.some((row) => row.kind === "removed"));
              const saved = await fetch(url + "/api/snapshots", { method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ view: view.id, label: "Review checkpoint" }) });
              assert.equal(saved.status, 201);
              const updated = await (await fetch(url + "/api/comparison?baseline=" + first.before.id)).json();
              assert.equal(updated.before.id, first.before.id);
              assert.ok(updated.baselines.some((entry) => entry.label === "Review checkpoint"));
              assert.equal((await fetch(url + "/api/module?view=invalid&path=gone")).status, 409);
              assert.equal((await fetch(url + "/api/module?" + new URLSearchParams({
                view: view.id, path: "../../private",
              }))).status, 404);
              assert.equal((await fetch(url + "/package.json")).status, 404);
              assert.equal((await fetch(url + "/api/snapshots", { method: "POST",
                headers: { Origin: "https://another-origin.invalid", "Content-Type": "application/json" },
                body: JSON.stringify({ view: view.id }) })).status, 403);
            });
      - index: 69
        fact:
          id: sha256:45435e68dfe6fcc5ff1131c62079005f1fb82e9af200fb2a7559aacb7bdf8a4d
          kind: file
          path: test/change-history-loading.test.mjs
          start_line: 1
          end_line: 103
          text: >
            /** История после наблюдения берётся из того же проверенного чтения
            без потери событий. */

            import assert from "node:assert/strict";

            import { execFile } from "node:child_process";

            import { mkdir, mkdtemp, readFile, rm, writeFile } from
            "node:fs/promises";

            import os from "node:os";

            import path from "node:path";

            import test from "node:test";

            import { promisify } from "node:util";

            import { stringify } from "yaml";

            import { ChangeHistory } from "../src/change-history.mjs";

            import { SnapshotStore } from "../src/snapshot-store.mjs";

            import { captureGitHead, captureWorkingTree } from
            "../src/snapshots.mjs";


            const run = promisify(execFile);

            const stored = (value) => JSON.parse(JSON.stringify(value));


            /** Изолированный проект создаёт настоящие снимки; его данные
            удаляются вместе с фикстурой. */

            async function fixture(t, useGit = false) {
              const directory = await mkdtemp(path.join(os.tmpdir(), "archiview-history-loading-"));
              t.after(() => rm(directory, { recursive: true, force: true }));
              const root = path.join(directory, "source");
              await mkdir(root);
              await writeFile(path.join(root, "arch.yaml"), stringify({ schema_version: 1, id: "root", title: "Root", kind: "module",
                purpose: "Читать записи.", responsibilities: { R1: "Читать записи." }, boundaries: {}, invariants: {} }));
              const edit = (value) => writeFile(path.join(root, "code.js"), "export const value = " + value + ";\n");
              await edit(0);
              const git = async (...args) => (await run("git", args, { cwd: root, windowsHide: true })).stdout.trim();
              const commit = async () => {
                await git("add", "arch.yaml", "code.js");
                await git("-c", "user.name=ArchiView Test", "-c", "user.email=archiview@example.invalid", "commit", "--quiet", "-m", "Snapshot");
                return captureGitHead(root);
              };
              if (useGit) await git("init", "--quiet", "--initial-branch=main");
              return { root, edit, commit, history: new ChangeHistory(new SnapshotStore(root)) };
            }


            test("observe includes the newly appended event and returns the same
            history for a duplicate", async (t) => {
              const { root, edit, history } = await fixture(t);
              for (const value of [0, 1, 2]) {
                await edit(value);
                const current = await captureWorkingTree(root);
                const observed = await history.observe(current, null, { includeHistory: true });
                assert.equal(observed.created, true);
                assert.equal(observed.history.changes.at(-1).id, observed.record.id);
                assert.deepEqual(stored(observed.history), await history.list(null));
                const duplicate = await history.observe(current, null, { includeHistory: true });
                assert.equal(duplicate.created, false);
                assert.deepEqual(stored(duplicate.history), await history.list(null));
                assert.deepEqual(duplicate.history.changes.map((record) => record.sequence), Array.from({ length: value + 1 }, (_, i) => i + 1));
              }
              const ordinary = await history.observe(await captureWorkingTree(root));
              assert.deepEqual(Object.keys(ordinary).sort(), ["created", "record"]);
            });


            test("clean and changed HEAD observations include exactly the
            history anchored to that revision", async (t) => {
              const { root, edit, commit, history } = await fixture(t, true);
              const firstHead = await commit();
              const clean = await history.observe(await captureWorkingTree(root), firstHead, { includeHistory: true });
              assert.equal(clean.record, null);
              assert.equal(clean.created, false);
              assert.deepEqual(clean.history, await history.list(firstHead.revision));
              assert.equal(clean.history.changes.length, 0);

              await edit(1);
              const changed = await history.observe(await captureWorkingTree(root), firstHead, { includeHistory: true });
              assert.equal(changed.created, true);
              assert.deepEqual(stored(changed.history), await history.list(firstHead.revision));

              await edit(0);
              const returned = await history.observe(await captureWorkingTree(root), firstHead, { includeHistory: true });
              assert.equal(returned.created, true);
              assert.equal(returned.history.changes.length, 2);
              assert.deepEqual(stored(returned.history), await history.list(firstHead.revision));

              await edit(2);
              const secondHead = await commit();
              const next = await history.observe(await captureWorkingTree(root), secondHead, { includeHistory: true });
              assert.equal(next.created, false);
              assert.deepEqual(next.history, await history.list(secondHead.revision));
              assert.equal(next.history.changes.length, 0);
              assert.equal((await history.list(firstHead.revision)).changes.length, 2);
            });


            test("observe rereads external changes and refuses corrupted history
            even for unchanged input", async (t) => {
              const { root, edit, history } = await fixture(t);
              const first = await captureWorkingTree(root);
              await history.observe(first, null, { includeHistory: true });
              await edit(1);
              const current = await captureWorkingTree(root);
              const second = new ChangeHistory(new SnapshotStore(root));
              const external = await second.observe(current);
              const observed = await history.observe(current, null, { includeHistory: true });
              assert.equal(observed.created, false);
              assert.equal(observed.history.changes.length, 2);
              assert.equal(observed.history.changes.at(-1).id, external.record.id);

              const file = path.join(history.directory, external.record.id + ".yaml");
              const text = await readFile(file, "utf8");
              await writeFile(file, text.replace("sequence: 2", "sequence: 9"));
              await assert.rejects(history.observe(current, null, { includeHistory: true }), /Change history is damaged; refusing to append/);
              assert.match((await history.list(null)).diagnostics.join("\n"), /record digest mismatch/);
            });
      - index: 70
        fact:
          id: sha256:eed5d9327103c7dea85ff9add58c5ad3954aae244087c0584d83d4857514f5d1
          kind: file
          path: test/change-history.test.mjs
          start_line: 1
          end_line: 178
          text: >
            /** Реальные Git revision и неизменяемые наблюдения рабочего дерева
            между коммитами. */

            import assert from "node:assert/strict";

            import { execFile } from "node:child_process";

            import { mkdir, mkdtemp, readFile, readdir, rm, writeFile } from
            "node:fs/promises";

            import os from "node:os";

            import path from "node:path";

            import test from "node:test";

            import { promisify } from "node:util";

            import { stringify } from "yaml";

            import { ChangeHistory } from "../src/change-history.mjs";

            import { SnapshotStore } from "../src/snapshot-store.mjs";

            import { captureGitHead, captureWorkingTree, listGitRevisions } from
            "../src/snapshots.mjs";


            const run = promisify(execFile);

            const stored = (value) => JSON.parse(JSON.stringify(value));


            /** Каждый сценарий создаёт собственный проект; Git получает только
            тестовую identity. */

            async function fixture(t, useGit = true) {
              const directory = await mkdtemp(path.join(os.tmpdir(), "archiview-change-history-"));
              t.after(() => rm(directory, { recursive: true, force: true }));
              const root = path.join(directory, "source");
              await mkdir(root);
              await writeFile(path.join(root, "arch.yaml"), stringify({ schema_version: 1, id: "root", title: "Root", kind: "module",
                purpose: "Читать записи.", responsibilities: { R1: "Читать записи." }, boundaries: {}, invariants: {} }));
              await writeFile(path.join(root, "code.js"), "export const read = () => 0;\n");
              const git = async (...args) => (await run("git", args, { cwd: root, windowsHide: true })).stdout.trim();
              const commit = async (subject) => {
                await git("add", "arch.yaml", "code.js");
                await git("-c", "user.name=ArchiView Test", "-c", "user.email=archiview@example.invalid", "commit", "--quiet", "-m", subject);
                return git("rev-parse", "HEAD");
              };
              if (useGit) await git("init", "--quiet", "--initial-branch=main");
              const snapshotStore = new SnapshotStore(root);
              const history = new ChangeHistory(snapshotStore);
              return { directory, root, snapshotStore, history, git, commit };
            }


            test("Git metadata pages expose the entire first-parent line and
            load selected commits exactly", async (t) => {
              const { root, commit } = await fixture(t);
              const revisions = [];
              for (let index = 0; index < 4; index++) {
                await writeFile(path.join(root, "code.js"), "export const read = () => " + index + ";\n");
                revisions.push(await commit("Revision " + index));
              }
              const newest = await listGitRevisions(root, { limit: 2 });
              assert.deepEqual(newest.revisions.map((entry) => entry.revision), revisions.slice(2));
              assert.equal(newest.hasMore, true);
              assert.equal(newest.nextBefore, revisions[2]);
              assert.equal(newest.headRevision, revisions[3]);
              assert.equal(newest.revisions[1].isHead, true);
              assert.equal(newest.revisions[0].parentRevision, revisions[1]);
              const older = await listGitRevisions(root, { limit: 2, before: newest.nextBefore });
              assert.deepEqual(older.revisions.map((entry) => entry.revision), revisions.slice(0, 2));
              assert.equal(older.hasMore, false);
              assert.equal(older.revisions[0].parentRevision, null);
              assert.equal(older.revisions.some((entry) => entry.isHead), false);
              assert.deepEqual((await listGitRevisions(root, { before: revisions[0] })).revisions, []);
              const selected = await captureGitHead(root, { revision: revisions[1] });
              assert.equal(selected.facts.find((fact) => fact.path === "code.js").text, "export const read = () => 1;\n");
              await assert.rejects(listGitRevisions(root, { before: "--all" }), /Invalid Git revision cursor/);
            });


            test("Git first-parent history excludes side commits while
            preserving merge parent metadata", async (t) => {
              const { root, git, commit } = await fixture(t);
              const initial = await commit("Initial");
              await git("checkout", "--quiet", "-b", "side");
              await writeFile(path.join(root, "side.js"), "export const side = true;\n");
              await git("add", "side.js");
              await git("-c", "user.name=ArchiView Test", "-c", "user.email=archiview@example.invalid", "commit", "--quiet", "-m", "Side");
              const side = await git("rev-parse", "HEAD");
              await git("checkout", "--quiet", "main");
              await writeFile(path.join(root, "code.js"), "export const read = () => 1;\n");
              const main = await commit("Main");
              await git("-c", "user.name=ArchiView Test", "-c", "user.email=archiview@example.invalid", "merge", "--quiet", "--no-ff", "side", "-m", "Merge");
              const result = await listGitRevisions(root);
              assert.deepEqual(result.revisions.slice(0, 2).map((entry) => entry.revision), [initial, main]);
              assert.equal(result.revisions.some((entry) => entry.revision === side), false);
              assert.equal(result.revisions.at(-1).parentRevision, main);
              await assert.rejects(listGitRevisions(root, { before: side }), /outside the current first-parent history/);
            });


            test("non-Git and unborn repositories expose no invented revisions",
            async (t) => {
              const plain = await fixture(t, false);
              assert.deepEqual((await listGitRevisions(plain.root)).revisions, []);
              const unborn = await fixture(t, true);
              assert.equal((await listGitRevisions(unborn.root)).headRevision, null);
            });


            test("clean HEAD adds no point; consecutive duplicates collapse and
            A to B to A remains exact", async (t) => {
              const { root, snapshotStore, history, commit } = await fixture(t);
              const revision = await commit("Initial");
              const head = await captureGitHead(root);
              assert.equal((await history.observe(await captureWorkingTree(root), head)).created, false);
              assert.equal((await history.list(revision)).changes.length, 0);
              const records = [];
              for (const value of [1, 2, 1]) {
                await writeFile(path.join(root, "code.js"), "export const read = () => " + value + ";\n");
                const snapshot = await captureWorkingTree(root);
                const observed = await history.observe(snapshot, head);
                assert.equal(observed.created, true);
                records.push(observed.record);
                assert.equal((await history.observe(snapshot, head)).created, false);
              }
              assert.deepEqual((await history.list(revision)).changes.map((record) => record.id), records.map((record) => record.id));
              assert.equal(new Set(records.map((record) => record.id)).size, 3);
              assert.equal(records[0].digest, records[2].digest);
              assert.deepEqual(await history.get(records[0].id), stored(records[0]));
              assert.equal(records[0].baseRevision, revision);
              assert.equal(records[0].originalId.startsWith("working-"), true);
              const second = new ChangeHistory(new SnapshotStore(snapshotStore.root));
              assert.equal((await second.observe(await captureWorkingTree(root), head)).created, false);
              assert.equal((await second.list()).changes.length, 3);
            });


            test("returning dirty to clean records an event; a new clean HEAD
            does not relabel old events", async (t) => {
              const { root, history, commit } = await fixture(t);
              const firstRevision = await commit("Initial");
              const firstHead = await captureGitHead(root);
              await history.observe(await captureWorkingTree(root), firstHead);
              await writeFile(path.join(root, "code.js"), "export const read = () => 1;\n");
              await history.observe(await captureWorkingTree(root), firstHead);
              await writeFile(path.join(root, "code.js"), "export const read = () => 0;\n");
              assert.equal((await history.observe(await captureWorkingTree(root), firstHead)).created, true);
              await writeFile(path.join(root, "code.js"), "export const read = () => 2;\n");
              const secondRevision = await commit("Second");
              assert.equal((await history.observe(await captureWorkingTree(root), await captureGitHead(root))).created, false);
              assert.equal((await history.list(firstRevision)).changes.length, 2);
              assert.equal((await history.list(secondRevision)).changes.length, 0);
            });


            test("non-Git initial observation becomes a baseline and
            incomplete/corrupt input is rejected", async (t) => {
              const { root, history } = await fixture(t, false);
              const first = await captureWorkingTree(root);
              const observed = await history.observe(first, null);
              assert.equal(observed.created, true);
              assert.equal(observed.record.baseRevision, null);
              assert.equal((await history.observe(first, null)).created, false);
              await assert.rejects(history.observe({ ...first, complete: false }, null), /Invalid or incomplete change snapshot/);
              const file = path.join(history.directory, observed.record.id + ".yaml");
              const original = await readFile(file, "utf8");
              await writeFile(file, original.replace("sequence: 1", "sequence: 2"));
              assert.match((await history.list()).diagnostics.join("\n"), /record digest mismatch/);
              await assert.rejects(history.observe(first, null), /refusing to append/);
            });


            test("late import is idempotent, preserves exact provenance and
            cannot rewind the current cursor", async (t) => {
              const { root, history, commit } = await fixture(t);
              const revision = await commit("Initial");
              const head = await captureGitHead(root);
              const snapshots = [];
              for (const value of [1, 2, 3]) {
                await writeFile(path.join(root, "code.js"), "export const read = () => " + value + ";\n");
                snapshots.push(await captureWorkingTree(root));
              }
              await history.observe(snapshots[2], head);
              const imported = await history.importSnapshots(snapshots.slice(0, 2), { baseRevision: revision, source: "verified-raw-publications" });
              assert.equal(imported.imported, 2);
              assert.equal((await history.importSnapshots(snapshots.slice(0, 2), { baseRevision: revision, source: "verified-raw-publications" })).imported, 0);
              assert.equal((await history.observe(snapshots[2], head)).created, false);
              const result = await history.list(revision);
              assert.deepEqual(result.changes.map((record) => record.digest), snapshots.map((snapshot) => snapshot.digest));
              assert.deepEqual(result.changes.map((record) => record.capturedAt), snapshots.map((snapshot) => snapshot.capturedAt));
              assert.equal(imported.changes[0].originalId, snapshots[0].id);
              assert.equal(imported.changes[0].provenance.source, "verified-raw-publications");
            });


            test("simultaneous observations append once and a missing cursor
            recovers without phantom changes", async (t) => {
              const { root, snapshotStore, history } = await fixture(t, false);
              const second = new ChangeHistory(new SnapshotStore(snapshotStore.root));
              const snapshot = await captureWorkingTree(root);
              const results = await Promise.all([history.observe(snapshot), second.observe(snapshot)]);
              assert.equal(results.filter((entry) => entry.created).length, 1);
              await rm(path.join(history.directory, ".cursor.yaml"));
              assert.equal((await history.observe(snapshot)).created, false);
              assert.equal((await history.list()).changes.length, 1);
              assert.equal((await readdir(history.directory)).some((name) => name.startsWith(".pending-") || name === ".lock"), false);
            });
