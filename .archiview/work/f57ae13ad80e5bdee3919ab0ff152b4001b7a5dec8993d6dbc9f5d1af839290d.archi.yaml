    contract:
      schema_version: 1
      id: architecture-tests
      title: Проверки контрактов и просмотра
      kind: module
      purpose: Проверять наблюдаемый контракт MCP, форматы архитектурных данных,
        снимки, доказательства и локальный HTTP-интерфейс ArchiView.
      responsibilities:
        R1: Проверять покрытие каталогов, цепочки ограничений, валидацию схем, статусы и
          перемещения модулей.
        R2: Проверять неизменность истории, разрешение доказательств, устаревание и
          границы файловой области.
        R3: Проверять реальные stdio- и HTTP-сценарии на изолированных проектах.
        R4: Проверять авторизацию панели, привязку анализа к неизменяемым входам и
          доставку запроса агенту без подмены анализа структурной проверкой.
          Проверять точную ссылку поручения исправления на сохранённую попытку и
          замечание.
        R5: Проверять перенос ZIP-пакета Codex и запуск установленного плагина со
          встроенным Node в изолированном профиле без системного Node и npm в
          PATH.
        R6: Проверять сборку и перенос пакета dsh — сборщик пишет только в dist, точки
          входа опубликованного пакета разрешаются, а перенесённый CLI
          запускается без node_modules.
      boundaries:
        B1: Тесты не подменяют содержательный анализ пользовательской ответственности
          эвристикой.
      invariants:
        I1: Используются временные проекты, принадлежащие тестам внутренние или внешние
          хранилища и отдельные порты. Переносимость проверяется на копиях в
          другом файловом корне.
        I2: Неполный результат и повреждённые данные обнаруживаются явно; рабочие
          исходники не изменяются проверками.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным
          адаптерам. Извлечение символов, разрешение зависимостей и индексация
          AST принадлежат ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено настроенным корнем проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
