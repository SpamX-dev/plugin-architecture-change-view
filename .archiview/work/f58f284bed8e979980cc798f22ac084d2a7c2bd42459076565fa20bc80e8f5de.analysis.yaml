          text: >
            import net from "node:net";

            import { randomUUID } from "node:crypto";

            import path from "node:path";

            import type { Adapter, ProjectTarget } from
            "../../web/web-backend/host-bridge/channel.js";


            type Data = Record<string, unknown>;

            function object(value: unknown): Data {
              if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error("Некорректный ответ Codex Desktop");
              return value as Data;
            }


            /** Codex Desktop's local App Tools transport uses length-prefixed
            JSON-RPC frames. */

            async function rpc(pipe: string, method: string, params: Data) {
              const payload = Buffer.from(JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }));
              const prefix = Buffer.alloc(4);
              prefix.writeUInt32LE(payload.length);
              const socket = net.createConnection(pipe);
              try {
                return await new Promise<Data>((resolve, reject) => {
                  socket.setTimeout(method === "tools/list" ? 2500 : 45000, () => socket.destroy(new Error("Codex Desktop не ответил")));
                  socket.once("connect", () => socket.write(Buffer.concat([prefix, payload])));
                  socket.once("error", reject);
                  socket.once("close", () => reject(new Error("Соединение с Codex Desktop закрыто")));
                  let buffer = Buffer.alloc(0);
                  socket.on("data", chunk => {
                    try {
                      buffer = Buffer.concat([buffer, typeof chunk === "string" ? Buffer.from(chunk) : chunk]);
                      if (buffer.length < 4) return;
                      const size = buffer.readUInt32LE();
                      if (size > 8 * 1024 * 1024) throw new Error("Слишком большой ответ Codex Desktop");
                      if (buffer.length < 4 + size) return;
                      const response = object(JSON.parse(buffer.toString("utf8", 4, 4 + size)));
                      if (response.error) throw new Error(String(object(response.error).message));
                      resolve(object(response.result));
                    } catch (error) { reject(error); }
                  });
                });
              } finally { socket.destroy(); }
            }


            export async function desktopStatus(pipe: string): Promise<"ready" |
            "unresponsive" | "disconnected"> {
              try {
                await rpc(pipe, "tools/list", { threadStartKind: "all" });
                return "ready";
              } catch (error) {
                const code = (error as NodeJS.ErrnoException).code;
                return code === "ENOENT" || code === "ECONNREFUSED" ? "disconnected" : "unresponsive";
              }
            }


            export function codexAdapter(pipe: string, context: () => {
            threadId?: string; hostId?: string } | Promise<{ threadId?: string;
            hostId?: string }>, transport = rpc): Adapter {
              async function tool(name: "list_projects" | "create_thread", args: Data) {
                const result = await transport(pipe, "tools/call", { ...await context(), tool: name, arguments: args,
                  namespace: "codex_app", callerSource: "codex", callId: randomUUID(), turnId: "archiview-" + randomUUID() });
                const items = Array.isArray(result.contentItems) ? result.contentItems.map(object) : [];
                const text = items.find(item => item.type === "inputText")?.text;
                if (result.success !== true || typeof text !== "string") throw new Error(typeof text === "string" ? text : "Codex отклонил " + name);
                return object(JSON.parse(text));
              }
              async function project(target: ProjectTarget) {
                const result = await tool("list_projects", {});
                const hostId = (await context()).hostId || "local";
                const projects = Array.isArray(result.projects) ? result.projects.map(object) : [];
                for (const root of [target.repositoryRoot, target.workspaceRoot]) {
                  const found = projects.find(p => p.projectKind === "local" && p.hostId === hostId &&
                    typeof p.path === "string" && path.relative(p.path, root) === "");
                  if (typeof found?.projectId === "string") return found.projectId;
                }
              }
              const missingProject = "Добавьте репозиторий или рабочую папку ArchiView в проекты Codex";
              return {
                kind: "codex", instance: pipe,
                async available(target) {
                  const catalogue = await transport(pipe, "tools/list", { threadStartKind: "all" });
                  const tools = Array.isArray(catalogue.tools) ? catalogue.tools.map(object) : [];
                  if (!tools.some(t => t.namespace === "codex_app" && t.name === "create_thread")) throw new Error("Создание чатов недоступно");
                  if (!(await context()).threadId) return "В чате Codex вызовите archiview_connect";
                  return (await project(target)) ? undefined : missingProject;
                },
                async start(job) {
                  const projectId = await project(job);
                  if (!projectId) throw new Error(missingProject);
                  const value = await tool("create_thread", { target: { type: "project", projectId, environment: { type: "local" } },
                    title: "ArchiView · " + job.moduleId, prompt: job.prompt });
                  if (typeof value.threadId !== "string") throw new Error("Codex не подтвердил идентификатор созданного чата");
                  return value.threadId;
                },
              };
            }
        - id: sha256:71617a144447ff7ca35ea0568827c6beefb84449c6bf38e7d053759b65c52311
          kind: file
          path: bridges/codex/server.ts
          start_line: 1
          end_line: 89
          text: >
            import { fork } from "node:child_process";

            import { fileURLToPath } from "node:url";

            import { createInterface } from "node:readline";

            import { setTimeout as delay } from "node:timers/promises";

            import { harnessInstanceId, listHarnesses, registerHarness } from
            "../../web/web-backend/host-bridge/channel.js";

            import { codexAdapter, desktopStatus } from "./host.js";

            import { callerThread, desktopBinding } from "./context.js";


            /** The host owns this MCP process. Registration ends when its stdio
            transport closes. */

            const pipe = process.env.CODEX_APP_TOOLS_PIPE_PATH;

            const environment = { threadId: process.env.CODEX_THREAD_ID, hostId:
            process.env.CODEX_APP_TOOLS_CALLER_HOST_ID };

            const binding = pipe && desktopBinding(pipe, environment);

            if (process.argv.includes("--connect")) {
              if (!binding || !environment.threadId) throw new Error("Выполните --connect из локального чата Codex Desktop");
              if (await desktopStatus(pipe!) !== "ready") throw new Error("Codex Desktop недоступен");
              await binding.connect(environment.threadId);
              const target = { workspaceRoot: process.cwd(), repositoryRoot: process.cwd() };
              if (!(await listHarnesses(target)).harnesses.some(host => host.id === harnessInstanceId("codex", pipe!))) {
                // An already open chat can still have its previous MCP catalogue after installation.
                const child = fork(fileURLToPath(import.meta.url), ["--desktop-worker"], {
                  detached: true, windowsHide: true, stdio: ["ignore", "ignore", "ignore", "ipc"],
                });
                try {
                  await new Promise<void>((resolve, reject) => {
                    const timeout = setTimeout(() => reject(new Error("Истекло время подключения ArchiView")), 10000);
                    child.once("message", () => { clearTimeout(timeout); resolve(); });
                    child.once("error", error => { clearTimeout(timeout); reject(error); });
                    child.once("exit", () => { clearTimeout(timeout); reject(new Error("Мост Codex завершился при запуске")); });
                  });
                } catch (error) { child.kill(); throw error; }
                if (child.connected) child.disconnect();
                child.unref();
              }
              process.stdout.write("ArchiView подключён к Codex Desktop.\n");
              process.exit(0);
            }

            if (process.argv.includes("--desktop-worker")) {
              if (!pipe || !binding) throw new Error("Нет канала Codex Desktop");
              const close = await registerHarness(codexAdapter(pipe, binding.read));
              process.send?.("ready");
              let missingProbes = 0;
              while (missingProbes < 2) {
                await delay(15000, undefined, { ref: false });
                missingProbes = await desktopStatus(pipe) === "disconnected" ? missingProbes + 1 : 0;
              }
              await close();
            } else await serveMcp();


            async function serveMcp() {
              let registration: ReturnType<typeof registerHarness> | undefined;
              function register() {
                if (!pipe || !binding) throw new Error("Требуется локальный Codex Desktop");
                registration ??= registerHarness(codexAdapter(pipe, binding.read)).catch(error => {
                  registration = undefined;
                  throw error;
                });
                return registration;
              }
              const lines = createInterface({ input: process.stdin });
              function send(id: unknown, value: object) {
                process.stdout.write(JSON.stringify({ jsonrpc: "2.0", id, ...value }) + "\n");
              }
              for await (const line of lines) {
                let message;
                try { message = JSON.parse(line); } catch { send(null, { error: { code: -32700, message: "Invalid JSON" } }); continue; }
                if (!message || typeof message !== "object" || message.id === undefined) continue;
                if (message.method === "initialize") {
                  if (pipe && binding) void register().catch(error => process.stderr.write(String(error) + "\n"));
                  send(message.id, { result: { protocolVersion: message.params?.protocolVersion ?? "2025-11-25",
                    capabilities: { tools: {} }, serverInfo: { name: "archiview-bridge", version: "1.0.0" } } });
                } else if (message.method === "tools/list") send(message.id, { result: { tools: [{ name: "archiview_connect",
                  description: "Зарегистрировать текущий Codex Desktop в локальном ArchiView по запросу пользователя.",
                  inputSchema: { type: "object", properties: {}, additionalProperties: false } }] } });
                else if (message.method === "tools/call" && message.params?.name === "archiview_connect") {
                  try {
                    const id = callerThread(message.params._meta) ?? environment.threadId;
                    if (!binding || !id) throw new Error("Требуется контекст локального чата Codex Desktop");
                    await binding.connect(id);
                    await register();
                    send(message.id, { result: { content: [{ type: "text", text: "Codex Desktop зарегистрирован в ArchiView." }] } });
                  } catch (error) {
                    send(message.id, { result: { isError: true, content: [{ type: "text", text: String(error) }] } });
                  }
                } else if (message.method === "ping") send(message.id, { result: {} });
                else send(message.id, { error: { code: -32601, message: "Method not found" } });
              }
              await (await registration)?.();
            }
