      checks:
        - id: check-1
          contract:
            snapshot: current
            module_id: archiview-codex
            section: purpose
            id: purpose
          subject: current
          verdict: consistent
          explanation: При initialize и archiview_connect сервер регистрирует адаптер, при
            завершении stdio снимает регистрацию. В отдельном процессе
            отключение определяется после двух последовательных ответов
            disconnected. Контекст хранится для IPC-адреса. Перед create_thread
            адаптер выбирает локальный проект по корню репозитория, затем
            рабочей папки, передаёт job.prompt и возвращает threadId.
          evidence:
            - snapshot: current
              fact_id: sha256:8e92cab1cbcd462441fb56111cea3460c7bd33a14f810b9cded85d5fa5d5d2e2
            - snapshot: current
              fact_id: sha256:88a8559fe711e6176ce022b3ebf1fa5c4d52bef3ec9d2b18575c97c8763e1c7b
            - snapshot: current
              fact_id: sha256:71617a144447ff7ca35ea0568827c6beefb84449c6bf38e7d053759b65c52311
        - id: check-2
          contract:
            snapshot: current
            module_id: archiview-codex
            section: invariants
            id: I8
          subject: current
          verdict: consistent
          explanation: По исходному коду на Windows 11 IPC-адрес поступает из
            CODEX_APP_TOOLS_PIPE_PATH в net.createConnection. Для дочернего
            процесса заданы fork и windowsHide. Сопоставление каталогов
            использует платформенный path.relative. Запуск в настоящем Desktop
            на Windows 11 в эту проверку не входил.
          evidence:
