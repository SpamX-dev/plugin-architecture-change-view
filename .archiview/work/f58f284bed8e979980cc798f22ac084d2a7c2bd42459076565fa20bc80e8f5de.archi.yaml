                    project.hostId === hostId && typeof project.path === "string" && path.isAbsolute(project.path));
                  return folders.some((project) => within(project.path, root)) ? { status: "ready", root } : { status: "unavailable" };
                } catch { return { status: "unknown" }; }
                finally { host.close(); }
              };
            }
