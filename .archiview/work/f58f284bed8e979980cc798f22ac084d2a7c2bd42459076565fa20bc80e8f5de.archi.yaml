    contract:
      schema_version: 1
      id: archiview-codex
      title: Адаптер панели Codex
      kind: module
      purpose: Открывать существующее веб-приложение ArchiView как локальное MCP App в
        Codex.
      responsibilities:
        R1: Регистрировать UI-ресурс, открытие панели в боковой вкладке чата и явные
          операции прикладного сервиса для UI; не добавлять глобальную точку
          открытия отдельного окна.
        R2: Скрывать операции UI от модели через visibility app; передавать данные и
          ошибки просмотра только в метаданных результата.
        R3: Автоматически привязывать экземпляр к выбранной рабочей папке чата Codex;
          отличать отсутствие папки от недоступности контекста и запрещать
          просмотр вне проектов.
      boundaries:
        B1: Вычисления и подготовка анализа принадлежат application; MCP-адаптер
          проверяет аргументы и вызывает сервис напрямую.
        B2: Адаптер использует MCP Apps для UI и предоставленный хостом канал Codex App
          Tools только для чтения метаданных текущего чата и рабочих папок; не
          читает внутренние базы и файлы стенограмм Codex.
      invariants:
        I1: Один процесс обслуживает один фиксированный корень; адаптер не открывает
          HTTP-порт и не требует сертификатов.
        I2: Отключение MCP-клиента завершает сессию и запрещает новые операции.
        I3: UI подключается к хосту до чтения дерева проекта; навигация не отправляет
          сообщения агенту и не обновляет контекст модели.
        I4: Автоматическое получение папки не вызывает модель. Отсутствие привязки
          ArchiView не означает отсутствие рабочей папки чата; неизвестный
          контекст не выдаётся за отсутствие проекта.
        I5: Отсутствие истории чата или временная недоступность его контекста не
          блокируют загрузку UI; исходный cwd MCP сохраняет рабочую папку чата и
          проверяется по каталогу папок хоста.
        I6: При неизвестной папке панель предлагает ручной ввод; в Windows нативный
          диалог открывается только явной кнопкой пользователя. Подтверждённое
          отсутствие проекта не обходится этой формой.
    document_state: documented
    inherited:
      - module_id: architecture-change-view
        section: boundaries
        id: B1
        text: Запись и содержательный анализ контрактов выполняет агент своими файловыми
          инструментами. Просмотр не изменяет исходники проекта.
      - module_id: architecture-change-view
        section: boundaries
        id: B2
        text: Экспорт скиллов в Codex и публикация скилла в dsh принадлежат отдельным
          адаптерам. Извлечение символов, разрешение зависимостей и индексация
          AST принадлежат ast-index.
      - module_id: architecture-change-view
        section: invariants
        id: I1
        text: Чтение ограничено настроенным корнем проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I2
        text: Снимки и результаты анализа по умолчанию находятся в переносимой папке
          .archiview внутри корня проекта. Эта папка исключена из анализа
          исходников; прежние сохранённые факты и отчёты не переписываются при
          переносе проекта.
      - module_id: architecture-change-view
        section: invariants
        id: I3
        text: arch.yaml содержит устойчивую ответственность; эвристические оценки и
          текущий код не разрешают её расширять.
      - module_id: architecture-change-view
        section: invariants
        id: I4
        text: Структурная проверка не выдаёт наличие файла за семантическое
          соответствие.
      - module_id: architecture-core
        section: boundaries
        id: B1
        text: Прикладные операции находятся в application; HTTP и CLI в archiview
          являются адаптерами, отображение принадлежит web.
      - module_id: architecture-core
        section: boundaries
        id: B2
        text: Семантический вывод ответственности выполняет агент или внешний
          анализатор. Наличие контракта не доказывает его выполнения.
      - module_id: architecture-core
        section: boundaries
        id: B3
        text: Адаптер Codex находится в codex; вызывает прикладной сервис через скрытые
          от модели инструменты UI без HTTP-сервера.
      - module_id: architecture-core
        section: boundaries
        id: B4
        text: Адаптер dsh находится в dsh; регистрирует инструменты, маршруты панели и
          скилл хоста, получая прикладные операции из application.
      - module_id: architecture-core
        section: invariants
        id: I1
        text: Пути исходников разрешаются внутри выбранного корня; ссылки, зависимости,
          сборка и папки .archiview не расширяют анализ. Запись данных
          допускается в .archiview корня проекта либо явно выбранном внешнем
          хранилище; ссылки не меняют эту область.
      - module_id: architecture-core
        section: invariants
        id: I2
        text: Неполнота обхода и доказательств сообщается явно.
      - module_id: architecture-core
        section: invariants
        id: I3
        text: Снимки и отчёты не заменяют arch.yaml и не согласуют новую
          ответственность.
      - module_id: architecture-core
        section: invariants
        id: I4
        text: Ссылки отчёта разрешаются в сохранённых снимках, а не в текущих изменяемых
          файлах.
      - module_id: architecture-core
        section: invariants
        id: I5
        text: Структурное различие контрактов не создаёт замечание; оценка нарушения
          требует отдельного анализа.
