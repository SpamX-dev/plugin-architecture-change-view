    contract:
      id: archiview-codex
      kind: module
      purpose: Открывать существующее веб-приложение ArchiView как локальное MCP App в
        Codex.
      responsibilities:
        R1: Регистрировать UI-ресурс, открытие панели в боковой вкладке чата и явные
          операции прикладного сервиса для UI; не добавлять глобальную точку
          открытия отдельного окна.
        R2: Скрывать операции UI от модели через visibility app; передавать данные и
          ошибки просмотра только в метаданных результата.
        R3: Автоматически привязывать экземпляр к выбранной рабочей папке чата Codex;
          отличать отсутствие папки от недоступности контекста и запрещать
          просмотр вне проектов.
      boundaries:
        B1: Вычисления и подготовка анализа принадлежат application; MCP-адаптер
          проверяет аргументы и вызывает сервис напрямую.
        B2: Адаптер использует MCP Apps для UI и предоставленный хостом канал Codex App
          Tools только для чтения метаданных текущего чата и рабочих папок; не
          читает внутренние базы и файлы стенограмм Codex.
      invariants:
        I1: Один процесс обслуживает один фиксированный корень; адаптер не открывает
          HTTP-порт и не требует сертификатов.
        I2: Отключение MCP-клиента завершает сессию и запрещает новые операции.
        I3: UI подключается к хосту до чтения дерева проекта; навигация не отправляет
          сообщения агенту и не обновляет контекст модели.
        I4: Автоматическое получение папки не вызывает модель. Отсутствие привязки
          ArchiView не означает отсутствие рабочей папки чата; неизвестный
          контекст не выдаётся за отсутствие проекта.
        I5: Отсутствие истории чата или временная недоступность его контекста не
          блокируют загрузку UI; исходный cwd MCP сохраняет рабочую папку чата и
          проверяется по каталогу папок хоста.
        I6: При неизвестной папке панель предлагает ручной ввод; в Windows нативный
          диалог открывается только явной кнопкой пользователя. Подтверждённое
          отсутствие проекта не обходится этой формой.
