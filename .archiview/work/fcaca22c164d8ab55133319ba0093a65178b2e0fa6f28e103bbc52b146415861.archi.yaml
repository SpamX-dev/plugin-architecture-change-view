            .diff-line.added { background: #edf7ee; color: #578465;
            }.diff-line.removed { background: #fff0ed; color: #af7c72; }

            .line-number { text-align: right; padding-right: 10px; user-select:
            none; font-size: 9px; color: #b1beb4; border-right: 1px solid
            #e5ebe650; }

            .line-sign { text-align: center; user-select: none; }.line-content {
            white-space: pre-wrap; overflow-wrap: anywhere; padding: 1px 14px
            1px 0; }

            .files-heading { display: flex; align-items: center;
            justify-content: space-between; padding: 16px 20px; background:
            #f9fcfa; color: #6e8775; font-size: 12px; border-bottom: 1px solid
