            .files-heading span { font-size: 10px; color: #98aa9e; }

            .file-directory > summary { cursor: pointer; padding: 9px 16px;
            background: #f3f7f4; color: #476651; border-bottom: 1px solid
            #e4ebe5; overflow-wrap: anywhere; }

            .file-directory > summary:hover { background: #eaf2ec; }

            .file-directory > summary:focus-visible { outline: 2px solid
            var(--green); outline-offset: -2px; }

            .file-directory > summary::marker { color: #6b8372; font-size: 11px;
            }

            .file-directory > summary svg { width: 15px; height: 15px; margin: 0
            7px 0 4px; vertical-align: middle; }

            .file-directory > summary code { font: 600 12px var(--mono); }

            .file-directory > :is(.file-directory, .file-row) {
            margin-inline-start: min(3%, 18px); border-inline-start: 1px solid
            var(--border); }

            .file-row { display: flex; align-items: center; gap: 12px; padding:
            13px 20px; border-bottom: 1px solid #edf1ee; }

            .file-row .status-badge { min-height: 24px; padding-inline: 8px;
