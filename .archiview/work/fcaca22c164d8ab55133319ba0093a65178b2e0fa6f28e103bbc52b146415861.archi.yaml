            .paper-note { font-size: 10px; color: #7f9486; margin-left: auto; }

            .markdown { padding: 25px 30px 30px; color: #65786b; font-size:
            13px; line-height: 1.85; overflow-wrap: anywhere; }

            .markdown > :first-child { margin-top: 0; }

            .markdown > :last-child { margin-bottom: 0; }

            .markdown h1, .markdown h2, .markdown h3, .markdown h4 { color:
            #3d5745; line-height: 1.5; font-weight: 600; }

            .markdown h1 { font-size: 18px; margin: 29px 0 10px; letter-spacing:
            -.25px; }

            .markdown h2 { font-size: 16px; margin: 27px 0 10px; }

            .markdown h3 { font-size: 14px; }

            .markdown p { margin: 9px 0 17px; }

            .markdown ul, .markdown ol { padding-left: 22px; }

            .markdown li { padding-left: 3px; margin: 4px 0; }

            .markdown li::marker { color: #7ca58a; }

            .markdown a { color: #378065; text-underline-offset: 3px; }

            .markdown code { font-family: var(--mono); font-size: 11px; padding:
            2px 5px; border-radius: 4px; background: #f0f5f1; color: #64836e; }

            .markdown pre { padding: 15px; background: #f6f9f6; border: 1px
