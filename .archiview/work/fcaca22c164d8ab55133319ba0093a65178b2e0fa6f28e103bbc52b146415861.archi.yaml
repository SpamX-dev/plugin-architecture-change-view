            .file-path { font-family: var(--mono); font-size: 10px; color:
            #718977; flex: 1; overflow-wrap: anywhere; }

            .file-empty { padding: 20px; color: #9aaa9e; font-size: 12px; }

            .loading-state { color: #a1b0a6; font-size: 12px; padding: 36px
            20px; text-align: center; }

            .empty-tree { text-align: center; padding: 35px 18px; color:
            #9aa99e; font-size: 11px; }.empty-tree strong { color: #7e9486;
            font-size: 12px; font-weight: 550; }.empty-tree p { line-height:
            1.7; }

            .global-warning { background: #fff6db; color: #9e8245; padding: 10px
            30px; font-size: 11px; position: fixed; bottom: 0; left: 0; right:
            0; z-index: 6; border-top: 1px solid #e8dba9; }

            dialog { border: 1px solid #d7e2da; border-radius: 12px; padding:
            30px; max-width: 450px; width: calc(100% - 36px); color: #46634f;
            box-shadow: 0 20px 90px #163b2930; }

            dialog::backdrop { background: #183d2b40; backdrop-filter:
            blur(3px); }

            dialog h2 { margin: 10px 0 12px; font-size: 23px; font-weight: 600;
            letter-spacing: -.6px; }

            dialog p { font-size: 12px; color: #8a9f91; line-height: 1.8;
            margin-bottom: 25px; }

            .toast { position: fixed; bottom: 25px; left: 50%; transform:
            translateX(-50%); z-index: 20; background: #315a40; color: #f1f7f2;
            border-radius: 7px; font-size: 12px; padding: 12px 20px; box-shadow:
            0 4px 20px #244e3625; max-width: calc(100% - 40px); overflow-wrap:
            anywhere; }

            .mobile-only { display: none; }

            @media (min-width: 1550px) { .content { padding: 0 55px;
            }.document-panel { max-width: 1120px; } }

            @media (max-width: 1150px) {
              .topbar { padding: 0 22px; gap: 20px; }.project-context { padding-left: 18px; }
              .comparison-picker select { width: 275px; }
              .content { padding: 0 25px; }.module-title-row h1 { font-size: 22px; }
              .module-meta { padding: 15px; }
              .meta-value { font-size: 10px; }
              .view-label { display: none; }.markdown { padding: 23px; }
            }

            @media (max-width: 800px) {
              body { height: 100dvh; }.topbar { height: auto; min-height: 76px; padding: 12px 15px; gap: 12px; flex-wrap: wrap; }
              .brand { font-size: 21px; }.brand-mark { width: 30px; height: 30px; }
              .topbar-actions { gap: 8px; width: 100%; margin: 0; }.button { font-size: 10px; padding: 6px 9px; }
              #refresh { font-size: 0; gap: 0; width: 35px; flex: 0 0 auto; }
              .project-context { padding-left: 12px; gap: 7px; }.project-heading { gap: 2px; }.project-heading strong { font-size: 11px; }
              .comparison-picker { flex: 1; }.comparison-picker select { width: 100%; min-width: 0; font-size: 11px; padding: 7px; }
              .app-shell { display: block; }.sidebar, .tree-resizer { display: none; }
              .tree-open .sidebar { display: flex; position: absolute; z-index: 5; top: 0; left: 0; bottom: 0; width: min(420px, 93%); box-shadow: 10px 0 30px #234a2c20; }
              .content { height: 100%; padding: 0 20px; }.content-topline { padding: 16px 0; justify-content: flex-start; }
              .mobile-only { display: inline-flex; font-size: 9px; padding: 4px 7px; min-height: 25px; }
              .module-title-row h1 { font-size: 22px; }.module-meta { margin: 19px 0 23px; }
              #copy-path { display: none; }.tabs { gap: 23px; }.markdown { font-size: 12px; padding: 22px 20px; }.paper-heading { padding: 12px 15px; }
              .paper-note { font-size: 8px; }.document-panel { padding-top: 20px; }.diff-line { grid-template-columns: 28px 28px 20px minmax(0,1fr); font-size: 9px; }.diff-labels { grid-template-columns: 28px 28px 1fr; }.line-number { padding-right: 6px; }
            }

            @media (prefers-reduced-motion: reduce) { *, *::before, *::after {
            animation: none !important; scroll-behavior: auto !important; } }


            /* Структурированные контракты и независимые результаты анализа. */

            .tabs { gap: 22px; flex-wrap: wrap; }

            .tabs-row { flex-wrap: wrap; gap: 10px; }

            .review-marker { color: #aa7b31; font-size: 13px; }

            .contract-paper { border: 1px solid var(--border); background: #fff;
            border-radius: 9px; overflow: hidden; }

            .contract-header { padding: 27px 30px; background: #f7faf8;
