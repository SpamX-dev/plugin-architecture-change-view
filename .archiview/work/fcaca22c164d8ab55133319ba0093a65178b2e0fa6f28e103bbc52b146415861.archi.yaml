            .review-toolbar-label { color: #607b68; font-size: 12px; }

            .analysis-notice { display: flex; flex-wrap: wrap; align-items:
            center; justify-content: space-between; gap: 16px; background:
            #f7f8f8; border-color: #dfe5e2; }

