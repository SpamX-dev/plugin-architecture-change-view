            #review-status .meta-value { color: #9a6c25; }

            .tabs-row { display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 10; background: #fff;
            padding-top: 12px; }

            .tabs { display: flex; gap: 26px; }

            .tabs button { background: transparent; border: 0; border-bottom:
            2px solid transparent; padding: 0 0 13px; color: var(--muted);
            font-size: 11px; display: flex; gap: 7px; align-items: center;
            margin-bottom: -1px; }

            .tabs button[aria-selected="true"] { color: #397052; border-color:
            #3a865e; font-weight: 600; }

            .tab-count { font-size: 9px; border-radius: 4px; background:
