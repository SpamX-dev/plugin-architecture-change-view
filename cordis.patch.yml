# Плагин ArchiView для dsh: одна запись загрузчика.
#
# Файл публикуется вместе с пакетом и подключается через `dsh.bundle`, поэтому
# установленный плагин активируется без ручной правки профиля. Корень проекта
# по умолчанию определяется по чату вкладки; `root` задаёт его принудительно
# для прямого открытия страницы вне чата.
- insert:
    - id: archiview
      name: plugin-architecture-change-view
      config:
        prefix: /archiview
