schema_version: 1
id: archiview-application
title: Прикладной сервис ArchiView
kind: module
purpose: Предоставлять операции просмотра и анализа одного проекта независимо от транспорта и клиента.
responsibilities:
  R1: Управлять выбранной папкой проекта, рабочей сессией, сравнениями и ограниченным кешем представлений.
  R2: Формировать дерево, детали модулей и хронологию через общую модель снимков и отчётов;
    предоставлять расположение сохранённого анализа относительно текущего корня проекта.
  R3: Подготавливать анализ выбранного снимка, сохранять базы и обслуживать импорт результатов.
boundaries:
  B1: Не зависит от HTTP, MCP, Codex или DOM; получает аргументы и возвращает данные либо прикладную ошибку.
  B2: Схемы, доказательства, сбор исходников и хранение неизменяемых результатов принадлежат общей модели.
invariants:
  I1: Сессия привязана к одному корню; каталог установки не выбирается вместо проекта автоматически.
  I2: Исторический просмотр не заменяет опубликованное текущее состояние и не перечитывает изменённый код вместо выбранного снимка.
  I3: Подготовка и передача запроса анализа не считаются завершённой содержательной проверкой.
