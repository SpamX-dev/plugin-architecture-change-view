schema_version: 1
id: archiview-codex
title: Адаптер панели Codex
kind: module
purpose: Открывать существующее веб-приложение ArchiView как локальное MCP App в Codex.
responsibilities:
  R1: Регистрировать UI-ресурс и точки открытия панели, управлять принадлежащим адаптеру HTTP-сервером.
  R2: Передавать UI адрес backend и случайный токен, не включая токен в модельный результат инструмента.
boundaries:
  B1: Данные просмотра и подготовка анализа принадлежат HTTP backend; MCP не дублирует его API.
  B2: Адаптер использует публичный MCP Apps протокол и метаданные расширений, без внутренних сервисов Codex.
invariants:
  I1: Один процесс обслуживает один фиксированный корень; HTTP слушает только loopback на свободном порту.
  I2: Отключение MCP-клиента закрывает принадлежащий адаптеру сервер.
