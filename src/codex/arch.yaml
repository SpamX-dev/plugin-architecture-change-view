schema_version: 1
id: archiview-codex
title: Адаптер панели Codex
kind: module
purpose: Открывать существующее веб-приложение ArchiView как локальное MCP App в Codex.
responsibilities:
  R1: Регистрировать UI-ресурс, точки открытия панели и явные операции прикладного сервиса для UI.
  R2: Скрывать операции UI от модели через visibility app; передавать данные и ошибки просмотра только в метаданных результата.
  R3: Привязывать экземпляр к явно выбранной папке проекта; каталог установки плагина не является проектом по умолчанию.
boundaries:
  B1: Вычисления и подготовка анализа принадлежат application; MCP-адаптер проверяет аргументы и вызывает сервис напрямую.
  B2: Адаптер использует публичный MCP Apps протокол и метаданные расширений, без внутренних сервисов Codex.
invariants:
  I1: Один процесс обслуживает один фиксированный корень; адаптер не открывает HTTP-порт и не требует сертификатов.
  I2: Отключение MCP-клиента завершает сессию и запрещает новые операции.
  I3: UI подключается к хосту до чтения дерева проекта; навигация не отправляет сообщения агенту и не обновляет контекст модели.
