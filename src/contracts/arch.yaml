schema_version: 1
id: archiview-contracts
title: Контракты каталогов
kind: module
extensions:
  archiview.roles: [domain]
purpose: Читать декларации ответственности и находить каталоги исходников, которым нужен контракт.
responsibilities:
  R1: Проверять структуру arch.yaml и сохранять состояние отсутствующих, повреждённых и прежних описаний.
  R2: Находить исходники проекта и предоставлять инвентаризацию каталогов и цепочки родительских контрактов.
boundaries:
  B1: Предметные выводы по реализации и публикация отчётов принадлежат другим модулям.
invariants:
  I1: Пути чтения ограничены выбранным проектом, при неполном обходе возвращается диагностика.
  I2: Наличие документа подтверждает только его структурное состояние.
