schema_version: 1
id: archiview-node-runtime
title: Среда выполнения Node
kind: module
purpose: Предоставлять общие для модулей Node сведения о среде выполнения ArchiView.
responsibilities:
  R1: Разрешать ресурсы и команду CLI относительно действующего пакета в исходной и автономной поставке.
  R2: Представлять ошибки платформы с сохранением диагностических полей файловых и дочерних процессов.
boundaries:
  B1: Выбор рабочего проекта, вычисление отчётов и протокол хоста принадлежат потребителям.
invariants:
  I1: Поиск ресурсов пакета не зависит от рабочей папки пользователя.
