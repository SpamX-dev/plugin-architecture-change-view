schema_version: 1
id: archiview-serialization
title: Кодирование данных
kind: module
purpose: Предоставлять общее чтение YAML, средства проверки структуры и канонические отпечатки внешних данных.
responsibilities:
  R1: Читать однозначные JSON-совместимые значения из YAML и предоставлять примитивы проверки их структуры.
  R2: Канонизировать значения и вычислять согласованный SHA-256 по байтам UTF-8.
boundaries:
  B1: Схемы конкретных контрактов и проверок определяются их владельцами.
invariants:
  I1: Порядок ключей словаря не влияет на каноническую форму. Порядок массива сохраняется.
  I2: Неоднозначные ключи, ссылки YAML и недопустимые типы отклоняются до использования данных.
