schema_version: 1
id: archiview-storage
title: Хранение истории проекта
kind: module
extensions:
  archiview.roles: [storage]
purpose: Сохранять снимки, проверки и опубликованные отчёты проекта с возможностью переноса и восстановления.
responsibilities:
  R1: Обслуживать хранилище одного проекта, перенос прежних данных и историю локальных состояний.
  R2: Проверять целостность, уплотнять и публиковать переносимую историю, сверять подготовленные для Git отчёты с индексом.
boundaries:
  B1: Смысловая оценка и модель актуальности определяются вне хранилища.
invariants:
  I1: Проверка выбранной публикации и её замена выполняются под общей блокировкой записи.
  I2: Перенос сохраняет происхождение и содержимое неизменяемых попыток. Чтение и запись ограничены допустимой файловой областью.
