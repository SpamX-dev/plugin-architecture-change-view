schema_version: 1
id: architecture-tests
title: Проверки контрактов и просмотра
kind: module
purpose: Проверять наблюдаемый контракт MCP, форматы архитектурных данных, снимки, доказательства и
  локальный HTTP-интерфейс ArchiView.
responsibilities:
  R1: Проверять покрытие каталогов, цепочки ограничений, валидацию схем, статусы и перемещения модулей.
  R2: Проверять неизменность истории, разрешение доказательств, устаревание и границы файловой области.
  R3: Проверять реальные stdio- и HTTP-сценарии на изолированных проектах.
  R4: Проверять авторизацию панели, привязку анализа к неизменяемым входам и доставку запроса агенту без подмены анализа структурной проверкой.
    Проверять точную ссылку поручения исправления на сохранённую попытку и замечание.
  R5: Проверять перенос ZIP-пакета Codex и запуск установленного плагина со встроенным Node
    в изолированном профиле без системного Node и npm в PATH.
  R6: Проверять сборку и перенос пакета dsh — сборщик пишет только в dist, точки входа
    опубликованного пакета разрешаются, а перенесённый CLI запускается без node_modules.
boundaries:
  B1: Тесты не подменяют содержательный анализ пользовательской ответственности эвристикой.
invariants:
  I1: Используются временные проекты, принадлежащие тестам внутренние или внешние хранилища
    и отдельные порты. Переносимость проверяется на копиях в другом файловом корне.
  I2: Неполный результат и повреждённые данные обнаруживаются явно; рабочие исходники не изменяются
    проверками.
