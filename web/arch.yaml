schema_version: 1
id: architecture-web
title: Клиентские интерфейсы архитектуры
kind: group
purpose: Давать пользователю единый интерфейс просмотра архитектуры проекта в браузере и в панелях хостов.
responsibilities:
  R1: Обеспечивать одинаковую навигацию по модулям выбранного сравнения в самостоятельной
    версии и во встроенных панелях.
boundaries:
  B1: Интерфейс получает состояние проекта и результаты сравнений через API ArchiView.
invariants:
  I1: Содержимое контрактов, отчётов и исходников отображается как данные.
  I2: Клиент не изменяет исходники и принятые границы ответственности.
